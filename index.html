/* ---------- timers ---------- */
const TK='atelier-pizza-timers-v1';
let timers=[]; try{ timers=JSON.parse(localStorage.getItem(TK)||'[]')||[]; }catch(e){}
let actx=null, timerSig='';
const saveTimers=()=>{ try{ localStorage.setItem(TK,JSON.stringify(timers)); }catch(e){} };
function unlockAudio(){ try{ actx=actx||new (window.AudioContext||window.webkitAudioContext)(); if(actx.state==='suspended') actx.resume(); }catch(e){} }
function beep(){
  try{ unlockAudio(); const t0=actx.currentTime;
    for(let i=0;i<4;i++){ const o=actx.createOscillator(), g=actx.createGain(); o.type='sine'; o.frequency.value=i%2?660:880; o.connect(g); g.connect(actx.destination);
      const a=t0+i*0.45; g.gain.setValueAtTime(0.0001,a); g.gain.exponentialRampToValueAtTime(0.35,a+0.02); g.gain.exponentialRampToValueAtTime(0.0001,a+0.35); o.start(a); o.stop(a+0.4); } }catch(e){}
  try{ if(navigator.vibrate) navigator.vibrate([300,150,300,150,300]); }catch(e){}
}
const fmtLeft=ms=>{ const s=Math.max(0,Math.round(ms/1000)), h=Math.floor(s/3600), m=Math.floor(s%3600/60), x=s%60; return h?`${h} h ${pad(m)} min`:`${pad(m)}:${pad(x)}`; };
function startTimer(label,min){ unlockAudio(); timers.push({id:Date.now().toString(36)+Math.random().toString(36).slice(2,6),label,min,end:Date.now()+min*60000,done:false}); saveTimers(); tick(true); }
function drawTimers(){
  const box=$('timers'); box.hidden=!timers.length; document.body.classList.toggle('hasTimers',timers.length>0);
  box.innerHTML=timers.length?`<div class="tthead"><b>${T('Minuteurs','Timers','Temporizadores','Timer','Timers','计时器')}</b></div>`+timers.map(t=>`<div class="timer${t.done?' done':''}" data-id="${t.id}"><span class="tlab">${esc(t.label)}</span><span class="tval" data-tv></span><span class="row" style="gap:4px">${t.done?'':`<button type="button" class="mini" data-tplus="${t.id}">+5 min</button>`}<button type="button" class="mini" data-tstop="${t.id}">${t.done?'OK':T('Arrêter','Stop','Parar','Ferma','Parar','停止')}</button></span></div>`).join(''):'';
}
function tick(force){
  const now=Date.now(); let ch=!!force;
  timers.forEach(t=>{ if(!t.done&&t.end<=now){ t.done=true; ch=true; beep(); } });
  if(ch) saveTimers();
  const sig=timers.map(t=>t.id+(t.done?'d':'')).join(',');
  if(ch||sig!==timerSig){ timerSig=sig; drawTimers(); }
  $('timers').querySelectorAll('.timer').forEach(el=>{ const t=timers.find(x=>x.id===el.dataset.id); if(t) el.querySelector('[data-tv]').textContent=t.done?T('Terminé !','Done!','¡Listo!','Finito!','Pronto!','完成！'):fmtLeft(t.end-now); });
  const run=timers.filter(t=>!t.done).sort((a,b)=>a.end-b.end)[0];
  document.title=run?`⏱ ${fmtLeft(run.end-now)} · Atelier Pizza`:timers.some(t=>t.done)?`✔ ${T('Minuteur terminé','Timer done','Temporizador listo','Timer finito','Timer encerrado','计时结束')} · Atelier Pizza`:'Atelier Pizza';
  markNow();
}
$('timers').addEventListener('click',e=>{ const b=e.target.closest('button'); if(!b) return; unlockAudio();
  if(b.dataset.tstop){ timers=timers.filter(t=>t.id!==b.dataset.tstop); saveTimers(); tick(true); }
  if(b.dataset.tplus){ const t=timers.find(x=>x.id===b.dataset.tplus); if(t){ t.end+=5*60000; saveTimers(); tick(); } } });

let noSleep=null;

async function dlRaw(data,name,mime){
  try{ if(window.claude&&typeof window.claude.use==='function'){ const d=await window.claude.use('downloads'); if(d){ await d.save({filename:name,data}); return 'ok'; } } }
  catch(e){ if(e&&e.code==='declined') return 'declined'; if(e&&(e.code==='rejected_extension'||e.code==='extension_not_enabled')) return 'ext'; }
  try{ const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([data],{type:mime})); a.download=name; document.body.appendChild(a); a.click(); a.remove(); return 'ok'; }catch(e){ return 'fail'; }
}
async function copyText(txt){
  try{ await navigator.clipboard.writeText(txt); return true; }catch(e){}
  try{ const t=document.createElement('textarea'); t.value=txt; t.style.position='fixed'; t.style.opacity='0'; document.body.appendChild(t); t.select(); const ok=document.execCommand('copy'); t.remove(); return ok; }catch(e){ return false; }
}

const icsEsc=t=>stripTags(t).replace(/\\/g,'\\\\').replace(/;/g,'\\;').replace(/,/g,'\\,').replace(/\r?\n/g,'\\n');
const icsDate=d=>`${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}T${pad(d.getHours())}${pad(d.getMinutes())}00`;
function icsFold(l){ const out=[]; while(l.length>73){ out.push(l.slice(0,73)); l=' '+l.slice(73); } out.push(l); return out.join('\r\n'); }
function makeIcs(){
  const s=read(), r=build(s), stamp=new Date().toISOString().replace(/[-:]/g,'').replace(/\.\d+/,''), title=curTitle();
  const L=['BEGIN:VCALENDAR','VERSION:2.0',`PRODID:-//Atelier Pizza//${VERSION}//FR`,'CALSCALE:GREGORIAN','METHOD:PUBLISH',`X-WR-CALNAME:${icsEsc(title)}`];
  r.items.forEach((x,i)=>{ const st=r.at(x.start), mm=Math.max(5,x.k==='oven'&&x.out!=null?x.out-x.start:x.m||5), en=new Date(st.getTime()+mm*60000);
    L.push('BEGIN:VEVENT',`UID:${stamp}-${i}@atelier-pizza`,`DTSTAMP:${stamp}`,`DTSTART:${icsDate(st)}`,`DTEND:${icsDate(en)}`,`SUMMARY:${icsEsc(T('Pizza','Pizza','Pizza','Pizza','Pizza','披萨')+' · '+x.t)}`,`DESCRIPTION:${icsEsc([title,x.d,x.then?T('Ensuite : ','Then: ','Después: ','Poi:','Depois: ','然后：')+x.then:''].filter(Boolean).join('\n'))}`);
    if(x.k!=='wait'&&x.k!=='cold') L.push('BEGIN:VALARM','ACTION:DISPLAY',`DESCRIPTION:${icsEsc(x.t)}`,'TRIGGER:-PT5M','END:VALARM');
    L.push('END:VEVENT'); });
  L.push('END:VCALENDAR'); return L.map(icsFold).join('\r\n')+'\r\n';
}

  ${li([T('<a href="https://marcosandreszs.github.io/atelier-pizza/" target="_blank" rel="noopener"><b>marcosandreszs.github.io/atelier-pizza</b></a> : elle marche sur ordinateur, téléphone et tablette, et se met à jour toute seule.','<a href="https://marcosandreszs.github.io/atelier-pizza/" target="_blank" rel="noopener"><b>marcosandreszs.github.io/atelier-pizza</b></a>: it works on computers, phones and tablets, and updates itself.','<a href="https://marcosandreszs.github.io/atelier-pizza/" target="_blank" rel="noopener"><b>marcosandreszs.github.io/atelier-pizza</b></a>: funciona en ordenador, móvil y tableta, y se actualiza sola.','<a href="https://marcosandreszs.github.io/atelier-pizza/" target="_blank" rel="noopener"><b>marcosandreszs.github.io/atelier-pizza</b></a>: funziona su computer, telefono e tablet, e si aggiorna da sola.','<a href="https://marcosandreszs.github.io/atelier-pizza/" target="_blank" rel="noopener"><b>marcosandreszs.github.io/atelier-pizza</b></a>: funciona em computador, celular e tablet, e se atualiza sozinho.','<a href="https://marcosandreszs.github.io/atelier-pizza/" target="_blank" rel="noopener"><b>marcosandreszs.github.io/atelier-pizza</b></a>：可在电脑、手机和平板上使用，并自动更新。'),T('iPhone et iPad : ouvre l’adresse dans Safari, puis Partager, « Sur l’écran d’accueil ».','iPhone and iPad: open the address in Safari, then Share, “Add to Home Screen”.','iPhone y iPad: abre la dirección en Safari y luego Compartir, «Añadir a pantalla de inicio».','iPhone e iPad: apri l’indirizzo in Safari, poi Condividi, «Aggiungi alla schermata Home».','iPhone e iPad: abra o endereço no Safari, depois Compartilhar, “Adicionar à Tela de Início”.','iPhone 和 iPad：在 Safari 中打开网址，然后点“分享”，“添加到主屏幕”。'),T('Android : ouvre l’adresse dans Chrome, menu ⋮, puis « Installer l’appli » ou « Ajouter à l’écran d’accueil ».','Android: open the address in Chrome, ⋮ menu, then “Install app” or “Add to Home screen”.','Android: abre la dirección en Chrome, menú ⋮ y luego «Instalar aplicación» o «Añadir a pantalla de inicio».','Android: apri l’indirizzo in Chrome, menu ⋮, poi «Installa app» o «Aggiungi a schermata Home».','Android: abra o endereço no Chrome, menu ⋮, depois “Instalar app” ou “Adicionar à tela inicial”.','Android：在 Chrome 中打开网址，点 ⋮ 菜单，再点“安装应用”或“添加到主屏幕”。'),T('Installée ainsi, elle s’ouvre en plein écran avec son icône, et fonctionne même sans connexion une fois ouverte une première fois.','Installed this way, it opens full screen with its icon, and works offline once opened a first time.','Instalada así, se abre a pantalla completa con su icono y funciona sin conexión una vez abierta por primera vez.','Installata così, si apre a schermo intero con la sua icona e funziona anche offline dopo la prima apertura.','Instalado assim, ele abre em tela cheia com o ícone e funciona sem internet depois de aberto uma primeira vez.','这样安装后，点图标即可全屏打开，首次打开后即可离线使用。')])}

e, «Apri con», poi Safari o Chrome.','Se ele abrir em outro app que não o navegador (sobretudo no Mac): clique com o botão direito no arquivo, “Abrir com” e depois Safari ou Chrome.','如果它在浏览器以外的应用中打开（尤其在 Mac 上）：右键点击文件，选择“打开方式”，再选 Safari 或 Chrome。'),T('Sur iPhone et iPad, le fichier ne fonctionne pas : utilise l’adresse web de l’appli (voir la partie 1).','On iPhone and iPad the file does not work: use the app’s web address (see part 1).','En iPhone y iPad el archivo no funciona: usa la dirección web de la app (ver la parte 1).','Su iPhone e iPad il file non funziona: usa l’indirizzo web dell’app (vedi la parte 1).','No iPhone e no iPad o arquivo não funciona: use o endereço web do app (veja a parte 1).','在 iPhone 和 iPad 上文件无法使用：请使用应用的网址（见第 1 部分）。'),T('Ou, dans le navigateur, Ctrl+O (Cmd+O sur Mac), puis choisis le fichier.','Or, in the browser, press Ctrl+O (Cmd+O on Mac) and pick the file.','O, en el navegador, pulsa Ctrl+O (Cmd+O en Mac) y elige el archivo.','Oppure, nel browser, premi Ctrl+O (Cmd+O su Mac) e scegli il file.','Ou, no navegador, pressione Ctrl+O (Cmd+O no Mac) e escolha o arquivo.','或在浏览器中按 Ctrl+O（Mac 上为 Cmd+O），然后选择文件。')])}
  <h3>4. ${T('Garder le fichier à portée de main','Keep the file handy','Tener el archivo a mano','Tenere il file a portata di mano','Ter o arquivo à mão','让文件触手可及')}</h3>
  ${li([T('Range-le dans un dossier fixe, par exemple Documents, puis Atelier Pizza, et ne le déplace plus.','Keep it in a fixed folder, for example Documents, then Atelier Pizza, and do not move it.','Guárdalo en una carpeta fija, por ejemplo Documentos y luego Atelier Pizza, y no lo muevas.','Mettilo in una cartella fissa, per esempio Documenti, poi Atelier Pizza, e non spostarlo più.','Guarde-o numa pasta fixa, por exemplo Documentos e depois Atelier Pizza, e não o mova mais.','把它放在固定的文件夹里，例如“文档”下的 Atelier Pizza，之后不要再移动。'),T('Ajoute-le aux favoris du navigateur (Ctrl+D, ou Cmd+D sur Mac).','Bookmark it in the browser (Ctrl+D, or Cmd+D on Mac).','Añádelo a favoritos del navegador (Ctrl+D, o Cmd+D en Mac).','Aggiungilo ai preferiti del browser (Ctrl+D, o Cmd+D su Mac).','Adicione-o aos favoritos do navegador (Ctrl+D, ou Cmd+D no Mac).','把它加入浏览器书签（Ctrl+D，Mac 上为 Cmd+D）。'),T('Crée un raccourci sur le bureau : clic droit sur le fichier, puis « Créer un raccourci » (Windows) ou « Créer un alias » (Mac).','Create a desktop shortcut: right-click the file, then “Create shortcut” (Windows) or “Make Alias” (Mac).','Crea un acceso directo en el escritorio: clic derecho en el archivo y «Crear acceso directo» (Windows) o «Crear alias» (Mac).','Crea un collegamento sul desktop: clic destro sul file, poi «Crea collegamento» (Windows) o «Crea alias» (Mac).','Crie um atalho na área de trabalho: clique com o botão direito no arquivo e depois “Criar atalho” (Windows) ou “Criar Alias” (Mac).','在桌面创建快捷方式：右键点击文件，选择“创建快捷方式”（Windows）或“制作替身”（Mac）。'),T('À chaque nouvelle version, remplace l’ancien fichier par le nouveau, au même endroit et sous le même nom : le favori et le raccourci continuent de fonctionner.','For each new version, replace the old file with the new one, in the same place and with the same name: the bookmark and shortcut keep working.','En cada nueva versión, reemplaza el archivo antiguo por el nuevo, en el mismo sitio y con el mismo nombre: el favorito y el acceso directo siguen funcionando.','A ogni nuova versione, sostituisci il vecchio file con il nuovo, nello stesso posto e con lo stesso nome: preferito e collegamento continuano a funzionare.','A cada nova versão, substitua o arquivo antigo pelo novo, no mesmo lugar e com o mesmo nome: o favorito e o atalho continuam funcionando.','每次有新版本时，用新文件替换旧文件，位置和文件名保持不变：书签和快捷方式会继续有效。')])}
  <h3>5. ${T('Le fichier sur téléphone, tablette et Mac','The file on a phone, tablet and Mac','El archivo en el móvil, la tableta y el Mac','Il file su telefono, tablet e Mac','O arquivo no celular, no tablet e no Mac','在手机、平板和 Mac 上使用文件')}</h3>
  ${li([T('Android : ouvre le fichier depuis l’appli Fichiers avec Chrome. Ça fonctionne, mais sans icône d’appli sur l’écran d’accueil.','Android: open the file from the Files app with Chrome. It works, but without an app icon on the home screen.','Android: abre el archivo desde la app Archivos con Chrome. Funciona, pero sin icono de app en la pantalla de inicio.','Android: apri il file dall’app File con Chrome. Funziona, ma senza icona dell’app nella schermata Home.','Android: abra o arquivo pelo app Arquivos com o Chrome. Funciona, mas sem ícone de app na tela inicial.','Android：从“文件”应用用 Chrome 打开文件。可以运行，但主屏幕上不会有应用图标。'),T('iPhone et iPad : le fichier seul ne fonctionne pas (l’iPhone n’en montre qu’un aperçu). Utilise l’adresse web de l’appli dans Safari, puis Partager, « Sur l’écran d’accueil » : elle s’ouvre alors comme une appli.','iPhone and iPad: the file alone does not work (the iPhone only shows a preview). Use the app’s web address in Safari, then Share, “Add to Home Screen”: it then opens like an app.','iPhone y iPad: el archivo solo no funciona (el iPhone solo muestra una vista previa). Usa la dirección web de la app en Safari y luego Compartir, «Añadir a pantalla de inicio»: se abre como una app.','iPhone e iPad: il file da solo non funziona (l’iPhone ne mostra solo un’anteprima). Usa l’indirizzo web dell’app in Safari, poi Condividi, «Aggiungi alla schermata Home»: si apre come un’app.','iPhone e iPad: o arquivo sozinho não funciona (o iPhone só mostra uma pré-visualização). Use o endereço web do app no Safari, depois Compartilhar, “Adicionar à Tela de Início”: ele passa a abrir como um app.','iPhone 和 iPad：仅靠文件无法运行（iPhone 只会显示预览）。请在 Safari 中打开应用网址，然后点“分享”，“添加到主屏幕”：之后它会像应用一样打开。'),T('Mac : enregistre le fichier, puis clic droit, « Ouvrir avec », Safari ou Chrome. Ne l’ouvre pas depuis Mail, Messages ou l’aperçu (barre d’espace) : l’appli n’y fonctionne pas. Ou utilise l’adresse web.','Mac: save the file, then right-click, “Open With”, Safari or Chrome. Do not open it from Mail, Messages or Quick Look (space bar): the app does not work there. Or use the web address.','Mac: guarda el archivo y luego clic derecho, «Abrir con», Safari o Chrome. No lo abras desde Mail, Mensajes o la vista rápida (barra espaciadora): ahí la app no funciona. O usa la dirección web.','Mac: salva il file, poi clic destro, «Apri con», Safari o Chrome. Non aprirlo da Mail, Messaggi o dall’anteprima (barra spaziatrice): lì l’app non funziona. Oppure usa l’indirizzo web.','Mac: salve o arquivo, depois clique com o botão direito, “Abrir com”, Safari ou Chrome. Não o abra pelo Mail, pelo Mensagens nem pela Visualização Rápida (barra de espaço): o app não funciona ali. Ou use o endereço web.','Mac：保存文件后右键点击，选择“打开方式”，再选 Safari 或 Chrome。不要从“邮件”、“信息”或快速查看（空格键）中打开：应用在那里无法运行。也可以使用网址。'),T('Attention : les recettes enregistrées avec le fichier et celles enregistrées avec l’adresse web sont séparées. Pour passer de l’un à l’autre, télécharge ta sauvegarde puis importe-la.','Note: recipes saved with the file and those saved with the web address are kept apart. To move from one to the other, download your backup and import it.','Atención: las recetas guardadas con el archivo y las guardadas con la dirección web están separadas. Para pasar de uno a otro, descarga tu copia e impórtala.','Attenzione: le ricette salvate con il file e quelle salvate con l’indirizzo web sono separate. Per passare dall’uno all’altro, scarica il backup e importalo.','Atenção: as receitas salvas com o arquivo e as salvas com o endereço web ficam separadas. Para passar de um para o outro, baixe o seu backup e importe-o.','注意：用文件保存的配方和用网址保存的配方是分开的。要在两者之间转移，请下载备份再导入。'),T('Les minuteurs restent utilisables sur Android.','Timers still work on Android.','Los temporizadores siguen funcionando en Android.','I timer funzionano comunque su Android.','Os timers continuam funcionando no Android.','在 Android 上计时器仍然有效。')])}
  <h3>${T('Ce que l’appli sait faire','What the app can do','Lo que la app sabe hacer','Cosa sa fare l’app','O que o app sabe fazer','应用能做什么')}</h3>
  ${li([T('<b>Démarrer</b> : à l’ouverture, rien n’est choisi ; si une fournée est en cours, l’appli propose de la reprendre ou d’en commencer une nouvelle. Le bouton « Tout recommencer » (rubrique 2) remet tout à zéro.','<b>Getting started</b>: on opening, nothing is chosen; if a bake is in progress, the app offers to resume it or start a new one. The “Start over” button (section 2) resets everything.','<b>Empezar</b>: al abrir, no hay nada elegido; si hay una horneada en curso, la app propone retomarla o empezar otra. El botón «Empezar de nuevo» (sección 2) lo pone todo a cero.','<b>Iniziare</b>: all’apertura non è scelto niente; se c’è un’infornata in corso, l’app propone di riprenderla o di iniziarne una nuova. Il pulsante «Ricominciare» (sezione 2) azzera tutto.','<b>Começar</b>: ao abrir, nada está escolhido; se houver uma fornada em andamento, o app oferece retomá-la ou começar uma nova. O botão “Recomeçar tudo” (seção 2) zera tudo.','<b>开始</b>：打开时没有任何选择；如果有正在进行的一批，应用会提示继续或开始新的一批。“全部重来”按钮（第 2 部分）会清空一切。'),
    T('<b>Choisir sa pâte, dans l’ordre</b> : d’abord le nombre et la taille des pizzas, puis une méthode (poolish, biga, express, recette simple, directe longue, frigo, levain, en moule, focaccia, sans gluten), puis une recette ; tout est recalculé pour ton format.','<b>Choose your dough, in order</b>: first the number and size of pizzas, then a method (poolish, biga, express, simple recipe, long straight, cold, sourdough, pan, focaccia, gluten-free), then a recipe; everything is recalculated for your size.','<b>Elegir la masa, en orden</b>: primero el número y el tamaño de las pizzas, luego un método (poolish, biga, exprés, receta sencilla, directa larga, nevera, masa madre, en molde, focaccia, sin gluten) y después una receta; todo se recalcula para tu formato.','<b>Scegliere l’impasto, in ordine</b>: prima numero e misura delle pizze, poi un metodo (poolish, biga, express, ricetta semplice, diretto lungo, frigo, lievito madre, in teglia, focaccia, senza glutine), poi una ricetta; tutto è ricalcolato per il tuo formato.','<b>Escolher a massa, na ordem</b>: primeiro o número e o tamanho das pizzas, depois um método (poolish, biga, express, receita simples, direta longa, geladeira, fermento natural, na forma, focaccia, sem glúten) e depois uma receita; tudo é recalculado para o seu tamanho.','<b>按顺序选择面团</b>：先选披萨数量和尺寸，再选方法（波兰种、biga、快速法、简单配方、长时间直接法、冷藏、天然酵种、烤盘、佛卡夏、无麸质），最后选配方；一切都会按你的尺寸重新计算。'),
    T('<b>Partir de la farine que tu as</b> : entre son poids, l’appli propose plusieurs façons de partager la pâte (petites ou grandes pizzas) sans rien perdre.','<b>Start from the flour you have</b>: enter its weight and the app suggests several ways to share the dough (small or large pizzas) with nothing wasted.','<b>Partir de la harina que tienes</b>: indica su peso y la app propone varias formas de repartir la masa (pizzas pequeñas o grandes) sin desperdiciar nada.','<b>Partire dalla farina che hai</b>: inserisci il peso e l’app propone diversi modi di dividere l’impasto (pizze piccole o grandi) senza sprechi.','<b>Partir da farinha que você tem</b>: informe o peso e o app sugere várias formas de dividir a massa (pizzas pequenas ou grandes) sem desperdício.','<b>从手头的面粉出发</b>：填写重量，应用会给出几种分面团的方式（小披萨或大披萨），不浪费。'),
    T('<b>Dire où tu en es</b> : pré-ferment déjà lancé, pâte déjà faite ou pâtons déjà faits. Le rétroplanning repart de là, et tu peux encore changer le nombre et la taille des pizzas : l’appli recalcule les pâtons.','<b>Say where you are at</b>: preferment started, dough made or balls made. The schedule picks up from there, and you can still change the number and size of pizzas: the app recalculates the balls.','<b>Indicar en qué punto estás</b>: prefermento empezado, masa hecha o bolas hechas. La planificación sigue desde ahí y aún puedes cambiar el número y el tamaño de las pizzas: la app recalcula las bolas.','<b>Dire a che punto sei</b>: prefermento avviato, impasto fatto o panetti fatti. Il programma riparte da lì e puoi ancora cambiare numero e misura delle pizze: l’app ricalcola i panetti.','<b>Dizer em que ponto você está</b>: pré-fermento iniciado, massa feita ou bolinhas feitas. O cronograma continua a partir daí, e você ainda pode mudar o número e o tamanho das pizzas: o app recalcula as bolinhas.','<b>说明进行到哪一步</b>：预发酵已开始、面团已做好或面团球已做好。时间表从那里继续，你仍可以更改披萨数量和尺寸：应用会重新计算面团球。'),
    T('<b>Planifier</b> : avec une heure de service, l’appli calcule quand commencer chaque étape ; sans heure, elle compte depuis le départ. Minuteurs à chaque attente, export vers ton agenda, fiche à imprimer.','<b>Plan</b>: with a serving time, the app works out when to start each step; without one, it counts from the start. Timers for each wait, calendar export, printable sheet.','<b>Planificar</b>: con hora de servir, la app calcula cuándo empezar cada paso; sin hora, cuenta desde el inicio. Temporizadores en cada espera, exportación al calendario, ficha para imprimir.','<b>Pianificare</b>: con un’ora di servizio, l’app calcola quando iniziare ogni passaggio; senza, conta dalla partenza. Timer per ogni attesa, esportazione nel calendario, scheda da stampare.','<b>Planejar</b>: com um horário de servir, o app calcula quando começar cada etapa; sem horário, conta a partir do início. Timers para cada espera, exportação para a agenda, ficha para imprimir.','<b>规划</b>：设定上桌时间后，应用会计算每一步何时开始；不设时间则从开始算起。每段等待都有计时器，可导出到日历，可打印说明。'),
    T('<b>Garnir</b> : garnitures prêtes ou à composer, bases (sauces) à créer, quantités calculées avec la pâte.','<b>Top</b>: ready-made or custom toppings, bases (sauces) you create, amounts calculated with the dough.','<b>Cubrir</b>: coberturas listas o para componer, bases (salsas) propias, cantidades calculadas con la masa.','<b>Condire</b>: condimenti pronti o da comporre, basi (salse) da creare, quantità calcolate con l’impasto.','<b>Cobrir</b>: coberturas prontas ou para montar, bases (molhos) criadas por você, quantidades calculadas com a massa.','<b>铺料</b>：现成或自选的配料组合，自建的酱底（酱汁），用量与面团一起计算。'),
    T('<b>Mode simple</b> : au premier lancement, l’appli pose 4 questions (combien de pizzas, quand manger, ton four, ta garniture) et donne seulement ce qu’il te faut, ton horaire et la cuisson. Le bouton « Mode complet », en haut, montre tous les réglages ; tu passes de l’un à l’autre sans rien perdre.','<b>Simple mode</b>: on first launch the app asks 4 questions (how many pizzas, when to eat, your oven, your toppings) and shows only what you need, your schedule and baking. The “Full mode” button at the top shows every setting; switch back and forth without losing anything.','<b>Modo sencillo</b>: al abrirla por primera vez, la app hace 4 preguntas (cuántas pizzas, cuándo comer, tu horno, tu cobertura) y muestra solo lo que necesitas, tu horario y la cocción. El botón «Modo completo», arriba, muestra todos los ajustes; pasas de uno a otro sin perder nada.','<b>Modalità semplice</b>: al primo avvio l’app fa 4 domande (quante pizze, quando mangiare, il tuo forno, il tuo condimento) e mostra solo cosa ti serve, il programma e la cottura. Il pulsante «Modalità completa», in alto, mostra tutte le impostazioni; passi dall’una all’altra senza perdere nulla.','<b>Modo simples</b>: na primeira vez, o app faz 4 perguntas (quantas pizzas, quando comer, seu forno, sua cobertura) e mostra só o que você precisa, seu cronograma e o cozimento. O botão “Modo completo”, no topo, mostra todos os ajustes; passe de um para o outro sem perder nada.','<b>简易模式</b>：首次打开时，应用会问 4 个问题（几张披萨、什么时候吃、你的烤箱、你的配料），只显示你需要的材料、时间表和烘烤方法。顶部的“完整模式”按钮显示所有设置；两种模式可以随时切换，不会丢失任何内容。'),
    T('<b>Annuler et rétablir</b> : en haut, « ↶ Annuler » revient en arrière, une modification à la fois (jusqu’à 30) : choix de recette, Reprendre ou Nouvelle fournée, nombre, diamètre, méthode, Je commence maintenant, etc. « ↷ » rétablit ce que tu viens d’annuler. Sur ordinateur : Ctrl+Z et Ctrl+Y (Cmd+Z et Cmd+Maj+Z sur Mac). Le carnet de recettes n’est pas concerné.','<b>Undo and redo</b>: at the top, “↶ Undo” goes back one change at a time (up to 30): recipe choice, Resume or New bake, number, diameter, method, I’m starting now, etc. “↷” redoes what you just undid. On a computer: Ctrl+Z and Ctrl+Y (Cmd+Z and Cmd+Shift+Z on Mac). The recipe book is not affected.','<b>Deshacer y rehacer</b>: arriba, «↶ Deshacer» vuelve atrás un cambio cada vez (hasta 30): elección de receta, Retomar o Nueva horneada, número, diámetro, método, Empiezo ahora, etc. «↷» rehace lo que acabas de deshacer. En ordenador: Ctrl+Z y Ctrl+Y (Cmd+Z y Cmd+Mayús+Z en Mac). El recetario no se ve afectado.','<b>Annulla e ripristina</b>: in alto, «↶ Annulla» torna indietro una modifica alla volta (fino a 30): scelta della ricetta, Riprendere o Nuova infornata, numero, diametro, metodo, Comincio adesso, ecc. «↷» ripristina ciò che hai appena annullato. Sul computer: Ctrl+Z e Ctrl+Y (Cmd+Z e Cmd+Maiusc+Z su Mac). Il ricettario non è interessato.','<b>Desfazer e refazer</b>: no topo, “↶ Desfazer” volta uma alteração de cada vez (até 30): escolha de receita, Retomar ou Nova fornada, número, diâmetro, método, Vou começar agora etc. “↷” refaz o que você acabou de desfazer. No computador: Ctrl+Z e Ctrl+Y (Cmd+Z e Cmd+Shift+Z no Mac). O caderno de receitas não é afetado.','<b>撤销和重做</b>：顶部的“↶ 撤销”每次撤回一项更改（最多 30 项）：选择配方、继续或新的一批、数量、直径、方法、我现在开始等。“↷”重做刚刚撤销的操作。在电脑上：Ctrl+Z 和 Ctrl+Y（Mac 上为 Cmd+Z 和 Cmd+Shift+Z）。配方本不受影响。'),
    T('<b>Arrondir les quantités</b> : dans la rubrique 6, le bouton « Arrondir les quantités » arrondit la farine à un chiffre rond (par exemple 643 g → 650 g) et ajuste tout le reste dans les mêmes proportions ; les gros poids sont arrondis à 5 g près. Un second clic remet les valeurs exactes.','<b>Round quantities</b>: in section 6, the “Round quantities” button rounds the flour to a round number (for example 643 g → 650 g) and adjusts everything else in the same proportions; large weights are rounded to the nearest 5 g. A second click restores exact values.','<b>Redondear las cantidades</b>: en la sección 6, el botón «Redondear las cantidades» redondea la harina a una cifra redonda (por ejemplo 643 g → 650 g) y ajusta todo lo demás en las mismas proporciones; los pesos grandes se redondean de 5 en 5 g. Un segundo clic vuelve a los valores exactos.','<b>Arrotondare le quantità</b>: nella sezione 6, il pulsante «Arrotondare le quantità» arrotonda la farina a un numero tondo (per esempio 643 g → 650 g) e adatta tutto il resto nelle stesse proporzioni; i pesi grandi sono arrotondati ai 5 g. Un secondo clic rimette i valori esatti.','<b>Arredondar as quantidades</b>: na seção 6, o botão “Arredondar as quantidades” arredonda a farinha para um número redondo (por exemplo 643 g → 650 g) e ajusta todo o resto nas mesmas proporções; os pesos grandes são arredondados de 5 em 5 g. Um segundo clique restaura os valores exatos.','<b>用量取整</b>：在第 6 部分，“用量取整”按钮会把面粉取整（例如 643 克 → 650 克），其余全部按相同比例调整；较大的重量取整到 5 克。再点一次恢复精确值。'),
    T('<b>Poids réel de la pâte</b> : avec « Pâte faite » ou « Pâtons déjà faits », tu peux entrer, au choix, le poids de ta pâte ou d’un pâton, ou la farine déjà mise (pré-ferment compris) ; c’est facultatif. L’appli recalcule tout à partir de là.','<b>Actual dough weight</b>: with “Dough made” or “Dough balls already made”, you can enter either the weight of your dough or of one ball, or the flour already used (preferment included); it is optional. The app recalculates everything from there.','<b>Peso real de la masa</b>: con «Masa hecha» o «Bolas ya hechas», puedes indicar, a elegir, el peso de tu masa o de una bola, o la harina ya usada (prefermento incluido); es opcional. La app lo recalcula todo a partir de ahí.','<b>Peso reale dell’impasto</b>: con «Impasto fatto» o «Panetti già fatti», puoi inserire, a scelta, il peso del tuo impasto o di un panetto, oppure la farina già usata (prefermento compreso); è facoltativo. L’app ricalcola tutto da lì.','<b>Peso real da massa</b>: com “Massa feita” ou “Bolinhas já feitas”, você pode informar, à sua escolha, o peso da massa ou de uma bolinha, ou a farinha já usada (pré-fermento incluído); é opcional. O app recalcula tudo a partir daí.','<b>面团实际重量</b>：选择“面团已做好”或“面团球已做好”时，你可以任选填写面团重量、一个面团球的重量，或已用的面粉量（含预发酵）；这是可选的。应用会据此重新计算一切。'),
    T('<b>Ta photo</b> : le bouton « 📷 Changer la photo », sur l’image du haut, la remplace par ta propre photo de pizza. Elle reste dans ce navigateur, n’est envoyée nulle part et fait partie du fichier de sauvegarde. « Photo d’origine » remet l’image de départ.','<b>Your photo</b>: the “📷 Change photo” button, on the top image, replaces it with your own pizza photo. It stays in this browser, is sent nowhere and is part of the backup file. “Original photo” puts back the starting image.','<b>Tu foto</b>: el botón «📷 Cambiar foto», sobre la imagen de arriba, la reemplaza por tu propia foto de pizza. Se queda en este navegador, no se envía a ningún sitio y forma parte del archivo de copia. «Foto original» devuelve la imagen de inicio.','<b>La tua foto</b>: il pulsante «📷 Cambia foto», sull’immagine in alto, la sostituisce con la tua foto di pizza. Resta in questo browser, non viene inviata da nessuna parte e fa parte del file di backup. «Foto originale» rimette l’immagine iniziale.','<b>Sua foto</b>: o botão “📷 Trocar a foto”, na imagem do topo, a substitui pela sua própria foto de pizza. Ela fica neste navegador, não é enviada a lugar nenhum e faz parte do arquivo de backup. “Foto original” devolve a imagem inicial.','<b>你的照片</b>：顶部图片上的“📷 更换照片”按钮可以换成你自己的披萨照片。照片只保存在这个浏览器里，不会发送到任何地方，并包含在备份文件中。“原始照片”可恢复原来的图片。'),
    T('<b>Taille du texte</b> : tout en haut, les boutons « A− » et « A+ » réduisent ou agrandissent l’affichage de l’appli (de 80 % à 130 %). Le réglage est gardé dans ce navigateur.','<b>Text size</b>: at the very top, the “A−” and “A+” buttons make the app smaller or larger (80% to 130%). The setting is kept in this browser.','<b>Tamaño del texto</b>: arriba del todo, los botones «A−» y «A+» reducen o agrandan la app (del 80 % al 130 %). El ajuste se guarda en este navegador.','<b>Dimensione del testo</b>: in cima, i pulsanti «A−» e «A+» riducono o ingrandiscono l’app (dall’80% al 130%). L’impostazione resta in questo browser.','<b>Tamanho do texto</b>: bem no topo, os botões “A−” e “A+” diminuem ou aumentam a exibição do app (de 80% a 130%). O ajuste fica salvo neste navegador.','<b>文字大小</b>：在最顶部，“A−”和“A+”按钮可以缩小或放大应用显示（80% 到 130%）。设置保存在这个浏览器中。'),
    T('<b>Calories</b> : un encadré sous les quantités (rubrique 6, Quantités calculées) estime l’énergie de la pizza complète (pâte, sauce, fromage et garniture), par pizza, par part et en tout, avec la part de la pâte.','<b>Calories</b>: an estimate per pizza and per slice, under the quantities.','<b>Calorías</b>: una estimación por pizza y por porción, bajo las cantidades.','<b>Calorie</b>: una stima per pizza e per fetta, sotto le quantità.','<b>Calorias</b>: um quadro abaixo das quantidades (seção 6, Quantidades calculadas) estima a energia da pizza completa (massa, molho, queijo e cobertura), por pizza, por fatia e no total, com a parte da massa.','<b>卡路里</b>：用量下方（第 6 部分“计算出的用量”）的方框会估算整张披萨（面团、酱、奶酪和配料）的能量，分为每张、每片和总计，并列出面团所占部分。'),
    T('<b>Suivre et partager</b> : coût de revient, liste de courses, recettes et journal de fournées, sauvegarde dans un fichier, cuisine à 20 °C par défaut (réglable).','<b>Track and share</b>: cost, shopping list, recipes and bake log, backup to a file, kitchen at 20 °C by default (adjustable).','<b>Seguir y compartir</b>: coste, lista de la compra, recetas y diario de horneadas, copia en un archivo, cocina a 20 °C por defecto (ajustable).','<b>Seguire e condividere</b>: costo, lista della spesa, ricette e diario delle infornate, backup in un file, cucina a 20 °C di base (regolabile).','<b>Acompanhar e compartilhar</b>: custo, lista de compras, receitas e diário de fornadas, backup em arquivo, cozinha a 20 °C por padrão (ajustável).','<b>记录和分享</b>：成本、购物清单、配方和烘焙日志、备份到文件，厨房温度默认 20 °C（可调）。')])}

  ${li([T('Tes recettes, notes, étoiles et prix restent <b>dans le navigateur</b> qui a ouvert le fichier, pas dans le fichier lui-même.','Your recipes, notes, stars and prices stay <b>in the browser</b> that opened the file, not in the file itself.','Tus recetas, notas, estrellas y precios se quedan <b>en el navegador</b> que abrió el archivo, no en el archivo.','Le tue ricette, note, stelle e prezzi restano <b>nel browser</b> che ha aperto il file, non nel file stesso.','Suas receitas, anotações, estrelas e preços ficam <b>no navegador</b> que abriu o arquivo, não no arquivo em si.','你的配方、笔记、星级和价格保存在打开文件的<b>浏览器</b>中，而不在文件本身里。'),T('Un navigateur, une copie : ouvrir le fichier dans Firefox ne montre pas les recettes enregistrées dans Chrome. Choisis un navigateur et tiens-t’y.','One browser, one copy: opening the file in Firefox does not show the recipes saved in Chrome. Pick one browser and stick to it.','Un navegador, una copia: abrir el archivo en Firefox no muestra las recetas guardadas en Chrome. Elige un navegador y quédate con él.','Un browser, una copia: aprire il file in Firefox non mostra le ricette salvate in Chrome. Scegli un browser e usa sempre quello.','Um navegador, uma cópia: abrir o arquivo no Firefox não mostra as receitas salvas no Chrome. Escolha um navegador e fique com ele.','一个浏览器，一份数据：在 Firefox 中打开文件看不到在 Chrome 中保存的配方。请固定使用一个浏览器。'),T('Après chaque séance, clique sur « Sauvegarder tous les changements » et range le fichier .json dans un dossier synchronisé (OneDrive, Google Drive, Dropbox).','After each session, click “Save all changes” and keep the .json file in a synced folder (OneDrive, Google Drive, Dropbox).','Después de cada sesión, pulsa «Guardar todos los cambios» y guarda el archivo .json en una carpeta sincronizada (OneDrive, Google Drive, Dropbox).','Dopo ogni sessione, clicca su «Salva tutte le modifiche» e metti il file .json in una cartella sincronizzata (OneDrive, Google Drive, Dropbox).','Depois de cada sessão, clique em “Salvar todas as alterações” e guarde o arquivo .json numa pasta sincronizada (OneDrive, Google Drive, Dropbox).','每次使用后，点击“保存所有更改”，把 .json 文件放在同步文件夹中（OneDrive、Google Drive、Dropbox）。'),T('Avant une nouvelle version : sauvegarde dans l’ancienne, ouvre la nouvelle, vérifie tes recettes. S’il en manque, « Mes fichiers », puis « Importer un fichier .json ».','Before a new version: back up in the old one, open the new one, check your recipes. If any are missing, “My files”, then “Import a .json file”.','Antes de una nueva versión: haz una copia en la antigua, abre la nueva y comprueba tus recetas. Si falta alguna, «Mis archivos» y luego «Importar un archivo .json».','Prima di una nuova versione: fai il backup nella vecchia, apri la nuova, controlla le ricette. Se ne manca qualcuna, «I miei file», poi «Importa un file .json».','Antes de uma nova versão: faça o backup na antiga, abra a nova e confira suas receitas. Se faltar alguma, “Meus arquivos” e depois “Importar um arquivo .json”.','换新版本之前：先在旧版本中备份，再打开新版本，检查配方。如果缺少，点“我的文件”，再点“导入 .json 文件”。'),T('Ce qui efface les données : la navigation privée, « Effacer les données de navigation » (cookies et données de site), et parfois le déplacement ou le renommage du fichier.','What erases the data: private browsing, “Clear browsing data” (cookies and site data), and sometimes moving or renaming the file.','Lo que borra los datos: la navegación privada, «Borrar datos de navegación» (cookies y datos de sitios) y a veces mover o renombrar el archivo.','Cosa cancella i dati: la navigazione privata, «Cancella dati di navigazione» (cookie e dati dei siti), e a volte spostare o rinominare il file.','O que apaga os dados: navegação privada, “Limpar dados de navegação” (cookies e dados de sites) e, às vezes, mover ou renomear o arquivo.','会清除数据的操作：隐私浏览、“清除浏览数据”（Cookie 和网站数据），有时还有移动或重命名文件。'),T('Pour partager : envoie le fichier .html, plus une sauvegarde ou une recette (.json) à importer.','To share: send the .html file, plus a backup or a recipe (.json) to import.','Para compartir: envía el archivo .html y una copia o una receta (.json) para importar.','Per condividere: manda il file .html, più un backup o una ricetta (.json) da importare.','Para compartilhar: envie o arquivo .html, mais um backup ou uma receita (.json) para importar.','分享时：发送 .html 文件，再加上一个备份或配方（.json）供对方导入。')])}

/* ---------- search ---------- */
function srchItems(){
  const it=[];
  document.querySelectorAll('section[data-toc]').forEach(sec=>it.push({k:T('Rubrique','Section','Sección','Sezione','Seção','部分'),t:sec.querySelector('h2').textContent,x:'',go:()=>goSec(sec.dataset.toc)}));
  [...Object.keys(METHODS),...umList().map(u=>'u:'+u.id)].forEach(k=>{ const m=mdef(k), t=L3([m.fr,m.en,m.es,m.it,m.pt,m.zh]); it.push({k:T('Méthode','Method','Método','Metodo','Método','方法'),t:t[0],x:t[1]||'',go:()=>{ const r=F.querySelector(`input[name=method][value="${k}"]`); if(r){ r.checked=true; onMethod(); render(); renderC(); autoPick(); } goSec('carD'); }}); });
  carnet.entries.forEach(e=>it.push({k:T('Recette','Recipe','Receta','Ricetta','Receita','做法'),t:eTitle(e),x:(eNotes(e)||'')+' '+(e.author||'')+' '+(e.cat||''),go:()=>{ openEntry(e); goSec('carD'); setTimeout(()=>$('cFiche').scrollIntoView({behavior:'smooth',block:'start'}),400); }}));
  FAQ.forEach(f=>it.push({k:'FAQ',t:L3(f.q),x:stripTags(L3(f.a)),go:()=>{ $('faqQ').value=L3(f.q); renderFaq(); goSec('faqD'); }}));
  $('plan').querySelectorAll('li[data-st]').forEach(li=>{ const b=li.querySelector('.what>b'); it.push({k:T('Étape','Step','Paso','Passaggio','Etapa','步骤'),t:(li.querySelector('.when .t')||{}).textContent+' · '+(b?b.textContent:''),x:li.querySelector('.what').textContent,go:()=>{ goSec('planD'); setTimeout(()=>li.scrollIntoView({behavior:'smooth',block:'center'}),400); }}); });
  return it;
}
let srchCache=[];
function runSearch(){
  const q=norm($('srchQ').value.trim()), w=q.split(/\s+/).filter(Boolean);
  if(!w.length){ $('srchR').innerHTML=''; $('srchN').textContent=T('Tape un mot : recette, méthode, question, étape…','Type a word: recipe, method, question, step…','Escribe una palabra: receta, método, pregunta, paso…','Scrivi una parola: ricetta, metodo, domanda, passaggio…','Digite uma palavra: receita, método, pergunta, etapa…','输入关键词：配方、方法、问题、步骤……'); return; }
  srchCache=srchItems().filter(i=>{ const h=norm(i.t+' '+i.x); return w.every(x=>h.includes(x)); }).slice(0,40);
  $('srchN').textContent=T(`${srchCache.length} résultat${srchCache.length>1?'s':''}`,`${srchCache.length} result${srchCache.length>1?'s':''}`,`${srchCache.length} resultado${srchCache.length>1?'s':''}`,`${srchCache.length} risultat${srchCache.length>1?'i':'o'}`,`${srchCache.length} resultado${srchCache.length>1?'s':''}`,`${srchCache.length} 个结果`);
  $('srchR').innerHTML=srchCache.map((i,n)=>`<li><button type="button" data-sr="${n}"><span class="badge">${esc(i.k)}</span> <b>${esc(i.t)}</b></button></li>`).join('');
}
$('srchBtn').addEventListener('click',()=>{ const p=$('srch'); p.hidden=!p.hidden; if(!p.hidden){ $('srchQ').focus(); runSearch(); } });
$('srchX').addEventListener('click',()=>{ $('srch').hidden=true; });
$('srchQ').addEventListener('input',runSearch);
$('srchQ').addEventListener('keydown',e=>{ if(e.key==='Escape') $('srch').hidden=true; if(e.key==='Enter'&&srchCache[0]){ srchCache[0].go(); $('srch').hidden=true; } });
$('srchR').addEventListener('click',e=>{ const b=e.target.closest('[data-sr]'); if(!b) return; const i=srchCache[+b.dataset.sr]; $('srch').hidden=true; if(i) i.go(); });

function spSync(){ try{
  const s=read0(), m=(F.querySelector('input[name=method]:checked')||{}).value||'';
  $('spN').textContent=$('n').value;
