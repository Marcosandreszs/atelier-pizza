const FAQC=()=>({about:T('L’appli','The app','La app','L’app'),site:T('Réglages du site','Site settings','Ajustes del sitio','Impostazioni del sito'),rec:T('Réglages des recettes','Recipe settings','Ajustes de las recetas','Impostazioni delle ricette'),save:T('Sauvegarde et partage','Backup and sharing','Copias y compartir','Backup e condivisione'),hand:T('Tours de main','Techniques','Técnica','Tecnica'),ing:T('Ingrédients','Ingredients','Ingredientes','Ingredienti'),oven:T('Four et cuisson','Oven and baking','Horno y horneado','Forno e cottura'),keep:T('Conservation','Storage','Conservación','Conservazione'),app:T('Utiliser l’atelier','Using the app','Usar la app','Usare l’app')});
const FAQ=[
 {c:'about',q:['Que peut faire cette appli ?','What can this app do?','¿Qué puede hacer esta app?','Che cosa può fare questa app?'],
  a:['<b>Planifier une fournée de A à Z</b> à partir de l’heure du repas :<br>• choisir d’abord le nombre et la taille des pizzas, ou partir de la farine que tu as ;<br>• puis choisir une méthode (poolish, biga, express, recette simple, directe longue, frigo, levain, en moule, sans gluten, focaccia ou une méthode perso) et une recette ;<br>• indiquer où tu en es (pré-ferment déjà lancé, pâte ou pâtons déjà faits) et changer d’avis en cours de route ;<br>• régler l’épaisseur, la farine, l’hydratation, le sel, l’huile, le miel, la levure, la température de la cuisine et le four ;<br>• calculer toutes les quantités (pâte, poolish, sauce, garniture) et le coût de revient ;<br>• construire le rétroplanning en arrière depuis l’heure du service, entre 8 h et 22 h, avec l’état des mains et du plan de travail à chaque étape ;<br>• lancer un minuteur à chaque étape, exporter les étapes dans ton agenda, faire la liste de courses, imprimer la fiche ;<br>• enregistrer, noter, classer, partager et importer des recettes et des garnitures, et tenir un journal de fournée ;<br>• chercher n’importe quoi avec la loupe ;<br>• sauvegarder tout dans un fichier, en français, en anglais, en espagnol ou en italien, avec la devise, les farines et les unités du pays choisi.','<b>Plan a bake from start to finish</b> from serving time:<br>• first pick the number and size of pizzas, or start from the flour you have;<br>• then pick a method (poolish, biga, express, simple recipe, long straight, cold, sourdough, pan, gluten-free, focaccia or a custom one) and a recipe;<br>• say where you are at (preferment started, dough or balls made) and change your mind along the way;<br>• set thickness, flour, hydration, salt, oil, honey, yeast, kitchen temperature and oven;<br>• work out every amount (dough, poolish, sauce, toppings) and the cost;<br>• build the backward schedule from serving time, between 8 am and 10 pm, with hands and counter advice at each step;<br>• start a timer at each step, export the steps to your calendar, make the shopping list, print the sheet;<br>• save, rate, sort, share and import recipes and topping sets, and keep a bake log;<br>• search anything with the magnifier;<br>• back everything up to a file, in French, English, Spanish or Italian, with the currency, flours and units of the chosen country.','<b>Planificar una horneada de principio a fin</b> desde la hora de servir:<br>• elegir primero el número y el tamaño de las pizzas, o partir de la harina que tienes;<br>• luego elegir un método (poolish, biga, exprés, receta sencilla, directa larga, nevera, masa madre, en molde, sin gluten, focaccia o uno propio) y una receta;<br>• indicar en qué punto estás (prefermento empezado, masa o bolas hechas) y cambiar de idea sobre la marcha;<br>• ajustar grosor, harina, hidratación, sal, aceite, miel, levadura, temperatura de la cocina y horno;<br>• calcular todas las cantidades (masa, poolish, salsa, cobertura) y el coste;<br>• construir la planificación hacia atrás desde la hora de servir, entre las 8 h y las 22 h, con consejos de manos y encimera en cada paso;<br>• lanzar un temporizador en cada paso, exportar los pasos al calendario, hacer la lista de la compra, imprimir la ficha;<br>• guardar, valorar, ordenar, compartir e importar recetas y coberturas, y llevar un diario de horneadas;<br>• buscar cualquier cosa con la lupa;<br>• guardarlo todo en un archivo, en francés, inglés, español o italiano, con la moneda, las harinas y las unidades del país elegido.','<b>Pianificare un’infornata dall’inizio alla fine</b> partendo dall’ora del servizio:<br>• scegliere prima numero e misura delle pizze, o partire dalla farina che hai;<br>• poi scegliere un metodo (poolish, biga, express, ricetta semplice, diretto lungo, in frigo, lievito madre, in teglia, senza glutine, focaccia o un metodo personale) e una ricetta;<br>• dire a che punto sei (prefermento avviato, impasto o panetti fatti) e cambiare idea strada facendo;<br>• regolare spessore, farina, idratazione, sale, olio, miele, lievito, temperatura della cucina e forno;<br>• calcolare tutte le quantità (impasto, poolish, salsa, condimento) e il costo;<br>• costruire il programma a ritroso dall’ora del servizio, tra le 8 e le 22, con consigli su mani e piano di lavoro a ogni passaggio;<br>• avviare un timer a ogni passaggio, esportare i passaggi nel calendario, fare la lista della spesa, stampare la scheda;<br>• salvare, votare, ordinare, condividere e importare ricette e condimenti, e tenere un diario delle infornate;<br>• cercare qualsiasi cosa con la lente;<br>• salvare tutto in un file, in francese, inglese, spagnolo o italiano, con la valuta, le farine e le unità del paese scelto.']},
 {c:'site',q:['Comment mettre ma propre photo de pizza ?','How do I use my own pizza photo?','¿Cómo poner mi propia foto de pizza?','Come mettere la mia foto di pizza?'],
  a:['Sur l’image du haut, clique sur « 📷 Changer la photo » et choisis une image (JPEG ou PNG, prise au téléphone par exemple). L’appli la réduit pour qu’elle prenne peu de place. Elle reste dans ce navigateur, n’est envoyée nulle part et fait partie du fichier de sauvegarde. Pour revenir à l’image de départ : « Photo d’origine ».','On the top image, click “📷 Change photo” and pick an image (JPEG or PNG, for example taken with your phone). The app shrinks it so it takes little space. It stays in this browser, is sent nowhere and is part of the backup file. To go back to the starting image: “Original photo”.','En la imagen de arriba, pulsa «📷 Cambiar foto» y elige una imagen (JPEG o PNG, por ejemplo hecha con el móvil). La app la reduce para que ocupe poco. Se queda en este navegador, no se envía a ningún sitio y forma parte del archivo de copia. Para volver a la imagen de inicio: «Foto original».','Sull’immagine in alto, clicca «📷 Cambia foto» e scegli un’immagine (JPEG o PNG, per esempio scattata col telefono). L’app la riduce perché occupi poco spazio. Resta in questo browser, non viene inviata da nessuna parte e fa parte del file di backup. Per tornare all’immagine iniziale: «Foto originale».']},
 {c:'site',q:['Comment agrandir le texte ?','How do I make the text larger?','¿Cómo agrandar el texto?','Come ingrandire il testo?'],
  a:['Tout en haut de l’appli, clique sur « A+ » pour agrandir (jusqu’à 130 %) ou sur « A− » pour réduire (jusqu’à 80 %), par paliers de 10 %. Tout l’affichage suit et le réglage est gardé dans ce navigateur.','At the very top of the app, click “A+” to enlarge (up to 130%) or “A−” to reduce (down to 80%), in 10% steps. The whole display follows and the setting is kept in this browser.','Arriba del todo, pulsa «A+» para agrandar (hasta 130 %) o «A−» para reducir (hasta 80 %), de 10 en 10 %. Toda la pantalla sigue y el ajuste se guarda en este navegador.','In cima all’app, clicca «A+» per ingrandire (fino al 130%) o «A−» per ridurre (fino all’80%), a passi del 10%. Tutta la visualizzazione segue e l’impostazione resta in questo browser.']},
 {c:'site',q:['Comment changer l’apparence du site ?','How do I change the app’s appearance?','¿Cómo cambio la apariencia del sitio?','Come cambio l’aspetto del sito?'],
  a:['En haut de la page, « Apparence du site » : Automatique (suit le mode clair ou sombre de l’appareil), Clair, Sombre, Cahier (fond quadrillé, police Verdana), Fond blanc (le plus lisible en plein jour) ou Lavande (tons mauve, rose et bleu pastel). Le choix est gardé dans ce navigateur. Ça ne change que l’affichage, pas les recettes.','At the top of the page, “Appearance”: Automatic (follows the device’s light or dark mode), Light, Dark, Notebook (grid paper, Verdana font), White (easiest to read in daylight) or Lavender (mauve, pink and pastel blue tones). The choice is kept in this browser. It only changes the display, not the recipes.','Arriba de la página, «Apariencia del sitio»: Automática (sigue el modo claro u oscuro del dispositivo), Claro, Oscuro, Cuaderno (fondo cuadriculado, letra Verdana), Fondo blanco (lo más legible de día) o Lavanda (tonos malva, rosa y azul pastel). La elección se guarda en este navegador. Solo cambia la presentación, no las recetas.','In alto nella pagina, «Aspetto del sito»: Automatico (segue la modalità chiara o scura del dispositivo), Chiaro, Scuro, Quaderno (fondo a quadretti, carattere Verdana), Sfondo bianco (il più leggibile di giorno) o Lavanda (toni malva, rosa e azzurro pastello). La scelta resta in questo browser. Cambia solo la visualizzazione, non le ricette.']},
 {c:'site',q:['Où sont gardés mes réglages du site ?','Where are my site settings kept?','¿Dónde se guardan mis ajustes del sitio?','Dove sono salvate le impostazioni del sito?'],
  a:['La langue, le pays, l’apparence, les tris et les rubriques ouvertes sont gardés dans ce navigateur. Ils ne sont pas dans le fichier de sauvegarde : sur un autre appareil, il suffit de les choisir à nouveau.','Language, country, look, sorting and open sections are kept in this browser. They are not in the backup file: on another device, just choose them again.','El idioma, el país, la apariencia, los órdenes y las secciones abiertas se guardan en este navegador. No van en el archivo de copia: en otro dispositivo, basta con elegirlos de nuevo.','Lingua, paese, aspetto, ordinamenti e sezioni aperte restano in questo browser. Non sono nel file di backup: su un altro dispositivo basta sceglierli di nuovo.']},
 {c:'rec',q:['Faut-il indiquer une heure de service ?','Do I have to set a serving time?','¿Hay que indicar una hora de servir?','Bisogna indicare un’ora di servizio?'],
  a:['Non, c’est facultatif (rubrique 1). Sans heure, le rétroplanning compte depuis le départ : +10 min, +1 h 10… Avec une heure, l’appli calcule quand commencer, en plaçant les étapes entre 8 h et 22 h. Dans le rétroplanning, le bouton ▶ (« Je commence maintenant », ou « Je fais la pâte maintenant » si le pré-ferment est déjà lancé) donne à chaque étape une vraie heure à partir de maintenant.','No, it is optional (section 1). Without a time, the schedule counts from the start: +10 min, +1 h 10… With a time, the app works out when to start, between 8 am and 10 pm. In the schedule, the ▶ button (“I’m starting now”, or “I’m making the dough now” if the preferment is already started) gives each step a real clock time from now.','No, es opcional (sección 1). Sin hora, la planificación cuenta desde el inicio: +10 min, +1 h 10… Con hora, la app calcula cuándo empezar, situando los pasos entre las 8 h y las 22 h. En la planificación, el botón ▶ («Empiezo ahora», o «Hago la masa ahora» si el prefermento ya está empezado) da a cada paso una hora real a partir de ahora.','No, è facoltativo (sezione 1). Senza ora, il programma conta dalla partenza: +10 min, +1 h 10… Con un’ora, l’app calcola quando cominciare, collocando i passaggi tra le 8 e le 22. Nel programma, il pulsante ▶ («Comincio adesso», o «Faccio l’impasto adesso» se il prefermento è già avviato) dà a ogni passaggio un orario vero a partire da adesso.']},
 {c:'hand',q:['Comment étaler sans écraser le bord ?','How do I stretch without crushing the rim?','¿Cómo estirar sin aplastar el borde?','Come stendere senza schiacciare il cornicione?'],
  a:['1. Pose le pâton sur de la semoule fine. Du bout des doigts d’une seule main, appuie d’abord sur la partie haute, sans écraser le centre.<br>2. Retourne le pâton : le haut passe en bas. On travaille toujours la partie du haut.<br>3. À deux mains, doigts joints en demi-cercle : c’est ce geste qui forme le bord. Ne touche jamais le bord lui-même.<br>4. Retire l’excès de semoule et repose la pâte.<br>5. Une main reste immobile entre la pâte et le bord ; l’autre étire. Tourne et recommence.<br>6. Déplace la pâte à la spatule ou à la pelle : moins on la touche, plus le bord gonfle.','1. Set the ball on fine semolina. With the fingertips of one hand, first press the top part, without crushing the centre.<br>2. Flip the ball: the top goes to the bottom. You always work the top part.<br>3. With both hands, fingers joined in a half-circle: this forms the rim. Never touch the rim itself.<br>4. Shake off excess semolina and set the dough back down.<br>5. One hand stays still between the dough and the rim; the other stretches. Turn and repeat.<br>6. Move the dough with a spatula or peel: the less you touch it, the more the rim puffs.','1. Pon la bola sobre sémola fina. Con la yema de los dedos de una mano, presiona primero la parte superior, sin aplastar el centro.<br>2. Dale la vuelta: lo de arriba pasa abajo. Siempre se trabaja la parte de arriba.<br>3. Con las dos manos, dedos juntos en semicírculo: así se forma el borde. No toques nunca el borde.<br>4. Quita el exceso de sémola y vuelve a poner la masa.<br>5. Una mano queda quieta entre la masa y el borde; la otra estira. Gira y repite.<br>6. Mueve la masa con una espátula o pala: cuanto menos se toca, más se hincha el borde.','1. Metti il panetto sulla semola rimacinata. Con la punta delle dita di una mano, premi prima la parte alta, senza schiacciare il centro.<br>2. Gira il panetto: sopra va sotto. Si lavora sempre la parte alta.<br>3. A due mani, dita unite a semicerchio: così si forma il cornicione. Non toccare mai il cornicione.<br>4. Togli la semola in eccesso e rimetti giù l’impasto.<br>5. Una mano resta ferma tra l’impasto e il cornicione; l’altra allarga. Gira e ripeti.<br>6. Sposta l’impasto con una spatola o una pala: meno lo tocchi, più il cornicione si gonfia.']},
 {c:'oven',q:['Des taches noires sur le bord : c’est brûlé ?','Black spots on the rim: is it burnt?','Manchas negras en el borde: ¿está quemado?','Macchie scure sul cornicione: è bruciato?'],
  a:['Pas forcément. Les petites taches sombres sur le bord (la « leopardatura », comme un pelage de léopard) viennent de l’eau de la pâte qui se transforme brusquement en vapeur dans un four très chaud. Elles sont typiques d’une cuisson napolitaine à 430 °C ou plus, en 60 à 90 secondes. Dans un four domestique à 260 °C, on les obtient rarement ; le gril en fin de cuisson s’en approche. Une croûte noire et amère partout, en revanche, c’est du brûlé.','Not necessarily. Small dark spots on the rim (“leopardatura”, like a leopard’s coat) come from the water in the dough turning suddenly into steam in a very hot oven. They are typical of Neapolitan baking at 430 °C (800 °F) or more, in 60 to 90 seconds. In a home oven at 260 °C (500 °F) you rarely get them; the broiler at the end comes close. A crust that is black and bitter all over, however, is burnt.','No necesariamente. Las manchitas oscuras del borde (la «leopardatura», como la piel de un leopardo) vienen del agua de la masa que se convierte de golpe en vapor en un horno muy caliente. Son típicas de la cocción napolitana a 430 °C o más, en 60 a 90 segundos. En un horno doméstico a 260 °C se consiguen pocas veces; el grill al final se acerca. Una corteza negra y amarga por todas partes, en cambio, está quemada.','Non per forza. Le macchioline scure sul cornicione (la «leopardatura») vengono dall’acqua dell’impasto che diventa di colpo vapore in un forno molto caldo. Sono tipiche della cottura napoletana a 430 °C o più, in 60–90 secondi. In un forno domestico a 260 °C si ottengono di rado; il grill a fine cottura ci si avvicina. Una crosta nera e amara dappertutto, invece, è bruciata.']},
 {c:'hand',q:['Comment obtenir un bord bien alvéolé ?','How do I get an airy, open rim?','¿Cómo conseguir un borde bien alveolado?','Come ottenere un cornicione ben alveolato?'],
  a:['Plusieurs facteurs jouent ensemble : une farine assez forte pour les longues fermentations (W 280 ou plus, avec un bon équilibre entre ténacité et extensibilité) ; une fermentation bien menée, en temps et en température ; une hydratation et un pétrissage adaptés à ta farine ; et un étalage qui garde le gaz : presse du centre vers l’extérieur en laissant le bord intact, sans rouleau. Un bord écrasé gonfle moins à la cuisson.','Several factors work together: a flour strong enough for long fermentation (W 280 or more, with a good balance of strength and extensibility); well-managed fermentation, in time and temperature; hydration and kneading suited to your flour; and stretching that keeps the gas: press from the centre outwards, leaving the rim intact, no rolling pin. A flattened rim rises less in the oven.','Varios factores actúan juntos: una harina lo bastante fuerte para fermentaciones largas (W 280 o más, con buen equilibrio entre tenacidad y extensibilidad); una fermentación bien llevada, en tiempo y temperatura; una hidratación y un amasado adaptados a tu harina; y un estirado que conserve el gas: presiona del centro hacia fuera dejando el borde intacto, sin rodillo. Un borde aplastado sube menos en el horno.','Più fattori lavorano insieme: una farina abbastanza forte per lievitazioni lunghe (W 280 o più, con un buon equilibrio tra tenacità ed estensibilità); una lievitazione ben gestita, nei tempi e nelle temperature; idratazione e impasto adatti alla farina; e una stesura che conservi il gas: premi dal centro verso l’esterno lasciando intatto il cornicione, senza mattarello. Un cornicione schiacciato cresce meno in cottura.']},
 {c:'rec',q:['Qu’est-ce que la biga ?','What is a biga?','¿Qué es la biga?','Cos’è la biga?'],
  a:['Un pré-ferment italien ferme, préparé la veille : farine, environ 45 % de son poids en eau et 1 % de levure fraîche (0,3 % si elle mûrit au frigo), à peine mélangés. Le poolish, lui, est liquide (autant d’eau que de farine). La biga donne une pâte plus aromatique et plus facile à travailler. Elle mûrit idéalement vers 18 °C ; dans une cuisine plus chaude, l’appli conseille de finir au frigo. Méthode « Biga » dans la rubrique 2, recette « Pizza à la biga (50 %) ».','An Italian stiff preferment made the day before: flour, about 45% of its weight in water and 1% fresh yeast (0.3% if it matures in the fridge), barely mixed. A poolish is liquid (as much water as flour). Biga gives a more flavourful dough that is easier to handle. It matures best around 18 °C (64 °F); in a warmer kitchen the app suggests finishing in the fridge. “Biga” method in section 2, recipe “Biga pizza (50%)”.','Un prefermento italiano firme, preparado la víspera: harina, unos 45 % de su peso en agua y 1 % de levadura fresca (0,3 % si madura en la nevera), apenas mezclados. El poolish, en cambio, es líquido (tanta agua como harina). La biga da una masa más aromática y más fácil de trabajar. Madura mejor hacia 18 °C; en una cocina más caliente, la app aconseja terminar en la nevera. Método «Biga» en la sección 2, receta «Pizza con biga (50 %)».','Un prefermento italiano solido, preparato il giorno prima: farina, circa 45 % del suo peso in acqua e 1 % di lievito fresco (0,3 % se matura in frigo), appena mescolati. Il poolish invece è liquido (tanta acqua quanta farina). La biga dà un impasto più aromatico e più facile da lavorare. Matura meglio intorno ai 18 °C; in una cucina più calda l’app consiglia di finire in frigo. Metodo «Biga» nella sezione 2, ricetta «Pizza con biga (50 %)».']},
 {c:'rec',q:['Que veut dire « Recommandé » ?','What does “Recommended” mean?','¿Qué significa «Recomendado»?','Cosa vuol dire «Consigliato»?'],
  a:['À côté des valeurs réglables (hydratation, sel, levure…), « ✓ Recommandé » signale que la valeur est celle de la recette chargée, ou à défaut celle de la méthode, et qu’elle est dans la plage conseillée. Si cette valeur sort de la plage, l’appli affiche « ✓ Valeur de la recette » (ou « de la méthode ») et l’avertissement « hors plage » reste visible. Si tu as modifié la valeur, le bouton la remet d’un clic.','Next to adjustable values (hydration, salt, yeast…), “✓ Recommended” means the value is the loaded recipe’s, or otherwise the method’s, and that it is within the advised range. If that value is out of range, the app shows “✓ Recipe value” (or “Method value”) and the “out of range” warning stays visible. If you changed the value, the button restores it in one click.','Junto a los valores ajustables (hidratación, sal, levadura…), «✓ Recomendado» indica que el valor es el de la receta cargada o, si no, el del método, y que está dentro del rango aconsejado. Si ese valor queda fuera del rango, la app muestra «✓ Valor de la receta» (o «del método») y el aviso «fuera del rango» sigue visible. Si cambiaste el valor, el botón lo restablece con un clic.','Accanto ai valori regolabili (idratazione, sale, lievito…), «✓ Consigliato» indica che il valore è quello della ricetta caricata, o altrimenti del metodo, e che è nell’intervallo consigliato. Se quel valore è fuori intervallo, l’app mostra «✓ Valore della ricetta» (o «del metodo») e l’avviso «fuori intervallo» resta visibile. Se hai cambiato il valore, il pulsante lo ripristina con un clic.']},
 {c:'rec',q:['À quoi sert la marge si la pâte colle ?','What is the sticky-dough margin for?','¿Para qué sirve el margen si la masa se pega?','A cosa serve il margine se l’impasto si attacca?'],
  a:['Rubrique 3 : la case ajoute jusqu’à 1 h 30 après le pétrissage, pour laisser reposer et repétrir une pâte qui colle encore. L’heure de départ recule d’autant. Si la pâte ne colle pas, ce temps devient un simple repos couvert.','Section 3: the box adds up to 1 h 30 after kneading, to rest and re-knead a dough that still sticks. The start time moves earlier accordingly. If the dough does not stick, that time is just a covered rest.','Sección 3: la casilla añade hasta 1 h 30 tras el amasado, para dejar reposar y volver a amasar una masa que aún se pega. La hora de inicio se adelanta en consecuencia. Si la masa no se pega, ese tiempo es un simple reposo tapado.','Sezione 3: la casella aggiunge fino a 1 h 30 dopo l’impasto, per far riposare e reimpastare un impasto che si attacca ancora. L’ora di partenza si anticipa di conseguenza. Se l’impasto non si attacca, quel tempo diventa un semplice riposo coperto.']},
 {c:'rec',q:['Eau tiède ou à température ambiante ?','Warm or room-temperature water?','¿Agua tibia o a temperatura ambiente?','Acqua tiepida o a temperatura ambiente?'],
  a:['Par défaut, l’appli calcule une eau tiède selon la température de la cuisine. La case « Eau à température ambiante » (rubrique 3) remplace ce calcul, comme dans « Ma pizza ».','By default the app works out warm water from the kitchen temperature. The “Room-temperature water” box (section 3) replaces that, as in “My pizza”.','Por defecto la app calcula agua tibia según la temperatura de la cocina. La casilla «Agua a temperatura ambiente» (sección 3) lo sustituye, como en «Mi pizza».','Di base l’app calcola un’acqua tiepida secondo la temperatura della cucina. La casella «Acqua a temperatura ambiente» (sezione 3) la sostituisce, come in «La mia pizza».']},
 {c:'rec',q:['Que fait la case « Huiler les bords au pinceau » ?','What does “Brush the rim with oil” do?','¿Qué hace la casilla «Pintar los bordes con aceite»?','Cosa fa la casella «Spennellare i bordi con olio»?'],
  a:['Rubrique 5 : elle ajoute l’huile des bords aux quantités et au coût, l’étape au rétroplanning et le geste dans « Garnir la pizza ». La croûte dore mieux.','Section 5: it adds the rim oil to quantities and cost, the step to the schedule and the gesture to “Topping the pizza”. The crust browns better.','Sección 5: añade el aceite de los bordes a cantidades y coste, el paso a la planificación y el gesto a «Cubrir la pizza». La corteza se dora mejor.','Sezione 5: aggiunge l’olio dei bordi a quantità e costo, il passaggio al programma e il gesto in «Condire la pizza». La crosta si dora meglio.']},
 {c:'ing',q:['Combien de calories dans une pizza ?','How many calories are in a pizza?','¿Cuántas calorías tiene una pizza?','Quante calorie ha una pizza?'],
  a:['La rubrique 6, Quantités calculées, donne, dans un encadré, une estimation pour la pizza complète (pâte, sauce, fromage et garniture) : par pizza, par part et en tout, avec le détail pâte d’un côté, sauce et garniture de l’autre. Si la garniture est exclue, l’encadré l’indique et ne compte que la pâte. Les valeurs viennent de tables de composition des aliments (moyennes arrondies) : c’est un ordre de grandeur. Les ingrédients que l’appli ne connaît pas sont signalés « non comptés ».','Section 6, Calculated quantities, gives an estimate per pizza, per slice and in all, from the dough, base and topping amounts. Values come from food composition tables (rounded averages): it is a ballpark figure. Ingredients the app does not know are flagged “not counted”.','La sección 6, Cantidades calculadas, da una estimación por pizza, por porción y en total, a partir de las cantidades de masa, base y cobertura. Los valores vienen de tablas de composición de alimentos (medias redondeadas): es un orden de magnitud. Los ingredientes que la app no conoce se marcan «no contados».','La sezione 6, Quantità calcolate, dà una stima per pizza, per fetta e in tutto, dalle quantità di impasto, base e condimento. I valori vengono da tabelle di composizione degli alimenti (medie arrotondate): è un ordine di grandezza. Gli ingredienti che l’app non conosce sono segnalati «non contati».']},
 {c:'app',q:['Je me suis trompé : comment revenir en arrière ?','I made a mistake: how do I go back?','Me equivoqué: ¿cómo vuelvo atrás?','Ho sbagliato: come torno indietro?'],
  a:['Clique sur « ↶ Annuler », dans la barre du haut : l’appli revient à l’état d’avant, une modification à la fois, jusqu’à 30 (Reprendre ma dernière fournée, Nouvelle fournée, choix de recette, nombre, diamètre, Je commence maintenant…). Un message indique ce qui a été annulé. « ↷ » rétablit. Sur ordinateur, Ctrl+Z et Ctrl+Y marchent aussi (Cmd+Z et Cmd+Maj+Z sur Mac). Le carnet (enregistrer ou effacer une recette) n’est pas concerné. L’historique repart à zéro quand tu rouvres l’appli.','Click “↶ Undo” in the top bar: the app goes back to the previous state, one change at a time, up to 30 (Resume my last bake, New bake, recipe choice, number, diameter, I’m starting now…). A message says what was undone. “↷” redoes. On a computer, Ctrl+Z and Ctrl+Y also work (Cmd+Z and Cmd+Shift+Z on Mac). The recipe book (saving or deleting a recipe) is not affected. History starts over when you reopen the app.','Pulsa «↶ Deshacer» en la barra de arriba: la app vuelve al estado anterior, un cambio cada vez, hasta 30 (Retomar mi última horneada, Nueva horneada, elección de receta, número, diámetro, Empiezo ahora…). Un mensaje indica lo que se deshizo. «↷» rehace. En ordenador, Ctrl+Z y Ctrl+Y también funcionan (Cmd+Z y Cmd+Mayús+Z en Mac). El recetario (guardar o borrar una receta) no se ve afectado. El historial empieza de cero al volver a abrir la app.','Clicca «↶ Annulla» nella barra in alto: l’app torna allo stato precedente, una modifica alla volta, fino a 30 (Riprendere l’ultima infornata, Nuova infornata, scelta della ricetta, numero, diametro, Comincio adesso…). Un messaggio indica cosa è stato annullato. «↷» ripristina. Sul computer funzionano anche Ctrl+Z e Ctrl+Y (Cmd+Z e Cmd+Maiusc+Z su Mac). Il ricettario (salvare o eliminare una ricetta) non è interessato. La cronologia riparte da zero quando riapri l’app.']},
 {c:'rec',q:['Comment avoir des quantités rondes (650 g plutôt que 643 g) ?','How do I get round quantities (650 g rather than 643 g)?','¿Cómo tener cantidades redondas (650 g en vez de 643 g)?','Come avere quantità tonde (650 g invece di 643 g)?'],
  a:['Dans la rubrique 6, Quantités calculées, clique sur « Arrondir les quantités ». L’appli arrondit la farine totale à un chiffre rond (à 100, 50, 25 ou 10 g près, en restant à moins de 2 % d’écart), puis recalcule l’eau, le pré-ferment, le sel et la levure dans les mêmes proportions : l’hydratation et le sel ne changent pas. Les gros poids sont affichés à 5 g près ; le sel et la levure restent précis. Les pâtons pèsent un peu plus ou un peu moins (l’écart est indiqué). Clique à nouveau pour revenir aux valeurs exactes.','In section 6, Calculated quantities, click “Round quantities”. The app rounds the total flour to a round number (to the nearest 100, 50, 25 or 10 g, staying within 2%), then recalculates water, preferment, salt and yeast in the same proportions: hydration and salt do not change. Large weights are shown to the nearest 5 g; salt and yeast stay precise. Dough balls weigh slightly more or less (the difference is shown). Click again to go back to exact values.','En la sección 6, Cantidades calculadas, pulsa «Redondear las cantidades». La app redondea la harina total a una cifra redonda (a 100, 50, 25 o 10 g, sin pasar del 2 % de diferencia) y recalcula el agua, el prefermento, la sal y la levadura en las mismas proporciones: la hidratación y la sal no cambian. Los pesos grandes se muestran de 5 en 5 g; la sal y la levadura siguen precisas. Las bolas pesan un poco más o menos (se indica la diferencia). Pulsa de nuevo para volver a los valores exactos.','Nella sezione 6, Quantità calcolate, clicca «Arrotondare le quantità». L’app arrotonda la farina totale a un numero tondo (ai 100, 50, 25 o 10 g, restando entro il 2%), poi ricalcola acqua, prefermento, sale e lievito nelle stesse proporzioni: idratazione e sale non cambiano. I pesi grandi sono mostrati ai 5 g; sale e lievito restano precisi. I panetti pesano un po’ di più o di meno (la differenza è indicata). Clicca di nuovo per tornare ai valori esatti.']},
 {c:'rec',q:['Je n’ai qu’une certaine quantité de farine : comment faire ?','I only have a certain amount of flour: what do I do?','Solo tengo cierta cantidad de harina: ¿cómo hago?','Ho solo una certa quantità di farina: come faccio?'],
  a:['À l’étape 1 de la rubrique 2, choisis « Je pars de : la farine que j’ai » et entre son poids. L’appli calcule la pâte totale et propose plusieurs répartitions (par exemple 3 pizzas de 40 cm ou 5 de 33 cm). Tu peux aussi régler toi-même le nombre et la taille : le poids des pâtons suit et toute la pâte est utilisée. Elle te dit si la pâte sera plus épaisse ou plus fine que d’habitude.','In step 1 of section 2, choose “I start from: the flour I have” and enter its weight. The app works out the total dough and suggests several splits (for example 3 pizzas of 40 cm or 5 of 33 cm). You can also set the number and size yourself: ball weight follows and all the dough is used. It tells you if the crust will be thicker or thinner than usual.','En el paso 1 de la sección 2, elige «Parto de: la harina que tengo» e indica su peso. La app calcula la masa total y propone varios repartos (por ejemplo 3 pizzas de 40 cm o 5 de 33 cm). También puedes ajustar tú el número y el tamaño: el peso de las bolas se adapta y se usa toda la masa. Te avisa si la masa quedará más gruesa o más fina de lo habitual.','Al passo 1 della sezione 2, scegli «Parto da: la farina che ho» e inserisci il peso. L’app calcola l’impasto totale e propone diverse suddivisioni (per esempio 3 pizze da 40 cm o 5 da 33 cm). Puoi anche regolare tu numero e misura: il peso dei panetti si adegua e si usa tutto l’impasto. Ti dice se l’impasto sarà più spesso o più sottile del solito.']},
 {c:'rec',q:['J’ai déjà lancé mon poolish, ou ma pâte est déjà faite : que faire ?','I already started my poolish, or my dough is already made: what now?','Ya empecé el poolish, o la masa ya está hecha: ¿qué hago?','Ho già avviato il poolish, o l’impasto è già fatto: che faccio?'],
  a:['Dans la rubrique 1, « Où en es-tu ? » : « Pré-ferment déjà lancé » (indique quand), « Pâte faite, en levée » ou « Pâtons déjà faits ». Le rétroplanning commence alors à l’étape suivante, sans te dire qu’il est trop tard pour ce qui est déjà fait. Avec une pâte ou des pâtons faits, les ingrédients ne bougent plus : tu peux encore changer d’avis à l’étape 1 et faire, par exemple, 4 petites pizzas au lieu de 2 grandes ; l’appli calcule le poids et la taille des pâtons, et ajoute une étape pour les rebouler si besoin.','In section 1, “Where are you at?”: “Preferment already started” (say when), “Dough made, rising” or “Dough balls already made”. The schedule then starts at the next step, without telling you it is too late for what is done. With dough or balls made, ingredients are fixed: you can still change your mind in step 1 and make, say, 4 small pizzas instead of 2 large; the app works out ball weight and size, and adds a reshaping step if needed.','En la sección 1, «¿En qué punto estás?»: «Prefermento ya empezado» (indica cuándo), «Masa hecha, levando» o «Bolas ya hechas». La planificación empieza entonces en el paso siguiente, sin decirte que es tarde para lo que ya está hecho. Con la masa o las bolas hechas, los ingredientes ya no cambian: aún puedes cambiar de idea en el paso 1 y hacer, por ejemplo, 4 pizzas pequeñas en vez de 2 grandes; la app calcula el peso y el tamaño de las bolas y añade un paso para volver a bolearlas si hace falta.','Nella sezione 1, «A che punto sei?»: «Prefermento già avviato» (indica quando), «Impasto fatto, in lievitazione» o «Panetti già fatti». Il programma parte allora dal passaggio successivo, senza dirti che è tardi per ciò che è già fatto. Con impasto o panetti fatti, gli ingredienti non cambiano più: puoi ancora cambiare idea al passo 1 e fare, per esempio, 4 pizze piccole invece di 2 grandi; l’app calcola peso e misura dei panetti e aggiunge un passaggio per riformarli se serve.']},
 {c:'rec',q:['Pourquoi la recette ne change-t-elle pas mon nombre de pizzas ?','Why doesn’t a recipe change my number of pizzas?','¿Por qué la receta no cambia mi número de pizzas?','Perché la ricetta non cambia il mio numero di pizze?'],
  a:['Dans la rubrique 2, tu choisis d’abord le nombre et le format de tes pizzas, puis la méthode, puis la recette. La recette n’apporte que ses proportions (eau, sel, levure, farine, durées) ; les quantités sont recalculées pour ton nombre de pizzas et ta taille, et le poids des pâtons suit la surface. Seules les focaccias passent en plaque.','In section 2 you pick the number and size of your pizzas first, then the method, then the recipe. The recipe only brings its proportions (water, salt, yeast, flour, times); amounts are recalculated for your number and size, and ball weight follows the surface. Only focaccias switch to a pan.','En la sección 2 eliges primero el número y el formato de tus pizzas, luego el método y después la receta. La receta solo aporta sus proporciones (agua, sal, levadura, harina, tiempos); las cantidades se recalculan para tu número y tamaño, y el peso de las bolas sigue la superficie. Solo las focaccias pasan a bandeja.','Nella sezione 2 scegli prima numero e formato delle pizze, poi il metodo, poi la ricetta. La ricetta porta solo le sue proporzioni (acqua, sale, lievito, farina, tempi); le quantità vengono ricalcolate per il tuo numero e la tua misura, e il peso dei panetti segue la superficie. Solo le focacce passano in teglia.']},
 {c:'rec',q:['Pourquoi la température de la cuisine revient à 20 °C ?','Why does the kitchen temperature go back to 20 °C?','¿Por qué la temperatura de la cocina vuelve a 20 °C?','Perché la temperatura della cucina torna a 20 °C?'],
  a:['C’est une donnée du jour, pas de la recette : elle revient à 20 °C à chaque ouverture, et charger une recette ne la change pas. Règle-la selon ta cuisine ; le bouton « Remettre à 20 °C » la réinitialise.','It is a condition of the day, not of the recipe: it goes back to 20 °C each time you open the app, and loading a recipe does not change it. Set it for your kitchen; the “Reset to 20 °C” button resets it.','Es un dato del día, no de la receta: vuelve a 20 °C cada vez que abres la app y cargar una receta no la cambia. Ajústala según tu cocina; el botón «Volver a 20 °C» la restablece.','È un dato del giorno, non della ricetta: torna a 20 °C a ogni apertura e caricare una ricetta non la cambia. Regolala secondo la tua cucina; il pulsante «Torna a 20 °C» la reimposta.']},
 {c:'save',q:['Comment garder l’appli et ne rien perdre ?','How do I keep the app and lose nothing?','¿Cómo conservo la app sin perder nada?','Come conservo l’app senza perdere nulla?'],
  a:['Range le fichier « Atelier Pizza.html » dans un dossier fixe, ajoute-le aux favoris, et sauvegarde tes changements dans un fichier .json après chaque séance. Tout est expliqué dans la fenêtre « Utiliser l’appli » : <button type="button" class="mini" data-openuse>Ouvrir</button>','Keep the file “Atelier Pizza.html” in a fixed folder, bookmark it, and save your changes to a .json file after each session. Everything is explained in the “Using the app” window: <button type="button" class="mini" data-openuse>Open</button>','Guarda el archivo «Atelier Pizza.html» en una carpeta fija, añádelo a favoritos y guarda tus cambios en un archivo .json tras cada sesión. Todo se explica en la ventana «Usar la app»: <button type="button" class="mini" data-openuse>Abrir</button>','Tieni il file «Atelier Pizza.html» in una cartella fissa, aggiungilo ai preferiti e salva le modifiche in un file .json dopo ogni sessione. Tutto è spiegato nella finestra «Usare l’app»: <button type="button" class="mini" data-openuse>Apri</button>']},
 {c:'app',q:['Comment chercher dans l’appli ?','How do I search the app?','¿Cómo busco en la app?','Come cerco nell’app?'],
  a:['La loupe « Rechercher », en haut, cherche dans les recettes (titres et notes), les méthodes, la FAQ, les étapes du rétroplanning et les titres des rubriques. Clique sur un résultat pour y aller ; Entrée ouvre le premier.','The “Search” magnifier at the top looks through recipes (titles and notes), methods, the FAQ, schedule steps and section titles. Click a result to go there; Enter opens the first one.','La lupa «Buscar», arriba, busca en las recetas (títulos y notas), los métodos, las preguntas frecuentes, los pasos de la planificación y los títulos de las secciones. Pulsa un resultado para ir allí; Intro abre el primero.','La lente «Cerca», in alto, cerca nelle ricette (titoli e note), nei metodi, nelle domande frequenti, nei passaggi del programma e nei titoli delle sezioni. Clicca su un risultato per andarci; Invio apre il primo.']},
 {c:'site',q:['Comment changer la langue ou le pays ?','How do I change the language or country?','¿Cómo cambio el idioma o el país?','Come cambio lingua o paese?'],
  a:['En haut de la page : la langue (français, anglais, espagnol, italien) traduit tous les textes ; le pays règle la devise, les farines vendues sur place et les unités. On peut combiner, par exemple l’italien avec les farines du Canada.','At the top of the page: the language (French, English, Spanish, Italian) translates all texts; the country sets the currency, local flours and units. You can mix them, for example Italian with Canadian flours.','Arriba de la página: el idioma (francés, inglés, español, italiano) traduce todos los textos; el país fija la moneda, las harinas locales y las unidades. Se pueden combinar, por ejemplo italiano con harinas de Canadá.','In alto nella pagina: la lingua (francese, inglese, spagnolo, italiano) traduce tutti i testi; il paese imposta la valuta, le farine locali e le unità. Si possono combinare, per esempio l’italiano con le farine del Canada.']},
 {c:'hand',q:['Ma pâte colle : j’ajoute de la farine ?','My dough is sticky: should I add flour?','La masa se pega: ¿añado harina?','L’impasto è appiccicoso: aggiungo farina?'],
  a:['Non. Ajouter de la farine change ta recette : à 70 % d’hydratation, 100 g de farine en plus pour 1 kg de farine font tomber la pâte vers 64 %. Elle devient plus dense, plus sèche après cuisson, avec des zones compactes. Ta pâte ne contient pas trop d’eau, elle manque de temps : la farine met plusieurs dizaines de minutes à absorber l’eau. Laisse reposer 15 à 20 min, puis fais des rabats (replie la pâte sur elle-même) : repos, rabat, repos, rabat, jusqu’à ce qu’elle se tienne. Mains mouillées pour la travailler dans le bol ; mains huilées pour les rabats et pour la manipuler entre deux.','No. Adding flour changes your recipe: at 70% hydration, 100 g extra flour per 1 kg flour drops the dough to about 64%. It gets denser, drier after baking, with compact patches. Your dough does not have too much water, it needs time: flour takes tens of minutes to absorb water. Rest 15 to 20 min, then do folds (fold the dough over itself): rest, fold, rest, fold, until it holds. Wet hands to work it in the bowl; oiled hands for folds and handling in between.','No. Añadir harina cambia tu receta: al 70 % de hidratación, 100 g más de harina por 1 kg bajan la masa a un 64 %. Queda más densa, más seca tras hornear y con zonas compactas. Tu masa no tiene demasiada agua, le falta tiempo: la harina tarda decenas de minutos en absorber el agua. Deja reposar 15 a 20 min y luego haz pliegues: reposo, pliegue, reposo, pliegue, hasta que se sostenga. Manos mojadas para trabajarla en el bol; manos aceitadas para los pliegues y la manipulación.','No. Aggiungere farina cambia la ricetta: al 70% d’idratazione, 100 g di farina in più per 1 kg di farina portano l’impasto a circa 64%. Diventa più denso, più secco dopo la cottura, con zone compatte. L’impasto non ha troppa acqua, ha bisogno di tempo: la farina impiega decine di minuti ad assorbire l’acqua. Lascia riposare 15–20 min, poi fai delle pieghe (ripiega l’impasto su sé stesso): riposo, piega, riposo, piega, finché sta in forma. Mani bagnate per lavorarlo nella ciotola; mani unte per le pieghe e per maneggiarlo tra un riposo e l’altro.']},
 {c:'hand',q:['Mains mouillées ou huilées : quand ?','Wet or oiled hands: when?','Manos mojadas o aceitadas: ¿cuándo?','Mani bagnate o unte: quando?'],
  a:['Mains mouillées à l’eau pour le mélange et le pétrissage dans le bol : la pâte ne colle pas aux doigts. Mains huilées ensuite, pour les rabats, la manipulation entre deux repos et le boulage. Farine ou semoule seulement au moment d’étaler.','Wet hands for mixing and kneading in the bowl: the dough will not stick to your fingers. Then oiled hands for folds, handling between rests and shaping balls. Flour or semolina only when stretching.','Manos mojadas para mezclar y amasar en el bol: la masa no se pega a los dedos. Después, manos aceitadas para los pliegues, la manipulación entre reposos y el boleado. Harina o sémola solo al estirar.','Mani bagnate d’acqua per mescolare e impastare nella ciotola: l’impasto non si attacca alle dita. Poi mani unte per le pieghe, per maneggiarlo tra un riposo e l’altro e per formare i panetti. Farina o semola solo per stendere.']},
 {c:'save',q:['Où sont gardées mes recettes ?','Where are my recipes kept?','¿Dónde se guardan mis recetas?','Dove sono conservate le mie ricette?'],
  a:['Dans ce navigateur, sur cet appareil seulement. Elles disparaissent si tu effaces les données du site, si tu utilises la navigation privée, un autre navigateur ou un autre appareil. D’où l’intérêt du fichier de sauvegarde.','In this browser, on this device only. They are lost if you clear site data, use private browsing, another browser or another device. Hence the backup file.','En este navegador y en este dispositivo solamente. Se pierden si borras los datos del sitio, usas la navegación privada, otro navegador u otro dispositivo. De ahí el archivo de copia.','In questo browser, solo su questo dispositivo. Si perdono se cancelli i dati del sito, se usi la navigazione privata, un altro browser o un altro dispositivo. Da qui l’importanza del file di backup.']},
 {c:'save',q:['Comment ne rien perdre ?','How do I make sure I lose nothing?','¿Cómo no perder nada?','Come faccio a non perdere nulla?'],
  a:['Clique sur « Sauvegarder tous les changements » (en haut ou en bas) après chaque séance. Tu obtiens un fichier .json avec tout : recettes, notes, étoiles, journal, garnitures, méthodes, catégories et prix. Range-le dans un dossier synchronisé (OneDrive, Google Drive, Dropbox). L’indicateur orange signale les changements pas encore sauvegardés, et le navigateur demande une confirmation si tu quittes avant.','Click “Save all changes” (top or bottom) after each session. You get a .json file with everything: recipes, notes, stars, log, topping sets, methods, categories and prices. Keep it in a synced folder (OneDrive, Google Drive, Dropbox). The orange status shows unsaved changes, and the browser asks for confirmation if you leave before saving.','Pulsa «Guardar todos los cambios» (arriba o abajo) después de cada sesión. Obtienes un archivo .json con todo: recetas, notas, estrellas, diario, coberturas, métodos, categorías y precios. Guárdalo en una carpeta sincronizada (OneDrive, Google Drive, Dropbox). El aviso naranja indica cambios sin guardar y el navegador pide confirmación si sales antes.','Clicca su «Salva tutte le modifiche» (in alto o in basso) dopo ogni sessione. Ottieni un file .json con tutto: ricette, note, stelle, diario, condimenti, metodi, categorie e prezzi. Tienilo in una cartella sincronizzata (OneDrive, Google Drive, Dropbox). L’indicatore arancione segnala le modifiche non salvate, e il browser chiede conferma se esci prima.']},
 {c:'save',q:['Comment récupérer ma sauvegarde ou passer sur un autre appareil ?','How do I restore a backup or move to another device?','¿Cómo recupero mi copia o paso a otro dispositivo?','Come recupero un backup o passo a un altro dispositivo?'],
  a:['En haut, « Mes fichiers : importer, partager, notes », puis « Importer un fichier .json ». L’import ajoute ce qui manque et n’efface rien.','At the top, “My files: import, share, notes”, then “Import a .json file”. Import adds what is missing and deletes nothing.','Arriba, «Mis archivos: importar, compartir, notas», y luego «Importar un archivo .json». La importación añade lo que falta y no borra nada.','In alto, «I miei file: importa, condividi, note», poi «Importa un file .json». L’importazione aggiunge ciò che manca e non cancella nulla.']},
 {c:'save',q:['Comment envoyer une recette à quelqu’un ?','How do I send a recipe to someone?','¿Cómo envío una receta a alguien?','Come mando una ricetta a qualcuno?'],
  a:['Bouton ⤓ à côté de la recette : le fichier contient les réglages, les notes de l’auteur, les étoiles, la catégorie, la garniture, le journal et la méthode personnalisée utilisée. Envoie-le par courriel ou message ; l’autre personne l’importe dans son atelier.','The ⤓ button next to the recipe: the file holds the settings, author notes, stars, category, toppings, log and any custom method used. Send it by email or message; the other person imports it.','Botón ⤓ junto a la receta: el archivo contiene los ajustes, las notas del autor, las estrellas, la categoría, la cobertura, el diario y el método propio usado. Envíalo por correo o mensaje; la otra persona lo importa.','Il pulsante ⤓ accanto alla ricetta: il file contiene le impostazioni, le note dell’autore, le stelle, la categoria, il condimento, il diario e l’eventuale metodo personale usato. Mandalo per email o messaggio; l’altra persona lo importa.']},
 {c:'save',q:['Sur téléphone, où va le fichier ?','On a phone, where does the file go?','En el móvil, ¿adónde va el archivo?','Sul telefono, dove finisce il file?'],
  a:['Android (Chrome) : dans Téléchargements. iPhone : le système propose de l’enregistrer dans Fichiers ou de le partager.','Android (Chrome): in Downloads. iPhone: the system offers to save it to Files or share it.','Android (Chrome): en Descargas. iPhone: el sistema propone guardarlo en Archivos o compartirlo.','Android (Chrome): in Download. iPhone: il sistema propone di salvarlo in File o di condividerlo.']},
 {c:'save',q:['Pourquoi une recette porte la mention « (importée) » ?','Why does a recipe say “(imported)”?','¿Por qué una receta dice «(importada)»?','Perché una ricetta dice «(importata)»?'],
  a:['Tu as importé une version différente d’une recette que tu avais déjà. Rien n’est écrasé : les deux versions sont gardées, à toi de supprimer celle que tu ne veux plus.','You imported a different version of a recipe you already had. Nothing is overwritten: both versions are kept; delete the one you no longer want.','Importaste una versión distinta de una receta que ya tenías. No se sobrescribe nada: se guardan las dos; borra la que ya no quieras.','Hai importato una versione diversa di una ricetta che avevi già. Nulla viene sovrascritto: si tengono entrambe le versioni; elimina quella che non vuoi più.']},
 {c:'hand',q:['Comment savoir si la pâte est assez pétrie ?','How do I know the dough is kneaded enough?','¿Cómo sé si la masa está bien amasada?','Come capisco se l’impasto è impastato abbastanza?'],
  a:['Elle est lisse et se détache des parois. Test de la fenêtre : étire doucement un petit morceau ; s’il devient assez fin pour laisser passer la lumière sans se déchirer, c’est prêt.','It is smooth and pulls away from the bowl. Windowpane test: gently stretch a small piece; if it gets thin enough to let light through without tearing, it is ready.','Está lisa y se despega de las paredes. Prueba de la ventana: estira con cuidado un trocito; si queda tan fina que deja pasar la luz sin romperse, está lista.','È liscio e si stacca dalla ciotola. Prova del velo: tira delicatamente un pezzetto; se diventa così sottile da lasciar passare la luce senza strapparsi, è pronto.']},
 {c:'hand',q:['Comment savoir si la levée est finie ?','How do I know the rise is done?','¿Cómo sé si ha terminado de levar?','Come capisco se la lievitazione è finita?'],
  a:['Le volume a environ doublé. Test du doigt : enfonce-le d’environ 1 cm. Le creux remonte lentement : c’est prêt. Il remonte tout de suite : attends encore. Il ne remonte pas : la pâte a trop levé, utilise-la vite.','It has roughly doubled. Finger test: press about 1 cm in. The dent springs back slowly: ready. Springs back at once: wait. Does not spring back: over-proofed, use it quickly.','El volumen casi se ha duplicado. Prueba del dedo: húndelo 1 cm. El hueco vuelve despacio: lista. Vuelve enseguida: espera. No vuelve: ha levado de más, úsala pronto.','Il volume è circa raddoppiato. Prova del dito: affondalo di circa 1 cm. La fossetta risale lentamente: pronto. Risale subito: aspetta. Non risale: troppo lievitato, usalo in fretta.']},
 {c:'hand',q:['Comment étaler sans rouleau ?','How do I stretch without a rolling pin?','¿Cómo estirar sin rodillo?','Come stendo senza mattarello?'],
  a:['Pâton à température ambiante, sur un plan fariné ou semoulé. Appuie du bout des doigts du centre vers l’extérieur sans écraser le bord, qui fera la croûte gonflée. Termine en l’étirant sur le dos des mains.','Dough ball at room temperature, on a floured or semolina-dusted counter. Press with your fingertips from the centre outwards without flattening the rim, which becomes the puffy crust. Finish by stretching it over the backs of your hands.','Bola a temperatura ambiente, sobre una encimera con harina o sémola. Presiona con la yema de los dedos del centro hacia fuera sin aplastar el borde, que será la corteza hinchada. Termina estirándola sobre el dorso de las manos.','Panetto a temperatura ambiente, su un piano infarinato o con semola. Premi con la punta delle dita dal centro verso l’esterno senza schiacciare il bordo, che diventerà il cornicione. Finisci allargandolo sul dorso delle mani.']},
 {c:'hand',q:['La pâte se rétracte quand je l’étale','The dough shrinks back when I stretch it','La masa se encoge al estirarla','L’impasto si ritira quando lo stendo'],
  a:['Le gluten est trop tendu ou la pâte trop froide. Couvre-la et laisse-la reposer 10 à 15 min, puis reprends.','The gluten is too tight or the dough too cold. Cover it, let it rest 10 to 15 min, then try again.','El gluten está demasiado tenso o la masa demasiado fría. Tápala, déjala reposar 10 a 15 min y vuelve a intentarlo.','Il glutine è troppo teso o l’impasto troppo freddo. Coprilo, lascialo riposare 10–15 min, poi riprova.']},
 {c:'hand',q:['Je peux étaler un pâton qui sort du frigo ?','Can I stretch a dough ball straight from the fridge?','¿Puedo estirar una bola recién sacada de la nevera?','Posso stendere un panetto appena tolto dal frigo?'],
  a:['Non : laisse-le revenir à température ambiante, souvent 1 à 2 h selon ta cuisine. Froid, il se déchire et se rétracte.','No: let it come to room temperature, often 1 to 2 h depending on your kitchen. Cold dough tears and shrinks back.','No: deja que vuelva a temperatura ambiente, normalmente 1 a 2 h según la cocina. Fría se rompe y se encoge.','No: lascialo tornare a temperatura ambiente, spesso 1–2 h secondo la cucina. Freddo si strappa e si ritira.']},
 {c:'hand',q:['Comment glisser la pizza dans le four ?','How do I slide the pizza into the oven?','¿Cómo meto la pizza en el horno?','Come faccio scivolare la pizza nel forno?'],
  a:['Pelle légèrement saupoudrée de semoule. Garnis vite sur la pelle et secoue-la un peu avant d’enfourner pour vérifier que la pizza glisse. Avec une plaque à trous, étale directement sur la plaque.','Peel lightly dusted with semolina. Top quickly on the peel and give it a little shake before loading to check the pizza slides. With a perforated pan, stretch right on the pan.','Pala con un poco de sémola. Cubre rápido sobre la pala y sacúdela un poco antes de hornear para comprobar que la pizza se desliza. Con bandeja perforada, estira directamente sobre ella.','Pala spolverata con un po’ di semola. Condisci in fretta sulla pala e dalle una piccola scossa prima di infornare per verificare che la pizza scivoli. Con una teglia forata, stendi direttamente sulla teglia.']},
 {c:'ing',q:['Faut-il mettre les tomates au frigo ?','Should tomatoes go in the fridge?','¿Hay que guardar los tomates en la nevera?','I pomodori vanno in frigo?'],
  a:['Tomates fraîches : non, garde-les à température ambiante ; au frigo, elles perdent une partie de leurs arômes (étude Zhang et al., PNAS, 2016). Conserve ouverte : au frigo, dans un contenant fermé plutôt que dans la boîte, quelques jours.','Fresh tomatoes: no, keep them at room temperature; in the fridge they lose some of their flavour (Zhang et al., PNAS, 2016). Opened can: in the fridge, in a closed container rather than the can, for a few days.','Tomates frescos: no, a temperatura ambiente; en la nevera pierden parte de su aroma (Zhang et al., PNAS, 2016). Lata abierta: en la nevera, en un recipiente cerrado en lugar de la lata, unos días.','Pomodori freschi: no, tienili a temperatura ambiente; in frigo perdono parte del loro aroma (Zhang et al., PNAS, 2016). Barattolo aperto: in frigo, in un contenitore chiuso invece che nel barattolo, per qualche giorno.']},
 {c:'ing',q:['Quelles tomates pour la sauce ?','Which tomatoes for the sauce?','¿Qué tomates para la salsa?','Quali pomodori per la salsa?'],
  a:['Roma ou San Marzano pelées : chair dense, peu d’eau et peu de pépins, donc une sauce épaisse qui ne détrempe pas la pâte.','Peeled Roma or San Marzano: dense flesh, little water and few seeds, so a thick sauce that does not make the crust soggy.','Roma o San Marzano pelados: carne densa, poca agua y pocas semillas, así que una salsa espesa que no empapa la masa.','Pelati Roma o San Marzano: polpa densa, poca acqua e pochi semi, quindi una salsa densa che non inzuppa l’impasto.']},
 {c:'ing',q:['Ma mozzarella détrempe la pizza','My mozzarella makes the pizza soggy','La mozzarella me empapa la pizza','La mozzarella inzuppa la pizza'],
  a:['Fior di latte ou bufala : coupe-la et laisse-la égoutter quelques heures au frigo, puis éponge-la. Sinon, prends de la mozzarella râpée à faible humidité.','Fior di latte or buffalo: cut it and let it drain a few hours in the fridge, then pat dry. Otherwise use shredded low-moisture mozzarella.','Fior di latte o búfala: córtala, déjala escurrir unas horas en la nevera y sécala. Si no, usa mozzarella rallada de baja humedad.','Fior di latte o bufala: tagliala e lasciala sgocciolare qualche ora in frigo, poi tamponala. Altrimenti usa mozzarella grattugiata a bassa umidità.']},
 {c:'ing',q:['Comment choisir ma farine ?','How do I choose my flour?','¿Cómo elijo la harina?','Come scelgo la farina?'],
  a:['Regarde les protéines dans le tableau nutritionnel : protéines ÷ portion × 100 donne le pourcentage. Plus il est élevé, plus la farine absorbe d’eau et supporte une longue fermentation. Tu peux l’entrer dans « Ma farine » (rubrique 3).','Check the protein line on the nutrition label: protein ÷ serving × 100 gives the percentage. The higher it is, the more water the flour absorbs and the longer the fermentation it handles. You can enter it under “My flour” (section 3).','Mira las proteínas en la tabla nutricional: proteínas ÷ ración × 100 da el porcentaje. Cuanto más alto, más agua absorbe la harina y más fermentación aguanta. Puedes ponerlo en «Mi harina» (sección 3).','Guarda le proteine nella tabella nutrizionale: proteine ÷ porzione × 100 dà la percentuale. Più è alta, più la farina assorbe acqua e regge lievitazioni lunghe. Puoi inserirla in «La mia farina» (sezione 3).']},
 {c:'ing',q:['Levure fraîche ou sèche : quelle équivalence ?','Fresh or dry yeast: what is the equivalent?','Levadura fresca o seca: ¿qué equivalencia?','Lievito fresco o secco: qual è l’equivalenza?'],
  a:['L’atelier compte 1 g de levure sèche instantanée pour 3 g de fraîche, et 1 g de sèche active pour 2 g de fraîche. Choisis ton type de levure dans la rubrique 3 : la quantité est convertie automatiquement. La levure sèche instantanée se mélange à la farine ; la sèche active se réhydrate d’abord dans un peu d’eau tiède (au moins 30 °C).','The app counts 1 g of instant dry yeast for 3 g of fresh, and 1 g of active dry for 2 g of fresh. Pick your yeast type in section 3: the amount converts automatically. Instant dry yeast is mixed into the flour; active dry is first rehydrated in a little warm water (at least 30 °C / 86 °F).','La app cuenta 1 g de levadura seca instantánea por 3 g de fresca, y 1 g de seca activa por 2 g de fresca. Elige tu levadura en la sección 3: la cantidad se convierte sola. La seca instantánea se mezcla con la harina; la seca activa se rehidrata antes en un poco de agua tibia (al menos 30 °C).','L’app conta 1 g di lievito secco istantaneo per 3 g di fresco, e 1 g di secco attivo per 2 g di fresco. Scegli il tipo di lievito nella sezione 3: la quantità si converte da sola. Il secco istantaneo si mescola alla farina; il secco attivo si reidrata prima in un po’ d’acqua tiepida (almeno 30 °C).']},
 {c:'ing',q:['Comment conserver la levure fraîche ?','How do I store fresh yeast?','¿Cómo conservo la levadura fresca?','Come conservo il lievito fresco?'],
  a:['Au frigo, bien emballée, jusqu’à la date du fabricant. Elle doit être friable, couleur crème, avec une odeur agréable. Brune, collante ou à l’odeur forte : jette-la.','In the fridge, well wrapped, until the maker’s date. It should be crumbly, cream-coloured and smell pleasant. Brown, sticky or strong-smelling: throw it out.','En la nevera, bien envuelta, hasta la fecha del fabricante. Debe estar desmenuzable, color crema y oler bien. Marrón, pegajosa o con olor fuerte: tírala.','In frigo, ben avvolto, fino alla data del produttore. Deve essere friabile, color crema e avere un buon odore. Scuro, appiccicoso o dall’odore forte: buttalo.']},
 {c:'ing',q:['Levure sèche : faut-il ajouter de l’eau ?','Dry yeast: should I add water?','Levadura seca: ¿hay que añadir agua?','Lievito secco: bisogna aggiungere acqua?'],
  a:['En théorie, oui : la levure fraîche contient environ deux tiers d’eau, la sèche presque pas. En passant à la sèche, il manque donc un peu d’eau. Pour une pizza maison, l’écart est minime : avec 5 g de fraîche remplacés par environ 1,7 g de sèche instantanée, il manque environ 3 g d’eau sur plus de 400 g, moins de 1 %. L’appli ne le corrige pas ; tu peux ajouter une cuillère à thé d’eau si la pâte te semble ferme.','In theory, yes: fresh yeast is about two-thirds water, dry yeast almost none. Switching to dry, a little water is missing. For a home pizza the gap is tiny: replacing 5 g of fresh with about 1.7 g of instant dry leaves about 3 g of water missing out of more than 400 g, under 1%. The app does not correct it; add a teaspoon of water if the dough feels firm.','En teoría, sí: la levadura fresca tiene cerca de dos tercios de agua, la seca casi nada. Al pasar a la seca falta un poco de agua. Para una pizza casera la diferencia es mínima: al cambiar 5 g de fresca por unos 1,7 g de seca instantánea faltan unos 3 g de agua sobre más de 400 g, menos del 1 %. La app no lo corrige; añade una cucharadita de agua si la masa te parece firme.','In teoria sì: il lievito fresco contiene circa due terzi d’acqua, il secco quasi niente. Passando al secco manca quindi un po’ d’acqua. Per una pizza fatta in casa la differenza è minima: sostituendo 5 g di fresco con circa 1,7 g di secco istantaneo mancano circa 3 g d’acqua su più di 400 g, meno dell’1%. L’app non lo corregge; aggiungi un cucchiaino d’acqua se l’impasto ti sembra sodo.']},
 {c:'ing',q:['Pourquoi de l’eau froide, voire des glaçons ?','Why cold water, or even ice?','¿Por qué agua fría, o incluso hielo?','Perché acqua fredda, o perfino ghiaccio?'],
  a:['Pour maîtriser la température de la pâte. Le pétrissage la réchauffe, surtout au robot ; une pâte trop chaude lève trop vite, colle et supporte mal une longue levée. L’appli calcule la température de l’eau d’après celle de ta cuisine (rubrique 6). Si tu pétris au robot, prends une eau plus froide de quelques degrés (ordre de grandeur : 3 à 5 °C de moins). Avec de la levure sèche, ne la verse pas dans l’eau froide : mélange-la à la farine (instantanée) ou réhydrate-la d’abord dans un peu d’eau tiède (active).','To control the dough temperature. Kneading warms it, especially with a mixer; dough that is too warm rises too fast, gets sticky and copes badly with a long rise. The app works out the water temperature from your kitchen’s (section 6). If you knead with a mixer, use water a few degrees colder (roughly 3 to 5 °C less). With dry yeast, do not pour it into cold water: mix it into the flour (instant) or rehydrate it first in a little warm water (active).','Para controlar la temperatura de la masa. El amasado la calienta, sobre todo con robot; una masa demasiado caliente sube demasiado rápido, se pega y aguanta mal un levado largo. La app calcula la temperatura del agua según la de tu cocina (sección 6). Si amasas con robot, usa agua unos grados más fría (orden de magnitud: 3 a 5 °C menos). Con levadura seca, no la eches en el agua fría: mézclala con la harina (instantánea) o rehidrátala antes en un poco de agua tibia (activa).','Per controllare la temperatura dell’impasto. L’impastatura lo scalda, soprattutto con la planetaria; un impasto troppo caldo lievita troppo in fretta, si appiccica e regge male una lunga lievitazione. L’app calcola la temperatura dell’acqua in base a quella della tua cucina (sezione 6). Se impasti con la planetaria, usa acqua più fredda di qualche grado (ordine di grandezza: 3–5 °C in meno). Con il lievito secco, non versarlo nell’acqua fredda: mescolalo alla farina (istantaneo) o reidratalo prima in un po’ d’acqua tiepida (attivo).']},
 {c:'ing',q:['Sans gluten avec un mélange du commerce ?','Gluten-free with a store-bought blend?','¿Sin gluten con una mezcla comercial?','Senza glutine con una miscela del commercio?'],
  a:['La méthode « Sans gluten » de l’appli est faite pour un mélange maison (riz, fécule de maïs, psyllium) à environ 55 % d’eau, pressé sur une plaque huilée. Certains mélanges du commerce pour pizza demandent beaucoup plus d’eau, jusqu’à 90 % : règle l’hydratation selon l’emballage (rubrique 3). Gestes utiles avec ces mélanges : verse l’eau en deux fois et attends qu’elle soit absorbée, ajoute l’huile ensuite, pétris quelques minutes jusqu’à une boule lisse, puis emballe chaque pâton dans du film pour qu’il ne sèche pas pendant le repos.','The app’s “Gluten-free” method is made for a homemade blend (rice, cornstarch, psyllium) at about 55% water, pressed onto an oiled pan. Some store-bought pizza blends need much more water, up to 90%: set the hydration from the package (section 3). Useful steps with these blends: add the water in two goes and wait until it is absorbed, add the oil afterwards, knead a few minutes to a smooth ball, then wrap each ball in film so it does not dry out while resting.','El método «Sin gluten» de la app está pensado para una mezcla casera (arroz, maicena, psyllium) con un 55 % de agua, presionada sobre una bandeja aceitada. Algunas mezclas comerciales para pizza piden mucha más agua, hasta un 90 %: ajusta la hidratación según el envase (sección 3). Gestos útiles con estas mezclas: echa el agua en dos veces y espera a que se absorba, añade después el aceite, amasa unos minutos hasta una bola lisa y envuelve cada bola en film para que no se seque durante el reposo.','Il metodo «Senza glutine» dell’app è pensato per una miscela fatta in casa (riso, amido di mais, psyllium) con circa il 55% d’acqua, pressata su una teglia unta. Alcune miscele del commercio per pizza chiedono molta più acqua, fino al 90%: regola l’idratazione secondo la confezione (sezione 3). Gesti utili con queste miscele: versa l’acqua in due volte e aspetta che sia assorbita, aggiungi poi l’olio, impasta qualche minuto fino a una palla liscia e avvolgi ogni panetto nella pellicola perché non si secchi durante il riposo.']},
 {c:'ing',q:['Le sel tue-t-il la levure ?','Does salt kill yeast?','¿La sal mata la levadura?','Il sale uccide il lievito?'],
  a:['On conseille souvent de ne pas les mettre en contact direct. L’effet réel sur quelques minutes est discuté ; par précaution, dissous le sel dans l’eau ou ajoute-le après la levure.','People often advise keeping them apart. The real effect over a few minutes is debated; as a precaution, dissolve the salt in the water or add it after the yeast.','Se suele aconsejar no ponerlos en contacto directo. El efecto real en unos minutos se discute; por precaución, disuelve la sal en el agua o añádela después de la levadura.','Si consiglia spesso di non metterli a contatto diretto. L’effetto reale in pochi minuti è discusso; per prudenza, sciogli il sale nell’acqua o aggiungilo dopo il lievito.']},
 {c:'ing',q:['À quoi sert le miel ?','What is the honey for?','¿Para qué sirve la miel?','A cosa serve il miele?'],
  a:['En petite quantité, il nourrit la levure au départ et aide la croûte à colorer dans un four domestique.','In small amounts it feeds the yeast at the start and helps the crust brown in a home oven.','En poca cantidad alimenta la levadura al principio y ayuda a dorar la corteza en un horno doméstico.','In piccola quantità nutre il lievito all’inizio e aiuta la crosta a dorarsi in un forno domestico.']},
 {c:'oven',q:['Pourquoi préchauffer aussi longtemps ?','Why preheat for so long?','¿Por qué precalentar tanto tiempo?','Perché preriscaldare così a lungo?'],
  a:['Une pierre ou un acier doit accumuler la chaleur pour saisir le dessous de la pizza. Suis la durée indiquée dans le rétroplanning. La plaque à trous, elle, ne se préchauffe pas.','A stone or steel must store heat to sear the bottom of the pizza. Follow the time shown in the schedule. A perforated pan is not preheated.','Una piedra o un acero debe acumular calor para dorar la base. Sigue el tiempo de la planificación. La bandeja perforada no se precalienta.','Una pietra o un acciaio deve accumulare calore per cuocere bene il fondo della pizza. Segui il tempo indicato nel programma. La teglia forata non si preriscalda.']},
 {c:'oven',q:['Le dessous reste pâle','The bottom stays pale','La base queda pálida','Il fondo resta pallido'],
  a:['Pierre ou acier sous le grill : préchauffe-les plus longtemps (30 min ou plus) pour qu’ils soient bien chauds. Avec une plaque : cuis plus bas dans le four, préchauffe plus longtemps ou passe à une pierre ou un acier. Si c’est le dessus qui reste pâle, finis 1 à 2 min sous le grill, grille du haut.','Stone or steel under the broiler: preheat them longer (30 min or more) so they are really hot. With a sheet pan: bake lower in the oven, preheat longer or switch to a stone or steel. If the top stays pale, finish 1 to 2 min under the broiler, top rack.','Piedra o acero con el grill: precaliéntalos más tiempo (30 min o más) para que estén bien calientes. Con bandeja: hornea más abajo, precalienta más o usa piedra o acero. Si es la parte de arriba la que queda pálida, termina 1 a 2 min con el grill, rejilla alta.','Pietra o acciaio sotto il grill: preriscaldali più a lungo (30 min o più) perché siano ben caldi. Con una teglia: cuoci più in basso nel forno, preriscalda più a lungo o passa a una pietra o a un acciaio. Se è la superficie a restare pallida, finisci 1–2 min sotto il grill, griglia alta.']},
 {c:'keep',q:['Comment réchauffer une pizza du frigo ?','How do I reheat pizza from the fridge?','¿Cómo recaliento una pizza de la nevera?','Come riscaldo una pizza dal frigo?'],
  a:['Méthode de Marco : sur une plaque à trous ou une plaque en métal, dans le four froid, puis allume à 180–190 °C pendant 10 à 15 min. Pour 1 à 3 parts, la poêle est plus rapide. Détails dans la rubrique 10.','Marco’s method: on a perforated pan or metal sheet, in a cold oven, then turn it on to 180–190 °C (350–375 °F) for 10 to 15 min. For 1 to 3 slices, a skillet is faster. Details in section 10.','Método de Marco: sobre una bandeja perforada o de metal, con el horno frío, y luego enciéndelo a 180–190 °C durante 10 a 15 min. Para 1 a 3 porciones, la sartén es más rápida. Detalles en la sección 10.','Metodo di Marco: su una teglia forata o di metallo, nel forno freddo, poi accendilo a 180–190 °C per 10–15 min. Per 1–3 fette, la padella è più veloce. Dettagli nella sezione 10.']},
 {c:'keep',q:['Combien de temps se garde une pizza cuite ?','How long does baked pizza keep?','¿Cuánto dura una pizza horneada?','Quanto si conserva una pizza cotta?'],
  a:['Au frigo, 3 à 4 jours dans une boîte fermée (repère USDA pour les restes). Pas plus de 2 h à température ambiante avant de la ranger.','In the fridge, 3 to 4 days in a closed container (USDA guideline for leftovers). No more than 2 h at room temperature before storing.','En la nevera, 3 a 4 días en un recipiente cerrado (referencia del USDA para sobras). No más de 2 h a temperatura ambiente antes de guardarla.','In frigo, 3–4 giorni in un contenitore chiuso (indicazione USDA per gli avanzi). Non più di 2 h a temperatura ambiente prima di riporla.']},
 {c:'keep',q:['Peut-on congeler les pâtons ?','Can I freeze dough balls?','¿Se pueden congelar las bolas?','Si possono congelare i panetti?'],
  a:['Oui, juste après le boulage, légèrement huilés, un par sac, jusqu’à environ 3 mois. La veille, passe-les au frigo. Tout est détaillé dans la rubrique 10.','Yes, right after shaping, lightly oiled, one per bag, up to about 3 months. The day before, move them to the fridge. Full details in section 10.','Sí, justo después de bolear, ligeramente aceitadas, una por bolsa, hasta unos 3 meses. La víspera, pásalas a la nevera. Todo en la sección 10.','Sì, subito dopo la formatura, leggermente unti, uno per sacchetto, fino a circa 3 mesi. Il giorno prima, passali in frigo. Tutti i dettagli nella sezione 10.']},
 {c:'app',q:['Comment utiliser le minuteur ?','How do I use the timer?','¿Cómo uso el temporizador?','Come uso il timer?'],
  a:['Dans le rétroplanning, chaque étape a un bouton ⏱ Minuteur. Le décompte s’affiche en bas de l’écran et dans l’onglet du navigateur ; à la fin, un son et une vibration (sur téléphone). Garde la page ouverte : en arrière-plan, le téléphone peut couper le son.','In the schedule, each step has a ⏱ Timer button. The countdown shows at the bottom of the screen and in the browser tab; at the end, a sound and a vibration (on phones). Keep the page open: in the background the phone may mute it.','En la planificación, cada paso tiene un botón ⏱ Temporizador. La cuenta atrás aparece abajo y en la pestaña del navegador; al final, un sonido y una vibración (en el móvil). Mantén la página abierta: en segundo plano el móvil puede silenciarlo.','Nel programma, ogni passaggio di attesa ha un pulsante ⏱ Timer. Il conto alla rovescia compare in basso nello schermo e nella scheda del browser; alla fine, un suono e una vibrazione (sul telefono). Tieni la pagina aperta: in secondo piano il telefono può silenziarlo.']},

let faqCat='';
const norm=t=>String(t).normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();
function renderFaq(){
  const C3=FAQC(), qv=norm($('faqQ').value.trim()), words=qv.split(/\s+/).filter(Boolean);
  $('faqCats').innerHTML=[['',T('Tout','All','Todo','Tutte')],...Object.entries(C3)].map(([k,l])=>`<button type="button" class="mini${faqCat===k?' on':''}" data-fc="${k}">${l}</button>`).join('');
  let n=0, html='';
  Object.keys(C3).forEach(c=>{ if(faqCat&&faqCat!==c) return;
    const items=FAQ.filter(f=>f.c===c&&(!words.length||words.every(w=>norm(L3(f.q)+' '+L3(f.a)).includes(w))));
    if(!items.length) return; n+=items.length;
    html+=`<h3>${C3[c]}</h3>`+items.map(f=>`<details class="faqi"${words.length?' open':''}><summary>${L3(f.q)}</summary><p>${L3(f.a)}</p></details>`).join(''); });
  $('faq').innerHTML=html||`<p class="hint">${T('Aucune question ne correspond. Essaie un autre mot.','No question matches. Try another word.','Ninguna pregunta coincide. Prueba otra palabra.','Nessuna domanda corrisponde. Prova un’altra parola.')}</p>`;
  $('faqN').textContent=T(`${n} question${n>1?'s':''}`,`${n} question${n>1?'s':''}`,`${n} pregunta${n>1?'s':''}`,`${n} domand${n>1?'e':'a'}`);
}
$('faqQ').addEventListener('input',renderFaq);
$('faqCats').addEventListener('click',e=>{ const b=e.target.closest('[data-fc]'); if(!b) return; faqCat=b.dataset.fc; renderFaq(); });
