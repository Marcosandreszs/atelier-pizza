<meta name="application-name" content="Atelier Pizza">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>
/* Layout: en-tête avec photo, puis réglages à gauche (collants) et résultats à droite; une colonne sur téléphone */
:root{
  --bg:#EEF0EA; --surface:#FFFFFF; --sunk:#F6F7F3; --ink:#1C211D; --muted:#5B645D; --line:#D6DAD1;
  --accent:#2E6A3A; --accent-soft:#E1EDE2; --accent-ink:#FFFFFF;
  --char:#7A3A1C; --char-soft:#F6E7DE;
  --warn:#8A5A00; --warn-soft:#FBF0D6; --info:#2B5677; --info-soft:#E3EDF5;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#121613; --surface:#1A1F1B; --sunk:#151a16; --ink:#E6EAE4; --muted:#9AA39C; --line:#2C332E;
  --accent:#86C08F; --accent-soft:#1F3324; --accent-ink:#0E1410;
  --char:#E59A70; --char-soft:#3A251B;
  --warn:#E7B850; --warn-soft:#352A12; --info:#8DB8DC; --info-soft:#18283A; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121613; --surface:#1A1F1B; --sunk:#151a16; --ink:#E6EAE4; --muted:#9AA39C; --line:#2C332E;
  --accent:#86C08F; --accent-soft:#1F3324; --accent-ink:#0E1410;
  --char:#E59A70; --char-soft:#3A251B;
  --warn:#E7B850; --warn-soft:#352A12; --info:#8DB8DC; --info-soft:#18283A; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5}
.wrap{max-width:1240px;margin:0 auto;padding-block:20px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.hero{display:grid;grid-template-columns:minmax(0,1fr);gap:14px;align-items:end;padding-bottom:14px;border-bottom:2px solid var(--ink);margin-bottom:16px}
@media (min-width:720px){header.hero{grid-template-columns:minmax(0,1fr) 360px}}
.hero-img{width:100%;height:190px;object-fit:cover;border-radius:12px;display:block}
.ver{font-family:var(--mono);font-size:.75rem;letter-spacing:.06em;background:var(--char-soft);color:var(--char);padding:2px 8px;border-radius:6px;display:inline-block;margin-bottom:8px}
h1{font-family:var(--display);font-weight:700;font-size:clamp(2.2rem,6vw,3.4rem);line-height:.9;letter-spacing:.01em;margin:0 0 8px;text-transform:uppercase}
header p{margin:0;color:var(--muted);max-width:52ch;text-wrap:balance}
h2{font-family:var(--display);font-weight:700;font-size:1.45rem;text-transform:uppercase;letter-spacing:.03em;margin:0;line-height:1.1}
h3{font-family:var(--display);font-weight:600;font-size:1.05rem;text-transform:uppercase;letter-spacing:.06em;margin:0;color:var(--muted)}
.num,td.n,.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}

.summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-bottom:18px}
.summary div{background:var(--surface);padding:12px 14px;min-width:0}
.summary .k{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.summary .v{font-family:var(--display);font-weight:700;font-size:1.7rem;line-height:1.1}
.summary .s{font-size:.8rem;color:var(--muted)}
.summary .start .v{color:var(--char)}

.grid{display:grid;grid-template-columns:1fr;gap:18px}
@media (min-width:920px){.grid{grid-template-columns:minmax(320px,390px) minmax(0,1fr)}
  form.panel{position:sticky;top:12px;max-height:calc(100vh - 24px);overflow:auto}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px}
form.panel{padding:6px 16px 16px}
fieldset{border:0;margin:0;padding:14px 0;border-bottom:1px solid var(--line);display:grid;gap:12px;min-width:0}
fieldset:last-child{border-bottom:0}
legend{font-family:var(--display);font-weight:700;font-size:1.15rem;text-transform:uppercase;letter-spacing:.04em;padding:0;margin-bottom:4px;float:left;width:100%}
legend + *{clear:both}
label.f{display:grid;gap:4px;font-size:.88rem;font-weight:500}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row > *{min-width:0}
.hint{font-size:.8rem;color:var(--muted);font-weight:400}
select,textarea,input[type=text],input[type=number],input[type=date],input[type=time]{font:inherit;font-size:.92rem;color:var(--ink);background:var(--sunk);border:1px solid var(--line);border-radius:8px;padding:7px 9px;width:100%;min-width:0}
textarea{resize:vertical;line-height:1.45}
input[type=range]{width:100%;accent-color:var(--accent)}
.rng{display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:center}
.rng .lab{font-size:.88rem;font-weight:500}
.rng output{font-family:var(--mono);font-size:.9rem;background:var(--accent-soft);color:var(--ink);padding:1px 8px;border-radius:6px;justify-self:end;white-space:nowrap}
.rng input,.rng .hint{grid-column:1/-1}
.rec{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:baseline}
.pill{font-size:.72rem;font-weight:600;padding:0 7px;border-radius:999px;white-space:nowrap}
.pill.ok{background:var(--accent-soft);color:var(--accent)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.stepper{display:flex;align-items:center;border:1px solid var(--line);border-radius:8px;overflow:hidden;width:max-content}
.stepper button{font:inherit;font-size:1.1rem;width:38px;height:36px;border:0;background:var(--sunk);color:var(--ink);cursor:pointer}
.stepper input{width:56px;border:0;border-radius:0;text-align:center;font-family:var(--mono);background:var(--surface)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{position:relative}
.chip input{position:absolute;opacity:0;inset:0;cursor:pointer}
.chip span{display:inline-block;padding:4px 10px;border:1px solid var(--line);border-radius:999px;font-size:.84rem;background:var(--sunk);cursor:pointer}
.chip input:checked + span{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.chip input:focus-visible + span{outline:2px solid var(--accent);outline-offset:2px}
button.mini,label.mini{font:inherit;font-size:.78rem;border:1px solid var(--line);background:var(--sunk);color:var(--ink);border-radius:999px;padding:2px 10px;cursor:pointer}
.btn{font:inherit;font-size:.88rem;font-weight:600;border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);border-radius:8px;padding:7px 12px;cursor:pointer}
.btn.ghost{background:transparent;color:var(--accent)}
button:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.methods{display:grid;gap:6px}
.method{position:relative;display:block}
.method input{position:absolute;opacity:0}
.method span{display:grid;gap:1px;padding:8px 12px;border:1px solid var(--line);border-radius:10px;background:var(--sunk);cursor:pointer}
.method b{font-weight:600}
.method small{color:var(--muted);font-size:.8rem}
.method input:checked + span{border-color:var(--accent);background:var(--accent-soft);box-shadow:inset 3px 0 0 var(--accent)}
.method input:focus-visible + span{outline:2px solid var(--accent);outline-offset:2px}
.check{display:flex;gap:8px;align-items:flex-start;font-size:.88rem}
.check input{margin-top:3px;accent-color:var(--accent)}
.sub{display:grid;gap:12px;padding:10px 12px;background:var(--sunk);border-radius:10px;border:1px dashed var(--line)}
.sub .two3{display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:8px}
.cing{display:grid;gap:6px;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--sunk)}
.cing .row{gap:6px}
.cing .row select,.cing .row input{width:auto;flex:1 1 90px}

main{display:grid;gap:18px;min-width:0;align-content:start}
section.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:grid;gap:12px;min-width:0}
.head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.92rem}
th{text-align:left;font-size:.72rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:500;padding:6px 8px;border-bottom:1px solid var(--line)}
td{padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
td.n{text-align:right;white-space:nowrap}
th.n{text-align:right}
tr:last-child td{border-bottom:0}
td .hint{display:block}
.pct{display:flex;flex-wrap:wrap;gap:6px}
.pct span{font-family:var(--mono);font-size:.8rem;padding:2px 8px;border-radius:6px;background:var(--sunk);border:1px solid var(--line)}
.price{display:flex;flex-wrap:wrap;gap:4px;align-items:center;font-size:.85rem}
.price select{width:auto;padding:4px 6px;font-size:.82rem}
.price input{width:82px;padding:4px 6px;font-size:.85rem;font-family:var(--mono)}
.costsum{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.costsum div{background:var(--sunk);border-radius:8px;padding:8px 10px}
.costsum .k{font-size:.72rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.costsum .v{font-family:var(--display);font-weight:700;font-size:1.4rem}

.alerts{display:grid;gap:8px}
.alert{padding:9px 12px;border-radius:8px;font-size:.88rem;border-left:4px solid}
.alert.warn{background:var(--warn-soft);border-color:var(--warn)}
.alert.info{background:var(--info-soft);border-color:var(--info)}
.alert b{font-weight:600}

.tl{list-style:none;margin:0;padding:0;display:grid}
.tl li{display:grid;grid-template-columns:92px 18px minmax(0,1fr);gap:0 10px;position:relative}
.tl .when{text-align:right;padding-top:2px}
.tl .when .t{font-family:var(--mono);font-weight:500;font-size:.95rem}
.tl .when .d{font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.tl .rail{position:relative}
.tl .rail::before{content:"";position:absolute;left:8px;top:0;bottom:0;width:2px;background:var(--line)}
.tl li:first-child .rail::before{top:10px}
.tl li:last-child .rail::before{bottom:auto;height:10px}
.tl .dot{position:absolute;left:3px;top:6px;width:12px;height:12px;border-radius:50%;background:var(--surface);border:2px solid var(--accent)}
.tl li.act .dot{background:var(--accent)}
.tl li.oven .dot{background:var(--char);border-color:var(--char)}
.tl li.side .dot{border-color:var(--muted);border-style:dashed}
.tl li.cold .dot{border-color:var(--info);background:var(--info-soft)}
.tl .what{padding-bottom:16px;min-width:0}
.tl .what b{font-weight:600}
.tl .what p{margin:2px 0 0;font-size:.88rem;color:var(--muted)}
.tl .what p.then{color:var(--ink)}
.tl .what p.then b{font-weight:600;color:var(--accent)}
.tl li.wait .what > b,.tl li.cold .what > b{font-weight:500;color:var(--muted)}
.tag{display:inline-block;font-family:var(--mono);font-size:.72rem;padding:0 6px;border-radius:5px;margin-left:6px;vertical-align:1px;background:var(--sunk);border:1px solid var(--line);color:var(--muted)}
.tl li.oven .tag{background:var(--char-soft);border-color:transparent;color:var(--char)}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:.78rem;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;border:2px solid var(--accent);margin-right:5px;vertical-align:-1px}
.legend i.a{background:var(--accent)} .legend i.o{background:var(--char);border-color:var(--char)} .legend i.s{border-color:var(--muted);border-style:dashed} .legend i.c{border-color:var(--info);background:var(--info-soft)}
figure.tip{margin:0;display:flex;gap:12px;align-items:center;background:var(--sunk);border-radius:10px;padding:8px}
figure.tip img{width:120px;height:90px;object-fit:cover;border-radius:8px;flex:none}
figure.tip figcaption{font-size:.84rem;color:var(--muted)}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.box{background:var(--sunk);border-radius:10px;padding:12px;display:grid;gap:6px;min-width:0;align-content:start}
.box ol,.box ul{margin:0;padding-left:20px;display:grid;gap:4px;font-size:.9rem}
.big{font-family:var(--display);font-weight:700;font-size:1.5rem;line-height:1}
.clist{list-style:none;margin:0;padding:0;display:grid;gap:6px;max-height:380px;overflow:auto}
.clist li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 8px;align-items:start;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--surface)}
.clist li.on{border-color:var(--accent);box-shadow:inset 3px 0 0 var(--accent)}
.clist .load{all:unset;cursor:pointer;display:grid;gap:1px;min-width:0}
.clist .load:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.clist .load b{font-weight:600;overflow-wrap:anywhere}
.clist small{color:var(--muted);font-size:.78rem}
.clist p{grid-column:1/-1;margin:0;font-size:.82rem;color:var(--muted);white-space:pre-wrap;overflow-wrap:anywhere}
details summary{cursor:pointer;font-weight:600;font-size:.9rem;color:var(--accent)}
details[open] summary{margin-bottom:10px}
summary.leg,summary.head{list-style:none;display:flex;align-items:baseline;gap:8px;color:var(--ink)}
summary.leg::-webkit-details-marker,summary.head::-webkit-details-marker{display:none}
summary.leg{font-family:var(--display);font-weight:700;font-size:1.15rem;text-transform:uppercase;letter-spacing:.04em}
summary.leg .hint,summary.head .hint{font-family:var(--body);text-transform:none;letter-spacing:0;font-weight:400}
summary.leg::before,summary.head::before{content:"▸";color:var(--accent);transition:transform .15s;display:inline-block}
details[open] > summary.leg::before,details[open] > summary.head::before{transform:rotate(90deg)}
.gbody{display:grid;gap:12px;margin-top:10px}
details.sec > summary{padding-block:2px}
summary.head h2{flex:none}
summary.head{flex-wrap:wrap;justify-content:flex-start}
summary.head > .hint{margin-left:auto;text-align:right}
footer{margin-top:22px;font-size:.78rem;color:var(--muted);max-width:80ch}
@media (max-width:520px){.tl li{grid-template-columns:70px 18px minmax(0,1fr)} .hero-img{height:150px}}
.ctry{display:flex;align-items:center;gap:6px;font-size:.82rem;color:var(--muted)}
.ctry select{width:auto;padding:3px 6px;font-size:.84rem}
.stars{display:flex;gap:2px}
.stars button{font:inherit;font-size:1.25rem;line-height:1;background:none;border:0;padding:2px 3px;cursor:pointer;color:var(--line)}
.stars button.on{color:#C98A12}
.st{color:#C98A12;letter-spacing:1px}
.badge{display:inline-block;font-size:.72rem;padding:0 6px;border-radius:999px;background:var(--accent-soft);color:var(--accent);font-weight:600}
.badge:empty{display:none}
li.cathead{font-family:var(--display);font-weight:600;text-transform:uppercase;letter-spacing:.06em;font-size:.85rem;color:var(--muted);padding:8px 0 2px;border:0;background:none}
p.hand{margin:4px 0 0;font-size:.84rem;padding:5px 8px;border-left:3px solid var(--accent);background:var(--accent-soft);border-radius:0 6px 6px 0}
.toolbar{gap:8px;flex-wrap:wrap;align-items:flex-end}
.toolbar select{width:auto}
details.sec,.gbody,.gbody>*,.sub,.sub>*,#umSteps,#umSteps *{min-width:0}
.savebar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;margin:0 0 14px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
#saveBot{margin:18px 0 0}
.savest{font-size:.84rem;color:var(--muted)}
.savest.warn{color:#A4461A;font-weight:600}
.wrap{max-width:880px}
form.col{display:grid;gap:16px;min-width:0}
.topbar{position:sticky;top:0;z-index:20;display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding:8px 0;margin:-4px 0 10px;background:var(--bg)}
.topbar .grow{flex:1}
.topbar .btn{padding:4px 10px;font-size:.82rem}
.btn.on{background:var(--char);border-color:var(--char);color:#fff}
.toc{position:relative}
.toc>summary{list-style:none;cursor:pointer;font-size:.82rem;font-weight:600;border:1px solid var(--accent);color:var(--accent);border-radius:8px;padding:4px 10px;background:var(--surface)}
.toc>summary::-webkit-details-marker{display:none}
.toc>summary::after{content:" ▾"}
.toc ol{position:absolute;left:0;top:calc(100% + 4px);z-index:30;margin:0;padding:6px;list-style:none;background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.14);min-width:250px;max-height:70vh;overflow:auto}
.toc li button{display:block;width:100%;text-align:left;font:inherit;font-size:.9rem;background:none;border:0;color:var(--ink);padding:6px 10px;border-radius:6px;cursor:pointer}
.toc li button:hover{background:var(--accent-soft)}
section.card[data-toc]{scroll-margin-top:var(--tbh,90px)}
button.mini.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.tbtn{margin-top:6px}
.tl li.now .what{background:var(--accent-soft);border-radius:8px;padding:6px 8px 12px;margin-bottom:6px}
.tl li.now .dot{box-shadow:0 0 0 4px var(--accent-soft)}
body.cook .tl .what b{font-size:1.15rem}
body.cook .tl .what p{font-size:1rem}
body.cook .tl li.past{opacity:.5}
.timers{position:fixed;right:max(12px,env(safe-area-inset-right,0px));bottom:max(12px,env(safe-area-inset-bottom,0px));z-index:40;width:min(340px,calc(100vw - 24px));background:var(--surface);border:2px solid var(--accent);border-radius:12px;padding:8px 10px;box-shadow:0 10px 30px rgba(0,0,0,.2);display:grid;gap:6px}
.timers[hidden]{display:none}
.timer{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 8px;align-items:center;font-size:.85rem}
.timer .tlab{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.timer .tval{font-family:var(--mono);font-size:1.15rem;font-weight:500;text-align:right}
.timer .row{grid-column:1/-1;justify-content:flex-end}
.timer.done .tval{color:var(--char);animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:.25}}
body.hasTimers .wrap{padding-bottom:180px}
.faq h3{margin-top:10px}
.faqi{border:1px solid var(--line);border-radius:8px;background:var(--sunk);padding:0 10px;margin-top:6px}
.faqi>summary{cursor:pointer;font-weight:600;padding:8px 0;font-size:.92rem}
.faqi p{margin:0 0 10px;font-size:.9rem}
.jlist,.shop{list-style:none;margin:6px 0 0;padding:0;display:grid;gap:6px}
.jlist li{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:8px;align-items:start;font-size:.88rem;border-top:1px solid var(--line);padding-top:6px}
.printsheet{display:none}
@media print{
  body{background:#fff;color:#000}
  .wrap>*:not(#printSheet){display:none!important}
  #printSheet{display:block;font-size:11pt}
  #printSheet h1{font-size:20pt;margin:0}
  #printSheet h2{font-size:13pt;margin:14pt 0 4pt;border-bottom:1px solid #999}
  #printSheet .ps-sub{color:#555;margin:2pt 0 8pt}
  #printSheet section{break-inside:auto}
  #printSheet .tl li{break-inside:avoid}
  #printSheet .summary{margin-bottom:6pt}
}

.files .gbody{margin-top:8px}

.linkbtn{font:inherit;background:none;border:0;padding:0;color:var(--muted);text-decoration:underline;cursor:pointer}

const SEEDS=[
 {id:'mz-40cm',cat:'Pizza',author:'Marco',title:'Ma pizza (poolish)',titleEn:'My pizza (poolish)',titleEs:'Mi pizza (poolish)',
  notes:'Poolish 1 ou 2 jours avant : eau, farine à parts égales, avec 5 g de levure fraîche et 5 g de miel pour 300 g d’eau.\nLe jour J, environ 3 h avant le service : dissous le sel dans l’eau à température ambiante, verse-la dans le poolish, puis ajoute la farine petit à petit. Pétris 10 min, puis laisse la pâte reposer sur la table, couverte d’un bol.\n45 min plus tard : refaçonne, huile, recouvre du bol. 15 min après : divise en pâtons, dans des bols huilés et filmés, 1 h.\nÉtale, garnis, huile les bords au pinceau, puis cuis sur plaque à trous à 260 °C, 9 à 11 min en bas, puis 1 à 2 min sous le grill.\nHuile d’olive : un peu sur les mains pour manipuler la pâte, et sur les bords au pinceau. Hydratation 69 %.',
  notesEn:'Poolish 1 or 2 days ahead: equal parts water and flour, with 5 g fresh yeast and 5 g honey per 300 g water.\nOn the day, about 3 h before serving: dissolve the salt in room-temperature water, pour it into the poolish, then add the flour bit by bit. Knead 10 min, then let the dough rest on the counter under a bowl.\n45 min later: reshape, oil, cover with the bowl. 15 min after: divide into balls, in oiled covered bowls, 1 h.\nStretch, top, brush the rim with oil, then bake on a perforated pan at 260 °C (500 °F), 9 to 11 min low, then 1 to 2 min under the broiler.\nOlive oil: a little on your hands to handle the dough, and brushed on the rim. Hydration 69%.',
  notesEs:'Poolish 1 o 2 días antes: agua y harina a partes iguales, con 5 g de levadura fresca y 5 g de miel por 300 g de agua.\nEl día del servicio, unas 3 h antes: disuelve la sal en el agua a temperatura ambiente, viértela en el poolish y añade la harina poco a poco. Amasa 10 min y deja reposar la masa en la encimera, tapada con un bol.\n45 min después: vuelve a formar, aceita y tapa con el bol. 15 min más tarde: divide en bolas, en boles aceitados y tapados, 1 h.\nEstira, cubre, pinta los bordes con aceite y hornea en bandeja perforada a 260 °C, 9 a 11 min abajo y luego 1 a 2 min bajo el grill.\nAceite de oliva: un poco en las manos para manejar la masa y en los bordes con pincel. Hidratación 69 %.',
  params:{waterAmb:true,stickyMargin:true,brushEdges:true,n:2,shape:'round',diam:40,thick:'custom',ballW:557,method:'poolish',ppct:67,phours:24,pform:'marco',pyg:5,phg:5,vito:false,flour:'ap',hyd:69,salt:2.3,oil:0,honey:0,ytype:'fresh',T:22,oven:'home260',support:'perforee',grill:true,dbl:false,withTop:true,sauce:'maison',mozza:'fior',basil:false,extras:['jambon','olives','oignon','origan'],time:'18:30',ds:8,de:20,dRest:30,dBulk:0,dProof:50},notesIt:'Poolish 1 o 2 giorni prima: acqua e farina in parti uguali, con 5 g di lievito fresco e 5 g di miele ogni 300 g d’acqua.\nIl giorno stesso, circa 3 h prima del servizio: sciogli il sale nell’acqua a temperatura ambiente, versala nel poolish, poi aggiungi la farina poco alla volta. Impasta 10 min, poi lascia riposare l’impasto sul tavolo, coperto da una ciotola.\n45 min dopo: rimodella, ungi, copri con la ciotola. 15 min dopo: dividi in panetti, in ciotole unte e coperte, 1 h.\nStendi, condisci, spennella i bordi d’olio, poi cuoci su teglia forata a 260 °C, 9–11 min in basso, poi 1–2 min sotto il grill.\nOlio d’oliva: un po’ sulle mani per maneggiare l’impasto e sui bordi col pennello. Idratazione 69 %.',titleIt:'La mia pizza (poolish)'},
 {id:'vito',cat:'Pizza',author:'',title:'Poolish 30 % au robot',titleEn:'Poolish 30% with a mixer',titleEs:'Poolish 30 % con amasadora',
  notes:'Poolish la veille : eau et farine à parts égales, avec 5 g de levure fraîche et 5 g de miel pour 300 g d’eau ; film percé de quelques trous, départ à température ambiante puis environ 16 h au frigo.\nLe jour J : dilue le poolish dans l’eau froide (garde une tasse de côté) jusqu’à ce que l’eau blanchisse ; ajoute toute la farine d’un coup, puis le sel. Robot lent, 20 min maximum ; l’eau réservée en 4 ou 5 fois ; un peu d’huile d’olive en fin de pétrissage. Tests : main propre, voile.\nRabats sur le plan de travail mains huilées, grosse boule, 15 min sous un bol retourné. Pâtons pesés à la corne, boulés, dans une boîte farinée à 4 doigts d’écart, 1 h 30 environ à température ambiante. Fleurage moitié semoule, moitié farine.\nHydratation 71 %.',
  notesEn:'Poolish the day before: equal parts water and flour, with 5 g fresh yeast and 5 g honey per 300 g water; plastic wrap with a few holes, start at room temperature, then about 16 h in the fridge.\nOn the day: dissolve the poolish in the cold water (hold back a cup) until the water turns white; add all the flour at once, then the salt. Slow mixer, 20 min max; the reserved water in 4 or 5 additions; a little olive oil at the end. Tests: clean hand, windowpane.\nFolds on the counter with oiled hands, big ball, 15 min under an upturned bowl. Balls cut with a scraper and weighed, shaped, in a floured box 4 fingers apart, about 1 h 30 at room temperature. Dusting: half semolina, half flour.\nHydration 71%.',
  notesEs:'Poolish la víspera: agua y harina a partes iguales, con 5 g de levadura fresca y 5 g de miel por 300 g de agua; film con unos agujeros, arranque a temperatura ambiente y luego unas 16 h en la nevera.\nEl día del servicio: disuelve el poolish en el agua fría (reserva una taza) hasta que el agua se vuelva blanca; añade toda la harina de golpe y luego la sal. Amasadora lenta, 20 min como máximo; el agua reservada en 4 o 5 veces; un poco de aceite al final. Pruebas: mano limpia, velo.\nPliegues en la encimera con las manos aceitadas, bola grande, 15 min bajo un bol boca abajo. Bolas cortadas con rasqueta y pesadas, boleadas, en una caja enharinada a 4 dedos de distancia, unas 1 h 30 a temperatura ambiente. Para estirar: mitad sémola, mitad harina.\nHidratación 71 %.',
  params:{n:9,shape:'round',diam:30,thick:'custom',ballW:270,method:'poolish',ppct:30,phours:16,pform:'marco',pyg:5,phg:5,vito:true,flour:'strong',hyd:71,salt:2.1,oil:0.5,honey:0,ytype:'fresh',T:22,oven:'home290',support:'pierre',grill:false,withTop:true,sauce:'crue',mozza:'fior',basil:true,extras:[],time:'19:00',ds:8,de:20,dRest:15,dBulk:0,dProof:90},notesIt:'Poolish il giorno prima: acqua e farina in parti uguali, con 5 g di lievito fresco e 5 g di miele ogni 300 g d’acqua; pellicola bucherellata, avvio a temperatura ambiente, poi circa 16 h in frigo.\nIl giorno stesso: sciogli il poolish nell’acqua fredda (tienine da parte una tazza) finché l’acqua diventa bianca; aggiungi tutta la farina insieme, poi il sale. Impastatrice lenta, 20 min al massimo; l’acqua tenuta da parte in 4 o 5 volte; un po’ d’olio alla fine. Prove: mano pulita, velo.\nPieghe sul piano con le mani unte, grosso panetto, 15 min sotto una ciotola capovolta. Panetti tagliati col tarocco e pesati, formati, in una cassetta infarinata a 4 dita di distanza, circa 1 h 30 a temperatura ambiente. Spolvero: metà semola, metà farina.\nIdratazione 71 %.',titleIt:'Poolish 30 % in impastatrice'},
 {id:'napo-75',cat:'Pizza',author:'',title:'Napolitaine contemporaine 75 % (frigo 24 h)',titleEn:'Contemporary Neapolitan 75% (24 h fridge)',titleEs:'Napolitana contemporánea 75 % (nevera 24 h)',titleIt:'Napoletana contemporanea 75 % (frigo 24 h)',
  notes:'Farine type 0 (environ 12,5 % de protéines), 75 % d’eau, 0,3 % de levure fraîche, 2,5 % de sel, 2 % d’huile d’olive.\nPétris la farine avec les quatre cinquièmes de l’eau quelques minutes, couvre et laisse reposer 30 min. Reprends le pétrissage jusqu’à une pâte bien élastique, puis ajoute peu à peu le reste de l’eau, la levure dissoute dedans : attends que chaque ajout soit absorbé. Ajoute ensuite le sel, puis l’huile.\nBoule avec quelques rabats, dans une boîte légèrement huilée. Un rabat de renfort après 20 min, 30 min à température ambiante, puis 24 h au frigo. Le lendemain, divise en pâtons et laisse-les doubler.\nÉtale sur de la semoule sans écraser le bord. Cuisson très chaude (400 °C dans un four à pizza). À 75 %, la pâte est très souple : travaille-la mains mouillées.',
  notesEn:'Type 0 flour (about 12.5% protein), 75% water, 0.3% fresh yeast, 2.5% salt, 2% olive oil.\nKnead the flour with four fifths of the water for a few minutes, cover and rest 30 min. Knead again until very elastic, then add the rest of the water little by little, with the yeast dissolved in it: wait until each addition is absorbed. Then add the salt, then the oil.\nShape a ball with a few folds, in a lightly oiled box. One strengthening fold after 20 min, 30 min at room temperature, then 24 h in the fridge. Next day, divide into balls and let them double.\nStretch on semolina without flattening the rim. Bake very hot (400 °C / 750 °F in a pizza oven). At 75% the dough is very soft: work it with wet hands.',
  notesEs:'Harina tipo 0 (unos 12,5 % de proteínas), 75 % de agua, 0,3 % de levadura fresca, 2,5 % de sal, 2 % de aceite de oliva.\nAmasa la harina con cuatro quintos del agua unos minutos, tapa y deja reposar 30 min. Vuelve a amasar hasta que esté bien elástica y añade poco a poco el resto del agua, con la levadura disuelta: espera a que cada adición se absorba. Luego añade la sal y después el aceite.\nBolea con unos pliegues, en una caja ligeramente aceitada. Un pliegue de refuerzo a los 20 min, 30 min a temperatura ambiente y luego 24 h en la nevera. Al día siguiente, divide en bolas y déjalas doblar.\nEstira sobre sémola sin aplastar el borde. Horno muy caliente (400 °C en un horno de pizza). Al 75 %, la masa es muy blanda: trabájala con las manos mojadas.',
  notesIt:'Farina tipo 0 (circa 12,5 % di proteine), 75 % d’acqua, 0,3 % di lievito fresco, 2,5 % di sale, 2 % d’olio d’oliva.\nImpasta la farina con quattro quinti dell’acqua per qualche minuto, copri e lascia riposare 30 min. Riprendi a impastare finché l’impasto incorda bene, poi aggiungi poco alla volta il resto dell’acqua, con il lievito sciolto dentro: aspetta che ogni aggiunta sia assorbita. Poi il sale e quindi l’olio.\nForma una palla con qualche piega, in un contenitore leggermente unto. Una piega di rinforzo dopo 20 min, 30 min a temperatura ambiente, poi 24 h in frigo. Il giorno dopo, dividi in panetti e lasciali raddoppiare.\nStendi sulla semola senza schiacciare il bordo. Cottura molto calda (400 °C in un forno per pizza). Al 75 % l’impasto è molto morbido: lavoralo con le mani bagnate.',
  params:{n:4,shape:'round',diam:30,thick:'custom',ballW:250,method:'frigo',fh:24,flour:'ap',hyd:75,salt:2.5,oil:2,honey:0,ytype:'fresh',yfix:3,T:22,oven:'home290',support:'pierre',grill:false,withTop:true,sauce:'crue',mozza:'fior',basil:true,extras:[],time:'19:00',dRest:30,dBulk:50,dProof:180}},
 {id:'pala',cat:'Pizza',author:'',title:'Pizza alla pala (double cuisson)',titleEn:'Pizza alla pala (two-stage bake)',titleEs:'Pizza alla pala (doble cocción)',titleIt:'Pizza alla pala (doppia cottura)',
  notes:'Proportions : 75 % d’eau, 3 % de sel, 0,5 % de levure, 3 % d’huile d’olive.\nMélange la farine et le sel, verse les deux tiers de l’eau, puis le reste petit à petit. Incorpore la levure, puis l’huile, et termine par quelques rabats.\nUne journée au frigo. Sors la pâte, forme les pâtons et laisse-les reposer 4 à 5 h. Étale délicatement en ovale, du centre vers l’extérieur puis en redescendant par l’intérieur, sans chasser le gaz, et fais tomber l’excès de farine.\nCuisson à 270–280 °C sur pierre. Double cuisson : 4 à 5 min la pâte seule, puis garnis et remets environ 2 min. Elle se mange aussi nature.\nPas de pierre : retourne une plaque du four et fais-la chauffer à vide avec le four.\nLa pizza alla pala vient de Rome et doit son nom à la longue pelle en bois sur laquelle on la sert.',
  notesEn:'Proportions: 75% water, 3% salt, 0.5% yeast, 3% olive oil.\nMix the flour and salt, pour in two thirds of the water, then the rest little by little. Work in the yeast, then the oil, and finish with a few folds.\nOne day in the fridge. Take the dough out, shape the balls and let them rest 4 to 5 h. Stretch gently into an oval, from the centre outwards and then back down through the inside, without pushing out the gas, and shake off the excess flour.\nBake at 270–280 °C (520–540 °F) on a stone. Two-stage bake: 4 to 5 min for the dough alone, then top it and bake about 2 more min. It is also good plain.\nNo stone: turn a baking sheet upside down and preheat it empty with the oven.\nPizza alla pala comes from Rome and is named after the long wooden peel it is served on.',
  notesEs:'Proporciones: 75 % de agua, 3 % de sal, 0,5 % de levadura, 3 % de aceite de oliva.\nMezcla la harina y la sal, vierte dos tercios del agua y luego el resto poco a poco. Incorpora la levadura, después el aceite, y termina con unos pliegues.\nUn día en la nevera. Saca la masa, forma las bolas y déjalas reposar 4 a 5 h. Estira con suavidad en óvalo, del centro hacia fuera y luego bajando por el interior, sin sacar el gas, y quita el exceso de harina.\nHornea a 270–280 °C sobre piedra. Doble cocción: 4 a 5 min la masa sola, luego cubre y hornea unos 2 min más. También se come sola.\nSin piedra: da la vuelta a una bandeja del horno y precaliéntala vacía con el horno.\nLa pizza alla pala viene de Roma y debe su nombre a la larga pala de madera en la que se sirve.',
  notesIt:'Proporzioni: 75 % d’acqua, 3 % di sale, 0,5 % di lievito, 3 % d’olio d’oliva.\nMescola farina e sale, versa due terzi dell’acqua, poi il resto poco alla volta. Incorpora il lievito, poi l’olio, e finisci con qualche piega.\nUn giorno in frigo. Togli l’impasto, forma i panetti e lasciali riposare 4–5 h. Stendi delicatamente a forma ovale, dal centro verso l’esterno e poi ridiscendendo dall’interno, senza far uscire il gas, e togli la farina in eccesso.\nCottura a 270–280 °C su pietra. Doppia cottura: 4–5 min l’impasto da solo, poi condisci e rimetti in forno circa 2 min. È buona anche bianca.\nSenza pietra: capovolgi una teglia del forno e scaldala vuota insieme al forno.\nLa pizza alla pala viene da Roma e deve il nome alla lunga pala di legno su cui si serve.',
  params:{n:3,shape:'round',diam:35,thick:'custom',ballW:600,method:'frigo',fh:24,flour:'ap',hyd:75,salt:3,oil:3,honey:0,ytype:'fresh',yfix:5,T:22,oven:'home290',support:'pierre',grill:false,withTop:true,sauce:'crue',mozza:'fior',basil:true,extras:[],time:'19:00',dRest:0,dBulk:30,dProof:270}},
 {id:'pan-pablo',cat:'Pizza',author:'Pablo',title:'Pizza épaisse en moule (pan pizza)',titleEn:'Thick pan pizza',titleEs:'Pizza gruesa en molde (pan pizza)',titleIt:'Pizza alta in teglia tonda (pan pizza)',
  notes:'Recette de Pablo. Proportions : 60 % d’eau tiède (35–40 °C), 1,4 % de levure sèche, environ 2,5 % de lait en poudre (le secret du moelleux) et 2,5 % de sucre, 1,8 % de sel, 5,5 % d’huile végétale dans la pâte.\nDivise la pâte aussitôt après le pétrissage, étale chaque pâton dans un moule bien huilé (par exemple, pour un moule de 32 cm : 3 c. à soupe d’huile), levée 1 h 30 à 2 h, ou une nuit au frigo et sortie 1 h avant.\nFour à 250 °C ou au maximum, grille du bas, 12 à 15 min. Sauce un peu sucrée (coulis, une pointe de concentré, une pincée de sucre, origan, ail semoule) ; fromage généreux jusqu’au bord.\nBord fourré au fromage : étale la pâte un peu plus large que le moule, pose des bâtonnets de mozzarella sur le pourtour et replie la pâte par-dessus en pinçant bien.',
  notesEn:'Pablo’s recipe. Proportions: 60% warm water (35–40 °C), 1.4% dry yeast, about 2.5% milk powder (the secret of the softness) and 2.5% sugar, 1.8% salt, 5.5% vegetable oil in the dough.\nDivide the dough right after kneading, spread each ball in a well-oiled pan (for example, for a 32 cm pan: 3 tbsp oil), rise 1 h 30 to 2 h, or overnight in the fridge and out 1 h before.\nOven at 250 °C (480 °F) or max, bottom rack, 12 to 15 min. Slightly sweet sauce (passata, a little paste, a pinch of sugar, oregano, garlic powder); generous cheese right to the edge.\nCheese-stuffed crust: spread the dough a little wider than the pan, lay mozzarella sticks around the edge and fold the dough over, pinching well.',
  notesEs:'Receta de Pablo. Proporciones: 60 % de agua tibia (35–40 °C), 1,4 % de levadura seca, unos 2,5 % de leche en polvo (el secreto de la esponjosidad) y 2,5 % de azúcar, 1,8 % de sal, 5,5 % de aceite vegetal en la masa.\nDivide la masa justo después de amasar, extiende cada bola en un molde bien aceitado (por ejemplo, para un molde de 32 cm: 3 cdas. de aceite), levado de 1 h 30 a 2 h, o una noche en la nevera y sacar 1 h antes.\nHorno a 250 °C o al máximo, rejilla inferior, 12 a 15 min. Salsa un poco dulce (tomate triturado, una punta de concentrado, una pizca de azúcar, orégano, ajo en polvo); queso generoso hasta el borde.\nBorde relleno de queso: extiende la masa un poco más ancha que el molde, pon bastoncitos de mozzarella por el contorno y dobla la masa por encima, pellizcando bien.',
  notesIt:'Ricetta di Pablo. Proporzioni: 60 % d’acqua tiepida (35–40 °C), 1,4 % di lievito secco, circa 2,5 % di latte in polvere (il segreto della morbidezza) e 2,5 % di zucchero, 1,8 % di sale, 5,5 % d’olio di semi nell’impasto.\nDividi l’impasto subito dopo averlo impastato, stendi ogni panetto in uno stampo ben unto (per esempio, per uno stampo da 32 cm: 3 cucchiai d’olio), lievitazione di 1 h 30–2 h, o una notte in frigo e fuori 1 h prima.\nForno a 250 °C o al massimo, griglia in basso, 12–15 min. Salsa un po’ dolce (passata, un po’ di concentrato, un pizzico di zucchero, origano, aglio in polvere); formaggio abbondante fino al bordo.\nBordo ripieno di formaggio: stendi l’impasto un po’ più largo dello stampo, metti bastoncini di mozzarella lungo il bordo e ripiega l’impasto sopra, pizzicando bene.',
  params:{n:4,shape:'round',diam:32,thick:'custom',ballW:410,method:'pan',flour:'ap',hyd:60,salt:1.8,oil:5.5,honey:0,ytype:'ady',yfix:14,fh:2,T:22,oven:'home260',support:'plaque',grill:false,withTop:true,sauce:'maison',mozza:'rapee',basil:false,extras:['pepperoni','oignon','poivron','champ'],custom:[{name:'Lait en poudre',cat:'pate',qty:2.5,unit:'pf'},{name:'Sucre',cat:'pate',qty:2.5,unit:'pf'}],time:'19:00'}},
 {id:'plaque-semoule',cat:'Pizza',author:'Pablo',title:'Pizza en plaque à la semoule',titleEn:'Pan-baked pizza with semolina',titleEs:'Pizza en bandeja con sémola',titleIt:'Pizza in teglia con semola',
  notes:'Recette de Pablo, sur plaques métalliques. Farine forte (13,7 g de protéines pour 100 g) et semoule de blé fine (environ 1 part de semoule pour 9 de farine), eau tiède (30–35 °C), levure sèche active, sel, huile d’olive, une pincée de sucre.\nLevure activée 5 à 10 min dans l’eau tiède sucrée ; pétrissage 12 à 15 min, sel en dernier ; levée en masse environ 4 h 15 ; division et boulage ; détente 45 min (ne pas la sauter : la farine forte se rétracte).\nFour à 230 °C en chaleur tournante, préchauffé au moins 45 min, niveau le plus bas, 11 à 13 min. Étaler du centre vers les bords sans écraser le bord, plaque légèrement huilée, garnir avec modération, bords huilés au pinceau.\nL’hydratation de l’appli (70 %) est calculée sur la farine seule ; avec la semoule, elle est d’environ 64 %.',
  notesEn:'Pablo’s recipe, on metal pans. Strong flour (13.7 g protein per 100 g) and fine durum semolina (about 1 part semolina to 9 of flour), warm water (30–35 °C), active dry yeast, salt, olive oil, a pinch of sugar.\nYeast activated 5 to 10 min in the sweetened warm water; knead 12 to 15 min, salt last; bulk rise about 4 h 15; divide and shape; rest 45 min (do not skip: strong flour springs back).\nOven at 230 °C (445 °F) convection, preheated at least 45 min, lowest rack, 11 to 13 min. Stretch from the centre out without crushing the rim, lightly oiled pan, top sparingly, rim brushed with oil.\nThe app’s hydration (70%) is on flour only; with the semolina it is about 64%.',
  notesEs:'Receta de Pablo, en bandejas metálicas. Harina de fuerza (13,7 g de proteína por 100 g) y sémola fina de trigo duro (más o menos 1 parte de sémola por 9 de harina), agua tibia (30–35 °C), levadura seca activa, sal, aceite de oliva, una pizca de azúcar.\nLevadura activada 5 a 10 min en el agua tibia con azúcar; amasado 12 a 15 min, la sal al final; levado en bloque unas 4 h 15; división y boleado; reposo 45 min (no saltarlo: la harina de fuerza se retrae).\nHorno a 230 °C con ventilador, precalentado al menos 45 min, nivel más bajo, 11 a 13 min. Estirar del centro hacia los bordes sin aplastar el borde, bandeja ligeramente aceitada, cubrir con moderación, bordes pintados con aceite.\nLa hidratación de la app (70 %) se calcula solo sobre la harina; con la sémola es de unos 64 %.',
  notesIt:'Ricetta di Pablo, su teglie di metallo. Farina forte (13,7 g di proteine per 100 g) e semola rimacinata (circa 1 parte di semola per 9 di farina), acqua tiepida (30–35 °C), lievito secco attivo, sale, olio d’oliva, un pizzico di zucchero.\nLievito attivato 5–10 min nell’acqua tiepida zuccherata; impasto 12–15 min, sale per ultimo; lievitazione in massa circa 4 h 15; divisione e formatura; riposo 45 min (da non saltare: la farina forte si ritira).\nForno a 230 °C ventilato, preriscaldato almeno 45 min, livello più basso, 11–13 min. Stendere dal centro verso i bordi senza schiacciare il cornicione, teglia leggermente unta, condire con moderazione, bordi spennellati d’olio.\nL’idratazione dell’app (70 %) è calcolata sulla sola farina; con la semola è circa 64 %.',
  params:{brushEdges:true,n:4,shape:'round',diam:32,thick:'custom',ballW:300,method:'complete',flour:'bread',hyd:70,salt:2.1,oil:3.6,honey:0.2,ytype:'ady',yfix:14.3,fh:4.5,T:22,oven:'home240',support:'plaque',grill:false,withTop:true,sauce:'maison',mozza:'fior',basil:true,extras:[],custom:[{name:'Semoule de blé fine',cat:'pate',qty:11.1,unit:'pf'}],time:'19:00'}},
 {id:'express-70',cat:'Pizza',author:'',title:'Express 3 h à 70 %, par rabats',titleEn:'3 h express at 70%, with folds',titleEs:'Exprés 3 h al 70 %, con pliegues',titleIt:'Express 3 h al 70 %, con pieghe',
  notes:'Proportions : 70 % d’eau, 2,4 % de sel, 0,6 % de levure sèche instantanée.\nMélange tout jusqu’à ce qu’il ne reste plus de farine sèche ; boule grossière, couverte, 30 min. Un rabat d’environ 1 min ; 30 min ; un second rabat. Sur le plan de travail, forme une boule lisse, couverte, 30 min. Divise en pâtons et laisse-les 1 h 30 dans des boîtes.\nPas de pétrissage long : ce sont les rabats et le temps qui développent le gluten. L’appli suit le déroulé de la méthode Express ; remplace le pétrissage par les rabats.',
  notesEn:'Proportions: 70% water, 2.4% salt, 0.6% instant dry yeast.\nMix everything until no dry flour remains; rough ball, covered, 30 min. One fold of about 1 min; 30 min; a second fold. On the counter, shape a smooth ball, covered, 30 min. Divide into balls and leave them 1 h 30 in boxes.\nNo long kneading: folds and time develop the gluten. The app follows the Express method’s steps; replace kneading with the folds.',
  notesEs:'Proporciones: 70 % de agua, 2,4 % de sal, 0,6 % de levadura seca instantánea.\nMezcla todo hasta que no quede harina seca; bola tosca, tapada, 30 min. Un pliegue de 1 min; 30 min; un segundo pliegue. En la encimera, forma una bola lisa, tapada, 30 min. Divide en bolas y déjalas 1 h 30 en cajas.\nSin amasado largo: los pliegues y el tiempo desarrollan el gluten. La app sigue los pasos del método Exprés; sustituye el amasado por los pliegues.',
  notesIt:'Proporzioni: 70 % d’acqua, 2,4 % di sale, 0,6 % di lievito secco istantaneo.\nMescola tutto finché non resta farina secca; palla grossolana, coperta, 30 min. Una piega di circa 1 min; 30 min; una seconda piega. Sul piano forma una palla liscia, coperta, 30 min. Dividi in panetti e lasciali 1 h 30 nelle cassette.\nNiente impasto lungo: pieghe e tempo sviluppano il glutine. L’app segue i passaggi del metodo Express; sostituisci l’impasto con le pieghe.',
  params:{n:3,shape:'round',diam:30,thick:'custom',ballW:285,method:'express',flour:'ap',hyd:70,salt:2.4,oil:0,honey:0,ytype:'idy',yfix:6,T:22,oven:'home260',support:'pierre',grill:true,withTop:true,sauce:'maison',mozza:'fior',basil:true,extras:[],time:'19:00',dRest:30,dBulk:60,dProof:90}},
 {id:'focaccia',cat:'Focaccia',author:'',title:'Focaccia moelleuse sans pétrissage (plaque 30 × 40 cm)',titleEn:'Soft no-knead focaccia (30 × 40 cm pan)',titleEs:'Focaccia esponjosa sin amasado (bandeja 30 × 40 cm)',
  notes:'Farine T55, Manitoba ou 00 ; eau tiède à 80 % ; levure (sèche ou fraîche) ; sel fin ; un peu de sucre ou de miel ; huile d’olive généreuse, fleur de sel, romarin frais.\nLevure et sucre dans l’eau tiède 5 min ; farine et sel à la spatule, sans pétrir ; filet d’huile, couvert, 1 h 30 à 2 h au chaud. Plaque bien huilée, pâte pliée 1 ou 2 fois puis versée et étalée mains huilées ; 30 à 45 min sans couvrir. Four 220 °C ; huile, creux avec les dix doigts jusqu’au fond, fleur de sel, romarin ; 20 à 25 min. À la sortie, un filet d’huile, tiédir sur une grille.',
  notesEn:'T55, Manitoba or 00 flour; 80% warm water; yeast (dry or fresh); fine salt; a little sugar or honey; plenty of olive oil, flaky salt, fresh rosemary.\nYeast and sugar in warm water 5 min; flour and salt with a spatula, no kneading; drizzle of oil, covered, 1 h 30 to 2 h somewhere warm. Well-oiled pan, fold the dough 1 or 2 times, then tip it in and spread with oiled hands; 30 to 45 min uncovered. Oven 220 °C (430 °F); oil, dimple with all ten fingers to the bottom, flaky salt, rosemary; 20 to 25 min. When it comes out, a drizzle of oil; cool on a rack.',
  notesEs:'Harina T55, Manitoba o 00; agua tibia al 80 %; levadura (seca o fresca); sal fina; un poco de azúcar o miel; aceite de oliva generoso, sal en escamas, romero fresco.\nLevadura y azúcar en el agua tibia 5 min; harina y sal con espátula, sin amasar; chorrito de aceite, tapada, 1 h 30 a 2 h en un sitio templado. Bandeja bien aceitada, masa plegada 1 o 2 veces y luego volcada y extendida con las manos aceitadas; 30 a 45 min sin tapar. Horno a 220 °C; aceite, hoyos con los diez dedos hasta el fondo, sal en escamas, romero; 20 a 25 min. Al salir, un chorrito de aceite y templar sobre una rejilla.',
  params:{n:1,shape:'rect',rl:40,rw:30,thick:'custom',ballW:925,method:'focaccia',flour:'ap',hyd:80,salt:2.4,oil:0,honey:1,ytype:'idy',yfix:14,T:22,oven:'home240',support:'plaque',grill:false,dbl:false,withTop:true,sauce:'none',mozza:'none',basil:false,extras:[],time:'18:30',ds:8,de:20},notesIt:'Farina T55, Manitoba o 00; acqua tiepida all’80 %; lievito (secco o fresco); sale fino; un po’ di zucchero o miele; olio d’oliva abbondante, sale in fiocchi, rosmarino fresco.\nLievito e zucchero nell’acqua tiepida 5 min; farina e sale con una spatola, senza impastare; un filo d’olio, coperto, 1 h 30–2 h al caldo. Teglia ben unta, impasto piegato 1 o 2 volte poi versato e steso con le mani unte; 30–45 min scoperto. Forno a 220 °C; olio, fossette con dieci dita fino al fondo, sale in fiocchi, rosmarino; 20–25 min. All’uscita, un filo d’olio e far intiepidire su una griglia.',titleIt:'Focaccia soffice senza impastare (teglia 30 × 40 cm)'},
 {id:'pugliese',cat:'Focaccia',author:'',title:'Focaccia pugliese à la pomme de terre',titleEn:'Focaccia pugliese with potato',titleEs:'Focaccia pugliese con patata',
  notes:'Focaccia des Pouilles (région de Bari) : la pomme de terre dans la pâte la rend très moelleuse et l’empêche de sécher.\nFarine (T45, 00 ou tout usage) et semoule fine de blé dur (2 pour 1), pomme de terre cuite et écrasée (environ un tiers du poids de farine), eau tiède, levure, une pincée de sucre, sel, huile d’olive, plus de l’huile pour la plaque et le dessus.\nCuire la pomme de terre avec la peau, l’éplucher chaude et l’écraser finement. Activer la levure 5 min dans l’eau tiède sucrée, ajouter farine, semoule, sel, purée et huile, pétrir 10 min : la pâte est souple et collante.\n1re levée de 2 à 3 h sous un torchon humide ; 2e levée de 45 min à 1 h sur la plaque bien huilée.\nCreuser avec les doigts, garnir de tomates cerises (côté coupé en bas), olives, romarin ou origan, fleur de sel et un filet d’huile. Four à 220–250 °C, 15 à 20 min.',
  notesEn:'Focaccia from Apulia (Bari area): potato in the dough makes it very soft and keeps it from drying out.\nFlour (T45, 00 or all-purpose) and fine durum semolina (2 to 1), cooked mashed potato (about a third of the flour weight), warm water, yeast, a pinch of sugar, salt, olive oil, plus oil for the pan and the top.\nBoil the potato in its skin, peel it hot and mash finely. Activate the yeast 5 min in sweetened warm water, add flour, semolina, salt, mash and oil, knead 10 min: the dough is soft and sticky.\n1st rise 2 to 3 h under a damp cloth; 2nd rise 45 min to 1 h in the well-oiled pan.\nDimple with your fingers, top with cherry tomatoes (cut side down), olives, rosemary or oregano, flaky salt and a drizzle of oil. Oven at 220–250 °C (430–480 °F), 15 to 20 min.',
  notesEs:'Focaccia de Apulia (zona de Bari): la patata en la masa la hace muy esponjosa y evita que se seque.\nHarina (T45, 00 o común) y sémola fina de trigo duro (2 a 1), patata cocida y aplastada (más o menos un tercio del peso de la harina), agua tibia, levadura, una pizca de azúcar, sal, aceite de oliva, y más aceite para la bandeja y la superficie.\nCocer la patata con piel, pelarla caliente y hacer un puré fino. Activar la levadura 5 min en el agua tibia con azúcar, añadir harina, sémola, sal, puré y aceite, amasar 10 min: la masa es suave y pegajosa.\n1.er levado de 2 a 3 h bajo un paño húmedo; 2.º levado de 45 min a 1 h en la bandeja bien aceitada.\nHacer hoyos con los dedos, cubrir con tomates cherry (lado cortado hacia abajo), aceitunas, romero u orégano, sal en escamas y un chorrito de aceite. Horno a 220–250 °C, 15 a 20 min.',
  params:{n:1,shape:'rect',rl:40,rw:30,thick:'custom',ballW:779,method:'focaccia',flour:'semblend',hyd:61,salt:2.2,oil:8.9,honey:0.9,ytype:'idy',yfix:11.1,T:22,oven:'home240',withTop:true,sauce:'none',mozza:'none',basil:false,extras:['tomcer','olives','origan','olive'],custom:[{name:'pomme de terre cuite, en purée',cat:'pate',qty:33.3,unit:'pf'}],dBulk:150,dProof:50,focT:230,focB:17.5,time:'19:00'},notesIt:'Focaccia pugliese (zona di Bari): la patata nell’impasto la rende molto soffice e le impedisce di seccarsi.\nFarina (T45, 00 o per tutti gli usi) e semola rimacinata (2 a 1), patata lessa schiacciata (circa un terzo del peso della farina), acqua tiepida, lievito, un pizzico di zucchero, sale, olio d’oliva, più olio per la teglia e la superficie.\nLessare la patata con la buccia, sbucciarla calda e schiacciarla finemente. Attivare il lievito 5 min nell’acqua tiepida zuccherata, aggiungere farina, semola, sale, purè e olio, impastare 10 min: l’impasto è morbido e appiccicoso.\n1ª lievitazione di 2–3 h sotto un canovaccio umido; 2ª lievitazione di 45 min–1 h nella teglia ben unta.\nFare le fossette con le dita, condire con pomodorini (lato tagliato in giù), olive, rosmarino o origano, sale in fiocchi e un filo d’olio. Forno a 220–250 °C, 15–20 min.',titleIt:'Focaccia pugliese con patate'},
 {id:'biga-50',cat:'Pizza',author:'',title:'Pizza à la biga (50 %)',titleEn:'Biga pizza (50%)',titleEs:'Pizza con biga (50 %)',titleIt:'Pizza con biga (50 %)',
  notes:'Biga la veille : la moitié de la farine, 45 % de son poids en eau fraîche et 1 % de levure fraîche (0,3 % si elle passe au frigo), mélangées juste assez pour mouiller la farine (grumeaux). 18 h vers 18 °C ; dans une cuisine plus chaude, 1 h à température ambiante puis au frigo.\nLe jour J : biga délayée dans le reste de l’eau, reste de la farine, sel, pétrissage 10 à 15 min, pointage 1 h, boulage, apprêt 2 h 30 environ.\nValeurs de départ courantes pour une biga, à ajuster selon ta farine et ta cuisine.',
  notesEn:'Biga the day before: half the flour, 45% of its weight in cool water and 1% fresh yeast (0.3% if it goes in the fridge), mixed just enough to wet the flour (lumpy). 18 h around 18 °C (64 °F); in a warmer kitchen, 1 h at room temperature then in the fridge.\nOn the day: biga dissolved in the rest of the water, rest of the flour, salt, knead 10 to 15 min, bulk 1 h, shape, proof about 2 h 30.\nCommon starting values for a biga, to adjust to your flour and kitchen.',
  notesEs:'Biga la víspera: la mitad de la harina, 45 % de su peso en agua fresca y 1 % de levadura fresca (0,3 % si pasa por la nevera), mezcladas lo justo para mojar la harina (grumos). 18 h hacia 18 °C; en una cocina más caliente, 1 h a temperatura ambiente y luego a la nevera.\nEl día del servicio: biga deshecha en el resto del agua, resto de la harina, sal, amasado 10 a 15 min, primer levado 1 h, boleado, segundo levado unas 2 h 30.\nValores de partida habituales para una biga, a ajustar según tu harina y tu cocina.',
  notesIt:'Biga il giorno prima: metà della farina, 45 % del suo peso in acqua fresca e 1 % di lievito fresco (0,3 % se passa in frigo), mescolati quanto basta per bagnare la farina (grumi). 18 h intorno ai 18 °C; in una cucina più calda, 1 h a temperatura ambiente poi in frigo.\nIl giorno stesso: biga sciolta nel resto dell’acqua, resto della farina, sale, impasto 10–15 min, puntata 1 h, formatura, appretto circa 2 h 30.\nValori di partenza comuni per una biga, da regolare secondo la farina e la cucina.',

 {id:'biga-48',cat:'Pizza',author:'',title:'Biga 48 h (pâtons au frigo)',titleEn:'48 h biga (balls in the fridge)',titleEs:'Biga 48 h (bolas en la nevera)',titleIt:'Biga 48 h (panetti in frigo)',
  notes:'Biga : la moitié de la farine (farine forte, W 340 environ), 50 % de son poids en eau froide, 0,3 % de levure fraîche ; mélanger, 2 h à température ambiante, puis 20 h au frigo.\nPâte finale : biga, le reste de la farine (W 300 environ) et de l’eau froide, un peu de levure fraîche, le sel ; hydratation totale 70 %, sel 2,5 %. Pétrir jusqu’à une pâte lisse.\nPâtons 20 h au frigo, sortis 4 h avant la cuisson. Pâte croustillante et aérée.\nL’appli prépare la biga à 45 % d’eau ; la différence est faible.',
  notesEn:'Biga: half the flour (strong flour, about W 340), 50% of its weight in cold water, 0.3% fresh yeast; mix, 2 h at room temperature, then 20 h in the fridge.\nFinal dough: biga, the rest of the flour (about W 300) and cold water, a little fresh yeast, the salt; total hydration 70%, salt 2.5%. Knead until smooth.\nBalls 20 h in the fridge, out 4 h before baking. Crisp, airy crust.\nThe app makes the biga at 45% water; the difference is small.',
  notesEs:'Biga: la mitad de la harina (harina de fuerza, unos W 340), 50 % de su peso en agua fría, 0,3 % de levadura fresca; mezclar, 2 h a temperatura ambiente y luego 20 h en la nevera.\nMasa final: biga, el resto de la harina (unos W 300) y del agua fría, un poco de levadura fresca, la sal; hidratación total 70 %, sal 2,5 %. Amasar hasta que esté lisa.\nBolas 20 h en la nevera, sacadas 4 h antes de hornear. Corteza crujiente y aireada.\nLa app prepara la biga con 45 % de agua; la diferencia es pequeña.',
  notesIt:'Biga: metà della farina (farina forte, circa W 340), 50 % del suo peso in acqua fredda, 0,3 % di lievito fresco; mescolare, 2 h a temperatura ambiente, poi 20 h in frigo.\nImpasto finale: biga, il resto della farina (circa W 300) e dell’acqua fredda, un po’ di lievito fresco, il sale; idratazione totale 70 %, sale 2,5 %. Impastare fino a un impasto liscio.\nPanetti 20 h in frigo, fuori 4 h prima della cottura. Crosta croccante e alveolata.\nL’app prepara la biga al 45 % d’acqua; la differenza è piccola.',
  params:{n:4,shape:'round',diam:30,thick:'custom',ballW:280,method:'biga',bpct:50,bh:22,bfr:true,flour:'strong',hyd:70,salt:2.5,oil:0,honey:0,ytype:'fresh',T:22,oven:'home290',support:'pierre',grill:true,withTop:true,sauce:'crue',mozza:'fior',basil:true,extras:[],time:'19:00',dProof:240}},
 {id:'vito-100',cat:'Pizza',author:'',title:'Poolish 100 %',titleEn:'Poolish 100%',titleEs:'Poolish 100 %',
  notes:'Proportions : 145 g de farine pour 100 ml d’eau (environ 69 % d’hydratation), sel 3,45 %.\nPoolish 16 à 24 h avant : eau et farine à parts égales, avec 5 g de levure fraîche et 5 g de miel pour 300 g d’eau.\nVersion 100 % : toute l’eau est dans le poolish. Le jour J, on n’ajoute que le reste de la farine et le sel, sans eau.',

  notesEs:'Proporciones: 145 g de harina por 100 ml de agua (unos 69 % de hidratación), sal 3,45 %.\nPoolish 16 a 24 h antes: agua y harina a partes iguales, con 5 g de levadura fresca y 5 g de miel por 300 g de agua.\nVersión 100 %: toda el agua está en el poolish. El día del servicio solo se añade el resto de la harina y la sal, sin agua.',

 {id:'vito-20',cat:'Pizza',author:'',title:'Poolish 20 %',titleEn:'Poolish 20%',titleEs:'Poolish 20 %',
  notes:'Mêmes proportions que la version 100 % : 145 g de farine pour 100 ml d’eau, sel 3,45 %.\nVersion « 20 % » : un petit poolish (eau et farine à parts égales, levure et miel en proportion), fait 16 à 24 h avant, qui contient environ 17 % de l’eau.\nLe jour J : on ajoute le reste de l’eau, de la farine et le sel.',

  notesEs:'Mismas proporciones que la versión 100 %: 145 g de harina por 100 ml de agua, sal 3,45 %.\nVersión «20 %»: un poolish pequeño (agua y harina a partes iguales, levadura y miel en proporción), hecho 16 a 24 h antes, que contiene unos 17 % del agua.\nEl día del servicio: se añade el resto del agua, la harina y la sal.',

 {id:'base-complete',cat:'Pizza',author:'Marco',title:'Recette simple',titleEn:'Simple recipe',titleEs:'Receta sencilla',
  notes:'Levure sèche activée dans l’eau tiède miellée (15 à 30 min, jusqu’à ce que ça mousse), puis pétrissage avec la farine, le sel et un peu d’huile d’olive, et une seule levée de 3 à 6 h, la même journée.\nUn peu d’huile d’olive sur les mains pour manipuler la pâte, et au pinceau sur les bords de la pizza avant d’enfourner.\nMême esprit que ma recette au poolish : c’est surtout la façon de faire lever et de pétrir qui change.',
  notesEn:'Dry yeast activated in warm honey water (15 to 30 min, until foamy), then kneaded with the flour, salt and a little olive oil, and a single 3 to 6 h rise, the same day.\nA little olive oil on your hands to handle the dough, and brushed on the pizza rim before baking.\nSame spirit as my poolish recipe: mainly the rising and kneading change.',
  notesEs:'Levadura seca activada en el agua tibia con miel (15 a 30 min, hasta que haga espuma), luego amasado con la harina, la sal y un poco de aceite de oliva, y un solo levado de 3 a 6 h, el mismo día.\nUn poco de aceite de oliva en las manos para manejar la masa, y con pincel en los bordes de la pizza antes de hornear.\nMismo espíritu que mi receta con poolish: sobre todo cambian el levado y el amasado.',
  params:{brushEdges:true,n:2,shape:'round',diam:40,thick:'custom',ballW:444,method:'complete',flour:'ap',T:22,oven:'home260',support:'perforee',grill:true,withTop:true,sauce:'maison',mozza:'fior',basil:false,extras:['jambon','olives','oignon','origan'],time:'18:30',hyd:61,salt:1.1,oil:0.9,honey:1.3,ytype:'idy',yfix:14.8,fh:4},notesIt:'Lievito secco attivato nell’acqua tiepida con miele (15–30 min, finché fa schiuma), poi impastato con farina, sale e un po’ d’olio d’oliva, e una sola lievitazione di 3–6 h, in giornata.\nUn po’ d’olio d’oliva sulle mani per maneggiare l’impasto, e col pennello sui bordi della pizza prima di infornare.\nStesso spirito della mia ricetta col poolish: cambiano soprattutto lievitazione e impasto.',titleIt:'Ricetta semplice'},

const ANCH=[[2,2.2],[3,1.43],[4,0.8],[6,0.33],[8,0.175],[10,0.125],[12,0.085],[16,0.066],[24,0.045],[48,0.025]];
function base24(H){ H=clamp(H,2,48);
  for(let i=0;i<ANCH.length-1;i++){ const[a,ya]=ANCH[i],[b,yb]=ANCH[i+1];
    if(H<=b){ const t=(Math.log(H)-Math.log(a))/(Math.log(b)-Math.log(a)); return Math.exp(Math.log(ya)+t*(Math.log(yb)-Math.log(ya))); } }
  return ANCH[ANCH.length-1][1]; }
function kT(H){ const t=clamp((Math.log(H)-Math.log(3))/(Math.log(8)-Math.log(3)),0,1); return 0.095+t*0.052; }
const freshPct=(T_,H)=>base24(H)*Math.exp(-kT(H)*(T_-24));
const coldPct=(T_,H)=>0.4*Math.pow(24/H,0.7)*clamp(Math.exp(-0.05*(T_-22)),0.7,1.4);
const levainPct=(T_,H)=>clamp(20*Math.pow(freshPct(T_,H)/freshPct(24,8),0.9),2,35);
const WT=[[19,30],[22,25],[25,20],[28,14.5],[31,10]];
function waterT(t){ let v;
  if(t<=WT[0][0]) v=WT[0][1]+(WT[0][0]-t)*1.67;
  else if(t>=WT[4][0]) v=WT[4][1]-(t-WT[4][0])*1.5;
  else for(let i=0;i<4;i++){ const[a,ya]=WT[i],[b,yb]=WT[i+1]; if(t<=b){ v=lerp(ya,yb,(t-a)/(b-a)); break; } }
  return Math.round(clamp(v,6,36)); }
const poolishSug=t=>clamp(Math.round((100-(t-19)*(80/7))/10)*10,20,100);

function fitWindow(st,m,s,serve){
  const d=new Date(serve.getTime()+st*60000), h=d.getHours()+d.getMinutes()/60;

  const t=new Date(d); t.setHours(s.de,0,0,0); if(h<s.ds) t.setDate(t.getDate()-1);
  return (t.getTime()-serve.getTime())/60000-m;
}

      rows+=`<tr><td>${Y_}<span class="hint">${ytxt}</span></td><td class="n">${gr(P.y)} g</td><td class="n"><b>${gr(P.y)} g</b>${s.ytype!=='fresh'?`<span class="hint">${spoon(P.y,3)}</span>`:''}</td><td class="n">–</td></tr>`;

let costItems=[];

    <div class="costsum" id="costSum"></div>`;
  updateCosts();

function updateCosts(){
  let pate=0, gar=0; const per=new Map();
  costItems.forEach(it=>{ const pk=priceOf(it.k); if(pk===null) return; const c=it.g/1000*pk; per.set(it.k,(per.get(it.k)||0)+c); if(it.cat==='pate') pate+=c; else gar+=c; });
  $('cost').querySelectorAll('tr[data-k]').forEach(tr=>{ const c=per.get(tr.dataset.k); tr.querySelector('[data-cost]').textContent=c===undefined?'–':money(c); });
  const s=read(), n=s.n, missK=new Set(costItems.filter(it=>priceOf(it.k)===null).map(it=>it.k)).size;
  const P=parts(s,calc(s)), slices=n*P.per, unit=isFoc(s)?T('plaque','pan','bandeja','teglia'):'pizza';
  $('costH').textContent=`${T('Total','Total','Total','Totale')} ${money(pate+gar)} · ${money((pate+gar)/n)} / ${unit}${missK?T(` · ${missK} prix manquant${missK>1?'s':''}`,` · ${missK} missing price${missK>1?'s':''}`,` · ${missK} precio${missK>1?'s':''} sin poner`,` · ${missK} prezz${missK>1?'i mancanti':'o mancante'}`):''}`;
  $('costSum').innerHTML=`<div><div class="k">${T('Pâte','Dough','Masa','Impasto')}</div><div class="v">${money(pate)}</div></div><div><div class="k">${T('Par pâton','Per ball','Por bola','Per panetto')}</div><div class="v">${money(pate/n)}</div></div><div><div class="k">${T('Garniture','Toppings','Cobertura','Condimento')}</div><div class="v">${s.withTop?money(gar):T('exclue','excluded','excluida','escluso')}</div></div><div><div class="k">${T('Total','Total','Total','Totale')}</div><div class="v">${money(pate+gar)}</div></div><div><div class="k">${isFoc(s)?T('Par plaque','Per pan','Por bandeja','Per teglia'):T('Par pizza','Per pizza','Por pizza','Per pizza')}</div><div class="v">${money((pate+gar)/n)}</div></div><div><div class="k">${T('Par part','Per slice','Por porción','Per fetta')}</div><div class="v">${money((pate+gar)/slices)}</div></div>${missK?`<div><div class="k">${T('Prix manquants','Missing prices','Precios sin poner','Prezzi mancanti')}</div><div class="v">${missK}</div></div>`:''}`;
}
$('cost').addEventListener('input',e=>{
  const tr=e.target.closest('tr[data-k]'); if(!tr) return; const k=tr.dataset.k; carnet.prices=carnet.prices||{};
  const p=carnet.prices[k]||{mode:'kg'}; const f=e.target.dataset.f;

  carnet.prices[k]=p; saveC(); updateCosts();
});

const fmtLine=(s,q)=>{ const f=isFoc(s)||s.method==='pan'; return T(`${s.n} ${isFoc(s)?(s.n>1?'plaques':'plaque'):(s.n>1?'pizzas':'pizza')} de ${fmtSz(s)} · ${f?'pâte':'pâtons'} de ${q.ball} g`,`${s.n} ${isFoc(s)?(s.n>1?'pans':'pan'):(s.n>1?'pizzas':'pizza')} of ${fmtSz(s)} · ${q.ball} g ${f?'dough':'balls'}`,`${s.n} ${isFoc(s)?(s.n>1?'bandejas':'bandeja'):(s.n>1?'pizzas':'pizza')} de ${fmtSz(s)} · ${f?'masa':'bolas'} de ${q.ball} g`,`${s.n} ${isFoc(s)?(s.n>1?'teglie':'teglia'):(s.n>1?'pizze':'pizza')} da ${fmtSz(s)} · ${f?'impasto':'panetti'} da ${q.ball} g`); };

function renderBake(s,r){
  const ov=r.ov, o=ov.o; let steps=[];

  else if(ov.pan) steps.push(T('Moules sur la grille la plus basse : le dessous frit dans l’huile avant que le fromage ne brûle.','Pans on the lowest rack: the bottom fries in the oil before the cheese burns.','Moldes en la rejilla más baja: la base se fríe en el aceite antes de que el queso se queme.','Stampi sulla griglia più bassa: il fondo frigge nell’olio prima che il formaggio bruci.'),T('Cuisson 12 à 15 min : dessous doré et croustillant, dessus moelleux.','Bake 12 to 15 min: golden, crisp bottom, soft top.','Hornea 12 a 15 min: base dorada y crujiente, superficie tierna.','Cuoci 12–15 min: fondo dorato e croccante, sopra morbido.'),T('Si le dessus est prêt mais le fond pâle, pose le moule directement sur la sole 1 min.','If the top is done but the bottom is pale, set the pan straight on the oven floor for 1 min.','Si la superficie está lista pero la base pálida, pon el molde directamente en la base del horno 1 min.','Se sopra è pronta ma il fondo è pallido, appoggia lo stampo direttamente sul fondo del forno per 1 min.'),T('Attends 2 min avant de démouler : la croûte réabsorbe un peu d’huile. Fais glisser avec une spatule.','Wait 2 min before unmoulding: the crust absorbs a little oil. Slide it out with a spatula.','Espera 2 min antes de desmoldar: la corteza reabsorbe un poco de aceite. Sácala con una espátula.','Aspetta 2 min prima di sformare: la crosta riassorbe un po’ d’olio. Falla scivolare con una spatola.'));
    else {
    if(s.method==='sg') steps.push(T('Sans gluten : préchauffe à 275 °C en chaleur tournante et cuis sur papier cuisson.','Gluten-free: preheat to 275 °C (525 °F) convection and bake on parchment.','Sin gluten: precalienta a 275 °C con ventilador y hornea sobre papel.','Senza glutine: preriscalda a 275 °C ventilato e cuoci su carta forno.'));
    if(ov.brl){ steps.push(
      T(`${s.support==='acier'?'Acier':'Pierre'} au tiers supérieur ; allume le grill, dispose la ${s.support==='acier'?'plaque d’acier':'pierre'}, préchauffe 20 min au minimum (30 min, c’est mieux).`,`${s.support==='acier'?'Steel':'Stone'} in the upper third; turn on the broiler, put the ${s.support==='acier'?'steel':'stone'} in, preheat at least 20 min (30 min is better).`,`${s.support==='acier'?'Acero':'Piedra'} en el tercio superior; enciende el grill, coloca ${s.support==='acier'?'el acero':'la piedra'}, precalienta 20 min como mínimo (mejor 30 min).`,`${s.support==='acier'?'Acciaio':'Pietra'} nel terzo superiore; accendi il grill, sistema ${s.support==='acier'?'l’acciaio':'la pietra'}, preriscalda almeno 20 min (meglio 30 min).`),
      T('Glisse la pizza avec une pelle farinée ou semoulée sur la grille du haut, 1 à 2 min max : bien dorée, pas brûlée.','Slide the pizza with a floured or semolina-dusted peel onto the stone on the top rack, 1 to 2 min max: golden, not burnt.','Desliza la pizza con una pala enharinada o con sémola sobre la rejilla alta, 1 a 2 min como máximo: dorada, no quemada.','Fai scivolare la pizza con una pala infarinata o con semola sulla griglia alta, 1–2 min al massimo: dorata, non bruciata.'),
      T('Vérifie le dessous 2 ou 3 fois.','Check the underside 2 or 3 times.','Revisa la base 2 o 3 veces.','Controlla il fondo 2 o 3 volte.'),
      T('Une pizza à la fois ; laisse le four remonter en température 3 à 5 min entre deux.','One pizza at a time; let the oven recover 3 to 5 min between pizzas.','Una pizza cada vez; deja que el horno recupere temperatura 3 a 5 min entre una y otra.','Una pizza alla volta; lascia che il forno recuperi 3–5 min tra una e l’altra.')); }
    else if(o.home){
      if(s.support==='perforee') steps.push(T('Préchauffe le four au maximum, sans la plaque.','Preheat the oven to max, without the pan.','Precalienta el horno al máximo, sin la bandeja.','Preriscalda il forno al massimo, senza la teglia.'),T('Ouvre le pâton sur la semoule (ou la farine, excédent secoué), finis de l’étaler sur la plaque à trous, garnis, enfourne sur la grille du bas.','Open the ball on semolina (or flour, excess shaken off), finish stretching it on the perforated pan, top, bake on the bottom rack.','Abre la bola sobre sémola (o harina, sacudiendo el exceso), termina de estirarla sobre la bandeja perforada, cubre y hornea en la rejilla baja.','Apri il panetto sulla semola (o sulla farina, scuotendo l’eccesso), finisci di stenderlo sulla teglia forata, condisci, inforna sulla griglia bassa.'));
      else steps.push(T(`${s.support==='plaque'?'Plaque retournée':'Pierre ou acier'} au tiers inférieur ; préchauffe ${ov.pre} min au maximum.`,`${s.support==='plaque'?'Upturned pan':'Stone or steel'} in the lower third; preheat ${ov.pre} min at max.`,`${s.support==='plaque'?'Bandeja invertida':'Piedra o acero'} en el tercio inferior; precalienta ${ov.pre} min al máximo.`,`${s.support==='plaque'?'Teglia capovolta':'Pietra o acciaio'} nel terzo inferiore; preriscalda ${ov.pre} min al massimo.`),T('Glisse la pizza avec une pelle farinée ou semoulée.','Slide the pizza in with a floured or semolina-dusted peel.','Desliza la pizza con una pala enharinada o con sémola.','Fai scivolare la pizza con una pala infarinata o con semola.'));

    else steps.push(T(`Préchauffe ${ov.pre} min.`,`Preheat ${ov.pre} min.`,`Precalienta ${ov.pre} min.`,`Preriscalda ${ov.pre} min.`),T(`Cuisson ${o.bake[0]} à ${o.bake[1]} min, une pizza à la fois.`,`Bake ${o.bake[0]} to ${o.bake[1]} min, one pizza at a time.`,`Hornea ${o.bake[0]} a ${o.bake[1]} min, una pizza cada vez.`,`Cuoci ${o.bake[0]}–${o.bake[1]} min, una pizza alla volta.`));
  }
  const list=[]; for(let i=0;i<s.n;i++){ const st=r.B+i*ov.cycle; list.push(`<li>${isFoc(s)?T('Plaque','Pan','Bandeja','Teglia'):'Pizza'} ${i+1} : ${T('enfournée','in at','entra a las','in forno alle')} ${whenL(r,st)}, ${T('sortie','out at','sale a las','fuori alle')} ${whenL(r,st+ov.bake)}</li>`); }
  $('bakeH').textContent=fmtLine(s,r.q)+' · '+(ov.foc||ov.pan?ov.temp:s.method==='sg'?'275 °C (525 °F)':L3([o.fr,o.en,o.es,o.it]));
  $('bake').innerHTML=`<div class="two"><div class="box"><h3>${T('Repères','Guide','Referencias','Riferimenti')}</h3><div class="big">${ov.temp}</div><span class="hint">${T(`Préchauffage ${ov.pre} min · environ ${nf(ov.bake,1)} min par ${isFoc(s)?'plaque':'pizza'}`,`Preheat ${ov.pre} min · about ${nf(ov.bake,1)} min per ${isFoc(s)?'pan':'pizza'}`,`Precalentar ${ov.pre} min · unos ${nf(ov.bake,1)} min por ${isFoc(s)?'bandeja':'pizza'}`,`Preriscaldamento ${ov.pre} min · circa ${nf(ov.bake,1)} min per ${isFoc(s)?'teglia':'pizza'}`)}</span><ol>${steps.map(x=>`<li>${x}</li>`).join('')}</ol></div>
    <div class="box"><h3>${T('Enchaînement','Sequence','Secuencia','Sequenza')}</h3><ul>${list.join('')}</ul></div></div>${isFoc(s)||s.method==='sg'?'':`<div class="box" style="margin-top:12px"><h3>${T('Astuces de cuisson','Baking tips','Trucos de horneado','Trucchi di cottura')}</h3><ul><li>${T('<b>Pas de pierre ?</b> Retourne une plaque du four et fais-la chauffer à vide avec le four. Sans rebord, la pizza glisse dessus directement et le métal brûlant saisit le dessous de la pâte.','<b>No stone?</b> Turn a baking sheet upside down and preheat it empty with the oven. With no rim, the pizza slides straight on and the hot metal sears the bottom of the dough.','<b>¿Sin piedra?</b> Da la vuelta a una bandeja del horno y precaliéntala vacía con el horno. Sin borde, la pizza se desliza directamente y el metal caliente sella la base.','<b>Niente pietra?</b> Capovolgi una teglia del forno e scaldala vuota insieme al forno. Senza bordo, la pizza ci scivola sopra e il metallo rovente sigilla il fondo.')}</li><li>${T('<b>Double cuisson</b>, utile pour une pâte très hydratée ou une garniture humide : 4 à 5 min la pâte seule, puis garnis et remets environ 2 min. La pâte gonfle sans le poids ni l’humidité de la garniture.','<b>Two-stage bake</b>, useful for a very wet dough or moist toppings: 4 to 5 min for the dough alone, then top it and bake about 2 more min. The dough rises without the weight and moisture of the toppings.','<b>Doble cocción</b>, útil con una masa muy hidratada o una cobertura húmeda: 4 a 5 min la masa sola, luego cubre y hornea unos 2 min más. La masa sube sin el peso ni la humedad de la cobertura.','<b>Doppia cottura</b>, utile con un impasto molto idratato o un condimento umido: 4–5 min l’impasto da solo, poi condisci e rimetti in forno circa 2 min. L’impasto cresce senza il peso e l’umidità del condimento.')}</li></ul></div>`}`;

    T('<b>Pour 1 à 3 parts</b> : à la poêle à feu moyen, 2 à 3 min, puis quelques gouttes d’eau à côté de la pizza et un couvercle 1 min pour fondre le fromage.','<b>For 1 to 3 slices</b>: in a skillet over medium heat, 2 to 3 min, then a few drops of water beside the pizza and a lid for 1 min to melt the cheese.','<b>Para 1 a 3 porciones</b>: en sartén a fuego medio, 2 a 3 min, luego unas gotas de agua junto a la pizza y una tapa 1 min para fundir el queso.','<b>Per 1–3 fette</b>: in padella a fuoco medio, 2–3 min, poi qualche goccia d’acqua accanto alla pizza e un coperchio per 1 min per sciogliere il formaggio.'),
    T('Focaccia épaisse : quelques minutes de plus. Le centre doit être bien chaud : l’USDA recommande 74 °C à cœur pour les restes.','Thick focaccia: a few more minutes. The centre must be hot: USDA recommends 74 °C (165 °F) inside for leftovers.','Focaccia gruesa: unos minutos más. El centro debe quedar bien caliente: el USDA recomienda 74 °C en el centro para las sobras.','Focaccia alta: qualche minuto in più. Il centro deve essere ben caldo: l’USDA raccomanda 74 °C al cuore per gli avanzi.'),
    T('Évite le micro-ondes : la pâte devient molle puis caoutchouteuse.','Avoid the microwave: the crust turns soft, then rubbery.','Evita el microondas: la masa se ablanda y luego queda gomosa.','Evita il microonde: l’impasto diventa molle, poi gommoso.')])}
  ${sec(T('Pâtons crus au frigo','Raw dough balls in the fridge','Bolas crudas en la nevera','Panetti crudi in frigo'),[

    T('Le jour même : sors-le 1 à 2 h (jusqu’à 3 h) avant d’étaler, jusqu’à ce qu’il soit souple et un peu gonflé.','On the day: take it out 1 to 2 h (up to 3 h) before stretching, until soft and slightly puffy.','El mismo día: sácala 1 a 2 h (hasta 3 h) antes de estirar, hasta que esté suave y algo hinchada.','Il giorno stesso: toglilo 1–2 h (fino a 3 h) prima di stenderlo, finché è morbido e un po’ gonfio.'),
    T('Pressé : 3 à 4 h à température ambiante, couvert. Évite le micro-ondes, qui cuit la pâte.','In a hurry: 3 to 4 h at room temperature, covered. Avoid the microwave, which cooks the dough.','Con prisa: 3 a 4 h a temperatura ambiente, tapada. Evita el microondas, que cuece la masa.','Di fretta: 3–4 h a temperatura ambiente, coperto. Evita il microonde, che cuoce l’impasto.'),
    T('Si la pâte se rétracte quand tu l’étales, laisse-la reposer 15 à 20 min de plus.','If the dough shrinks back as you stretch it, let it rest 15 to 20 min more.','Si la masa se encoge al estirarla, déjala reposar 15 a 20 min más.','Se l’impasto si ritira quando lo stendi, lascialo riposare altri 15–20 min.')])}
  ${sec('Focaccia',[

  </div>`;
