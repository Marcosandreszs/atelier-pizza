  a:['À côté des valeurs réglables (hydratation, sel, levure…), « ✓ Recommandé » signale que la valeur est celle de la recette chargée, ou à défaut celle de la méthode, et qu’elle est dans la plage conseillée. Si cette valeur sort de la plage, l’appli affiche « ✓ Valeur de la recette » (ou « de la méthode ») et l’avertissement « hors plage » reste visible. Si tu as modifié la valeur, le bouton la remet d’un clic.','Next to adjustable values (hydration, salt, yeast…), “✓ Recommended” means the value is the loaded recipe’s, or otherwise the method’s, and that it is within the advised range. If that value is out of range, the app shows “✓ Recipe value” (or “Method value”) and the “out of range” warning stays visible. If you changed the value, the button restores it in one click.','Junto a los valores ajustables (hidratación, sal, levadura…), «✓ Recomendado» indica que el valor es el de la receta cargada o, si no, el del método, y que está dentro del rango aconsejado. Si ese valor queda fuera del rango, la app muestra «✓ Valor de la receta» (o «del método») y el aviso «fuera del rango» sigue visible. Si cambiaste el valor, el botón lo restablece con un clic.','Accanto ai valori regolabili (idratazione, sale, lievito…), «✓ Consigliato» indica che il valore è quello della ricetta caricata, o altrimenti del metodo, e che è nell’intervallo consigliato. Se quel valore è fuori intervallo, l’app mostra «✓ Valore della ricetta» (o «del metodo») e l’avviso «fuori intervallo» resta visibile. Se hai cambiato il valore, il pulsante lo ripristina con un clic.','Ao lado dos valores ajustáveis (hidratação, sal, fermento…), “✓ Recomendado” indica que o valor é o da receita carregada, ou senão o do método, e que está dentro da faixa aconselhada. Se esse valor estiver fora da faixa, o app mostra “✓ Valor da receita” (ou “Valor do método”) e o aviso “fora da faixa” continua visível. Se você mudou o valor, o botão o restaura com um clique.','在可调数值（含水量、盐、酵母……）旁边，“✓ 推荐”表示该数值来自已载入的配方，没有配方时来自方法，并且在建议范围内。如果该数值超出范围，应用会显示“✓ 配方数值”（或“方法数值”），“超出范围”的提示也会保留。如果你改过数值，点一下按钮即可恢复。']},
 {c:'rec',q:['À quoi sert la marge si la pâte colle ?','What is the sticky-dough margin for?','¿Para qué sirve el margen si la masa se pega?','A cosa serve il margine se l’impasto si attacca?','Para que serve a margem de massa grudenta?','“面团粘手余量”有什么用？'],
  a:['Rubrique 3 : la case ajoute jusqu’à 1 h 30 après le pétrissage, pour laisser reposer et repétrir une pâte qui colle encore. L’heure de départ recule d’autant. Si la pâte ne colle pas, ce temps devient un simple repos couvert.','Section 3: the box adds up to 1 h 30 after kneading, to rest and re-knead a dough that still sticks. The start time moves earlier accordingly. If the dough does not stick, that time is just a covered rest.','Sección 3: la casilla añade hasta 1 h 30 tras el amasado, para dejar reposar y volver a amasar una masa que aún se pega. La hora de inicio se adelanta en consecuencia. Si la masa no se pega, ese tiempo es un simple reposo tapado.','Sezione 3: la casella aggiunge fino a 1 h 30 dopo l’impasto, per far riposare e reimpastare un impasto che si attacca ancora. L’ora di partenza si anticipa di conseguenza. Se l’impasto non si attacca, quel tempo diventa un semplice riposo coperto.','Seção 3: a caixa acrescenta até 1 h 30 depois da sova, para deixar descansar e sovar de novo uma massa que ainda gruda. O horário de início é antecipado na mesma medida. Se a massa não grudar, esse tempo é só um descanso coberto.','第 3 部分：勾选后会在揉面后增加最多 1 小时 30 分，用来静置并重新揉制仍然粘手的面团。开始时间会相应提前。如果面团不粘，这段时间就只是盖好静置。']},
 {c:'rec',q:['Eau tiède ou à température ambiante ?','Warm or room-temperature water?','¿Agua tibia o a temperatura ambiente?','Acqua tiepida o a temperatura ambiente?','Água morna ou em temperatura ambiente?','温水还是室温水？'],
  a:['Par défaut, l’appli calcule une eau tiède selon la température de la cuisine. La case « Eau à température ambiante » (rubrique 3) remplace ce calcul, comme dans « Ma pizza ».','By default the app works out warm water from the kitchen temperature. The “Room-temperature water” box (section 3) replaces that, as in “My pizza”.','Por defecto la app calcula agua tibia según la temperatura de la cocina. La casilla «Agua a temperatura ambiente» (sección 3) lo sustituye, como en «Mi pizza».','Di base l’app calcola un’acqua tiepida secondo la temperatura della cucina. La casella «Acqua a temperatura ambiente» (sezione 3) la sostituisce, come in «La mia pizza».','Por padrão, o app calcula água morna a partir da temperatura da cozinha. A caixa “Água em temperatura ambiente” (seção 3) substitui isso, como em “Minha pizza”.','默认情况下，应用根据厨房温度计算温水温度。勾选“室温水”（第 3 部分）后改为室温水，就像“我的披萨”那样。']},
 {c:'rec',q:['Que fait la case « Huiler les bords au pinceau » ?','What does “Brush the rim with oil” do?','¿Qué hace la casilla «Pintar los bordes con aceite»?','Cosa fa la casella «Spennellare i bordi con olio»?','O que faz “Pincelar a borda com azeite”?','“饼边刷油”有什么作用？'],
  a:['Rubrique 5 : elle ajoute l’huile des bords aux quantités et au coût, l’étape au rétroplanning et le geste dans « Garnir la pizza ». La croûte dore mieux.','Section 5: it adds the rim oil to quantities and cost, the step to the schedule and the gesture to “Topping the pizza”. The crust browns better.','Sección 5: añade el aceite de los bordes a cantidades y coste, el paso a la planificación y el gesto a «Cubrir la pizza». La corteza se dora mejor.','Sezione 5: aggiunge l’olio dei bordi a quantità e costo, il passaggio al programma e il gesto in «Condire la pizza». La crosta si dora meglio.','Seção 5: acrescenta o azeite da borda às quantidades e ao custo, a etapa ao cronograma e o gesto em “Cobrir a pizza”. A borda doura melhor.','第 5 部分：把饼边用油计入用量和成本，在时间表中加上这一步，并在“给披萨铺料”中加入这个动作。饼边上色更好。']},
 {c:'ing',q:['Combien de calories dans une pizza ?','How many calories are in a pizza?','¿Cuántas calorías tiene una pizza?','Quante calorie ha una pizza?','Quantas calorias tem uma pizza?','一张披萨有多少卡路里？'],
  a:['La rubrique 6, Quantités calculées, donne, dans un encadré, une estimation pour la pizza complète (pâte, sauce, fromage et garniture) : par pizza, par part et en tout, avec le détail pâte d’un côté, sauce et garniture de l’autre. Si la garniture est exclue, l’encadré l’indique et ne compte que la pâte. Les valeurs viennent de tables de composition des aliments (moyennes arrondies) : c’est un ordre de grandeur. Les ingrédients que l’appli ne connaît pas sont signalés « non comptés ».','Section 6, Calculated quantities, gives an estimate per pizza, per slice and in all, from the dough, base and topping amounts. Values come from food composition tables (rounded averages): it is a ballpark figure. Ingredients the app does not know are flagged “not counted”.','La sección 6, Cantidades calculadas, da una estimación por pizza, por porción y en total, a partir de las cantidades de masa, base y cobertura. Los valores vienen de tablas de composición de alimentos (medias redondeadas): es un orden de magnitud. Los ingredientes que la app no conoce se marcan «no contados».','La sezione 6, Quantità calcolate, dà una stima per pizza, per fetta e in tutto, dalle quantità di impasto, base e condimento. I valori vengono da tabelle di composizione degli alimenti (medie arrotondate): è un ordine di grandezza. Gli ingredienti che l’app non conosce sono segnalati «non contati».','A seção 6, Quantidades calculadas, dá uma estimativa por pizza, por fatia e no total, a partir das quantidades de massa, base e cobertura. Os valores vêm de tabelas de composição de alimentos (médias arredondadas): é uma ordem de grandeza. Os ingredientes que o app não conhece são indicados como “não contados”.','第 6 部分“计算出的用量”会根据面团、酱底和配料的用量，估算每张披萨、每片和总计的热量。数值来自食物成分表（四舍五入的平均值）：只是一个大致数字。应用不认识的原料会标为“未计入”。']},
 {c:'app',q:['Qu’est-ce que le mode simple ?','What is simple mode?','¿Qué es el modo sencillo?','Cos’è la modalità semplice?','O que é o modo simples?','什么是简易模式？'],
  a:['Une version allégée de l’appli, en 4 questions : combien de pizzas, quand tu veux manger (dans 3 h, ce soir ou demain), ton four et ta garniture. L’appli choisit pour toi la méthode et des réglages éprouvés, arrondit les quantités, et n’affiche que ce qu’il te faut, ton horaire et la cuisson. « Mode complet », en haut, montre tous les réglages (farine, hydratation, levure, autres méthodes, carnet de recettes…). Tu passes de l’un à l’autre sans rien perdre.','A lighter version of the app, in 4 questions: how many pizzas, when you want to eat (in 3 h, tonight or tomorrow), your oven and your toppings. The app picks the method and proven settings for you, rounds the amounts and shows only what you need, your schedule and baking. “Full mode” at the top shows every setting (flour, hydration, yeast, other methods, recipe book…). Switch back and forth without losing anything.','Una versión simplificada de la app, en 4 preguntas: cuántas pizzas, cuándo quieres comer (en 3 h, esta noche o mañana), tu horno y tu cobertura. La app elige por ti el método y ajustes probados, redondea las cantidades y solo muestra lo que necesitas, tu horario y la cocción. «Modo completo», arriba, muestra todos los ajustes (harina, hidratación, levadura, otros métodos, recetario…). Pasas de uno a otro sin perder nada.','Una versione semplificata dell’app, in 4 domande: quante pizze, quando vuoi mangiare (tra 3 h, stasera o domani), il tuo forno e il tuo condimento. L’app sceglie per te il metodo e impostazioni collaudate, arrotonda le quantità e mostra solo cosa ti serve, il programma e la cottura. «Modalità completa», in alto, mostra tutte le impostazioni (farina, idratazione, lievito, altri metodi, ricettario…). Passi dall’una all’altra senza perdere nulla.','Uma versão mais leve do app, em 4 perguntas: quantas pizzas, quando você quer comer (em 3 h, hoje à noite ou amanhã), seu forno e sua cobertura. O app escolhe para você o método e ajustes testados, arredonda as quantidades e mostra só o que você precisa, seu cronograma e o cozimento. “Modo completo”, no topo, mostra todos os ajustes (farinha, hidratação, fermento, outros métodos, caderno de receitas…). Passe de um para o outro sem perder nada.','应用的精简版，只有 4 个问题：做几张披萨、什么时候吃（3 小时后、今晚或明天）、你的烤箱和你的配料。应用会替你选择方法和经过验证的设置，把用量取整，只显示你需要的材料、时间表和烘烤方法。顶部的“完整模式”显示所有设置（面粉、含水量、酵母、其他方法、配方本……）。两种模式可以随时切换，不会丢失任何内容。']},
 {c:'app',q:['Comment avoir l’appli sur mon téléphone ?','How do I get the app on my phone?','¿Cómo tener la app en el móvil?','Come avere l’app sul telefono?','Como ter o app no celular?','怎样把应用装到手机上？'],
  a:['Ouvre https://marcosandreszs.github.io/atelier-pizza/ dans le navigateur du téléphone. iPhone : bouton Partager, puis « Sur l’écran d’accueil ». Android (Chrome) : menu ⋮, puis « Installer l’appli » ou « Ajouter à l’écran d’accueil ». L’icône ouvre l’appli en plein écran, et elle fonctionne sans connexion une fois ouverte une première fois. Sur iPhone, l’appli de l’écran d’accueil garde ses propres recettes, séparées de Safari : utilise la sauvegarde pour passer de l’un à l’autre.','Open https://marcosandreszs.github.io/atelier-pizza/ in the phone’s browser. iPhone: Share button, then “Add to Home Screen”. Android (Chrome): ⋮ menu, then “Install app” or “Add to Home screen”. The icon opens the app full screen, and it works offline once opened a first time. On iPhone, the home-screen app keeps its own recipes, separate from Safari: use the backup to move between them.','Abre https://marcosandreszs.github.io/atelier-pizza/ en el navegador del móvil. iPhone: botón Compartir y luego «Añadir a pantalla de inicio». Android (Chrome): menú ⋮ y luego «Instalar aplicación» o «Añadir a pantalla de inicio». El icono abre la app a pantalla completa, y funciona sin conexión una vez abierta por primera vez. En iPhone, la app de la pantalla de inicio guarda sus propias recetas, separadas de Safari: usa la copia para pasar de una a otra.','Apri https://marcosandreszs.github.io/atelier-pizza/ nel browser del telefono. iPhone: pulsante Condividi, poi «Aggiungi alla schermata Home». Android (Chrome): menu ⋮, poi «Installa app» o «Aggiungi a schermata Home». L’icona apre l’app a schermo intero, e funziona anche offline dopo la prima apertura. Su iPhone, l’app della schermata Home ha le sue ricette, separate da Safari: usa il backup per passare dall’una all’altra.','Abra https://marcosandreszs.github.io/atelier-pizza/ no navegador do celular. iPhone: botão Compartilhar, depois “Adicionar à Tela de Início”. Android (Chrome): menu ⋮, depois “Instalar app” ou “Adicionar à tela inicial”. O ícone abre o app em tela cheia, e ele funciona sem internet depois de aberto uma primeira vez. No iPhone, o app da tela de início guarda as próprias receitas, separadas do Safari: use o backup para passar de um para o outro.','在手机浏览器中打开 https://marcosandreszs.github.io/atelier-pizza/ 。iPhone：点“分享”按钮，再点“添加到主屏幕”。Android（Chrome）：点 ⋮ 菜单，再点“安装应用”或“添加到主屏幕”。图标会以全屏打开应用，首次打开后即可离线使用。在 iPhone 上，主屏幕应用的配方与 Safari 中的分开保存：请用备份在两者之间转移。']},
 {c:'app',q:['Je me suis trompé : comment revenir en arrière ?','I made a mistake: how do I go back?','Me equivoqué: ¿cómo vuelvo atrás?','Ho sbagliato: come torno indietro?','Errei: como voltar atrás?','我操作错了：怎样撤回？'],
  a:['Clique sur « ↶ Annuler », dans la barre du haut : l’appli revient à l’état d’avant, une modification à la fois, jusqu’à 30 (Reprendre ma dernière fournée, Nouvelle fournée, choix de recette, nombre, diamètre, Je commence maintenant…). Un message indique ce qui a été annulé. « ↷ » rétablit. Sur ordinateur, Ctrl+Z et Ctrl+Y marchent aussi (Cmd+Z et Cmd+Maj+Z sur Mac). Le carnet (enregistrer ou effacer une recette) n’est pas concerné. L’historique repart à zéro quand tu rouvres l’appli.','Click “↶ Undo” in the top bar: the app goes back to the previous state, one change at a time, up to 30 (Resume my last bake, New bake, recipe choice, number, diameter, I’m starting now…). A message says what was undone. “↷” redoes. On a computer, Ctrl+Z and Ctrl+Y also work (Cmd+Z and Cmd+Shift+Z on Mac). The recipe book (saving or deleting a recipe) is not affected. History starts over when you reopen the app.','Pulsa «↶ Deshacer» en la barra de arriba: la app vuelve al estado anterior, un cambio cada vez, hasta 30 (Retomar mi última horneada, Nueva horneada, elección de receta, número, diámetro, Empiezo ahora…). Un mensaje indica lo que se deshizo. «↷» rehace. En ordenador, Ctrl+Z y Ctrl+Y también funcionan (Cmd+Z y Cmd+Mayús+Z en Mac). El recetario (guardar o borrar una receta) no se ve afectado. El historial empieza de cero al volver a abrir la app.','Clicca «↶ Annulla» nella barra in alto: l’app torna allo stato precedente, una modifica alla volta, fino a 30 (Riprendere l’ultima infornata, Nuova infornata, scelta della ricetta, numero, diametro, Comincio adesso…). Un messaggio indica cosa è stato annullato. «↷» ripristina. Sul computer funzionano anche Ctrl+Z e Ctrl+Y (Cmd+Z e Cmd+Maiusc+Z su Mac). Il ricettario (salvare o eliminare una ricetta) non è interessato. La cronologia riparte da zero quando riapri l’app.','Clique em “↶ Desfazer” na barra de cima: o app volta ao estado anterior, uma alteração de cada vez, até 30 (Retomar minha última fornada, Nova fornada, escolha de receita, número, diâmetro, Vou começar agora…). Uma mensagem diz o que foi desfeito. “↷” refaz. No computador, Ctrl+Z e Ctrl+Y também funcionam (Cmd+Z e Cmd+Shift+Z no Mac). O caderno de receitas (salvar ou apagar uma receita) não é afetado. O histórico recomeça quando você reabre o app.','点击顶部栏的“↶ 撤销”：应用会回到上一个状态，每次撤销一项更改，最多 30 项（继续我上一批、新的一批、选择配方、数量、直径、我现在开始……）。会有提示说明撤销了什么。“↷”用于重做。在电脑上也可以用 Ctrl+Z 和 Ctrl+Y（Mac 上为 Cmd+Z 和 Cmd+Shift+Z）。配方本（保存或删除配方）不受影响。重新打开应用后，历史记录会重新开始。']},
 {c:'rec',q:['Comment avoir des quantités rondes (650 g plutôt que 643 g) ?','How do I get round quantities (650 g rather than 643 g)?','¿Cómo tener cantidades redondas (650 g en vez de 643 g)?','Come avere quantità tonde (650 g invece di 643 g)?','Como ter quantidades redondas (650 g em vez de 643 g)?','怎样得到整数用量（650 克而不是 643 克）？'],
  a:['Dans la rubrique 6, Quantités calculées, clique sur « Arrondir les quantités ». L’appli arrondit la farine totale à un chiffre rond (à 100, 50, 25 ou 10 g près, en restant à moins de 2 % d’écart), puis recalcule l’eau, le pré-ferment, le sel et la levure dans les mêmes proportions : l’hydratation et le sel ne changent pas. Les gros poids sont affichés à 5 g près ; le sel et la levure restent précis. Les pâtons pèsent un peu plus ou un peu moins (l’écart est indiqué). Clique à nouveau pour revenir aux valeurs exactes.','In section 6, Calculated quantities, click “Round quantities”. The app rounds the total flour to a round number (to the nearest 100, 50, 25 or 10 g, staying within 2%), then recalculates water, preferment, salt and yeast in the same proportions: hydration and salt do not change. Large weights are shown to the nearest 5 g; salt and yeast stay precise. Dough balls weigh slightly more or less (the difference is shown). Click again to go back to exact values.','En la sección 6, Cantidades calculadas, pulsa «Redondear las cantidades». La app redondea la harina total a una cifra redonda (a 100, 50, 25 o 10 g, sin pasar del 2 % de diferencia) y recalcula el agua, el prefermento, la sal y la levadura en las mismas proporciones: la hidratación y la sal no cambian. Los pesos grandes se muestran de 5 en 5 g; la sal y la levadura siguen precisas. Las bolas pesan un poco más o menos (se indica la diferencia). Pulsa de nuevo para volver a los valores exactos.','Nella sezione 6, Quantità calcolate, clicca «Arrotondare le quantità». L’app arrotonda la farina totale a un numero tondo (ai 100, 50, 25 o 10 g, restando entro il 2%), poi ricalcola acqua, prefermento, sale e lievito nelle stesse proporzioni: idratazione e sale non cambiano. I pesi grandi sono mostrati ai 5 g; sale e lievito restano precisi. I panetti pesano un po’ di più o di meno (la differenza è indicata). Clicca di nuovo per tornare ai valori esatti.','Na seção 6, Quantidades calculadas, clique em “Arredondar as quantidades”. O app arredonda a farinha total para um número redondo (à centena, ao 50, ao 25 ou ao 10 g mais próximo, sem passar de 2%) e recalcula água, pré-fermento, sal e fermento nas mesmas proporções: a hidratação e o sal não mudam. Os pesos grandes aparecem de 5 em 5 g; o sal e o fermento continuam precisos. As bolinhas ficam um pouco mais pesadas ou mais leves (a diferença é indicada). Clique de novo para voltar aos valores exatos.','在第 6 部分“计算出的用量”中点击“用量取整”。应用会把面粉总量取整（取到最接近的 100、50、25 或 10 克，偏差不超过 2%），再按相同比例重新计算水、预发酵、盐和酵母：含水量和盐比例不变。较大的重量显示到 5 克；盐和酵母保持精确。面团球会略重或略轻（会显示差值）。再点一次恢复精确值。']},
 {c:'rec',q:['Je n’ai qu’une certaine quantité de farine : comment faire ?','I only have a certain amount of flour: what do I do?','Solo tengo cierta cantidad de harina: ¿cómo hago?','Ho solo una certa quantità di farina: come faccio?','Só tenho uma certa quantidade de farinha: o que faço?','我只有一定量的面粉：怎么办？'],
  a:['À l’étape 1 de la rubrique 2, choisis « Je pars de : la farine que j’ai » et entre son poids. L’appli calcule la pâte totale et propose plusieurs répartitions (par exemple 3 pizzas de 40 cm ou 5 de 33 cm). Tu peux aussi régler toi-même le nombre et la taille : le poids des pâtons suit et toute la pâte est utilisée. Elle te dit si la pâte sera plus épaisse ou plus fine que d’habitude.','In step 1 of section 2, choose “I start from: the flour I have” and enter its weight. The app works out the total dough and suggests several splits (for example 3 pizzas of 40 cm or 5 of 33 cm). You can also set the number and size yourself: ball weight follows and all the dough is used. It tells you if the crust will be thicker or thinner than usual.','En el paso 1 de la sección 2, elige «Parto de: la harina que tengo» e indica su peso. La app calcula la masa total y propone varios repartos (por ejemplo 3 pizzas de 40 cm o 5 de 33 cm). También puedes ajustar tú el número y el tamaño: el peso de las bolas se adapta y se usa toda la masa. Te avisa si la masa quedará más gruesa o más fina de lo habitual.','Al passo 1 della sezione 2, scegli «Parto da: la farina che ho» e inserisci il peso. L’app calcola l’impasto totale e propone diverse suddivisioni (per esempio 3 pizze da 40 cm o 5 da 33 cm). Puoi anche regolare tu numero e misura: il peso dei panetti si adegua e si usa tutto l’impasto. Ti dice se l’impasto sarà più spesso o più sottile del solito.','Na etapa 1 da seção 2, escolha “Começo por: a farinha que eu tenho” e informe o peso dela. O app calcula a massa total e sugere várias divisões (por exemplo 3 pizzas de 40 cm ou 5 de 33 cm). Você também pode ajustar o número e o tamanho: o peso das bolinhas acompanha e toda a massa é usada. Ele avisa se a massa ficará mais grossa ou mais fina que o normal.','在第 2 部分第 1 步，选择“我从这里出发：我手头的面粉”，填写面粉重量。应用会算出面团总量，并给出几种分法（例如 3 张 40 厘米或 5 张 33 厘米）。你也可以自己设定数量和尺寸：面团球重量随之变化，面团全部用完。如果饼皮会比平常厚或薄，应用会提示你。']},
 {c:'rec',q:['J’ai déjà lancé mon poolish, ou ma pâte est déjà faite : que faire ?','I already started my poolish, or my dough is already made: what now?','Ya empecé el poolish, o la masa ya está hecha: ¿qué hago?','Ho già avviato il poolish, o l’impasto è già fatto: che faccio?','Já comecei meu poolish, ou minha massa já está feita: e agora?','我已经开始做波兰种，或面团已经做好了：怎么办？'],
  a:['Dans la rubrique 1, « Où en es-tu ? » : « Pré-ferment déjà lancé » (indique quand), « Pâte faite, en levée » ou « Pâtons déjà faits ». Le rétroplanning commence alors à l’étape suivante, sans te dire qu’il est trop tard pour ce qui est déjà fait. Avec une pâte ou des pâtons faits, les ingrédients ne bougent plus : tu peux encore changer d’avis à l’étape 1 et faire, par exemple, 4 petites pizzas au lieu de 2 grandes ; l’appli calcule le poids et la taille des pâtons, et ajoute une étape pour les rebouler si besoin.','In section 1, “Where are you at?”: “Preferment already started” (say when), “Dough made, rising” or “Dough balls already made”. The schedule then starts at the next step, without telling you it is too late for what is done. With dough or balls made, ingredients are fixed: you can still change your mind in step 1 and make, say, 4 small pizzas instead of 2 large; the app works out ball weight and size, and adds a reshaping step if needed.','En la sección 1, «¿En qué punto estás?»: «Prefermento ya empezado» (indica cuándo), «Masa hecha, levando» o «Bolas ya hechas». La planificación empieza entonces en el paso siguiente, sin decirte que es tarde para lo que ya está hecho. Con la masa o las bolas hechas, los ingredientes ya no cambian: aún puedes cambiar de idea en el paso 1 y hacer, por ejemplo, 4 pizzas pequeñas en vez de 2 grandes; la app calcula el peso y el tamaño de las bolas y añade un paso para volver a bolearlas si hace falta.','Nella sezione 1, «A che punto sei?»: «Prefermento già avviato» (indica quando), «Impasto fatto, in lievitazione» o «Panetti già fatti». Il programma parte allora dal passaggio successivo, senza dirti che è tardi per ciò che è già fatto. Con impasto o panetti fatti, gli ingredienti non cambiano più: puoi ancora cambiare idea al passo 1 e fare, per esempio, 4 pizze piccole invece di 2 grandi; l’app calcola peso e misura dei panetti e aggiunge un passaggio per riformarli se serve.','Na seção 1, “Em que ponto você está?”: “Pré-fermento já iniciado” (diga quando), “Massa feita, crescendo” ou “Bolinhas já feitas”. O cronograma começa então na etapa seguinte, sem dizer que é tarde demais para o que já foi feito. Com massa ou bolinhas feitas, os ingredientes ficam fixos: você ainda pode mudar de ideia na etapa 1 e fazer, por exemplo, 4 pizzas pequenas em vez de 2 grandes; o app calcula o peso e o tamanho das bolinhas e acrescenta uma etapa de boleamento se for preciso.','在第 1 部分“你进行到哪一步了？”中选择：“预发酵已开始”（填写时间）、“面团已做好，正在发酵”或“面团球已做好”。时间表会从下一步开始，不会再提示已完成的步骤来不及。面团或面团球已做好时，原料就固定了：你仍可以在第 1 步改主意，比如做 4 张小披萨而不是 2 张大的；应用会计算面团球的重量和尺寸，并在需要时添加重新滚圆的步骤。']},
 {c:'rec',q:['Pourquoi la recette ne change-t-elle pas mon nombre de pizzas ?','Why doesn’t a recipe change my number of pizzas?','¿Por qué la receta no cambia mi número de pizzas?','Perché la ricetta non cambia il mio numero di pizze?','Por que uma receita não muda meu número de pizzas?','为什么配方不会改变我的披萨数量？'],
  a:['Dans la rubrique 2, tu choisis d’abord le nombre et le format de tes pizzas, puis la méthode, puis la recette. La recette n’apporte que ses proportions (eau, sel, levure, farine, durées) ; les quantités sont recalculées pour ton nombre de pizzas et ta taille, et le poids des pâtons suit la surface. Seules les focaccias passent en plaque.','In section 2 you pick the number and size of your pizzas first, then the method, then the recipe. The recipe only brings its proportions (water, salt, yeast, flour, times); amounts are recalculated for your number and size, and ball weight follows the surface. Only focaccias switch to a pan.','En la sección 2 eliges primero el número y el formato de tus pizzas, luego el método y después la receta. La receta solo aporta sus proporciones (agua, sal, levadura, harina, tiempos); las cantidades se recalculan para tu número y tamaño, y el peso de las bolas sigue la superficie. Solo las focaccias pasan a bandeja.','Nella sezione 2 scegli prima numero e formato delle pizze, poi il metodo, poi la ricetta. La ricetta porta solo le sue proporzioni (acqua, sale, lievito, farina, tempi); le quantità vengono ricalcolate per il tuo numero e la tua misura, e il peso dei panetti segue la superficie. Solo le focacce passano in teglia.','Na seção 2, você escolhe primeiro o número e o tamanho das pizzas, depois o método e depois a receita. A receita traz só as proporções (água, sal, fermento, farinha, tempos); as quantidades são recalculadas para o seu número e tamanho, e o peso das bolinhas acompanha a superfície. Só as focaccias passam para uma assadeira.','在第 2 部分，你先选择披萨数量和尺寸，再选方法，最后选配方。配方只提供比例（水、盐、酵母、面粉、时间）；用量会按你的数量和尺寸重新计算，面团球重量随面积变化。只有佛卡夏会改成烤盘。']},
 {c:'rec',q:['Pourquoi la température de la cuisine revient à 20 °C ?','Why does the kitchen temperature go back to 20 °C?','¿Por qué la temperatura de la cocina vuelve a 20 °C?','Perché la temperatura della cucina torna a 20 °C?','Por que a temperatura da cozinha volta para 20 °C?','为什么厨房温度会变回 20 °C？'],
  a:['C’est une donnée du jour, pas de la recette : elle revient à 20 °C à chaque ouverture, et charger une recette ne la change pas. Règle-la selon ta cuisine ; le bouton « Remettre à 20 °C » la réinitialise.','It is a condition of the day, not of the recipe: it goes back to 20 °C each time you open the app, and loading a recipe does not change it. Set it for your kitchen; the “Reset to 20 °C” button resets it.','Es un dato del día, no de la receta: vuelve a 20 °C cada vez que abres la app y cargar una receta no la cambia. Ajústala según tu cocina; el botón «Volver a 20 °C» la restablece.','È un dato del giorno, non della ricetta: torna a 20 °C a ogni apertura e caricare una ricetta non la cambia. Regolala secondo la tua cucina; il pulsante «Torna a 20 °C» la reimposta.','É uma condição do dia, não da receita: ela volta para 20 °C cada vez que você abre o app, e carregar uma receita não a altera. Ajuste-a para a sua cozinha; o botão “Voltar para 20 °C” a restaura.','这是当天的条件，不属于配方：每次打开应用都会恢复为 20 °C，载入配方也不会改变它。请按你的厨房设置；“恢复为 20 °C”按钮可以重置。']},
 {c:'save',q:['Comment garder l’appli et ne rien perdre ?','How do I keep the app and lose nothing?','¿Cómo conservo la app sin perder nada?','Come conservo l’app senza perdere nulla?','Como manter o app sem perder nada?','怎样保留应用、不丢失任何内容？'],
  a:['Range le fichier « Atelier Pizza.html » dans un dossier fixe, ajoute-le aux favoris, et sauvegarde tes changements dans un fichier .json après chaque séance. Tout est expliqué dans la fenêtre « Utiliser l’appli » : <button type="button" class="mini" data-openuse>Ouvrir</button>','Keep the file “Atelier Pizza.html” in a fixed folder, bookmark it, and save your changes to a .json file after each session. Everything is explained in the “Using the app” window: <button type="button" class="mini" data-openuse>Open</button>','Guarda el archivo «Atelier Pizza.html» en una carpeta fija, añádelo a favoritos y guarda tus cambios en un archivo .json tras cada sesión. Todo se explica en la ventana «Usar la app»: <button type="button" class="mini" data-openuse>Abrir</button>','Tieni il file «Atelier Pizza.html» in una cartella fissa, aggiungilo ai preferiti e salva le modifiche in un file .json dopo ogni sessione. Tutto è spiegato nella finestra «Usare l’app»: <button type="button" class="mini" data-openuse>Apri</button>','Guarde o arquivo “Atelier Pizza.html” numa pasta fixa, adicione aos favoritos e salve suas alterações num arquivo .json depois de cada sessão. Tudo é explicado na janela “Usar o app”: <button type="button" class="mini" data-openuse>Abrir</button>','把“Atelier Pizza.html”文件放在固定的文件夹里，加入书签，每次使用后把更改保存到 .json 文件。“使用说明”窗口里有详细说明：<button type="button" class="mini" data-openuse>打开</button>']},
 {c:'app',q:['Comment chercher dans l’appli ?','How do I search the app?','¿Cómo busco en la app?','Come cerco nell’app?','Como buscar no app?','怎样在应用中搜索？'],
  a:['La loupe « Rechercher », en haut, cherche dans les recettes (titres et notes), les méthodes, la FAQ, les étapes du rétroplanning et les titres des rubriques. Clique sur un résultat pour y aller ; Entrée ouvre le premier.','The “Search” magnifier at the top looks through recipes (titles and notes), methods, the FAQ, schedule steps and section titles. Click a result to go there; Enter opens the first one.','La lupa «Buscar», arriba, busca en las recetas (títulos y notas), los métodos, las preguntas frecuentes, los pasos de la planificación y los títulos de las secciones. Pulsa un resultado para ir allí; Intro abre el primero.','La lente «Cerca», in alto, cerca nelle ricette (titoli e note), nei metodi, nelle domande frequenti, nei passaggi del programma e nei titoli delle sezioni. Clicca su un risultato per andarci; Invio apre il primo.','A lupa “Buscar”, no topo, procura nas receitas (títulos e anotações), nos métodos, nas perguntas frequentes, nas etapas do cronograma e nos títulos das seções. Clique num resultado para ir até ele; Enter abre o primeiro.','顶部的“搜索”放大镜会在配方（标题和笔记）、方法、常见问题、时间表步骤和各部分标题中查找。点击结果即可跳转；按回车打开第一个结果。']},
 {c:'site',q:['Comment changer la langue ou le pays ?','How do I change the language or country?','¿Cómo cambio el idioma o el país?','Come cambio lingua o paese?','Como mudar o idioma ou o país?','怎样更改语言或国家？'],
  a:['En haut de la page : la langue (français, anglais, espagnol, italien, portugais, chinois) traduit tous les textes ; le pays règle la devise, les farines vendues sur place et les unités. On peut combiner, par exemple l’italien avec les farines du Canada.','At the top of the page: the language (French, English, Spanish, Italian, Portuguese, Chinese) translates all texts; the country sets the currency, local flours and units. You can mix them, for example Italian with Canadian flours.','Arriba de la página: el idioma (francés, inglés, español, italiano, portugués, chino) traduce todos los textos; el país fija la moneda, las harinas locales y las unidades. Se pueden combinar, por ejemplo italiano con harinas de Canadá.','In alto nella pagina: la lingua (francese, inglese, spagnolo, italiano, portoghese, cinese) traduce tutti i testi; il paese imposta la valuta, le farine locali e le unità. Si possono combinare, per esempio l’italiano con le farine del Canada.','No topo da página: o idioma (francês, inglês, espanhol, italiano, português, chinês) traduz todos os textos; o país define a moeda, as farinhas locais e as unidades. Você pode combiná-los, por exemplo português com as farinhas italianas.','在页面顶部：语言（法语、英语、西班牙语、意大利语、葡萄牙语、中文）会翻译所有文字；国家决定货币、当地面粉和单位。两者可以自由组合，例如中文界面配意大利面粉。']},
 {c:'hand',q:['Ma pâte colle : j’ajoute de la farine ?','My dough is sticky: should I add flour?','La masa se pega: ¿añado harina?','L’impasto è appiccicoso: aggiungo farina?','Minha massa está grudenta: devo acrescentar farinha?','面团粘手：要加面粉吗？'],
  a:['Non. Ajouter de la farine change ta recette : à 70 % d’hydratation, 100 g de farine en plus pour 1 kg de farine font tomber la pâte vers 64 %. Elle devient plus dense, plus sèche après cuisson, avec des zones compactes. Ta pâte ne contient pas trop d’eau, elle manque de temps : la farine met plusieurs dizaines de minutes à absorber l’eau. Laisse reposer 15 à 20 min, puis fais des rabats (replie la pâte sur elle-même) : repos, rabat, repos, rabat, jusqu’à ce qu’elle se tienne. Mains mouillées pour la travailler dans le bol ; mains huilées pour les rabats et pour la manipuler entre deux.','No. Adding flour changes your recipe: at 70% hydration, 100 g extra flour per 1 kg flour drops the dough to about 64%. It gets denser, drier after baking, with compact patches. Your dough does not have too much water, it needs time: flour takes tens of minutes to absorb water. Rest 15 to 20 min, then do folds (fold the dough over itself): rest, fold, rest, fold, until it holds. Wet hands to work it in the bowl; oiled hands for folds and handling in between.','No. Añadir harina cambia tu receta: al 70 % de hidratación, 100 g más de harina por 1 kg bajan la masa a un 64 %. Queda más densa, más seca tras hornear y con zonas compactas. Tu masa no tiene demasiada agua, le falta tiempo: la harina tarda decenas de minutos en absorber el agua. Deja reposar 15 a 20 min y luego haz pliegues: reposo, pliegue, reposo, pliegue, hasta que se sostenga. Manos mojadas para trabajarla en el bol; manos aceitadas para los pliegues y la manipulación.','No. Aggiungere farina cambia la ricetta: al 70% d’idratazione, 100 g di farina in più per 1 kg di farina portano l’impasto a circa 64%. Diventa più denso, più secco dopo la cottura, con zone compatte. L’impasto non ha troppa acqua, ha bisogno di tempo: la farina impiega decine di minuti ad assorbire l’acqua. Lascia riposare 15–20 min, poi fai delle pieghe (ripiega l’impasto su sé stesso): riposo, piega, riposo, piega, finché sta in forma. Mani bagnate per lavorarlo nella ciotola; mani unte per le pieghe e per maneggiarlo tra un riposo e l’altro.','Não. Acrescentar farinha muda a sua receita: com 70% de hidratação, 100 g de farinha a mais por 1 kg baixam a massa para cerca de 64%. Ela fica mais densa, mais seca depois de assada, com partes compactas. Sua massa não tem água demais, ela precisa de tempo: a farinha leva dezenas de minutos para absorver a água. Deixe descansar 15 a 20 min e faça dobras (dobre a massa sobre si mesma): descanso, dobra, descanso, dobra, até ela se sustentar. Mãos molhadas para trabalhar na tigela; mãos untadas para as dobras e o manuseio entre uma e outra.','不要。加面粉会改变你的配方：含水 70% 时，每 1 公斤面粉多加 100 克，含水量会降到约 64%。面团会更紧实，烤后更干，还会有结块的地方。你的面团并不是水太多，而是需要时间：面粉要几十分钟才能吸收水分。静置 15 到 20 分钟，然后折叠（把面团向内折）：静置、折叠、静置、折叠，直到面团能撑住。在盆里操作时用湿手；折叠和中间拿取时用抹油的手。']},
 {c:'hand',q:['Mains mouillées ou huilées : quand ?','Wet or oiled hands: when?','Manos mojadas o aceitadas: ¿cuándo?','Mani bagnate o unte: quando?','Mãos molhadas ou untadas: quando?','湿手还是油手：什么时候用？'],
  a:['Mains mouillées à l’eau pour le mélange et le pétrissage dans le bol : la pâte ne colle pas aux doigts. Mains huilées ensuite, pour les rabats, la manipulation entre deux repos et le boulage. Farine ou semoule seulement au moment d’étaler.','Wet hands for mixing and kneading in the bowl: the dough will not stick to your fingers. Then oiled hands for folds, handling between rests and shaping balls. Flour or semolina only when stretching.','Manos mojadas para mezclar y amasar en el bol: la masa no se pega a los dedos. Después, manos aceitadas para los pliegues, la manipulación entre reposos y el boleado. Harina o sémola solo al estirar.','Mani bagnate d’acqua per mescolare e impastare nella ciotola: l’impasto non si attacca alle dita. Poi mani unte per le pieghe, per maneggiarlo tra un riposo e l’altro e per formare i panetti. Farina o semola solo per stendere.','Mãos molhadas para misturar e sovar na tigela: a massa não gruda nos dedos. Depois, mãos untadas para as dobras, o manuseio entre os descansos e o boleamento. Farinha ou sêmola só na hora de abrir.','在盆里混合和揉面时用湿手：面团不会粘手指。之后折叠、静置间的拿取和滚圆时用抹油的手。只有擀开时才用面粉或粗粒小麦粉。']},
 {c:'save',q:['Où sont gardées mes recettes ?','Where are my recipes kept?','¿Dónde se guardan mis recetas?','Dove sono conservate le mie ricette?','Onde ficam minhas receitas?','我的配方保存在哪里？'],
  a:['Dans ce navigateur, sur cet appareil seulement. Elles disparaissent si tu effaces les données du site, si tu utilises la navigation privée, un autre navigateur ou un autre appareil. D’où l’intérêt du fichier de sauvegarde.','In this browser, on this device only. They are lost if you clear site data, use private browsing, another browser or another device. Hence the backup file.','En este navegador y en este dispositivo solamente. Se pierden si borras los datos del sitio, usas la navegación privada, otro navegador u otro dispositivo. De ahí el archivo de copia.','In questo browser, solo su questo dispositivo. Si perdono se cancelli i dati del sito, se usi la navigazione privata, un altro browser o un altro dispositivo. Da qui l’importanza del file di backup.','Neste navegador, só neste aparelho. Elas se perdem se você apagar os dados do site, usar navegação privada, outro navegador ou outro aparelho. Daí o arquivo de backup.','保存在这个浏览器里，仅限这台设备。如果清除网站数据、使用隐私浏览、换浏览器或换设备，配方就会丢失。所以需要备份文件。']},
 {c:'save',q:['Comment ne rien perdre ?','How do I make sure I lose nothing?','¿Cómo no perder nada?','Come faccio a non perdere nulla?','Como ter certeza de não perder nada?','怎样确保不丢失任何内容？'],
  a:['Clique sur « Sauvegarder tous les changements » (en haut ou en bas) après chaque séance. Tu obtiens un fichier .json avec tout : recettes, notes, étoiles, journal, garnitures, méthodes, catégories et prix. Range-le dans un dossier synchronisé (OneDrive, Google Drive, Dropbox). L’indicateur orange signale les changements pas encore sauvegardés, et le navigateur demande une confirmation si tu quittes avant.','Click “Save all changes” (top or bottom) after each session. You get a .json file with everything: recipes, notes, stars, log, topping sets, methods, categories and prices. Keep it in a synced folder (OneDrive, Google Drive, Dropbox). The orange status shows unsaved changes, and the browser asks for confirmation if you leave before saving.','Pulsa «Guardar todos los cambios» (arriba o abajo) después de cada sesión. Obtienes un archivo .json con todo: recetas, notas, estrellas, diario, coberturas, métodos, categorías y precios. Guárdalo en una carpeta sincronizada (OneDrive, Google Drive, Dropbox). El aviso naranja indica cambios sin guardar y el navegador pide confirmación si sales antes.','Clicca su «Salva tutte le modifiche» (in alto o in basso) dopo ogni sessione. Ottieni un file .json con tutto: ricette, note, stelle, diario, condimenti, metodi, categorie e prezzi. Tienilo in una cartella sincronizzata (OneDrive, Google Drive, Dropbox). L’indicatore arancione segnala le modifiche non salvate, e il browser chiede conferma se esci prima.','Clique em “Salvar todas as alterações” (no topo ou embaixo) depois de cada sessão. Você recebe um arquivo .json com tudo: receitas, anotações, estrelas, diário, coberturas, métodos, categorias e preços. Guarde-o numa pasta sincronizada (OneDrive, Google Drive, Dropbox). O status laranja indica alterações não salvas, e o navegador pede confirmação se você sair antes de salvar.','每次使用后点击“保存所有更改”（顶部或底部）。你会得到一个包含全部内容的 .json 文件：配方、笔记、星级、日志、配料组合、方法、类别和价格。请放在同步文件夹里（OneDrive、Google Drive、Dropbox）。橙色状态表示有未保存的更改，如果保存前离开，浏览器会请你确认。']},
 {c:'save',q:['Comment récupérer ma sauvegarde ou passer sur un autre appareil ?','How do I restore a backup or move to another device?','¿Cómo recupero mi copia o paso a otro dispositivo?','Come recupero un backup o passo a un altro dispositivo?','Como restaurar um backup ou passar para outro aparelho?','怎样恢复备份或换到其他设备？'],
  a:['En haut, « Mes fichiers : importer, partager, notes », puis « Importer un fichier .json ». L’import ajoute ce qui manque et n’efface rien.','At the top, “My files: import, share, notes”, then “Import a .json file”. Import adds what is missing and deletes nothing.','Arriba, «Mis archivos: importar, compartir, notas», y luego «Importar un archivo .json». La importación añade lo que falta y no borra nada.','In alto, «I miei file: importa, condividi, note», poi «Importa un file .json». L’importazione aggiunge ciò che manca e non cancella nulla.','No topo, “Meus arquivos: importar, compartilhar, anotações” e depois “Importar um arquivo .json”. A importação acrescenta o que falta e não apaga nada.','在顶部点“我的文件：导入、分享、笔记”，再点“导入 .json 文件”。导入会补上缺少的内容，不会删除任何东西。']},
 {c:'save',q:['Comment envoyer une recette à quelqu’un ?','How do I send a recipe to someone?','¿Cómo envío una receta a alguien?','Come mando una ricetta a qualcuno?','Como enviar uma receita para alguém?','怎样把配方发给别人？'],
  a:['Bouton ⤓ à côté de la recette : le fichier contient les réglages, les notes de l’auteur, les étoiles, la catégorie, la garniture, le journal et la méthode personnalisée utilisée. Envoie-le par courriel ou message ; l’autre personne l’importe dans son atelier.','The ⤓ button next to the recipe: the file holds the settings, author notes, stars, category, toppings, log and any custom method used. Send it by email or message; the other person imports it.','Botón ⤓ junto a la receta: el archivo contiene los ajustes, las notas del autor, las estrellas, la categoría, la cobertura, el diario y el método propio usado. Envíalo por correo o mensaje; la otra persona lo importa.','Il pulsante ⤓ accanto alla ricetta: il file contiene le impostazioni, le note dell’autore, le stelle, la categoria, il condimento, il diario e l’eventuale metodo personale usato. Mandalo per email o messaggio; l’altra persona lo importa.','O botão ⤓ ao lado da receita: o arquivo contém os ajustes, as anotações do autor, as estrelas, a categoria, as coberturas, o diário e o método personalizado usado, se houver. Envie por e-mail ou mensagem; a outra pessoa o importa.','配方旁边的 ⤓ 按钮：文件包含设置、作者笔记、星级、类别、配料、日志以及使用的自定义方法（如有）。通过电子邮件或消息发送；对方导入即可。']},
 {c:'save',q:['Sur téléphone, où va le fichier ?','On a phone, where does the file go?','En el móvil, ¿adónde va el archivo?','Sul telefono, dove finisce il file?','No celular, para onde vai o arquivo?','在手机上，文件保存到哪里？'],
  a:['Android (Chrome) : dans Téléchargements. iPhone : le système propose de l’enregistrer dans Fichiers ou de le partager.','Android (Chrome): in Downloads. iPhone: the system offers to save it to Files or share it.','Android (Chrome): en Descargas. iPhone: el sistema propone guardarlo en Archivos o compartirlo.','Android (Chrome): in Download. iPhone: il sistema propone di salvarlo in File o di condividerlo.','Android (Chrome): em Downloads. iPhone: o sistema oferece salvar em Arquivos ou compartilhar.','Android（Chrome）：在“下载”中。iPhone：系统会提示保存到“文件”或分享。']},
 {c:'save',q:['Pourquoi une recette porte la mention « (importée) » ?','Why does a recipe say “(imported)”?','¿Por qué una receta dice «(importada)»?','Perché una ricetta dice «(importata)»?','Por que uma receita diz “(importada)”?','为什么配方上写着“（已导入）”？'],
  a:['Tu as importé une version différente d’une recette que tu avais déjà. Rien n’est écrasé : les deux versions sont gardées, à toi de supprimer celle que tu ne veux plus.','You imported a different version of a recipe you already had. Nothing is overwritten: both versions are kept; delete the one you no longer want.','Importaste una versión distinta de una receta que ya tenías. No se sobrescribe nada: se guardan las dos; borra la que ya no quieras.','Hai importato una versione diversa di una ricetta che avevi già. Nulla viene sovrascritto: si tengono entrambe le versioni; elimina quella che non vuoi più.','Você importou uma versão diferente de uma receita que já tinha. Nada é sobrescrito: as duas versões são mantidas; apague a que você não quer mais.','你导入了一个已有配方的不同版本。不会覆盖任何内容：两个版本都会保留；删除不需要的那个即可。']},
 {c:'hand',q:['Comment savoir si la pâte est assez pétrie ?','How do I know the dough is kneaded enough?','¿Cómo sé si la masa está bien amasada?','Come capisco se l’impasto è impastato abbastanza?','Como saber se a massa foi bem sovada?','怎样判断面团揉好了？'],
  a:['Elle est lisse et se détache des parois. Test de la fenêtre : étire doucement un petit morceau ; s’il devient assez fin pour laisser passer la lumière sans se déchirer, c’est prêt.','It is smooth and pulls away from the bowl. Windowpane test: gently stretch a small piece; if it gets thin enough to let light through without tearing, it is ready.','Está lisa y se despega de las paredes. Prueba de la ventana: estira con cuidado un trocito; si queda tan fina que deja pasar la luz sin romperse, está lista.','È liscio e si stacca dalla ciotola. Prova del velo: tira delicatamente un pezzetto; se diventa così sottile da lasciar passare la luce senza strapparsi, è pronto.','Ela fica lisa e se solta da tigela. Teste do véu: estique delicadamente um pedacinho; se ele ficar fino a ponto de deixar passar a luz sem rasgar, está pronta.','面团光滑，不粘盆。薄膜测试：轻轻拉开一小块，如果能拉到透光而不破，就揉好了。']},
 {c:'hand',q:['Comment savoir si la levée est finie ?','How do I know the rise is done?','¿Cómo sé si ha terminado de levar?','Come capisco se la lievitazione è finita?','Como saber se a fermentação terminou?','怎样判断发酵好了？'],
  a:['Le volume a environ doublé. Test du doigt : enfonce-le d’environ 1 cm. Le creux remonte lentement : c’est prêt. Il remonte tout de suite : attends encore. Il ne remonte pas : la pâte a trop levé, utilise-la vite.','It has roughly doubled. Finger test: press about 1 cm in. The dent springs back slowly: ready. Springs back at once: wait. Does not spring back: over-proofed, use it quickly.','El volumen casi se ha duplicado. Prueba del dedo: húndelo 1 cm. El hueco vuelve despacio: lista. Vuelve enseguida: espera. No vuelve: ha levado de más, úsala pronto.','Il volume è circa raddoppiato. Prova del dito: affondalo di circa 1 cm. La fossetta risale lentamente: pronto. Risale subito: aspetta. Non risale: troppo lievitato, usalo in fretta.','Ela quase dobrou de volume. Teste do dedo: afunde cerca de 1 cm. A marca volta devagar: pronta. Volta na hora: espere. Não volta: passou do ponto, use rápido.','体积大约增加到两倍。手指测试：按下约 1 厘米。凹痕慢慢回弹：好了。立刻回弹：再等等。不回弹：发过头了，尽快使用。']},
 {c:'hand',q:['Comment étaler sans rouleau ?','How do I stretch without a rolling pin?','¿Cómo estirar sin rodillo?','Come stendo senza mattarello?','Como abrir a massa sem rolo?','不用擀面杖怎样推开面团？'],
  a:['Pâton à température ambiante, sur un plan fariné ou semoulé. Appuie du bout des doigts du centre vers l’extérieur sans écraser le bord, qui fera la croûte gonflée. Termine en l’étirant sur le dos des mains.','Dough ball at room temperature, on a floured or semolina-dusted counter. Press with your fingertips from the centre outwards without flattening the rim, which becomes the puffy crust. Finish by stretching it over the backs of your hands.','Bola a temperatura ambiente, sobre una encimera con harina o sémola. Presiona con la yema de los dedos del centro hacia fuera sin aplastar el borde, que será la corteza hinchada. Termina estirándola sobre el dorso de las manos.','Panetto a temperatura ambiente, su un piano infarinato o con semola. Premi con la punta delle dita dal centro verso l’esterno senza schiacciare il bordo, che diventerà il cornicione. Finisci allargandolo sul dorso delle mani.','Bolinha em temperatura ambiente, numa bancada enfarinhada ou com sêmola. Pressione com as pontas dos dedos do centro para fora sem achatar a borda, que vira a crosta estufada. Termine esticando sobre o dorso das mãos.','面团球回到室温，放在撒了面粉或粗粒小麦粉的台面上。用指尖从中心向外按压，不要压扁饼边，饼边会变成蓬松的外圈。最后放在手背上拉开。']},
 {c:'hand',q:['La pâte se rétracte quand je l’étale','The dough shrinks back when I stretch it','La masa se encoge al estirarla','L’impasto si ritira quando lo stendo','A massa retrai quando eu abro','推开时面团回缩'],
  a:['Le gluten est trop tendu ou la pâte trop froide. Couvre-la et laisse-la reposer 10 à 15 min, puis reprends.','The gluten is too tight or the dough too cold. Cover it, let it rest 10 to 15 min, then try again.','El gluten está demasiado tenso o la masa demasiado fría. Tápala, déjala reposar 10 a 15 min y vuelve a intentarlo.','Il glutine è troppo teso o l’impasto troppo freddo. Coprilo, lascialo riposare 10–15 min, poi riprova.','O glúten está tenso demais ou a massa está fria demais. Cubra, deixe descansar 10 a 15 min e tente de novo.','面筋太紧或面团太凉。盖好，静置 10 到 15 分钟后再试。']},
 {c:'hand',q:['Je peux étaler un pâton qui sort du frigo ?','Can I stretch a dough ball straight from the fridge?','¿Puedo estirar una bola recién sacada de la nevera?','Posso stendere un panetto appena tolto dal frigo?','Posso abrir uma bolinha direto da geladeira?','面团球能直接从冰箱拿出来擀吗？'],
  a:['Non : laisse-le revenir à température ambiante, souvent 1 à 2 h selon ta cuisine. Froid, il se déchire et se rétracte.','No: let it come to room temperature, often 1 to 2 h depending on your kitchen. Cold dough tears and shrinks back.','No: deja que vuelva a temperatura ambiente, normalmente 1 a 2 h según la cocina. Fría se rompe y se encoge.','No: lascialo tornare a temperatura ambiente, spesso 1–2 h secondo la cucina. Freddo si strappa e si ritira.','Não: deixe chegar à temperatura ambiente, muitas vezes 1 a 2 h conforme a cozinha. Massa fria rasga e retrai.','不能：先让它回到室温，通常需要 1 到 2 小时，视厨房温度而定。冷面团容易破，还会回缩。']},
 {c:'hand',q:['Comment glisser la pizza dans le four ?','How do I slide the pizza into the oven?','¿Cómo meto la pizza en el horno?','Come faccio scivolare la pizza nel forno?','Como colocar a pizza no forno?','怎样把披萨送进烤箱？'],
  a:['Pelle légèrement saupoudrée de semoule. Garnis vite sur la pelle et secoue-la un peu avant d’enfourner pour vérifier que la pizza glisse. Avec une plaque à trous, étale directement sur la plaque.','Peel lightly dusted with semolina. Top quickly on the peel and give it a little shake before loading to check the pizza slides. With a perforated pan, stretch right on the pan.','Pala con un poco de sémola. Cubre rápido sobre la pala y sacúdela un poco antes de hornear para comprobar que la pizza se desliza. Con bandeja perforada, estira directamente sobre ella.','Pala spolverata con un po’ di semola. Condisci in fretta sulla pala e dalle una piccola scossa prima di infornare per verificare che la pizza scivoli. Con una teglia forata, stendi direttamente sulla teglia.','Pá levemente polvilhada com sêmola. Monte rápido sobre a pá e dê uma pequena sacudida antes de levar ao forno para ver se a pizza desliza. Com assadeira furada, abra direto sobre a assadeira.','在披萨铲上薄薄撒一层粗粒小麦粉。在铲上快速铺料，入炉前轻轻晃一下，确认披萨能滑动。用带孔烤盘时，直接在烤盘上推开。']},
 {c:'ing',q:['Faut-il mettre les tomates au frigo ?','Should tomatoes go in the fridge?','¿Hay que guardar los tomates en la nevera?','I pomodori vanno in frigo?','Tomate vai na geladeira?','番茄要放冰箱吗？'],
  a:['Tomates fraîches : non, garde-les à température ambiante ; au frigo, elles perdent une partie de leurs arômes (étude Zhang et al., PNAS, 2016). Conserve ouverte : au frigo, dans un contenant fermé plutôt que dans la boîte, quelques jours.','Fresh tomatoes: no, keep them at room temperature; in the fridge they lose some of their flavour (Zhang et al., PNAS, 2016). Opened can: in the fridge, in a closed container rather than the can, for a few days.','Tomates frescos: no, a temperatura ambiente; en la nevera pierden parte de su aroma (Zhang et al., PNAS, 2016). Lata abierta: en la nevera, en un recipiente cerrado en lugar de la lata, unos días.','Pomodori freschi: no, tienili a temperatura ambiente; in frigo perdono parte del loro aroma (Zhang et al., PNAS, 2016). Barattolo aperto: in frigo, in un contenitore chiuso invece che nel barattolo, per qualche giorno.','Tomates frescos: não, mantenha em temperatura ambiente; na geladeira eles perdem parte do sabor (Zhang et al., PNAS, 2016). Lata aberta: na geladeira, num recipiente fechado e não na lata, por alguns dias.','新鲜番茄：不要，放在室温；冷藏会让它们失去部分风味（Zhang 等，PNAS，2016）。开封的罐头：倒进有盖容器（不要留在罐里）冷藏，可放几天。']},
 {c:'ing',q:['Quelles tomates pour la sauce ?','Which tomatoes for the sauce?','¿Qué tomates para la salsa?','Quali pomodori per la salsa?','Quais tomates para o molho?','做酱用什么番茄？'],
  a:['Roma ou San Marzano pelées : chair dense, peu d’eau et peu de pépins, donc une sauce épaisse qui ne détrempe pas la pâte.','Peeled Roma or San Marzano: dense flesh, little water and few seeds, so a thick sauce that does not make the crust soggy.','Roma o San Marzano pelados: carne densa, poca agua y pocas semillas, así que una salsa espesa que no empapa la masa.','Pelati Roma o San Marzano: polpa densa, poca acqua e pochi semi, quindi una salsa densa che non inzuppa l’impasto.','Roma ou San Marzano pelados: polpa densa, pouca água e poucas sementes, ou seja, um molho espesso que não encharca a massa.','去皮的罗马番茄或圣马扎诺番茄：果肉紧实，水分和籽都少，酱汁浓稠，不会让饼底变湿软。']},
 {c:'ing',q:['Ma mozzarella détrempe la pizza','My mozzarella makes the pizza soggy','La mozzarella me empapa la pizza','La mozzarella inzuppa la pizza','Minha muçarela deixa a pizza encharcada','马苏里拉让披萨变得湿软'],
  a:['Fior di latte ou bufala : coupe-la et laisse-la égoutter quelques heures au frigo, puis éponge-la. Sinon, prends de la mozzarella râpée à faible humidité.','Fior di latte or buffalo: cut it and let it drain a few hours in the fridge, then pat dry. Otherwise use shredded low-moisture mozzarella.','Fior di latte o búfala: córtala, déjala escurrir unas horas en la nevera y sécala. Si no, usa mozzarella rallada de baja humedad.','Fior di latte o bufala: tagliala e lasciala sgocciolare qualche ora in frigo, poi tamponala. Altrimenti usa mozzarella grattugiata a bassa umidità.','Fior di latte ou de búfala: corte e deixe escorrer algumas horas na geladeira, depois seque com papel. Senão, use muçarela ralada de baixa umidade.','Fior di latte 或水牛马苏里拉：切开后放进冰箱沥水几个小时，再用纸巾吸干。否则就用低水分马苏里拉碎。']},
 {c:'ing',q:['Comment choisir ma farine ?','How do I choose my flour?','¿Cómo elijo la harina?','Come scelgo la farina?','Como escolher minha farinha?','怎样选择面粉？'],
  a:['Regarde les protéines dans le tableau nutritionnel : protéines ÷ portion × 100 donne le pourcentage. Plus il est élevé, plus la farine absorbe d’eau et supporte une longue fermentation. Tu peux l’entrer dans « Ma farine » (rubrique 3).','Check the protein line on the nutrition label: protein ÷ serving × 100 gives the percentage. The higher it is, the more water the flour absorbs and the longer the fermentation it handles. You can enter it under “My flour” (section 3).','Mira las proteínas en la tabla nutricional: proteínas ÷ ración × 100 da el porcentaje. Cuanto más alto, más agua absorbe la harina y más fermentación aguanta. Puedes ponerlo en «Mi harina» (sección 3).','Guarda le proteine nella tabella nutrizionale: proteine ÷ porzione × 100 dà la percentuale. Più è alta, più la farina assorbe acqua e regge lievitazioni lunghe. Puoi inserirla in «La mia farina» (sezione 3).','Veja a linha de proteínas na tabela nutricional: proteínas ÷ porção × 100 dá a porcentagem. Quanto mais alta, mais água a farinha absorve e mais longa a fermentação que ela aguenta. Você pode informá-la em “Minha farinha” (seção 3).','查看营养成分表中的蛋白质一栏：蛋白质 ÷ 每份重量 × 100 即为百分比。数值越高，面粉吸水越多，越耐长时间发酵。你可以在“我的面粉”（第 3 部分）中填写。']},
 {c:'ing',q:['Levure fraîche ou sèche : quelle équivalence ?','Fresh or dry yeast: what is the equivalent?','Levadura fresca o seca: ¿qué equivalencia?','Lievito fresco o secco: qual è l’equivalenza?','Fermento fresco ou seco: qual a equivalência?','鲜酵母和干酵母：怎么换算？'],
  a:['L’atelier compte 1 g de levure sèche instantanée pour 3 g de fraîche, et 1 g de sèche active pour 2 g de fraîche. Choisis ton type de levure dans la rubrique 3 : la quantité est convertie automatiquement. La levure sèche instantanée se mélange à la farine ; la sèche active se réhydrate d’abord dans un peu d’eau tiède (au moins 30 °C).','The app counts 1 g of instant dry yeast for 3 g of fresh, and 1 g of active dry for 2 g of fresh. Pick your yeast type in section 3: the amount converts automatically. Instant dry yeast is mixed into the flour; active dry is first rehydrated in a little warm water (at least 30 °C / 86 °F).','La app cuenta 1 g de levadura seca instantánea por 3 g de fresca, y 1 g de seca activa por 2 g de fresca. Elige tu levadura en la sección 3: la cantidad se convierte sola. La seca instantánea se mezcla con la harina; la seca activa se rehidrata antes en un poco de agua tibia (al menos 30 °C).','L’app conta 1 g di lievito secco istantaneo per 3 g di fresco, e 1 g di secco attivo per 2 g di fresco. Scegli il tipo di lievito nella sezione 3: la quantità si converte da sola. Il secco istantaneo si mescola alla farina; il secco attivo si reidrata prima in un po’ d’acqua tiepida (almeno 30 °C).','O app conta 1 g de fermento seco instantâneo para 3 g de fresco, e 1 g de seco ativo para 2 g de fresco. Escolha o tipo de fermento na seção 3: a quantidade é convertida automaticamente. O fermento seco instantâneo é misturado à farinha; o seco ativo é primeiro reidratado num pouco de água morna (pelo menos 30 °C).','应用按 1 克即发干酵母 = 3 克鲜酵母、1 克活性干酵母 = 2 克鲜酵母换算。在第 3 部分选择酵母类型：用量会自动换算。即发干酵母直接拌进面粉；活性干酵母要先用少量温水（至少 30 °C）复水。']},
 {c:'ing',q:['Comment conserver la levure fraîche ?','How do I store fresh yeast?','¿Cómo conservo la levadura fresca?','Come conservo il lievito fresco?','Como conservar o fermento fresco?','鲜酵母怎样保存？'],
  a:['Au frigo, bien emballée, jusqu’à la date du fabricant. Elle doit être friable, couleur crème, avec une odeur agréable. Brune, collante ou à l’odeur forte : jette-la.','In the fridge, well wrapped, until the maker’s date. It should be crumbly, cream-coloured and smell pleasant. Brown, sticky or strong-smelling: throw it out.','En la nevera, bien envuelta, hasta la fecha del fabricante. Debe estar desmenuzable, color crema y oler bien. Marrón, pegajosa o con olor fuerte: tírala.','In frigo, ben avvolto, fino alla data del produttore. Deve essere friabile, color crema e avere un buon odore. Scuro, appiccicoso o dall’odore forte: buttalo.','Na geladeira, bem embrulhado, até a data do fabricante. Ele deve estar quebradiço, cor de creme e com cheiro agradável. Marrom, pegajoso ou com cheiro forte: jogue fora.','冷藏，包好，在保质期内使用。它应该松散易碎、呈奶油色、气味宜人。如果变成褐色、发粘或气味刺鼻：请丢弃。']},
 {c:'ing',q:['Levure sèche : faut-il ajouter de l’eau ?','Dry yeast: should I add water?','Levadura seca: ¿hay que añadir agua?','Lievito secco: bisogna aggiungere acqua?','Fermento seco: devo acrescentar água?','用干酵母：要多加水吗？'],
  a:['En théorie, oui : la levure fraîche contient environ deux tiers d’eau, la sèche presque pas. En passant à la sèche, il manque donc un peu d’eau. Pour une pizza maison, l’écart est minime : avec 5 g de fraîche remplacés par environ 1,7 g de sèche instantanée, il manque environ 3 g d’eau sur plus de 400 g, moins de 1 %. L’appli ne le corrige pas ; tu peux ajouter une cuillère à thé d’eau si la pâte te semble ferme.','In theory, yes: fresh yeast is about two-thirds water, dry yeast almost none. Switching to dry, a little water is missing. For a home pizza the gap is tiny: replacing 5 g of fresh with about 1.7 g of instant dry leaves about 3 g of water missing out of more than 400 g, under 1%. The app does not correct it; add a teaspoon of water if the dough feels firm.','En teoría, sí: la levadura fresca tiene cerca de dos tercios de agua, la seca casi nada. Al pasar a la seca falta un poco de agua. Para una pizza casera la diferencia es mínima: al cambiar 5 g de fresca por unos 1,7 g de seca instantánea faltan unos 3 g de agua sobre más de 400 g, menos del 1 %. La app no lo corrige; añade una cucharadita de agua si la masa te parece firme.','In teoria sì: il lievito fresco contiene circa due terzi d’acqua, il secco quasi niente. Passando al secco manca quindi un po’ d’acqua. Per una pizza fatta in casa la differenza è minima: sostituendo 5 g di fresco con circa 1,7 g di secco istantaneo mancano circa 3 g d’acqua su più di 400 g, meno dell’1%. L’app non lo corregge; aggiungi un cucchiaino d’acqua se l’impasto ti sembra sodo.','Em teoria, sim: o fermento fresco tem cerca de dois terços de água, o seco quase nenhuma. Passando para o seco, falta um pouco de água. Numa pizza caseira a diferença é mínima: trocar 5 g de fresco por cerca de 1,7 g de seco instantâneo deixa faltar uns 3 g de água em mais de 400 g, menos de 1%. O app não corrige; acrescente uma colher de chá de água se a massa parecer firme.','理论上要：鲜酵母约三分之二是水，干酵母几乎不含水。改用干酵母时，会少一点水。对家庭披萨来说差别极小：用约 1.7 克即发干酵母代替 5 克鲜酵母，大约少 3 克水，而总水量超过 400 克，不到 1%。应用不做修正；如果面团偏硬，可以加一茶匙水。']},
 {c:'ing',q:['Pourquoi de l’eau froide, voire des glaçons ?','Why cold water, or even ice?','¿Por qué agua fría, o incluso hielo?','Perché acqua fredda, o perfino ghiaccio?','Por que água fria, ou até gelo?','为什么要用冷水，甚至冰水？'],
  a:['Pour maîtriser la température de la pâte. Le pétrissage la réchauffe, surtout au robot ; une pâte trop chaude lève trop vite, colle et supporte mal une longue levée. L’appli calcule la température de l’eau d’après celle de ta cuisine (rubrique 6). Si tu pétris au robot, prends une eau plus froide de quelques degrés (ordre de grandeur : 3 à 5 °C de moins). Avec de la levure sèche, ne la verse pas dans l’eau froide : mélange-la à la farine (instantanée) ou réhydrate-la d’abord dans un peu d’eau tiède (active).','To control the dough temperature. Kneading warms it, especially with a mixer; dough that is too warm rises too fast, gets sticky and copes badly with a long rise. The app works out the water temperature from your kitchen’s (section 6). If you knead with a mixer, use water a few degrees colder (roughly 3 to 5 °C less). With dry yeast, do not pour it into cold water: mix it into the flour (instant) or rehydrate it first in a little warm water (active).','Para controlar la temperatura de la masa. El amasado la calienta, sobre todo con robot; una masa demasiado caliente sube demasiado rápido, se pega y aguanta mal un levado largo. La app calcula la temperatura del agua según la de tu cocina (sección 6). Si amasas con robot, usa agua unos grados más fría (orden de magnitud: 3 a 5 °C menos). Con levadura seca, no la eches en el agua fría: mézclala con la harina (instantánea) o rehidrátala antes en un poco de agua tibia (activa).','Per controllare la temperatura dell’impasto. L’impastatura lo scalda, soprattutto con la planetaria; un impasto troppo caldo lievita troppo in fretta, si appiccica e regge male una lunga lievitazione. L’app calcola la temperatura dell’acqua in base a quella della tua cucina (sezione 6). Se impasti con la planetaria, usa acqua più fredda di qualche grado (ordine di grandezza: 3–5 °C in meno). Con il lievito secco, non versarlo nell’acqua fredda: mescolalo alla farina (istantaneo) o reidratalo prima in un po’ d’acqua tiepida (attivo).','Para controlar a temperatura da massa. A sova a aquece, sobretudo na batedeira; uma massa quente demais cresce rápido demais, fica grudenta e aguenta mal uma fermentação longa. O app calcula a temperatura da água a partir da temperatura da sua cozinha (seção 6). Se você sovar na batedeira, use água alguns graus mais fria (cerca de 3 a 5 °C a menos). Com fermento seco, não o despeje na água fria: misture-o à farinha (instantâneo) ou reidrate-o antes num pouco de água morna (ativo).','为了控制面团温度。揉面会让面团升温，用搅拌机时尤其明显；面团太热会发得太快、变粘，也不耐长时间发酵。应用会根据你的厨房温度计算水温（第 6 部分）。用搅拌机揉面时，水温再低几度（约低 3 到 5 °C）。用干酵母时，不要倒进冷水：即发干酵母拌进面粉，活性干酵母先用少量温水复水。']},
 {c:'ing',q:['Sans gluten avec un mélange du commerce ?','Gluten-free with a store-bought blend?','¿Sin gluten con una mezcla comercial?','Senza glutine con una miscela del commercio?','Sem glúten com uma mistura pronta?','用市售混合粉做无麸质披萨？'],
  a:['La méthode « Sans gluten » de l’appli est faite pour un mélange maison (riz, fécule de maïs, psyllium) à environ 55 % d’eau, pressé sur une plaque huilée. Certains mélanges du commerce pour pizza demandent beaucoup plus d’eau, jusqu’à 90 % : règle l’hydratation selon l’emballage (rubrique 3). Gestes utiles avec ces mélanges : verse l’eau en deux fois et attends qu’elle soit absorbée, ajoute l’huile ensuite, pétris quelques minutes jusqu’à une boule lisse, puis emballe chaque pâton dans du film pour qu’il ne sèche pas pendant le repos.','The app’s “Gluten-free” method is made for a homemade blend (rice, cornstarch, psyllium) at about 55% water, pressed onto an oiled pan. Some store-bought pizza blends need much more water, up to 90%: set the hydration from the package (section 3). Useful steps with these blends: add the water in two goes and wait until it is absorbed, add the oil afterwards, knead a few minutes to a smooth ball, then wrap each ball in film so it does not dry out while resting.','El método «Sin gluten» de la app está pensado para una mezcla casera (arroz, maicena, psyllium) con un 55 % de agua, presionada sobre una bandeja aceitada. Algunas mezclas comerciales para pizza piden mucha más agua, hasta un 90 %: ajusta la hidratación según el envase (sección 3). Gestos útiles con estas mezclas: echa el agua en dos veces y espera a que se absorba, añade después el aceite, amasa unos minutos hasta una bola lisa y envuelve cada bola en film para que no se seque durante el reposo.','Il metodo «Senza glutine» dell’app è pensato per una miscela fatta in casa (riso, amido di mais, psyllium) con circa il 55% d’acqua, pressata su una teglia unta. Alcune miscele del commercio per pizza chiedono molta più acqua, fino al 90%: regola l’idratazione secondo la confezione (sezione 3). Gesti utili con queste miscele: versa l’acqua in due volte e aspetta che sia assorbita, aggiungi poi l’olio, impasta qualche minuto fino a una palla liscia e avvolgi ogni panetto nella pellicola perché non si secchi durante il riposo.','O método “Sem glúten” do app foi feito para uma mistura caseira (arroz, amido de milho, psyllium) com cerca de 55% de água, pressionada numa assadeira untada. Algumas misturas prontas para pizza pedem muito mais água, até 90%: ajuste a hidratação conforme a embalagem (seção 3). Etapas úteis com essas misturas: acrescente a água em duas vezes e espere que seja absorvida, acrescente o óleo depois, sove alguns minutos até formar uma bola lisa e embrulhe cada bolinha em filme para não ressecar durante o descanso.','应用中的“无麸质”方法是为自制混合粉（米粉、玉米淀粉、车前子壳粉）设计的，含水约 55%，按压在抹油的烤盘上。一些市售披萨混合粉需要多得多的水，最高达 90%：请按包装设置含水量（第 3 部分）。用这类混合粉时的实用步骤：水分两次加入，等吸收后再加；之后再加油；揉几分钟成光滑的面团；静置时把每个面团球用保鲜膜包好，以免变干。']},
 {c:'ing',q:['Le sel tue-t-il la levure ?','Does salt kill yeast?','¿La sal mata la levadura?','Il sale uccide il lievito?','O sal mata o fermento?','盐会杀死酵母吗？'],
  a:['On conseille souvent de ne pas les mettre en contact direct. L’effet réel sur quelques minutes est discuté ; par précaution, dissous le sel dans l’eau ou ajoute-le après la levure.','People often advise keeping them apart. The real effect over a few minutes is debated; as a precaution, dissolve the salt in the water or add it after the yeast.','Se suele aconsejar no ponerlos en contacto directo. El efecto real en unos minutos se discute; por precaución, disuelve la sal en el agua o añádela después de la levadura.','Si consiglia spesso di non metterli a contatto diretto. L’effetto reale in pochi minuti è discusso; per prudenza, sciogli il sale nell’acqua o aggiungilo dopo il lievito.','Muitas vezes se aconselha separá-los. O efeito real em poucos minutos é discutido; por precaução, dissolva o sal na água ou acrescente-o depois do fermento.','人们常建议把盐和酵母分开。几分钟内的实际影响尚有争议；保险起见，可以把盐溶在水里，或在加酵母之后再加盐。']},
 {c:'ing',q:['À quoi sert le miel ?','What is the honey for?','¿Para qué sirve la miel?','A cosa serve il miele?','Para que serve o mel?','蜂蜜有什么用？'],
  a:['En petite quantité, il nourrit la levure au départ et aide la croûte à colorer dans un four domestique.','In small amounts it feeds the yeast at the start and helps the crust brown in a home oven.','En poca cantidad alimenta la levadura al principio y ayuda a dorar la corteza en un horno doméstico.','In piccola quantità nutre il lievito all’inizio e aiuta la crosta a dorarsi in un forno domestico.','Em pequena quantidade, ele alimenta o fermento no início e ajuda a crosta a dourar em forno doméstico.','少量蜂蜜能在开始时为酵母提供养分，并帮助家用烤箱中的饼皮上色。']},
 {c:'oven',q:['Pourquoi préchauffer aussi longtemps ?','Why preheat for so long?','¿Por qué precalentar tanto tiempo?','Perché preriscaldare così a lungo?','Por que preaquecer tanto tempo?','为什么要预热这么久？'],
  a:['Une pierre ou un acier doit accumuler la chaleur pour saisir le dessous de la pizza. Suis la durée indiquée dans le rétroplanning. La plaque à trous, elle, ne se préchauffe pas.','A stone or steel must store heat to sear the bottom of the pizza. Follow the time shown in the schedule. A perforated pan is not preheated.','Una piedra o un acero debe acumular calor para dorar la base. Sigue el tiempo de la planificación. La bandeja perforada no se precalienta.','Una pietra o un acciaio deve accumulare calore per cuocere bene il fondo della pizza. Segui il tempo indicato nel programma. La teglia forata non si preriscalda.','Uma pedra ou um aço precisa acumular calor para selar o fundo da pizza. Siga o tempo indicado no cronograma. A assadeira furada não é preaquecida.','披萨石或烤钢板需要蓄足热量，才能迅速烤定饼底。请按时间表中显示的时间预热。带孔烤盘不需要预热。']},
 {c:'oven',q:['Le dessous reste pâle','The bottom stays pale','La base queda pálida','Il fondo resta pallido','O fundo fica pálido','饼底颜色太浅'],
  a:['Pierre ou acier sous le grill : préchauffe-les plus longtemps (30 min ou plus) pour qu’ils soient bien chauds. Avec une plaque : cuis plus bas dans le four, préchauffe plus longtemps ou passe à une pierre ou un acier. Si c’est le dessus qui reste pâle, finis 1 à 2 min sous le grill, grille du haut.','Stone or steel under the broiler: preheat them longer (30 min or more) so they are really hot. With a sheet pan: bake lower in the oven, preheat longer or switch to a stone or steel. If the top stays pale, finish 1 to 2 min under the broiler, top rack.','Piedra o acero con el grill: precaliéntalos más tiempo (30 min o más) para que estén bien calientes. Con bandeja: hornea más abajo, precalienta más o usa piedra o acero. Si es la parte de arriba la que queda pálida, termina 1 a 2 min con el grill, rejilla alta.','Pietra o acciaio sotto il grill: preriscaldali più a lungo (30 min o più) perché siano ben caldi. Con una teglia: cuoci più in basso nel forno, preriscalda più a lungo o passa a una pietra o a un acciaio. Se è la superficie a restare pallida, finisci 1–2 min sotto il grill, griglia alta.','Pedra ou aço no grill: preaqueça por mais tempo (30 min ou mais) para que fiquem bem quentes. Com assadeira comum: asse mais embaixo no forno, preaqueça por mais tempo ou passe para pedra ou aço. Se a parte de cima ficar pálida, termine 1 a 2 min no grill, grade de cima.','用上火烤披萨石或烤钢板时：预热更久（30 分钟以上），让它们真正热透。用普通烤盘时：放在烤箱更低的位置，预热更久，或改用披萨石或烤钢板。如果表面颜色太浅，最后用上火在顶层烤 1 到 2 分钟。']},
 {c:'keep',q:['Comment réchauffer une pizza du frigo ?','How do I reheat pizza from the fridge?','¿Cómo recaliento una pizza de la nevera?','Come riscaldo una pizza dal frigo?','Como reaquecer pizza da geladeira?','冷藏披萨怎样加热？'],
  a:['Méthode de Marco : sur une plaque à trous ou une plaque en métal, dans le four froid, puis allume à 180–190 °C pendant 10 à 15 min. Pour 1 à 3 parts, la poêle est plus rapide. Détails dans la rubrique 10.','Marco’s method: on a perforated pan or metal sheet, in a cold oven, then turn it on to 180–190 °C (350–375 °F) for 10 to 15 min. For 1 to 3 slices, a skillet is faster. Details in section 10.','Método de Marco: sobre una bandeja perforada o de metal, con el horno frío, y luego enciéndelo a 180–190 °C durante 10 a 15 min. Para 1 a 3 porciones, la sartén es más rápida. Detalles en la sección 10.','Metodo di Marco: su una teglia forata o di metallo, nel forno freddo, poi accendilo a 180–190 °C per 10–15 min. Per 1–3 fette, la padella è più veloce. Dettagli nella sezione 10.','Método do Marco: numa assadeira furada ou chapa de metal, no forno frio, depois ligue a 180–190 °C por 10 a 15 min. Para 1 a 3 fatias, a frigideira é mais rápida. Detalhes na seção 10.','Marco 的方法：放在带孔烤盘或金属烤板上，放进冷烤箱，再开到 180–190 °C 加热 10 到 15 分钟。1 到 3 片用平底锅更快。详见第 10 部分。']},
 {c:'keep',q:['Combien de temps se garde une pizza cuite ?','How long does baked pizza keep?','¿Cuánto dura una pizza horneada?','Quanto si conserva una pizza cotta?','Quanto tempo dura a pizza assada?','烤好的披萨能放多久？'],
  a:['Au frigo, 3 à 4 jours dans une boîte fermée (repère USDA pour les restes). Pas plus de 2 h à température ambiante avant de la ranger.','In the fridge, 3 to 4 days in a closed container (USDA guideline for leftovers). No more than 2 h at room temperature before storing.','En la nevera, 3 a 4 días en un recipiente cerrado (referencia del USDA para sobras). No más de 2 h a temperatura ambiente antes de guardarla.','In frigo, 3–4 giorni in un contenitore chiuso (indicazione USDA per gli avanzi). Non più di 2 h a temperatura ambiente prima di riporla.','Na geladeira, 3 a 4 dias num recipiente fechado (orientação do USDA para sobras). No máximo 2 h em temperatura ambiente antes de guardar.','冷藏，装在有盖容器里可放 3 到 4 天（美国农业部关于剩菜的建议）。收起来之前在室温下不超过 2 小时。']},
 {c:'keep',q:['Peut-on congeler les pâtons ?','Can I freeze dough balls?','¿Se pueden congelar las bolas?','Si possono congelare i panetti?','Posso congelar bolinhas de massa?','面团球可以冷冻吗？'],
  a:['Oui, juste après le boulage, légèrement huilés, un par sac, jusqu’à environ 3 mois. La veille, passe-les au frigo. Tout est détaillé dans la rubrique 10.','Yes, right after shaping, lightly oiled, one per bag, up to about 3 months. The day before, move them to the fridge. Full details in section 10.','Sí, justo después de bolear, ligeramente aceitadas, una por bolsa, hasta unos 3 meses. La víspera, pásalas a la nevera. Todo en la sección 10.','Sì, subito dopo la formatura, leggermente unti, uno per sacchetto, fino a circa 3 mesi. Il giorno prima, passali in frigo. Tutti i dettagli nella sezione 10.','Sim, logo após o boleamento, levemente untadas, uma por saco, até cerca de 3 meses. Na véspera, passe-as para a geladeira. Todos os detalhes na seção 10.','可以，滚圆后马上冷冻，稍微抹油，一袋一个，最长约 3 个月。前一天移到冰箱。详见第 10 部分。']},
 {c:'app',q:['Comment utiliser le minuteur ?','How do I use the timer?','¿Cómo uso el temporizador?','Come uso il timer?','Como usar o timer?','怎样使用计时器？'],
  a:['Dans le rétroplanning, chaque étape a un bouton ⏱ Minuteur. Le décompte s’affiche en bas de l’écran et dans l’onglet du navigateur ; à la fin, un son et une vibration (sur téléphone). Garde la page ouverte : en arrière-plan, le téléphone peut couper le son.','In the schedule, each step has a ⏱ Timer button. The countdown shows at the bottom of the screen and in the browser tab; at the end, a sound and a vibration (on phones). Keep the page open: in the background the phone may mute it.','En la planificación, cada paso tiene un botón ⏱ Temporizador. La cuenta atrás aparece abajo y en la pestaña del navegador; al final, un sonido y una vibración (en el móvil). Mantén la página abierta: en segundo plano el móvil puede silenciarlo.','Nel programma, ogni passaggio di attesa ha un pulsante ⏱ Timer. Il conto alla rovescia compare in basso nello schermo e nella scheda del browser; alla fine, un suono e una vibrazione (sul telefono). Tieni la pagina aperta: in secondo piano il telefono può silenziarlo.','No cronograma, cada etapa tem um botão ⏱ Timer. A contagem regressiva aparece embaixo da tela e na aba do navegador; no fim, um som e uma vibração (no celular). Mantenha a página aberta: em segundo plano, o celular pode silenciá-lo.','在时间表中，每个步骤都有一个 ⏱ 计时器按钮。倒计时显示在屏幕底部和浏览器标签上；结束时会响铃并振动（手机上）。请保持页面打开：在后台时手机可能会把它静音。']},
 {c:'app',q:['Comment mettre le rétroplanning dans mon agenda ?','How do I put the schedule in my calendar?','¿Cómo paso la planificación a mi calendario?','Come metto il programma nel mio calendario?','Como colocar o cronograma na minha agenda?','怎样把时间表加入日历？'],

 {c:'app',q:['Comment faire ma liste de courses ?','How do I make my shopping list?','¿Cómo hago la lista de la compra?','Come faccio la lista della spesa?','Como fazer minha lista de compras?','怎样生成购物清单？'],

 {c:'app',q:['Comment imprimer une recette ?','How do I print a recipe?','¿Cómo imprimo una receta?','Come stampo una ricetta?','Como imprimir uma receita?','怎样打印配方？'],

 {c:'app',q:['À quoi sert le journal de fournée ?','What is the bake log for?','¿Para qué sirve el diario de horneadas?','A cosa serve il diario delle infornate?','Para que serve o diário de fornadas?','烘焙日志有什么用？'],

 {c:'app',q:['Comment créer ma propre méthode ?','How do I create my own method?','¿Cómo creo mi propio método?','Come creo un mio metodo?','Como criar meu próprio método?','怎样创建自己的方法？'],

let faqCat='';
const norm=t=>String(t).normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();
function renderFaq(){
  const C3=FAQC(), qv=norm($('faqQ').value.trim()), words=qv.split(/\s+/).filter(Boolean);
  $('faqCats').innerHTML=[['',T('Tout','All','Todo','Tutte','Todas','全部')],...Object.entries(C3)].map(([k,l])=>`<button type="button" class="mini${faqCat===k?' on':''}" data-fc="${k}">${l}</button>`).join('');
  let n=0, html='';
  Object.keys(C3).forEach(c=>{ if(faqCat&&faqCat!==c) return;
    const items=FAQ.filter(f=>f.c===c&&(!words.length||words.every(w=>norm(L3(f.q)+' '+L3(f.a)).includes(w))));
    if(!items.length) return; n+=items.length;
    html+=`<h3>${C3[c]}</h3>`+items.map(f=>`<details class="faqi"${words.length?' open':''}><summary>${L3(f.q)}</summary><p>${L3(f.a)}</p></details>`).join(''); });
  $('faq').innerHTML=html||`<p class="hint">${T('Aucune question ne correspond. Essaie un autre mot.','No question matches. Try another word.','Ninguna pregunta coincide. Prueba otra palabra.','Nessuna domanda corrisponde. Prova un’altra parola.','Nenhuma pergunta corresponde. Tente outra palavra.','没有匹配的问题。换个词试试。')}</p>`;
  $('faqN').textContent=T(`${n} question${n>1?'s':''}`,`${n} question${n>1?'s':''}`,`${n} pregunta${n>1?'s':''}`,`${n} domand${n>1?'e':'a'}`,`${n} pergunta${n>1?'s':''}`,`${n} 个问题`);
}
$('faqQ').addEventListener('input',renderFaq);
$('faqCats').addEventListener('click',e=>{ const b=e.target.closest('[data-fc]'); if(!b) return; faqCat=b.dataset.fc; renderFaq(); });
function goSec(id,focus){ const d=$(id); if(!d) return; try{ const tb=document.querySelector('.topbar'); if(tb) document.documentElement.style.setProperty('--tbh',(tb.getBoundingClientRect().height+10)+'px'); }catch(e){} const ds=d.matches('details')?d:d.closest('details.sec'); if(ds) ds.open=true; (d.matches('details.sec')?d.closest('section'):d).scrollIntoView({behavior:'smooth',block:'start'}); if(focus) setTimeout(()=>{ try{ $(focus).focus({preventScroll:true}); }catch(e){} },350); }
$('faqBtn').addEventListener('click',()=>goSec('faqD','faqQ'));
