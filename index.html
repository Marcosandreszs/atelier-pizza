if((carnet.seedV||0)<13){
  const ON={'mz-40cm':{notes:'Poolish 1 ou 2 jours avant : 300 ml d’eau, 5 g de levure fraîche, 5 g de miel, 300 g de farine.\nJour J, 16 h : 350 g de farine tout usage, 150 ml d’eau à température ambiante avec 15 g de sel (sel dans l’eau, eau dans le poolish, puis la farine petit à petit). Pétrir 10 min, puis laisser la pâte reposer sur la table, couverte d’un bol.\n16 h 45 : refaçonner, huiler, recouvrir du bol.\n17 h : 2 boules (environ 545 g) dans 2 bols huilés et filmés, 1 h.\n18 h : étaler, garnir, mettre un peu d’huile d’olive au pinceau sur les bords, puis cuire sur plaque à trous, 260 °C, 9 à 11 min en bas puis 1 à 2 min sous le grill.\nHuile d’olive : un peu sur les mains pour manipuler la pâte, et sur les bords au pinceau.\nHydratation : 69 % (450 ml d’eau pour 650 g de farine).',notesEn:'Poolish 1 or 2 days ahead: 300 ml water, 5 g fresh yeast, 5 g honey, 300 g flour.\nDay of, 4 pm: 350 g all-purpose flour, 150 ml room-temperature water with 15 g salt (salt in water, water into poolish, then flour bit by bit). Knead 10 min, then let the dough rest on the counter, covered with a bowl.\n4:45 pm: reshape, oil, cover with the bowl.\n5 pm: 2 balls (about 545 g) in 2 oiled, wrapped bowls, 1 h.\n6 pm: stretch, top, brush the rim with a little olive oil, then bake on a perforated pan, 260 °C (500 °F), 9 to 11 min low then 1 to 2 min under the broiler.\nOlive oil: a little on your hands to handle the dough, and on the rim with a brush.\nHydration: 69% (450 ml water for 650 g flour).',notesEs:'Poolish 1 o 2 días antes: 300 ml de agua, 5 g de levadura fresca, 5 g de miel, 300 g de harina.\nDía del servicio, 16:00: 350 g de harina, 150 ml de agua a temperatura ambiente con 15 g de sal (sal en el agua, agua en el poolish y luego la harina poco a poco). Amasar 10 min y dejar reposar la masa en la encimera, tapada con un bol.\n16:45: volver a formar, aceitar, tapar con el bol.\n17:00: 2 bolas (unos 545 g) en 2 boles aceitados y tapados, 1 h.\n18:00: estirar, cubrir, pintar los bordes con un poco de aceite de oliva y hornear en bandeja perforada, 260 °C, 9 a 11 min abajo y luego 1 a 2 min con el grill.\nAceite de oliva: un poco en las manos para manipular la masa y en los bordes con pincel.\nHidratación: 69 % (450 ml de agua para 650 g de harina).',notesIt:'Poolish 1 o 2 giorni prima: 300 ml d’acqua, 5 g di lievito fresco, 5 g di miele, 300 g di farina.\nIl giorno stesso, ore 16: 350 g di farina per tutti gli usi, 150 ml d’acqua a temperatura ambiente con 15 g di sale (sale nell’acqua, acqua nel poolish, poi la farina poco a poco). Impastare 10 min, poi lasciar riposare l’impasto sul tavolo, coperto da una ciotola.\nOre 16:45: rimodellare, ungere, coprire con la ciotola.\nOre 17: 2 panetti (circa 545 g) in 2 ciotole unte e coperte con pellicola, 1 h.\nOre 18: stendere, condire, spennellare un po’ d’olio d’oliva sui bordi, poi cuocere su teglia forata, 260 °C, 9–11 min in basso poi 1–2 min sotto il grill.\nOlio d’oliva: un po’ sulle mani per maneggiare l’impasto e sui bordi con il pennello.\nIdratazione: 69 % (450 ml d’acqua per 650 g di farina).'},'vito':{notes:'Poolish la veille : 300 g d’eau, 5 g de levure fraîche, 5 g de miel, 300 g de farine ; film percé de quelques trous, départ à température ambiante puis environ 16 h au frigo.\nJour J : poolish dilué dans 700 g d’eau froide (une tasse gardée de côté) jusqu’à ce que l’eau blanchisse ; 1 100 g de farine d’un coup ; 30 g de sel. Robot lent, 20 min maximum ; eau réservée en 4 ou 5 fois ; un peu d’huile d’olive en fin de pétrissage. Tests : main propre, voile.\nRabats sur le plan de travail mains huilées, grosse boule, 15 min sous un bol retourné. Pâtons pesés à la corne, boulés, boîte farinée, 4 doigts d’écart, 1 h à 2 h (1 h 30) à température ambiante. Fleurage moitié semoule, moitié farine tout usage.\nTotal : environ 2 440 g de pâte, 71 % d’hydratation. Non précisés : poids des pâtons (270 g supposés), type de farine, quantité d’huile, cuisson.',notesEn:'Poolish the day before: 300 g water, 5 g fresh yeast, 5 g honey, 300 g flour; plastic wrap with a few holes, start at room temperature, then about 16 h in the fridge.\nDay of: poolish dissolved in 700 g cold water (one cup held back) until the water turns white; 1,100 g flour all at once; 30 g salt. Slow mixer, 20 min max; reserved water in 4 or 5 additions; a little olive oil at the end. Tests: clean hand, windowpane.\nFolds on the counter with oiled hands, big ball, 15 min under an upturned bowl. Balls cut with a scraper and weighed, shaped, floured box, 4 fingers apart, 1 to 2 h (1 h 30) at room temperature. Dusting: half semolina, half all-purpose flour.\nTotal: about 2,440 g dough, 71% hydration. Not specified: ball weight (270 g assumed), flour type, oil amount, baking.',notesEs:'Poolish la víspera: 300 g de agua, 5 g de levadura fresca, 5 g de miel, 300 g de harina; film con unos agujeros, arranque a temperatura ambiente y luego unas 16 h en la nevera.\nDía del servicio: poolish disuelto en 700 g de agua fría (una taza reservada) hasta que el agua se vuelva blanca; 1100 g de harina de golpe; 30 g de sal. Amasadora lenta, 20 min como máximo; agua reservada en 4 o 5 veces; un poco de aceite de oliva al final. Pruebas: mano limpia, velo.\nPliegues en la encimera con las manos aceitadas, bola grande, 15 min bajo un bol boca abajo. Bolas cortadas con rasqueta y pesadas, boleadas, caja enharinada, 4 dedos de separación, 1 a 2 h (1 h 30) a temperatura ambiente. Para estirar: mitad sémola, mitad harina común.\nTotal: unos 2440 g de masa, 71 % de hidratación. Sin precisar: peso de las bolas (se suponen 270 g), tipo de harina, cantidad de aceite, horneado.',notesIt:'Poolish il giorno prima: 300 g d’acqua, 5 g di lievito fresco, 5 g di miele, 300 g di farina; pellicola con qualche foro, avvio a temperatura ambiente, poi circa 16 h in frigo.\nIl giorno stesso: poolish sciolto in 700 g d’acqua fredda (una tazza tenuta da parte) finché l’acqua diventa bianca; 1100 g di farina tutta insieme; 30 g di sale. Impastatrice lenta, 20 min al massimo; acqua tenuta da parte in 4 o 5 volte; un po’ d’olio d’oliva alla fine. Prove: mano pulita, velo.\nPieghe sul piano con le mani unte, grosso panetto, 15 min sotto una ciotola capovolta. Panetti tagliati col tarocco e pesati, formati, cassetta infarinata, a 4 dita di distanza, 1–2 h (1 h 30) a temperatura ambiente. Spolvero: metà semola, metà farina comune.\nTotale: circa 2440 g d’impasto, 71 % d’idratazione. Non precisati: peso dei panetti (270 g ipotizzati), tipo di farina, quantità d’olio, cottura.'},'napo-75':{notes:'Pour 1 kg de farine type 0 (environ 12,5 % de protéines) : 750 g d’eau, 3 g de levure fraîche, 25 g de sel, 20 g d’huile d’olive.\nPétris la farine avec 600 g d’eau quelques minutes, couvre et laisse reposer 30 min. Reprends le pétrissage jusqu’à une pâte bien élastique, puis ajoute peu à peu les 150 g d’eau restants, la levure dissoute dedans : attends que chaque ajout soit absorbé. Ajoute ensuite le sel, puis l’huile.\nBoule avec quelques rabats, dans une boîte légèrement huilée. Un rabat de renfort après 20 min, 30 min à température ambiante, puis 24 h au frigo. Le lendemain, pâtons de 250 g, à laisser doubler.\nÉtale sur de la semoule sans écraser le bord. Cuisson très chaude (400 °C dans un four à pizza).\nVariante d’origine : frigo en masse, puis pâtons le lendemain ; l’appli, elle, place les pâtons au frigo. À 75 %, la pâte est très souple : travaille-la mains mouillées.',notesEn:'For 1 kg type 0 flour (about 12.5% protein): 750 g water, 3 g fresh yeast, 25 g salt, 20 g olive oil.\nKnead the flour with 600 g of the water for a few minutes, cover and rest 30 min. Knead again until very elastic, then add the remaining 150 g water little by little, with the yeast dissolved in it: wait until each addition is absorbed. Then add the salt, then the oil.\nShape a ball with a few folds, in a lightly oiled box. One strengthening fold after 20 min, 30 min at room temperature, then 24 h in the fridge. Next day, 250 g balls, left to double.\nStretch on semolina without flattening the rim. Bake very hot (400 °C / 750 °F in a pizza oven).\nOriginal version: bulk in the fridge, then balls the next day; the app puts the balls in the fridge instead. At 75% the dough is very soft: work it with wet hands.',notesEs:'Para 1 kg de harina tipo 0 (unos 12,5 % de proteínas): 750 g de agua, 3 g de levadura fresca, 25 g de sal, 20 g de aceite de oliva.\nAmasa la harina con 600 g del agua unos minutos, tapa y deja reposar 30 min. Vuelve a amasar hasta que esté bien elástica y añade poco a poco los 150 g de agua restantes, con la levadura disuelta: espera a que cada adición se absorba. Luego añade la sal y después el aceite.\nBolea con unos pliegues, en una caja ligeramente aceitada. Un pliegue de refuerzo a los 20 min, 30 min a temperatura ambiente y luego 24 h en la nevera. Al día siguiente, bolas de 250 g, a dejar doblar.\nEstira sobre sémola sin aplastar el borde. Horno muy caliente (400 °C en un horno de pizza).\nVersión original: nevera en bloque y bolas al día siguiente; la app pone las bolas en la nevera. Al 75 %, la masa es muy blanda: trabájala con las manos mojadas.',notesIt:'Per 1 kg di farina tipo 0 (circa 12,5 % di proteine): 750 g d’acqua, 3 g di lievito fresco, 25 g di sale, 20 g d’olio d’oliva.\nImpasta la farina con 600 g dell’acqua per qualche minuto, copri e lascia riposare 30 min. Riprendi a impastare finché l’impasto incorda bene, poi aggiungi poco alla volta i 150 g d’acqua restanti, con il lievito sciolto dentro: aspetta che ogni aggiunta sia assorbita. Poi aggiungi il sale e quindi l’olio.\nForma una palla con qualche piega, in un contenitore leggermente unto. Una piega di rinforzo dopo 20 min, 30 min a temperatura ambiente, poi 24 h in frigo. Il giorno dopo, panetti da 250 g, da lasciar raddoppiare.\nStendi sulla semola senza schiacciare il bordo. Cottura molto calda (400 °C in un forno per pizza).\nVersione originale: frigo in massa, poi panetti il giorno dopo; l’app invece mette i panetti in frigo. Al 75 % l’impasto è molto morbido: lavoralo con le mani bagnate.'},'pala':{notes:'Pour 1 kg de farine : 750 g d’eau, 30 g de sel, 5 g de levure, 30 g d’huile d’olive.\nMélange la farine et le sel, verse environ 500 g d’eau, puis le reste petit à petit. Incorpore la levure, puis l’huile, et termine par quelques rabats.\nUne journée au frigo. Sors la pâte, forme les pâtons et laisse-les reposer 4 à 5 h. Étale délicatement en ovale, du centre vers l’extérieur puis en redescendant par l’intérieur, sans chasser le gaz, et fais tomber l’excès de farine.\nCuisson à 270–280 °C sur pierre. Double cuisson : 4 à 5 min la pâte seule, puis garnis et remets environ 2 min. Elle se mange aussi nature.\nPas de pierre : retourne une plaque du four et fais-la chauffer à vide avec le four.\nLa pizza alla pala vient de Rome et doit son nom à la longue pelle en bois sur laquelle on la sert.',notesEn:'For 1 kg flour: 750 g water, 30 g salt, 5 g yeast, 30 g olive oil.\nMix the flour and salt, pour in about 500 g water, then the rest little by little. Work in the yeast, then the oil, and finish with a few folds.\nOne day in the fridge. Take the dough out, shape the balls and let them rest 4 to 5 h. Stretch gently into an oval, from the centre outwards and then back down through the inside, without pushing out the gas, and shake off the excess flour.\nBake at 270–280 °C (520–540 °F) on a stone. Two-stage bake: 4 to 5 min for the dough alone, then top it and bake about 2 more min. It is also good plain.\nNo stone: turn a baking sheet upside down and preheat it empty with the oven.\nPizza alla pala comes from Rome and is named after the long wooden peel it is served on.',notesEs:'Para 1 kg de harina: 750 g de agua, 30 g de sal, 5 g de levadura, 30 g de aceite de oliva.\nMezcla la harina y la sal, vierte unos 500 g de agua y luego el resto poco a poco. Incorpora la levadura, después el aceite, y termina con unos pliegues.\nUn día en la nevera. Saca la masa, forma las bolas y déjalas reposar 4 a 5 h. Estira con suavidad en óvalo, del centro hacia fuera y luego bajando por el interior, sin sacar el gas, y quita el exceso de harina.\nHornea a 270–280 °C sobre piedra. Doble cocción: 4 a 5 min la masa sola, luego cubre y vuelve a hornear unos 2 min. También se come sola.\nSin piedra: da la vuelta a una bandeja del horno y precaliéntala vacía con el horno.\nLa pizza alla pala viene de Roma y debe su nombre a la larga pala de madera en la que se sirve.',notesIt:'Per 1 kg di farina: 750 g d’acqua, 30 g di sale, 5 g di lievito, 30 g d’olio d’oliva.\nMescola farina e sale, versa circa 500 g d’acqua, poi il resto poco alla volta. Incorpora il lievito, poi l’olio, e finisci con qualche piega.\nUn giorno in frigo. Togli l’impasto, forma i panetti e lasciali riposare 4–5 h. Stendi delicatamente a forma ovale, dal centro verso l’esterno e poi ridiscendendo dall’interno, senza far uscire il gas, e togli la farina in eccesso.\nCottura a 270–280 °C su pietra. Doppia cottura: 4–5 min l’impasto da solo, poi condisci e rimetti in forno circa 2 min. È buona anche bianca.\nSenza pietra: capovolgi una teglia del forno e scaldala vuota insieme al forno.\nLa pizza alla pala viene da Roma e deve il nome alla lunga pala di legno su cui si serve.'},'pan-pablo':{notes:'Recette de Pablo, pour 4 moules de 32 cm : 1 kg de farine, 600 ml d’eau tiède (35–40 °C), 2 sachets de levure sèche (environ 14 g), 4 c. à soupe de lait en poudre (le secret du moelleux), 2 c. à soupe de sucre, 1 c. à soupe de sel, 4 c. à soupe d’huile végétale dans la pâte, et 3 c. à soupe d’huile au fond de chaque moule.\nPâte divisée aussitôt en pâtons de 400 à 420 g, étalée dans les moules huilés, levée 1 h 30 à 2 h (ou une nuit au frigo, sortie 1 h avant).\nFour à 250 °C ou au maximum, grille du bas, 12 à 15 min. Sauce un peu sucrée (coulis, une pointe de concentré, une pincée de sucre, origan, ail semoule) ; fromage généreux jusqu’au bord.\nBord fourré au fromage : étale la pâte un peu plus large que le moule, pose des bâtonnets de mozzarella sur le pourtour et replie la pâte par-dessus en pinçant bien.',notesEn:'Pablo’s recipe, for 4 pans of 32 cm: 1 kg flour, 600 ml warm water (35–40 °C), 2 packets dry yeast (about 14 g), 4 tbsp milk powder (the secret of the softness), 2 tbsp sugar, 1 tbsp salt, 4 tbsp vegetable oil in the dough, and 3 tbsp oil in each pan.\nDivide right away into 400 to 420 g balls, spread in the oiled pans, rise 1 h 30 to 2 h (or overnight in the fridge, out 1 h before).\nOven at 250 °C (480 °F) or max, bottom rack, 12 to 15 min. Slightly sweet sauce (passata, a little paste, a pinch of sugar, oregano, garlic powder); generous cheese right to the edge.\nCheese-stuffed crust: spread the dough a little wider than the pan, lay mozzarella sticks around the edge and fold the dough over, pinching well.',notesEs:'Receta de Pablo, para 4 moldes de 32 cm: 1 kg de harina, 600 ml de agua tibia (35–40 °C), 2 sobres de levadura seca (unos 14 g), 4 cdas. de leche en polvo (el secreto de la esponjosidad), 2 cdas. de azúcar, 1 cda. de sal, 4 cdas. de aceite vegetal en la masa y 3 cdas. de aceite en cada molde.\nDivide enseguida en bolas de 400 a 420 g, extiéndelas en los moldes aceitados, levado de 1 h 30 a 2 h (o una noche en la nevera, sacar 1 h antes).\nHorno a 250 °C o al máximo, rejilla inferior, 12 a 15 min. Salsa un poco dulce (tomate triturado, una punta de concentrado, una pizca de azúcar, orégano, ajo en polvo); queso generoso hasta el borde.\nBorde relleno de queso: extiende la masa un poco más ancha que el molde, pon bastoncitos de mozzarella por el contorno y dobla la masa por encima, pellizcando bien.',notesIt:'Ricetta di Pablo, per 4 stampi da 32 cm: 1 kg di farina, 600 ml d’acqua tiepida (35–40 °C), 2 bustine di lievito secco (circa 14 g), 4 cucchiai di latte in polvere (il segreto della morbidezza), 2 cucchiai di zucchero, 1 cucchiaio di sale, 4 cucchiai d’olio di semi nell’impasto e 3 cucchiai d’olio in ogni stampo.\nDividi subito in panetti da 400–420 g, stendili negli stampi unti, lievitazione di 1 h 30–2 h (o una notte in frigo, fuori 1 h prima).\nForno a 250 °C o al massimo, griglia in basso, 12–15 min. Salsa un po’ dolce (passata, un po’ di concentrato, un pizzico di zucchero, origano, aglio in polvere); formaggio abbondante fino al bordo.\nBordo ripieno di formaggio: stendi l’impasto un po’ più largo dello stampo, metti bastoncini di mozzarella lungo il bordo e ripiega l’impasto sopra, pizzicando bene.'},'plaque-semoule':{notes:'Recette de Pablo, pour 4 pizzas de 32 cm sur plaques métalliques : 630 g de farine forte (13,7 g de protéines pour 100 g), 70 g de semoule de blé fine, 450 ml d’eau tiède (30–35 °C), 9 g de levure sèche active, 13 g de sel, 25 ml d’huile d’olive, 1 pincée de sucre.\nLevure activée 5 à 10 min dans l’eau tiède sucrée ; pétrissage 12 à 15 min, sel en dernier ; levée en masse environ 4 h 15 ; division en 4 pâtons d’environ 300 g, détente 45 min (ne pas la sauter : la farine forte se rétracte).\nFour à 230 °C en chaleur tournante, préchauffé au moins 45 min, niveau le plus bas, 11 à 13 min. Étaler du centre vers les bords sans écraser le bord, plaque légèrement huilée, garnir avec modération, bords huilés au pinceau.\nL’hydratation de l’appli (70 %) est calculée sur la farine seule ; avec la semoule, elle est d’environ 64 %.',notesEn:'Pablo’s recipe, for 4 pizzas of 32 cm on metal pans: 630 g strong flour (13.7 g protein per 100 g), 70 g fine durum semolina, 450 ml warm water (30–35 °C), 9 g active dry yeast, 13 g salt, 25 ml olive oil, a pinch of sugar.\nYeast activated 5 to 10 min in the sweetened warm water; knead 12 to 15 min, salt last; bulk rise about 4 h 15; divide into 4 balls of about 300 g, rest 45 min (do not skip: strong flour springs back).\nOven at 230 °C (445 °F) convection, preheated at least 45 min, lowest rack, 11 to 13 min. Stretch from the centre out without crushing the rim, lightly oiled pan, top sparingly, rim brushed with oil.\nThe app’s hydration (70%) is on flour only; with the semolina it is about 64%.',notesEs:'Receta de Pablo, para 4 pizzas de 32 cm en bandejas metálicas: 630 g de harina de fuerza (13,7 g de proteína por 100 g), 70 g de sémola fina de trigo duro, 450 ml de agua tibia (30–35 °C), 9 g de levadura seca activa, 13 g de sal, 25 ml de aceite de oliva, 1 pizca de azúcar.\nLevadura activada 5 a 10 min en el agua tibia con azúcar; amasado 12 a 15 min, la sal al final; levado en bloque unas 4 h 15; división en 4 bolas de unos 300 g, reposo 45 min (no saltarlo: la harina de fuerza se retrae).\nHorno a 230 °C con ventilador, precalentado al menos 45 min, nivel más bajo, 11 a 13 min. Estirar del centro hacia los bordes sin aplastar el borde, bandeja ligeramente aceitada, cubrir con moderación, bordes pintados con aceite.\nLa hidratación de la app (70 %) se calcula solo sobre la harina; con la sémola es de unos 64 %.',notesIt:'Ricetta di Pablo, per 4 pizze da 32 cm su teglie di metallo: 630 g di farina forte (13,7 g di proteine per 100 g), 70 g di semola rimacinata, 450 ml d’acqua tiepida (30–35 °C), 9 g di lievito secco attivo, 13 g di sale, 25 ml d’olio d’oliva, 1 pizzico di zucchero.\nLievito attivato 5–10 min nell’acqua tiepida zuccherata; impasto 12–15 min, sale per ultimo; lievitazione in massa circa 4 h 15; divisione in 4 panetti da circa 300 g, riposo 45 min (da non saltare: la farina forte si ritira).\nForno a 230 °C ventilato, preriscaldato almeno 45 min, livello più basso, 11–13 min. Stendere dal centro verso i bordi senza schiacciare il cornicione, teglia leggermente unta, condire con moderazione, bordi spennellati d’olio.\nL’idratazione dell’app (70 %) è calcolata sulla sola farina; con la semola è circa 64 %.'},'express-70':{notes:'Pour 3 pâtons de 285 g : 500 g de farine, 350 g d’eau (70 %), 12 g de sel, 3 g de levure sèche instantanée.\nMélange tout jusqu’à ce qu’il ne reste plus de farine sèche ; boule grossière, couverte, 30 min. Un rabat d’environ 1 min ; 30 min ; un second rabat. Sur le plan de travail, forme une boule lisse, couverte, 30 min. Divise en 3 pâtons et laisse-les 1 h 30 dans des boîtes.\nPas de pétrissage long : ce sont les rabats et le temps qui développent le gluten. L’appli suit le déroulé de la méthode Express ; remplace le pétrissage par les rabats.',notesEn:'For 3 balls of 285 g: 500 g flour, 350 g water (70%), 12 g salt, 3 g instant dry yeast.\nMix everything until no dry flour remains; rough ball, covered, 30 min. One fold of about 1 min; 30 min; a second fold. On the counter, shape a smooth ball, covered, 30 min. Divide into 3 balls and leave them 1 h 30 in boxes.\nNo long kneading: folds and time develop the gluten. The app follows the Express method’s steps; replace kneading with the folds.',notesEs:'Para 3 bolas de 285 g: 500 g de harina, 350 g de agua (70 %), 12 g de sal, 3 g de levadura seca instantánea.\nMezcla todo hasta que no quede harina seca; bola tosca, tapada, 30 min. Un pliegue de 1 min; 30 min; un segundo pliegue. En la encimera, forma una bola lisa, tapada, 30 min. Divide en 3 bolas y déjalas 1 h 30 en cajas.\nSin amasado largo: los pliegues y el tiempo desarrollan el gluten. La app sigue los pasos del método Exprés; sustituye el amasado por los pliegues.',notesIt:'Per 3 panetti da 285 g: 500 g di farina, 350 g d’acqua (70 %), 12 g di sale, 3 g di lievito secco istantaneo.\nMescola tutto finché non resta farina secca; palla grossolana, coperta, 30 min. Una piega di circa 1 min; 30 min; una seconda piega. Sul piano forma una palla liscia, coperta, 30 min. Dividi in 3 panetti e lasciali 1 h 30 nelle cassette.\nNiente impasto lungo: pieghe e tempo sviluppano il glutine. L’app segue i passaggi del metodo Express; sostituisci l’impasto con le pieghe.'},'focaccia':{notes:'500 g de farine (T55, Manitoba ou 00), 400 ml d’eau tiède, 1 sachet de levure sèche (7 g) ou 20 g de levure fraîche, 2 c. à café de sel fin, 1 c. à café de sucre ou de miel, huile d’olive généreuse, fleur de sel, romarin frais.\nLevure et sucre dans l’eau tiède 5 min ; farine et sel à la spatule, sans pétrir ; filet d’huile, couvert, 1 h 30 à 2 h au chaud. Plaque bien huilée, pâte pliée 1 ou 2 fois puis versée et étalée mains huilées ; 30 à 45 min sans couvrir. Four 220 °C ; huile, creux avec les dix doigts jusqu’au fond, fleur de sel, romarin ; 20 à 25 min. À la sortie, un filet d’huile, tiédir sur une grille.',notesEn:'500 g flour (all-purpose, Manitoba or 00), 400 ml warm water, 1 packet instant yeast (7 g) or 20 g fresh yeast, 2 tsp fine salt, 1 tsp sugar or honey, plenty of olive oil, flaky salt, fresh rosemary.\nYeast and sugar in warm water 5 min; flour and salt with a spatula, no kneading; drizzle of oil, covered, 1 h 30 to 2 h somewhere warm. Well-oiled pan, fold the dough once or twice, pour and spread with oiled hands; 30 to 45 min uncovered. Oven 220 °C (425 °F); oil, dimple with all ten fingers to the bottom, flaky salt, rosemary; 20 to 25 min. Drizzle oil when it comes out, cool on a rack.',notesEs:'500 g de harina (común, Manitoba o 00), 400 ml de agua tibia, 1 sobre de levadura seca (7 g) o 20 g de levadura fresca, 2 cdtas. de sal fina, 1 cdta. de azúcar o miel, aceite de oliva generoso, sal en escamas, romero fresco.\nLevadura y azúcar en el agua tibia 5 min; harina y sal con espátula, sin amasar; chorrito de aceite, tapado, 1 h 30 a 2 h en un sitio cálido. Bandeja bien aceitada, masa plegada 1 o 2 veces, vertida y extendida con las manos aceitadas; 30 a 45 min sin tapar. Horno a 220 °C; aceite, hoyos con los diez dedos hasta el fondo, sal en escamas, romero; 20 a 25 min. Al salir, un chorrito de aceite y templar sobre una rejilla.',notesIt:'500 g di farina (comune, Manitoba o 00), 400 ml d’acqua tiepida, 1 bustina di lievito secco (7 g) o 20 g di lievito fresco, 2 cucchiaini di sale fino, 1 cucchiaino di zucchero o miele, olio d’oliva in abbondanza, sale in fiocchi, rosmarino fresco.\nLievito e zucchero in acqua tiepida 5 min; farina e sale con una spatola, senza impastare; un filo d’olio, coperto, 1 h 30–2 h in un luogo caldo. Teglia ben unta, piegare l’impasto una o due volte, versarlo e stenderlo con le mani unte; 30–45 min scoperto. Forno a 220 °C; olio, fossette con tutte e dieci le dita fino al fondo, sale in fiocchi, rosmarino; 20–25 min. Un filo d’olio all’uscita, raffreddare su una griglia.'},'pugliese':{notes:'Focaccia des Pouilles (région de Bari) : la pomme de terre dans la pâte la rend très moelleuse et l’empêche de sécher.\nPour une plaque de 30 × 40 cm (6 personnes) : 300 g de farine (T45, 00 ou tout usage), 150 g de semoule fine de blé dur, 150 g de pomme de terre cuite et écrasée, 250 à 300 ml d’eau tiède, 5 g de levure sèche (ou 15 g de fraîche), 1 c. à thé de sucre, 10 g de sel, 3 c. à soupe d’huile d’olive, plus de l’huile pour la plaque et le dessus.\nCuire la pomme de terre avec la peau, l’éplucher chaude et l’écraser finement. Activer la levure 5 min dans l’eau tiède sucrée, ajouter farine, semoule, sel, purée et huile, pétrir 10 min : la pâte est souple et collante.\n1re levée de 2 à 3 h sous un torchon humide ; 2e levée de 45 min à 1 h sur la plaque bien huilée.\nCreuser avec les doigts, garnir de tomates cerises (côté coupé en bas), olives, romarin ou origan, fleur de sel et un filet d’huile. Four à 220–250 °C, 15 à 20 min.',notesEn:'Focaccia from Apulia (Bari area): potato in the dough makes it very soft and keeps it from drying out.\nFor a 30 × 40 cm pan (6 people): 300 g flour (all-purpose or 00), 150 g fine durum semolina, 150 g cooked mashed potato, 250 to 300 ml warm water, 5 g dry yeast (or 15 g fresh), 1 tsp sugar, 10 g salt, 3 tbsp olive oil, plus oil for the pan and the top.\nBoil the potato in its skin, peel it hot and mash finely. Activate the yeast 5 min in warm sugared water, add flour, semolina, salt, potato and oil, knead 10 min: the dough is soft and sticky.\n1st rise 2 to 3 h under a damp towel; 2nd rise 45 min to 1 h in the well-oiled pan.\nDimple with your fingers, top with cherry tomatoes (cut side down), olives, rosemary or oregano, flaky salt and a drizzle of oil. Oven 220–250 °C (425–480 °F), 15 to 20 min.',notesEs:'Focaccia de Apulia (zona de Bari): la patata en la masa la hace muy esponjosa y evita que se seque.\nPara una bandeja de 30 × 40 cm (6 personas): 300 g de harina (común o 00), 150 g de sémola fina de trigo duro, 150 g de patata cocida en puré, 250 a 300 ml de agua tibia, 5 g de levadura seca (o 15 g de fresca), 1 cdta. de azúcar, 10 g de sal, 3 cdas. de aceite de oliva y más aceite para la bandeja y la superficie.\nCocer la patata con piel, pelarla caliente y hacerla puré fino. Activar la levadura 5 min en agua tibia con azúcar, añadir harina, sémola, sal, puré y aceite, amasar 10 min: la masa queda suave y pegajosa.\n1.er levado de 2 a 3 h bajo un paño húmedo; 2.º levado de 45 min a 1 h en la bandeja bien aceitada.\nHundir los dedos, cubrir con tomates cherry (lado cortado hacia abajo), aceitunas, romero u orégano, sal en escamas y un chorrito de aceite. Horno a 220–250 °C, 15 a 20 min.',notesIt:'Focaccia pugliese (zona di Bari): la patata nell’impasto la rende molto soffice e le impedisce di seccarsi.\nPer una teglia di 30 × 40 cm (6 persone): 300 g di farina (00 o per tutti gli usi), 150 g di semola rimacinata di grano duro, 150 g di patata lessa schiacciata, 250–300 ml d’acqua tiepida, 5 g di lievito secco (o 15 g di fresco), 1 cucchiaino di zucchero, 10 g di sale, 3 cucchiai d’olio d’oliva, più olio per la teglia e la superficie.\nLessare la patata con la buccia, sbucciarla calda e schiacciarla finemente. Attivare il lievito 5 min in acqua tiepida zuccherata, aggiungere farina, semola, sale, patata e olio, impastare 10 min: l’impasto è morbido e appiccicoso.\n1ª lievitazione 2–3 h sotto un canovaccio umido; 2ª lievitazione 45 min–1 h nella teglia ben unta.\nFare le fossette con le dita, condire con pomodorini (lato tagliato verso il basso), olive, rosmarino o origano, sale in fiocchi e un filo d’olio. Forno a 220–250 °C, 15–20 min.'},'biga-50':{notes:'Biga la veille : la moitié de la farine, 45 % de son poids en eau fraîche et 1 % de levure fraîche (0,3 % si elle passe au frigo), mélangées juste assez pour mouiller la farine (grumeaux). 18 h vers 18 °C ; dans une cuisine plus chaude, 1 h à température ambiante puis au frigo.\nJour J : biga délayée dans le reste de l’eau, reste de la farine, sel, pétrissage 10 à 15 min, pointage 1 h, boulage, apprêt 2 h 30 environ.\nValeurs de départ courantes pour une biga, à ajuster selon ta farine et ta cuisine.',notesEn:'Biga the day before: half the flour, 45% of its weight in cool water and 1% fresh yeast (0.3% if it goes in the fridge), mixed just enough to wet the flour (lumpy). 18 h around 18 °C (64 °F); in a warmer kitchen, 1 h at room temperature then in the fridge.\nOn the day: biga dissolved in the rest of the water, rest of the flour, salt, knead 10 to 15 min, bulk 1 h, shape, proof about 2 h 30.\nCommon starting values for a biga, to adjust to your flour and kitchen.',notesEs:'Biga la víspera: la mitad de la harina, 45 % de su peso en agua fresca y 1 % de levadura fresca (0,3 % si pasa por la nevera), mezcladas lo justo para mojar la harina (grumos). 18 h hacia 18 °C; en una cocina más caliente, 1 h a temperatura ambiente y luego a la nevera.\nEl día del servicio: biga deshecha en el resto del agua, resto de la harina, sal, amasado 10 a 15 min, primer levado 1 h, boleado, segundo levado unas 2 h 30.\nValores de partida habituales para una biga, a ajustar según tu harina y tu cocina.',notesIt:'Biga il giorno prima: metà della farina, 45 % del suo peso in acqua fresca e 1 % di lievito fresco (0,3 % se passa in frigo), mescolati quanto basta per bagnare la farina (grumi). 18 h intorno ai 18 °C; in una cucina più calda, 1 h a temperatura ambiente poi in frigo.\nIl giorno stesso: biga sciolta nel resto dell’acqua, resto della farina, sale, impasto 10–15 min, puntata 1 h, formatura, appretto circa 2 h 30.\nValori di partenza comuni per una biga, da regolare secondo la farina e la cucina.'},'biga-48':{notes:'Biga : la moitié de la farine (farine forte, W 340 environ), 50 % de son poids en eau froide, 0,3 % de levure fraîche ; mélanger, 2 h à température ambiante, puis 20 h au frigo.\nPâte finale : biga, le reste de la farine (W 300 environ) et de l’eau froide, un peu de levure fraîche, le sel ; hydratation totale 70 %, sel 2,5 %. Pétrir jusqu’à une pâte lisse.\nPâtons de 280 g, 20 h au frigo, sortis 4 h avant la cuisson. Pâte croustillante et aérée.\nL’appli prépare la biga à 45 % d’eau ; la différence est faible.',notesEn:'Biga: half the flour (strong flour, about W 340), 50% of its weight in cold water, 0.3% fresh yeast; mix, 2 h at room temperature, then 20 h in the fridge.\nFinal dough: biga, the rest of the flour (about W 300) and cold water, a little fresh yeast, the salt; total hydration 70%, salt 2.5%. Knead until smooth.\n280 g balls, 20 h in the fridge, out 4 h before baking. Crisp, airy crust.\nThe app makes the biga at 45% water; the difference is small.',notesEs:'Biga: la mitad de la harina (harina de fuerza, unos W 340), 50 % de su peso en agua fría, 0,3 % de levadura fresca; mezclar, 2 h a temperatura ambiente y luego 20 h en la nevera.\nMasa final: biga, el resto de la harina (unos W 300) y del agua fría, un poco de levadura fresca, la sal; hidratación total 70 %, sal 2,5 %. Amasar hasta que esté lisa.\nBolas de 280 g, 20 h en la nevera, sacadas 4 h antes de hornear. Corteza crujiente y aireada.\nLa app prepara la biga con 45 % de agua; la diferencia es pequeña.',notesIt:'Biga: metà della farina (farina forte, circa W 340), 50 % del suo peso in acqua fredda, 0,3 % di lievito fresco; mescolare, 2 h a temperatura ambiente, poi 20 h in frigo.\nImpasto finale: biga, il resto della farina (circa W 300) e dell’acqua fredda, un po’ di lievito fresco, il sale; idratazione totale 70 %, sale 2,5 %. Impastare fino a un impasto liscio.\nPanetti da 280 g, 20 h in frigo, fuori 4 h prima della cottura. Crosta croccante e alveolata.\nL’app prepara la biga al 45 % d’acqua; la differenza è piccola.'},'vito-100':{notes:'Proportions : 145 g de farine pour 100 ml d’eau (environ 69 % d’hydratation). Pour 3 pizzas de 30 cm : 435 g de farine, 300 ml d’eau, 15 g de sel.\nPoolish 16 à 24 h avant : 300 ml d’eau, 5 g de levure fraîche, 5 g de miel, 300 g de farine.\nVersion 100 % : toute l’eau est dans le poolish. Le jour J, il reste seulement 135 g de farine et 15 g de sel à ajouter, sans eau.\nLes quantités se recalculent si tu changes le nombre ou la taille des pizzas.',notesEn:'Ratio: 145 g flour per 100 ml water (about 69% hydration). For 3 pizzas of 30 cm: 435 g flour, 300 ml water, 15 g salt.\nPoolish 16 to 24 h ahead: 300 ml water, 5 g fresh yeast, 5 g honey, 300 g flour.\n100% version: all the water is in the poolish. On the day you only add 135 g flour and 15 g salt, no water.\nAmounts update if you change the number or size of pizzas.',notesEs:'Proporciones: 145 g de harina por 100 ml de agua (unos 69 % de hidratación). Para 3 pizzas de 30 cm: 435 g de harina, 300 ml de agua, 15 g de sal.\nPoolish 16 a 24 h antes: 300 ml de agua, 5 g de levadura fresca, 5 g de miel, 300 g de harina.\nVersión 100 %: toda el agua está en el poolish. El día del servicio solo se añaden 135 g de harina y 15 g de sal, sin agua.\nLas cantidades se recalculan si cambias el número o el tamaño de las pizzas.',notesIt:'Proporzioni: 145 g di farina per 100 ml d’acqua (circa 69 % d’idratazione). Per 3 pizze da 30 cm: 435 g di farina, 300 ml d’acqua, 15 g di sale.\nPoolish 16–24 h prima: 300 ml d’acqua, 5 g di lievito fresco, 5 g di miele, 300 g di farina.\nVersione 100 %: tutta l’acqua è nel poolish. Il giorno stesso restano da aggiungere solo 135 g di farina e 15 g di sale, senza acqua.\nLe quantità si ricalcolano se cambi il numero o la misura delle pizze.'},'vito-20':{notes:'Mêmes proportions que la version 100 % : 435 g de farine, 300 ml d’eau et 15 g de sel pour 3 pizzas de 30 cm.\nVersion « 20 % » : poolish de 50 ml d’eau et 50 g de farine (levure et miel réduits en proportion), fait 16 à 24 h avant. Dans l’atelier, cela représente 17 % de l’eau.\nLe jour J : il reste 385 g de farine, 250 ml d’eau et 15 g de sel à ajouter.',notesEn:'Same ratio as the 100% version: 435 g flour, 300 ml water and 15 g salt for 3 pizzas of 30 cm.\n“20%” version: poolish of 50 ml water and 50 g flour (yeast and honey scaled down), made 16 to 24 h ahead. In the app this is 17% of the water.\nOn the day: add the remaining 385 g flour, 250 ml water and 15 g salt.',notesEs:'Mismas proporciones que la versión 100 %: 435 g de harina, 300 ml de agua y 15 g de sal para 3 pizzas de 30 cm.\nVersión «20 %»: poolish de 50 ml de agua y 50 g de harina (levadura y miel reducidas en proporción), hecho 16 a 24 h antes. En la app equivale al 17 % del agua.\nEl día del servicio: quedan por añadir 385 g de harina, 250 ml de agua y 15 g de sal.',notesIt:'Stesse proporzioni della versione 100 %: 435 g di farina, 300 ml d’acqua e 15 g di sale per 3 pizze da 30 cm.\nVersione «20 %»: poolish con 50 ml d’acqua e 50 g di farina (lievito e miele ridotti in proporzione), fatto 16–24 h prima. Nell’app corrisponde al 17 % dell’acqua.\nIl giorno stesso: restano da aggiungere 385 g di farina, 250 ml d’acqua e 15 g di sale.'},'base-complete':{notes:'Pour 2 pizzas de 40 cm : 540 g de farine, 330 ml d’eau, 1 c. à thé de sel (environ 6 g), 1 c. à thé de miel (environ 7 g), 1 sachet de levure sèche (environ 8 g), 5 g d’huile d’olive dans la pâte.\nLa levure est activée dans l’eau tiède miellée, puis une seule levée de 3 à 6 h, la même journée.\nUn peu d’huile d’olive sur les mains pour manipuler la pâte, et au pinceau sur les bords de la pizza avant d’enfourner.\nMême esprit que ma recette au poolish : c’est surtout la façon de faire lever et de pétrir qui change.',notesEn:'For 2 pizzas of 40 cm: 540 g flour, 330 ml water, 1 tsp salt (about 6 g), 1 tsp honey (about 7 g), 1 packet dry yeast (about 8 g), 5 g olive oil in the dough.\nThe yeast is activated in warm honey water, then a single 3 to 6 h rise, same day.\nA little olive oil on your hands to handle the dough, and brushed on the rim before baking.\nSame spirit as my poolish recipe: mainly the rising and kneading method changes.',notesEs:'Para 2 pizzas de 40 cm: 540 g de harina, 330 ml de agua, 1 cdta. de sal (unos 6 g), 1 cdta. de miel (unos 7 g), 1 sobre de levadura seca (unos 8 g), 5 g de aceite de oliva en la masa.\nLa levadura se activa en agua tibia con miel y luego un solo levado de 3 a 6 h, el mismo día.\nUn poco de aceite en las manos para manipular la masa y en los bordes con pincel antes de hornear.\nMismo espíritu que mi receta con poolish: cambia sobre todo la forma de levar y amasar.',notesIt:'Per 2 pizze da 40 cm: 540 g di farina, 330 ml d’acqua, 1 cucchiaino di sale (circa 6 g), 1 cucchiaino di miele (circa 7 g), 1 bustina di lievito secco (circa 8 g), 5 g d’olio d’oliva nell’impasto.\nIl lievito si attiva in acqua tiepida con miele, poi una sola lievitazione di 3–6 h, in giornata.\nUn po’ d’olio d’oliva sulle mani per maneggiare l’impasto, e col pennello sui bordi prima di infornare.\nStesso spirito della mia ricetta con poolish: cambia soprattutto il modo di far lievitare e di impastare.'},'sanjaya-napo':{notes:'600 g de farine 00, 390 g d’eau, 18 g de sel, 0,5 g de levure sèche instantanée. Farine et 350 g d’eau, repos 20 min ; levure dans le reste de l’eau ; sel ; pétrir. 2 h à température ambiante, pâtons de 250 g au frigo 18 à 24 h, 1 à 2 h dehors avant d’étaler. Cuisson 430 à 480 °C, 60 à 120 s.',notesEn:'600 g 00 flour, 390 g water, 18 g salt, 0.5 g instant yeast. Flour and 350 g water, rest 20 min; yeast in the remaining water; salt; knead. 2 h at room temperature, 250 g balls in the fridge 18 to 24 h, 1 to 2 h out before stretching. Bake at 430 to 480 °C (800–900 °F), 60 to 120 s.',notesEs:'600 g de harina 00, 390 g de agua, 18 g de sal, 0,5 g de levadura seca instantánea. Harina y 350 g de agua, reposo 20 min; levadura en el resto del agua; sal; amasar. 2 h a temperatura ambiente, bolas de 250 g en la nevera 18 a 24 h, 1 a 2 h fuera antes de estirar. Hornear a 430–480 °C, 60 a 120 s.',notesIt:'600 g di farina 00, 390 g d’acqua, 18 g di sale, 0,5 g di lievito secco istantaneo. Farina e 350 g d’acqua, riposo 20 min; il lievito nell’acqua rimanente; il sale; impastare. 2 h a temperatura ambiente, panetti da 250 g in frigo 18–24 h, fuori 1–2 h prima di stendere. Cottura a 430–480 °C, 60–120 s.'},'sanjaya-romaine':{notes:'500 g de farine forte, 375 g d’eau froide, 12 g de sel, 2 g de levure sèche instantanée, 15 g d’huile. Frigo 18 à 24 h, 1 à 2 h dehors, étaler dans une plaque bien huilée, levée 1 à 2 h. Garnir et cuire à 250–280 °C, 10 à 15 min.',notesEn:'500 g strong flour, 375 g cold water, 12 g salt, 2 g instant yeast, 15 g oil. Fridge 18 to 24 h, 1 to 2 h out, spread in a well-oiled pan, rise 1 to 2 h. Top and bake at 250–280 °C (480–540 °F), 10 to 15 min.',notesEs:'500 g de harina de fuerza, 375 g de agua fría, 12 g de sal, 2 g de levadura seca instantánea, 15 g de aceite. Nevera 18 a 24 h, 1 a 2 h fuera, extender en una bandeja bien aceitada, levar 1 a 2 h. Cubrir y hornear a 250–280 °C, 10 a 15 min.',notesIt:'500 g di farina forte, 375 g d’acqua fredda, 12 g di sale, 2 g di lievito secco istantaneo, 15 g d’olio. Frigo 18–24 h, fuori 1–2 h, stendere in teglia ben unta, lievitare 1–2 h. Condire e cuocere a 250–280 °C, 10–15 min.'},'npng-sg':{notes:'300 g de farine de riz blanche, 200 g de fécule de maïs, 7 g de psyllium, 1 pincée de sucre, 250 à 300 g d’eau tiède, 10 g de levure sèche (ou 25 g de fraîche), 30 g d’huile d’olive, 12 g de sel. Levée au moins 1 h 30 au tiède ; option frigo 24 à 72 h. Étaler très fin sur papier cuisson fariné à la farine de riz, four 275 °C en chaleur tournante.',notesEn:'300 g white rice flour, 200 g cornstarch, 7 g psyllium, a pinch of sugar, 250 to 300 g warm water, 10 g dry yeast (or 25 g fresh), 30 g olive oil, 12 g salt. Rise at least 1 h 30 somewhere warm; optional fridge 24 to 72 h. Spread very thin on rice-floured parchment, oven 275 °C (525 °F) convection.',notesEs:'300 g de harina de arroz blanca, 200 g de maicena, 7 g de psyllium, 1 pizca de azúcar, 250 a 300 g de agua tibia, 10 g de levadura seca (o 25 g de fresca), 30 g de aceite de oliva, 12 g de sal. Levar al menos 1 h 30 en un sitio templado; opción nevera 24 a 72 h. Extender muy fina sobre papel de horno con harina de arroz, horno a 275 °C con ventilador.',notesIt:'300 g di farina di riso bianca, 200 g di amido di mais, 7 g di psillio, un pizzico di zucchero, 250–300 g d’acqua tiepida, 10 g di lievito secco (o 25 g di fresco), 30 g d’olio d’oliva, 12 g di sale. Lievitazione di almeno 1 h 30 in un luogo caldo; frigo facoltativo 24–72 h. Stendere molto sottile su carta forno con farina di riso, forno a 275 °C ventilato.'}};
  carnet.entries.forEach(e=>{ const sd=SEEDS.find(x=>x.id===e.id), o=ON[e.id]; if(!sd||!o) return; ['notes','notesEn','notesEs','notesIt'].forEach(k=>{ if(!e[k]||e[k]===o[k]||/Notes d’origine|Pour 2 pizzas de 40|Jour J, 16 h/.test(e[k])) e[k]=sd[k]; }); });
  carnet.seedV=13;
}
let dirty=0, fileHandle=null, fileTimer=null;
function saveC(){ carnet.changedAt=new Date().toISOString(); try{ localStorage.setItem(CK,JSON.stringify(carnet)); }catch(e){} dirty++; $('xData').value=JSON.stringify(exportObj('sauvegarde'),null,1); fileStatus(); if(fileHandle){ clearTimeout(fileTimer); fileTimer=setTimeout(writeFile,800); } }

/* ---------- files: export, download, import ---------- */
function exportObj(type,extra){
  const base={app:'Atelier Pizza',version:VERSION,type,exporte_le:new Date().toISOString()};
  if(type==='sauvegarde') return {...base,recettes:carnet.entries,garnitures:carnet.toppings,bases:carnet.bases||[],methodes:carnet.methods,categories:carnet.cats,notes:carnet.notes||'',prix:carnet.prices||{},notes_methodes:carnet.mstars||{},...(getPhoto()?{photo:getPhoto()}:{})};
  return {...base,...extra};
}
async function dl(obj,name){
  const data=JSON.stringify(obj,null,2);
  try{ if(window.claude&&typeof window.claude.use==='function'){ const d=await window.claude.use('downloads'); if(d){ await d.save({filename:name,data}); return 'ok'; } } }
  catch(e){ if(e&&e.code==='declined') return 'declined'; }
  try{ const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([data],{type:'application/json'})); a.download=name; document.body.appendChild(a); a.click(); a.remove(); return 'ok'; }catch(e){ return 'fail'; }
}
const fname=(kind,title)=>`${VERSION}_${kind}${title?'_'+String(title).normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^A-Za-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,40):''}_${todayStr()}.json`;
const unsaved=()=>!!carnet.changedAt&&(!carnet.lastFile||carnet.changedAt>carnet.lastFile);
function markSaved(){ carnet.lastFile=new Date().toISOString(); if(carnet.changedAt>carnet.lastFile) carnet.changedAt=carnet.lastFile; dirty=0; try{ localStorage.setItem(CK,JSON.stringify(carnet)); }catch(e){} fileStatus(); }
function saveBars(){
  const fmt=d=>new Date(d).toLocaleString(LOC,{dateStyle:'medium',timeStyle:'short'});
  const u=unsaved(), txt=u?T(`Changements non sauvegardés dans un fichier (depuis le ${fmt(carnet.changedAt)}).`,`Changes not saved to a file (since ${fmt(carnet.changedAt)}).`,`Cambios sin guardar en un archivo (desde el ${fmt(carnet.changedAt)}).`,`Modifiche non salvate in un file (dal ${fmt(carnet.changedAt)}).`)
    :carnet.lastFile?T(`Tout est sauvegardé (dernier fichier : ${fmt(carnet.lastFile)}).`,`Everything is saved (last file: ${fmt(carnet.lastFile)}).`,`Todo está guardado (último archivo: ${fmt(carnet.lastFile)}).`,`Tutto è salvato (ultimo file: ${fmt(carnet.lastFile)}).`)
    :T('Aucun changement depuis l’installation.','No changes since setup.','Ningún cambio desde la instalación.','Nessuna modifica dall’installazione.');
  document.querySelectorAll('[data-savest]').forEach(el=>{ el.textContent=txt; el.classList.toggle('warn',u); });
}
async function saveAll(){
  if(fileHandle){ await writeFile(); if(!fileHandle) return saveAll(); }
  else { const r=await dl(exportObj('sauvegarde'),fname(T('sauvegarde','backup','copia','backup'))); if(r!=='ok'){ if(r==='fail') $('xMsg').textContent=T('Téléchargement impossible ici : utilise le copier-coller.','Download not possible here: use copy and paste.','Descarga no disponible aquí: usa copiar y pegar.','Download non possibile qui: usa copia e incolla.'); return; } markSaved(); }
  document.querySelectorAll('[data-savest]').forEach(el=>{ el.textContent=T('Fichier de sauvegarde créé. Range-le dans un dossier que tu retrouves facilement.','Backup file created. Keep it in a folder you can find easily.','Archivo de copia creado. Guárdalo en una carpeta fácil de encontrar.','File di backup creato. Mettilo in una cartella che ritrovi facilmente.'); el.classList.remove('warn'); });
}
document.querySelectorAll('[data-saveall]').forEach(b=>b.addEventListener('click',saveAll));
window.addEventListener('beforeunload',e=>{ if(unsaved()){ e.preventDefault(); e.returnValue=''; return ''; } });

  saveBars();
  const last=carnet.lastFile?new Date(carnet.lastFile).toLocaleString(LOC,{dateStyle:'medium',timeStyle:'short'}):T('jamais','never','nunca','mai');
  $('xStatus').textContent=(fileHandle?T('Sauvegarde automatique active : chaque modification est écrite dans ton fichier. ','Automatic backup on: every change is written to your file. ','Copia automática activa: cada cambio se escribe en tu archivo. ','Backup automatico attivo: ogni modifica viene scritta nel tuo file.'):'')+T(`Dernière sauvegarde dans un fichier : ${last}.`,`Last file backup: ${last}.`,`Última copia en archivo: ${last}.`,`Ultimo backup in un file: ${last}.`)+(!fileHandle&&unsaved()?T(' Des modifications ne sont pas encore dans un fichier.',' Some changes are not in a file yet.',' Hay cambios que aún no están en un archivo.',' Alcune modifiche non sono ancora in un file.'):'');
}
async function writeFile(){ if(!fileHandle) return; try{ const w=await fileHandle.createWritable(); await w.write(JSON.stringify(exportObj('sauvegarde'),null,2)); await w.close(); markSaved(); }catch(e){ fileHandle=null; fileStatus(); $('xMsg').textContent=T('Écriture impossible : clique de nouveau sur « Sauvegarde automatique ».','Could not write: click “Automatic backup” again.','No se pudo escribir: vuelve a pulsar «Copia automática».','Scrittura impossibile: clicca di nuovo su «Backup automatico».'); } }
$('xAuto').addEventListener('click',async()=>{
  if(!window.showSaveFilePicker){ $('xMsg').textContent=T('Ton navigateur ne permet pas la sauvegarde automatique ici (ouvre le fichier .html dans Chrome sur ordinateur). Utilise « Télécharger la sauvegarde complète ».','Your browser does not allow automatic backup here (open the .html file in Chrome on a computer). Use “Download full backup”.','Tu navegador no permite la copia automática aquí (abre el archivo .html en Chrome en un ordenador). Usa «Descargar la copia completa».','Il tuo browser non consente qui il backup automatico (apri il file .html in Chrome su computer). Usa «Scarica il backup completo».'); return; }
  try{ fileHandle=await window.showSaveFilePicker({suggestedName:`${VERSION}_sauvegarde.json`,types:[{description:'JSON',accept:{'application/json':['.json']}}]}); await writeFile(); $('xMsg').textContent=T('Fichier choisi. À la prochaine ouverture de l’appli, reclique ici et choisis le même fichier.','File chosen. Next time you open the app, click here again and pick the same file.','Archivo elegido. La próxima vez que abras la app, vuelve a pulsar aquí y elige el mismo archivo.','File scelto. La prossima volta che apri l’app, clicca di nuovo qui e scegli lo stesso file.'); }
  catch(e){ if(e&&e.name!=='AbortError') $('xMsg').textContent=T('Sauvegarde automatique impossible ici : utilise « Télécharger la sauvegarde complète ».','Automatic backup not possible here: use “Download full backup”.','Copia automática no disponible aquí: usa «Descargar la copia completa».','Backup automatico non possibile qui: usa «Scarica il backup completo».'); }
});
$('xAll').addEventListener('click',async()=>{ const r=await dl(exportObj('sauvegarde'),fname(T('sauvegarde','backup','copia','backup'))); if(r==='ok'){ markSaved(); $('xMsg').textContent=T('Fichier proposé au téléchargement. Range-le dans un dossier que tu retrouves facilement.','File offered for download. Keep it in a folder you can find easily.','Archivo ofrecido para descargar. Guárdalo en una carpeta fácil de encontrar.','File proposto per il download. Mettilo in una cartella che ritrovi facilmente.'); } else if(r==='fail') $('xMsg').textContent=T('Téléchargement impossible ici : utilise le copier-coller.','Download not possible here: use copy and paste.','Descarga no disponible aquí: usa copiar y pegar.','Download non possibile qui: usa copia e incolla.'); });
const canon=o=>JSON.stringify(o,(k,v)=>v&&typeof v==='object'&&!Array.isArray(v)?Object.keys(v).sort().reduce((a,x)=>(a[x]=v[x],a),{}):v);
function uniq(list,item,key){ const ex=list.find(x=>x.id===item.id); if(!ex){ list.push(item); return 1; } if(canon(ex)===canon(item)) return 0; const cp={...item,id:item.id+'-'+Date.now().toString(36)}; if(cp[key]) cp[key]+=T(' (importée)',' (imported)',' (importada)',' (importata)'); list.push(cp); return 1; }
function importText(txt){
  let d; try{ d=JSON.parse(txt); }catch(e){ return T('Fichier illisible : ce n’est pas un fichier .json valide.','Unreadable file: not a valid .json file.','Archivo ilegible: no es un .json válido.','File illeggibile: non è un file .json valido.'); }
  let nr=0, nt=0, nm=0;
  const recs=Array.isArray(d)?d.filter(x=>x&&x.params&&!('nameEn' in x)):(d.recettes||d.entries||(d.params&&d.title?[d]:[]));
  const tops=d.garnitures||(d.type==='garniture'&&d.garniture?[d.garniture]:[]);
  const meths=d.methodes||(d.methode?[d.methode]:[]);
  (meths||[]).forEach(m=>{ if(m&&m.id&&m.steps) nm+=uniq(carnet.methods,m,'name'); });
  (recs||[]).forEach(e=>{ if(e&&e.params){ if(e.cat&&!carnet.cats.includes(e.cat)) carnet.cats.push(e.cat); nr+=uniq(carnet.entries,{stars:0,cat:'Pizza',...e},'title'); } });
  (tops||[]).forEach(t=>{ if(t&&t.params) nt+=uniq(carnet.toppings,{stars:0,...t},'name'); });
  (d.bases||[]).forEach(b=>{ if(b&&b.id&&b.name) uniq(carnet.bases,b,'name'); }); refreshSauce();
  (d.categories||[]).forEach(c=>{ if(!carnet.cats.includes(c)) carnet.cats.push(c); });
  if(d.notes&&!(carnet.notes||'').includes(d.notes)) carnet.notes=(carnet.notes?carnet.notes+'\n\n':'')+d.notes;
  const ms=d.notes_methodes; if(ms&&typeof ms==='object'){ carnet.mstars=carnet.mstars||{}; for(const [k,v] of Object.entries(ms)) if(!carnet.mstars[k]&&v) carnet.mstars[k]=v; }
  if(d.photo&&typeof d.photo==='string'&&d.photo.startsWith('data:image/')&&!getPhoto()) savePhoto(d.photo);

/* ---------- country switch ---------- */
const LGK='atelier-pizza-lang';
function setCountry(k,keepState,lang){
  const st=keepState?read():null;
  const old={'ca-fr':['ca','fr'],'ca-en':['ca','en']}[k]; if(old){ k=old[0]; lang=lang||old[1]; }
  CK_=COUNTRIES[k]?k:'ca'; C=COUNTRIES[CK_]; LANG=['fr','en','es','it'].includes(lang)?lang:C.lang; LOC=LANG+'-'+C.cc;
  $('country').value=CK_; $('lang').value=LANG;
  try{ localStorage.setItem(CTRY,CK_); localStorage.setItem(LGK,LANG); }catch(e){}
  buildOptions(); applyI18n(); if(typeof uiReady!=='undefined'&&uiReady){ renderFaq(); renderCred(); cookLabels(); timerSig=''; tick(); renderUse(); }
  if(st) apply(st);
  hdrSel();
}
function hdrSel(){
  const L=[['look',T('Apparence du site','Appearance','Apariencia del sitio','Aspetto del sito'),window.__lookV||'cahier'],['lang',T('Langue','Language','Idioma','Lingua'),LANG],['country',T('Pays','Country','País','Paese'),CK_]];
  L.forEach(([id,lab,v])=>{ const el=$(id); if(!el) return; let h=el.querySelector('option[data-hdr]');
    if(!h){ h=document.createElement('option'); h.dataset.hdr='1'; h.value=''; h.disabled=true; el.insertBefore(h,el.firstChild); }
    h.textContent=lab;
    [...el.options].forEach(o=>{ if(o.dataset.hdr) return; const base=o.textContent.replace(/^✓ /,''); o.textContent=(o.value===v?'✓ ':'')+base; });
    el.selectedIndex=0; });
}
function relang(){ render(); fileStatus(); renderC(); renderT(); const ce=carnet.entries.find(x=>x.id===cur); if(ce){ $('cTitle').value=eTitle(ce); $('cNotes').value=eNotes(ce)||''; } umFill(umCur()||null); renderToc(); }
$('country').addEventListener('change',e=>{ setCountry(e.target.value,true,COUNTRIES[e.target.value].lang); relang(); });
$('lang').addEventListener('change',e=>{ setCountry(CK_,true,e.target.value); relang(); });
