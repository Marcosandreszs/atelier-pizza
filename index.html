/* Layout: en-tête avec photo, puis réglages à gauche (collants) et résultats à droite; une colonne sur téléphone */
:root{
  --bg:#EEF0EA; --surface:#FFFFFF; --sunk:#F6F7F3; --ink:#1C211D; --muted:#5B645D; --line:#D6DAD1;
  --accent:#2E6A3A; --accent-soft:#E1EDE2; --accent-ink:#FFFFFF;
  --char:#7A3A1C; --char-soft:#F6E7DE;
  --warn:#8A5A00; --warn-soft:#FBF0D6; --info:#2B5677; --info-soft:#E3EDF5;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#121613; --surface:#1A1F1B; --sunk:#151a16; --ink:#E6EAE4; --muted:#9AA39C; --line:#2C332E;
  --accent:#86C08F; --accent-soft:#1F3324; --accent-ink:#0E1410;
  --char:#E59A70; --char-soft:#3A251B;
  --warn:#E7B850; --warn-soft:#352A12; --info:#8DB8DC; --info-soft:#18283A; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121613; --surface:#1A1F1B; --sunk:#151a16; --ink:#E6EAE4; --muted:#9AA39C; --line:#2C332E;
  --accent:#86C08F; --accent-soft:#1F3324; --accent-ink:#0E1410;
  --char:#E59A70; --char-soft:#3A251B;
  --warn:#E7B850; --warn-soft:#352A12; --info:#8DB8DC; --info-soft:#18283A; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5}
.wrap{max-width:1240px;margin:0 auto;padding-block:20px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.hero{display:grid;grid-template-columns:minmax(0,1fr);gap:14px;align-items:end;padding-bottom:14px;border-bottom:2px solid var(--ink);margin-bottom:16px}
@media (min-width:720px){header.hero{grid-template-columns:minmax(0,1fr) 360px}}
.hero-img{width:100%;height:190px;object-fit:cover;border-radius:12px;display:block}
.ver{font-family:var(--mono);font-size:.75rem;letter-spacing:.06em;background:var(--char-soft);color:var(--char);padding:2px 8px;border-radius:6px;display:inline-block;margin-bottom:8px}
h1{font-family:var(--display);font-weight:700;font-size:clamp(2.2rem,6vw,3.4rem);line-height:.9;letter-spacing:.01em;margin:0 0 8px;text-transform:uppercase}
header p{margin:0;color:var(--muted);max-width:52ch;text-wrap:balance}
h2{font-family:var(--display);font-weight:700;font-size:1.45rem;text-transform:uppercase;letter-spacing:.03em;margin:0;line-height:1.1}

 umH:['Ta méthode utilise les réglages de la rubrique 3 (Farine et pâte) (farine, hydratation, sel, huile, miel, levure). Pour une quantité de levure précise, remplis « Quantité de levure imposée » ; sinon elle est calculée d’après la durée totale des attentes. Décris chaque étape dans l’ordre : titre, durée, type, mains et plan de travail, détails. La cuisson est ajoutée automatiquement à la fin.','Your method uses the settings in section 3 (flour, hydration, salt, oil, honey, yeast). For an exact yeast amount, fill in “Fixed yeast amount”; otherwise it is calculated from the total waiting time. Describe each step in order: title, duration, type, hands and counter, details. Baking is added automatically at the end.','Tu método usa los ajustes de la sección 3 (harina, hidratación, sal, aceite, miel, levadura). Para una cantidad exacta de levadura, rellena «Cantidad de levadura fija»; si no, se calcula según el tiempo total de espera. Describe cada paso en orden: título, duración, tipo, manos y encimera, detalles. El horneado se añade automáticamente al final.','Il tuo metodo usa le impostazioni della sezione 3 (farina, idratazione, sale, olio, miele, lievito). Per una quantità di lievito precisa, compila «Quantità di lievito fissa»; altrimenti viene calcolata in base al tempo totale di attesa. Descrivi ogni passaggio in ordine: titolo, durata, tipo, mani e piano di lavoro, dettagli. La cottura viene aggiunta automaticamente alla fine.','Seu método usa os ajustes da seção 3 (farinha, hidratação, sal, azeite, mel, fermento). Para uma quantidade exata de fermento, preencha “Quantidade fixa de fermento”; senão, ela é calculada a partir do tempo total de espera. Descreva cada etapa na ordem: título, duração, tipo, mãos e bancada, detalhes. O forno é acrescentado automaticamente no final.','你的方法使用第 3 部分的设置（面粉、含水量、盐、油、蜂蜜、酵母）。如需精确的酵母用量，请填写“固定酵母用量”；否则会根据总等待时间计算。按顺序描述每个步骤：标题、时长、类型、手和台面、细节。烘烤会自动加在最后。'],

 xferH:['Tout est gardé automatiquement dans ce navigateur, mais seulement là. Pour ne rien perdre et pour partager : télécharge régulièrement le fichier de sauvegarde (.json) sur ton ordinateur. Il contient les recettes, garnitures, méthodes, catégories, notes, étoiles et prix. Pour récupérer ou recevoir des recettes, importe un fichier .json : les recettes reçues s’ajoutent aux tiennes, rien n’est effacé.','Everything is saved automatically in this browser, but only there. To lose nothing and to share: regularly download the backup file (.json) to your computer. It holds recipes, topping sets, methods, categories, notes, ratings and prices. To restore or receive recipes, import a .json file: received recipes are added to yours, nothing is deleted.','Todo se guarda automáticamente en este navegador, pero solo ahí. Para no perder nada y para compartir: descarga con regularidad el archivo de copia (.json) en tu ordenador. Contiene recetas, coberturas, métodos, categorías, notas, estrellas y precios. Para recuperar o recibir recetas, importa un archivo .json: las recetas recibidas se añaden a las tuyas, no se borra nada.','Tutto viene salvato automaticamente in questo browser, ma solo qui. Per non perdere nulla e per condividere: scarica regolarmente il file di backup (.json) sul computer. Contiene ricette, condimenti, metodi, categorie, note, voti e prezzi. Per recuperare o ricevere ricette, importa un file .json: le ricette ricevute si aggiungono alle tue, non si cancella nulla.','Tudo é salvo automaticamente neste navegador, mas só nele. Para não perder nada e para compartilhar: baixe regularmente o arquivo de backup (.json) no seu computador. Ele contém receitas, coberturas, métodos, categorias, anotações, notas e preços. Para restaurar ou receber receitas, importe um arquivo .json: as receitas recebidas se somam às suas, nada é apagado.','所有内容都会自动保存在这个浏览器里，但只在这里。为了不丢失数据并方便分享：请定期把备份文件（.json）下载到电脑。它包含配方、配料组合、方法、类别、笔记、评分和价格。要恢复或接收配方，请导入 .json 文件：收到的配方会添加到你的配方中，不会删除任 const SEEDS=[
 {id:'mz-40cm',cat:'Pizza',author:'Marco',title:'Ma pizza (poolish)',titleEn:'My pizza (poolish)',titleEs:'Mi pizza (poolish)',
  notes:'Poolish 1 ou 2 jours avant : eau, farine à parts égales, avec 5 g de levure fraîche et 5 g de miel pour 300 g d’eau.\nLe jour J, environ 3 h avant le service : dissous le sel dans l’eau à température ambiante, verse-la dans le poolish, puis ajoute la farine petit à petit. Pétris 10 min, puis laisse la pâte reposer sur la table, couverte d’un bol.\n45 min plus tard : refaçonne, huile, recouvre du bol. 15 min après : divise en pâtons, dans des bols huilés et filmés, 1 h.\nÉtale, garnis, huile les bords au pinceau, puis cuis sur plaque à trous à 260 °C, 9 à 11 min en bas, puis 1 à 2 min sous le grill.\nHuile d’olive : un peu sur les mains pour manipuler la pâte, et sur les bords au pinceau. Hydratation 69 %.',
  notesEn:'Poolish 1 or 2 days ahead: equal parts water and flour, with 5 g fresh yeast and 5 g honey per 300 g water.\nOn the day, about 3 h before serving: dissolve the salt in room-temperature water, pour it into the poolish, then add the flour bit by bit. Knead 10 min, then let the dough rest on the counter under a bowl.\n45 min later: reshape, oil, cover with the bowl. 15 min after: divide into balls, in oiled covered bowls, 1 h.\nStretch, top, brush the rim with oil, then bake on a perforated pan at 260 °C (500 °F), 9 to 11 min low, then 1 to 2 min under the broiler.\nOlive oil: a little on your hands to handle the dough, and brushed on the rim. Hydration 69%.',
  notesEs:'Poolish 1 o 2 días antes: agua y harina a partes iguales, con 5 g de levadura fresca y 5 g de miel por 300 g de agua.\nEl día del servicio, unas 3 h antes: disuelve la sal en el agua a temperatura ambiente, viértela en el poolish y añade la harina poco a poco. Amasa 10 min y deja reposar la masa en la encimera, tapada con un bol.\n45 min después: vuelve a formar, aceita y tapa con el bol. 15 min más tarde: divide en bolas, en boles aceitados y tapados, 1 h.\nEstira, cubre, pinta los bordes con aceite y hornea en bandeja perforada a 260 °C, 9 a 11 min abajo y luego 1 a 2 min bajo el grill.\nAceite de oliva: un poco en las manos para manejar la masa y en los bordes con pincel. Hidratación 69 %.',
  params:{waterAmb:true,stickyMargin:true,brushEdges:true,n:2,shape:'round',diam:40,thick:'custom',ballW:557,method:'poolish',ppct:67,phours:24,pform:'marco',pyg:5,phg:5,vito:false,flour:'ap',hyd:69,salt:2.3,oil:0,honey:0,ytype:'fresh',T:22,oven:'home260',support:'perforee',grill:true,dbl:false,withTop:true,sauce:'maison',mozza:'fior',basil:false,extras:['jambon','olives','oignon','origan'],time:'18:30',ds:8,de:20,dRest:30,dBulk:0,dProof:50},notesIt:'Poolish 1 o 2 giorni prima: acqua e farina in parti uguali, con 5 g di lievito fresco e 5 g di miele ogni 300 g d’acqua.\nIl giorno stesso, circa 3 h prima del servizio: sciogli il sale nell’acqua a temperatura ambiente, versala nel poolish, poi aggiungi la farina poco alla volta. Impasta 10 min, poi lascia riposare l’impasto sul tavolo, coperto da una ciotola.\n45 min dopo: rimodella, ungi, copri con la ciotola. 15 min dopo: dividi in panetti, in ciotole unte e coperte, 1 h.\nStendi, condisci, spennella i bordi d’olio, poi cuoci su teglia forata a 260 °C, 9–11 min in basso, poi 1–2 min sotto il grill.\nOlio d’oliva: un po’ sulle mani per maneggiare l’impasto e sui bordi col pennello. Idratazione 69 %.',titleIt:'La mia pizza (poolish)',titlePt:'Minha pizza (poolish)',titleZh:'我的披萨（波兰种）',notesPt:'Poolish 1 ou 2 dias antes: água e farinha em partes iguais, com 5 g de fermento fresco e 5 g de mel para 300 g de água.\nNo dia, cerca de 3 h antes de servir: dissolva o sal na água em temperatura ambiente, despeje no poolish e acrescente a farinha aos poucos. Sove 10 min e deixe a massa descansar na bancada, coberta com uma tigela.\n45 min depois: modele de novo, unte com azeite, cubra com a tigela. 15 min depois: divida em bolinhas, em tigelas untadas e cobertas, 1 h.\nAbra, cubra, pincele a borda com azeite e asse em assadeira furada a 260 °C, 9 a 11 min embaixo, depois 1 a 2 min no grill.\nAzeite: um pouco nas mãos para manusear a massa, e na borda com pincel. Hidratação 69%.',notesZh:'提前 1 或 2 天做波兰种：水和面粉等量，每 300 克水加 5 克鲜酵母和 5 克蜂蜜。\n当天，上桌前约 3 小时：把盐溶在室温水里，倒入波兰种，再逐步加入面粉。揉 10 分钟，然后让面团在台面上静置，用碗盖住。\n45 分钟后：重新整形，抹油，用碗盖好。再过 15 分钟：分成面团球，放进抹油并盖好的碗里，1 小时。\n擀开，铺料，饼边刷油，然后放在带孔烤盘上 260 °C 烘烤，下层 9 到 11 分钟，再用上火烤 1 到 2 分钟。\n橄榄油：手上抹一点方便操作面团，饼边用刷子刷。含水量 69%。'},
 {id:'vito',cat:'Pizza',author:'',title:'Poolish 30 % au robot',titleEn:'Poolish 30% with a mixer',titleEs:'Poolish 30 % con amasadora',
  notes:'Poolish la veille : eau et farine à parts égales, avec 5 g de levure fraîche et 5 g de miel pour 300 g d’eau ; film percé de quelques trous, départ à température ambiante puis environ 16 h au frigo.\nLe jour J : dilue le poolish dans l’eau froide (garde une tasse de côté) jusqu’à ce que l’eau blanchisse ; ajoute toute la farine d’un coup, puis le sel. Robot lent, 20 min maximum ; l’eau réservée en 4 ou 5 fois ; un peu d’huile d’olive en fin de pétrissage. Tests : main propre, voile.\nRabats sur le plan de travail mains huilées, grosse boule, 15 min sous un bol retourné. Pâtons pesés à la corne, boulés, dans une boîte farinée à 4 doigts d’écart, 1 h 30 environ à température ambiante. Fleurage moitié semoule, moitié farine.\nHydratation 71 %.',
  notesEn:'Poolish the day before: equal parts water and flour, with 5 g fresh yeast and 5 g honey per 300 g water; plastic wrap with a few holes, start at room temperature, then about 16 h in the fridge.\nOn the day: dissolve the poolish in the cold water (hold back a cup) until the water turns white; add all the flour at once, then the salt. Slow mixer, 20 min max; the reserved water in 4 or 5 additions; a little olive oil at the end. Tests: clean hand, windowpane.\nFolds on the counter with oiled hands, big ball, 15 min under an upturned bowl. Balls cut with a scraper and weighed, shaped, in a floured box 4 fingers apart, about 1 h 30 at room temperature. Dusting: half semolina, half flour.\nHydration 71%.',
  notesEs:'Poolish la víspera: agua y harina a partes iguales, con 5 g de levadura fresca y 5 g de miel por 300 g de agua; film con unos agujeros, arranque a temperatura ambiente y luego unas 16 h en la nevera.\nEl día del servicio: disuelve el poolish en el agua fría (reserva una taza) hasta que el agua se vuelva blanca; añade toda la harina de golpe y luego la sal. Amasadora lenta, 20 min como máximo; el agua reservada en 4 o 5 veces; un poco de aceite al final. Pruebas: mano limpia, velo.\nPliegues en la encimera con las manos aceitadas, bola grande, 15 min bajo un bol boca abajo. Bolas cortadas con rasqueta y pesadas, boleadas, en una caja enharinada a 4 dedos de distancia, unas 1 h 30 a temperatura ambiente. Para estirar: mitad sémola, mitad harina.\nHidratación 71 %.',
  params:{n:9,shape:'round',diam:30,thick:'custom',ballW:270,method:'poolish',ppct:30,phours:16,pform:'marco',pyg:5,phg:5,vito:true,flour:'strong',hyd:71,salt:2.1,oil:0.5,honey:0,ytype:'fresh',T:22,oven:'home290',support:'pierre',grill:false,withTop:true,sauce:'crue',mozza:'fior',basil:true,extras:[],time:'19:00',ds:8,de:20,dRest:15,dBulk:0,dProof:90},notesIt:'Poolish il giorno prima: acqua e farina in parti uguali, con 5 g di lievito fresco e 5 g di miele ogni 300 g d’acqua; pellicola bucherellata, avvio a temperatura ambiente, poi circa 16 h in frigo.\nIl giorno stesso: sciogli il poolish nell’acqua fredda (tienine da parte una tazza) finché l’acqua diventa bianca; aggiungi tutta la farina insieme, poi il sale. Impastatrice lenta, 20 min al massimo; l’acqua tenuta da parte in 4 o 5 volte; un po’ d’olio alla fine. Prove: mano pulita, velo.\nPieghe sul piano con le mani unte, grosso panetto, 15 min sotto una ciotola capovolta. Panetti tagliati col tarocco e pesati, formati, in una cassetta infarinata a 4 dita di distanza, circa 1 h 30 a temperatura ambiente. Spolvero: metà semola, metà farina.\nIdratazione 71 %.',titleIt:'Poolish 30 % in impastatrice',titlePt:'Poolish 30% na batedeira',titleZh:'30% 波兰种（搅拌机）',notesPt:'Poolish na véspera: água e farinha em partes iguais, com 5 g de fermento fresco e 5 g de mel para 300 g de água; filme com alguns furos, início em temperatura ambiente e depois cerca de 16 h na geladeira.\nNo dia: dissolva o poolish na água fria (guarde uma xícara) até a água ficar branca; acrescente toda a farinha de uma vez, depois o sal. Batedeira lenta, 20 min no máximo; a água reservada em 4 ou 5 vezes; um pouco de azeite no fim da sova. Testes: mão limpa, véu.\nDobras na bancada com as mãos untadas, bola grande, 15 min sob uma tigela virada. Bolinhas cortadas com espátula e pesadas, boleadas, numa caixa enfarinhada a 4 dedos de distância, cerca de 1 h 30 em temperatura ambiente. Para polvilhar: metade sêmola, metade farinha.\nHidratação 71%.',notesZh:'前一天做波兰种：水和面粉等量，每 300 克水加 5 克鲜酵母和 5 克蜂蜜；保鲜膜戳几个小孔，先在室温启动，再冷藏约 16 小时。\n当天：把波兰种化在冷水里（留出一杯水），直到水变白；一次加入全部面粉，再加盐。慢速搅拌，最多 20 分钟；预留的水分 4 到 5 次加入；揉面结束前加一点橄榄油。检验：手干净不粘、能拉出薄膜。\n手抹油在台面上折叠，整成一个大面团，用倒扣的碗盖住 15 分钟。用刮板切分并称重，滚圆，放进撒粉的面团盒，彼此间隔 4 指宽，室温约 1 小时 30 分。撒粉：一半粗粒小麦粉，一半面粉。\n含水量 71%。'},
 {id:'napo-75',cat:'Pizza',author:'',title:'Napolitaine contemporaine 75 % (frigo 24 h)',titleEn:'Contemporary Neapolitan 75% (24 h fridge)',titleEs:'Napolitana contemporánea 75 % (nevera 24 h)',titleIt:'Napoletana contemporanea 75 % (frigo 24 h)',
  notes:'Farine type 0 (environ 12,5 % de protéines), 75 % d’eau, 0,3 % de levure fraîche, 2,5 % de sel, 2 % d’huile d’olive.\nPétris la farine avec les quatre cinquièmes de l’eau quelques minutes, couvre et laisse reposer 30 min. Reprends le pétrissage jusqu’à une pâte bien élastique, puis ajoute peu à peu le reste de l’eau, la levure dissoute dedans : attends que chaque ajout soit absorbé. Ajoute ensuite le sel, puis l’huile.\nBoule avec quelques rabats, dans une boîte légèrement huilée. Un rabat de renfort après 20 min, 30 min à température ambiante, puis 24 h au frigo. Le lendemain, divise en pâtons et laisse-les doubler.\nÉtale sur de la semoule sans écraser le bord. Cuisson très chaude (400 °C dans un four à pizza). À 75 %, la pâte est très souple : travaille-la mains mouillées.',
  notesEn:'Type 0 flour (about 12.5% protein), 75% water, 0.3% fresh yeast, 2.5% salt, 2% olive oil.\nKnead the flour with four fifths of the water for a few minutes, cover and rest 30 min. Knead again until very elastic, then add the rest of the water little by little, with the yeast dissolved in it: wait until each addition is absorbed. Then add the salt, then the oil.\nShape a ball with a few folds, in a lightly oiled box. One strengthening fold after 20 min, 30 min at room temperature, then 24 h in the fridge. Next day, divide into balls and let them double.\nStretch on semolina without flattening the rim. Bake very hot (400 °C / 750 °F in a pizza oven). At 75% the dough is very soft: work it with wet hands.',
  notesEs:'Harina tipo 0 (unos 12,5 % de proteínas), 75 % de agua, 0,3 % de levadura fresca, 2,5 % de sal, 2 % de aceite de oliva.\nAmasa la harina con cuatro quintos del agua unos minutos, tapa y deja reposar 30 min. Vuelve a amasar hasta que esté bien elástica y añade poco a poco el resto del agua, con la levadura disuelta: espera a que cada adición se absorba. Luego añade la sal y después el aceite.\nBolea con unos pliegues, en una caja ligeramente aceitada. Un pliegue de refuerzo a los 20 min, 30 min a temperatura ambiente y luego 24 h en la nevera. Al día siguiente, divide en bolas y déjalas doblar.\nEstira sobre sémola sin aplastar el borde. Horno muy caliente (400 °C en un horno de pizza). Al 75 %, la masa es muy blanda: trabájala con las manos mojadas.',
  notesIt:'Farina tipo 0 (circa 12,5 % di proteine), 75 % d’acqua, 0,3 % di lievito fresco, 2,5 % di sale, 2 % d’olio d’oliva.\nImpasta la farina con quattro quinti dell’acqua per qualche minuto, copri e lascia riposare 30 min. Riprendi a impastare finché l’impasto incorda bene, poi aggiungi poco alla volta il resto dell’acqua, con il lievito sciolto dentro: aspetta che ogni aggiunta sia assorbita. Poi il sale e quindi l’olio.\nForma una palla con qualche piega, in un contenitore leggermente unto. Una piega di rinforzo dopo 20 min, 30 min a temperatura ambiente, poi 24 h in frigo. Il giorno dopo, dividi in panetti e lasciali raddoppiare.\nStendi sulla semola senza schiacciare il bordo. Cottura molto calda (400 °C in un forno per pizza). Al 75 % l’impasto è molto morbido: lavoralo con le mani bagnate.',
  params:{n:4,shape:'round',diam:30,thick:'custom',ballW:250,method:'frigo',fh:24,flour:'ap',hyd:75,salt:2.5,oil:2,honey:0,ytype:'fresh',yfix:3,T:22,oven:'home290',support:'pierre',grill:false,withTop:true,sauce:'crue',mozza:'fior',basil:true,extras:[],time:'19:00',dRest:30,dBulk:50,dProof:180},titlePt:'Napolitana contemporânea 75% (24 h na geladeira)',titleZh:'当代那不勒斯披萨 75%（冷藏 24 小时）',notesPt:'Farinha tipo 0 (cerca de 12,5% de proteínas), 75% de água, 0,3% de fermento fresco, 2,5% de sal, 2% de azeite.\nSove a farinha com quatro quintos da água por alguns minutos, cubra e deixe descansar 30 min. Volte a sovar até a massa ficar bem elástica e acrescente aos poucos o resto da água, com o fermento dissolvido nela: espere cada adição ser absorvida. Depois acrescente o sal e, por fim, o azeite.\nBola com algumas dobras, numa caixa levemente untada. Uma dobra de reforço após 20 min, 30 min em temperatura ambiente e depois 24 h na geladeira. No dia seguinte, divida em bolinhas e deixe dobrarem de volume.\nAbra sobre sêmola sem achatar a borda. Forno bem quente (400 °C num forno de pizza). A 75%, a massa é muito mole: trabalhe com as mãos molhadas.',notesZh:'0 号面粉（蛋白质约 12.5%），75% 水，0.3% 鲜酵母，2.5% 盐，2% 橄榄油。\n先用五分之四的水和面粉揉几分钟，盖好静置 30 分钟。再揉到面团很有弹性，然后把溶有酵母的剩余水分一点点加入：每次都等水吸收后再加。接着加盐，最后加油。\n折几下整成团，放进稍微抹油的盒子。20 分钟后再折一次加强，室温放 30 分钟，然后冷藏 24 小时。第二天分成面团球，让它们发到两倍大。\n在粗粒小麦粉上擀开，不要压扁饼边。高温烘烤（披萨炉 400 °C）。含水 75% 的面团非常软：请用湿手操作。'},
 {id:'pala',cat:'Pizza',author:'',title:'Pizza alla pala (double cuisson)',titleEn:'Pizza alla pala (two-stage bake)',titleEs:'Pizza alla pala (doble cocción)',titleIt:'Pizza alla pala (doppia cottura)',
  notes:'Proportions : 75 % d’eau, 3 % de sel, 0,5 % de levure, 3 % d’huile d’olive.\nMélange la farine et le sel, verse les deux tiers de l’eau, puis le reste petit à petit. Incorpore la levure, puis l’huile, et termine par quelques rabats.\nUne journée au frigo. Sors la pâte, forme les pâtons et laisse-les reposer 4 à 5 h. Étale délicatement en ovale, du centre vers l’extérieur puis en redescendant par l’intérieur, sans chasser le gaz, et fais tomber l’excès de farine.\nCuisson à 270–280 °C sur pierre. Double cuisson : 4 à 5 min la pâte seule, puis garnis et remets environ 2 min. Elle se mange aussi nature.\nPas de pierre : retourne une plaque du four et fais-la chauffer à vide avec le four.\nLa pizza alla pala vient de Rome et doit son nom à la longue pelle en bois sur laquelle on la sert.',
  notesEn:'Proportions: 75% water, 3% salt, 0.5% yeast, 3% olive oil.\nMix the flour and salt, pour in two thirds of the water, then the rest little by little. Work in the yeast, then the oil, and finish with a few folds.\nOne day in the fridge. Take the dough out, shape the balls and let them rest 4 to 5 h. Stretch gently into an oval, from the centre outwards and then back down through the inside, without pushing out the gas, and shake off the excess flour.\nBake at 270–280 °C (520–540 °F) on a stone. Two-stage bake: 4 to 5 min for the dough alone, then top it and bake about 2 more min. It is also good plain.\nNo stone: turn a baking sheet upside down and preheat it empty with the oven.\nPizza alla pala comes from Rome and is named after the long wooden peel it is served on.',
  notesEs:'Proporciones: 75 % de agua, 3 % de sal, 0,5 % de levadura, 3 % de aceite de oliva.\nMezcla la harina y la sal, vierte dos tercios del agua y luego el resto poco a poco. Incorpora la levadura, después el aceite, y termina con unos pliegues.\nUn día en la nevera. Saca la masa, forma las bolas y déjalas reposar 4 a 5 h. Estira con suavidad en óvalo, del centro hacia fuera y luego bajando por el interior, sin sacar el gas, y quita el exceso de harina.\nHornea a 270–280 °C sobre piedra. Doble cocción: 4 a 5 min la masa sola, luego cubre y hornea unos 2 min más. También se come sola.\nSin piedra: da la vuelta a una bandeja del horno y precaliéntala vacía con el horno.\nLa pizza alla pala viene de Roma y debe su nombre a la larga pala de madera en la que se sirve.',
  notesIt:'Proporzioni: 75 % d’acqua, 3 % di sale, 0,5 % di lievito, 3 % d’olio d’oliva.\nMescola farina e sale, versa due terzi dell’acqua, poi il resto poco alla volta. Incorpora il lievito, poi l’olio, e finisci con qualche piega.\nUn giorno in frigo. Togli l’impasto, forma i panetti e lasciali riposare 4–5 h. Stendi delicatamente a forma ovale, dal centro verso l’esterno e poi ridiscendendo dall’interno, senza far uscire il gas, e togli la farina in eccesso.\nCottura a 270–280 °C su pietra. Doppia cottura: 4–5 min l’impasto da solo, poi condisci e rimetti in forno circa 2 min. È buona anche bianca.\nSenza pietra: capovolgi una teglia del forno e scaldala vuota insieme al forno.\nLa pizza alla pala viene da Roma e deve il nome alla lunga pala di legno su cui si serve.',
  params:{n:3,shape:'round',diam:35,thick:'custom',ballW:600,method:'frigo',fh:24,flour:'ap',hyd:75,salt:3,oil:3,honey:0,ytype:'fresh',yfix:5,T:22,oven:'home290',support:'pierre',grill:false,withTop:true,sauce:'crue',mozza:'fior',basil:true,extras:[],time:'19:00',dRest:0,dBulk:30,dProof:270},titlePt:'Pizza alla pala (cozimento em duas etapas)',titleZh:'罗马铲披萨（分两段烘烤）',notesPt:'Proporções: 75% de água, 3% de sal, 0,5% de fermento, 3% de azeite.\nMisture a farinha e o sal, despeje dois terços da água e depois o resto aos poucos. Incorpore o fermento, depois o azeite, e termine com algumas dobras.\nUm dia na geladeira. Tire a massa, faça as bolinhas e deixe descansar 4 a 5 h. Abra delicadamente em formato oval, do centro para fora e voltando por dentro, sem tirar o gás, e retire o excesso de farinha.\nAsse a 270–280 °C na pedra. Cozimento em duas etapas: 4 a 5 min só a massa, depois cubra e volte ao forno por cerca de 2 min. Também se come pura.\nSem pedra: vire uma assadeira do forno de cabeça para baixo e preaqueça vazia junto com o forno.\nA pizza alla pala vem de Roma e deve o nome à longa pá de madeira em que é servida.',notesZh:'比例：75% 水，3% 盐，0.5% 酵母，3% 橄榄油。\n把面粉和盐混合，倒入三分之二的水，再逐步加入其余的水。拌入酵母，再加油，最后折叠几次。\n冷藏一天。取出面团，分成面团球，静置 4 到 5 小时。轻轻从中心向外、再从内侧往回推开成椭圆形，不要把气体压出，抖掉多余的面粉。\n在披萨石上 270–280 °C 烘烤。分两段烘烤：先单烤饼底 4 到 5 分钟，再铺料回炉烤约 2 分钟。不加配料直接吃也很好。\n没有披萨石：把烤箱的烤盘倒扣过来，随烤箱空盘预热。\n罗马铲披萨来自罗马，因上桌时用的长木铲而得名。'},
 {id:'pan-pablo',cat:'Pizza',author:'Pablo',title:'Pizza épaisse en moule (pan pizza)',titleEn:'Thick pan pizza',titleEs:'Pizza gruesa en molde (pan pizza)',titleIt:'Pizza alta in teglia tonda (pan pizza)',
  notes:'Recette de Pablo. Proportions : 60 % d’eau tiède (35–40 °C), 1,4 % de levure sèche, environ 2,5 % de lait en poudre (le secret du moelleux) et 2,5 % de sucre, 1,8 % de sel, 5,5 % d’huile végétale dans la pâte.\nDivise la pâte aussitôt après le pétrissage, étale chaque pâton dans un moule bien huilé (par exemple, pour un moule de 32 cm : 3 c. à soupe d’huile), levée 1 h 30 à 2 h, ou une nuit au frigo et sortie 1 h avant.\nFour à 250 °C ou au maximum, grille du bas, 12 à 15 min. Sauce un peu sucrée (coulis, une pointe de concentré, une pincée de sucre, origan, ail semoule) ; fromage généreux jusqu’au bord.\nBord fourré au fromage : étale la pâte un peu plus large que le moule, pose des bâtonnets de mozzarella sur le pourtour et replie la pâte par-dessus en pinçant bien.',
  notesEn:'Pablo’s recipe. Proportions: 60% warm water (35–40 °C), 1.4% dry yeast, about 2.5% milk powder (the secret of the softness) and 2.5% sugar, 1.8% salt, 5.5% vegetable oil in the dough.\nDivide the dough right after kneading, spread each ball in a well-oiled pan (for example, for a 32 cm pan: 3 tbsp oil), rise 1 h 30 to 2 h, or overnight in the fridge and out 1 h before.\nOven at 250 °C (480 °F) or max, bottom rack, 12 to 15 min. Slightly sweet sauce (passata, a little paste, a pinch of sugar, oregano, garlic powder); generous cheese right to the edge.\nCheese-stuffed crust: spread the dough a little wider than the pan, lay mozzarella sticks around the edge and fold the dough over, pinching well.',
  notesEs:'Receta de Pablo. Proporciones: 60 % de agua tibia (35–40 °C), 1,4 % de levadura seca, unos 2,5 % de leche en polvo (el secreto de la esponjosidad) y 2,5 % de azúcar, 1,8 % de sal, 5,5 % de aceite vegetal en la masa.\nDivide la masa justo después de amasar, extiende cada bola en un molde bien aceitado (por ejemplo, para un molde de 32 cm: 3 cdas. de aceite), levado de 1 h 30 a 2 h, o una noche en la nevera y sacar 1 h antes.\nHorno a 250 °C o al máximo, rejilla inferior, 12 a 15 min. Salsa un poco dulce (tomate triturado, una punta de concentrado, una pizca de azúcar, orégano, ajo en polvo); queso generoso hasta el borde.\nBorde relleno de queso: extiende la masa un poco más ancha que el molde, pon bastoncitos de mozzarella por el contorno y dobla la masa por encima, pellizcando bien.',
  notesIt:'Ricetta di Pablo. Proporzioni: 60 % d’acqua tiepida (35–40 °C), 1,4 % di lievito secco, circa 2,5 % di latte in polvere (il segreto della morbidezza) e 2,5 % di zucchero, 1,8 % di sale, 5,5 % d’olio di semi nell’impasto.\nDividi l’impasto subito dopo averlo impastato, stendi ogni panetto in uno stampo ben unto (per esempio, per uno stampo da 32 cm: 3 cucchiai d’olio), lievitazione di 1 h 30–2 h, o una notte in frigo e fuori 1 h prima.\nForno a 250 °C o al massimo, griglia in basso, 12–15 min. Salsa un po’ dolce (passata, un po’ di concentrato, un pizzico di zucchero, origano, aglio in polvere); formaggio abbondante fino al bordo.\nBordo ripieno di formaggio: stendi l’impasto un po’ più largo dello stampo, metti bastoncini di mozzarella lungo il bordo e ripiega l’impasto sopra, pizzicando bene.',
  params:{n:4,shape:'round',diam:32,thick:'custom',ballW:410,method:'pan',flour:'ap',hyd:60,salt:1.8,oil:5.5,honey:0,ytype:'ady',yfix:14,fh:2,T:22,oven:'home260',support:'plaque',grill:false,withTop:true,sauce:'maison',mozza:'rapee',basil:false,extras:['pepperoni','oignon','poivron','champ'],custom:[{name:'Lait en poudre',cat:'pate',qty:2.5,unit:'pf'},{name:'Sucre',cat:'pate',qty:2.5,unit:'pf'}],time:'19:00'},titlePt:'Pizza grossa na forma (pan pizza)',titleZh:'厚底烤盘披萨（Pan pizza）',notesPt:'Receita do Pablo. Proporções: 60% de água morna (35–40 °C), 1,4% de fermento seco, cerca de 2,5% de leite em pó (o segredo da maciez) e 2,5% de açúcar, 1,8% de sal, 5,5% de óleo vegetal na massa.\nDivida a massa logo após sovar, espalhe cada bolinha numa forma bem untada (por exemplo, para uma forma de 32 cm: 3 colheres de sopa de óleo), deixe crescer 1 h 30 a 2 h, ou uma noite na geladeira, retirando 1 h antes.\nForno a 250 °C ou no máximo, grade de baixo, 12 a 15 min. Molho levemente adocicado (passata, um pouco de extrato, uma pitada de açúcar, orégano, alho em pó); bastante queijo até a borda.\nBorda recheada com queijo: abra a massa um pouco além da forma, coloque bastões de muçarela ao redor e dobre a massa por cima, apertando bem.',notesZh:'Pablo 的配方。比例：60% 温水（35–40 °C），1.4% 干酵母，约 2.5% 奶粉（松软的秘诀）和 2.5% 糖，1.8% 盐，面团中加 5.5% 植物油。\n揉好后马上分割，把每个面团铺进抹足油的烤盘（例如 32 厘米烤盘用 3 汤匙油），发酵 1 小时 30 分到 2 小时，或冷藏过夜，烘烤前 1 小时取出。\n烤箱 250 °C 或开到最高，下层，12 到 15 分钟。酱汁略甜（番茄泥、少许番茄膏、一小撮糖、牛至、蒜粉）；奶酪铺满直到边缘。\n芝心饼边：把面团铺得比烤盘稍大一点，沿边缘放上马苏里拉奶酪条，把面团折过来包住，捏紧。'},
 {id:'plaque-semoule',cat:'Pizza',author:'Pablo',title:'Pizza en plaque à la semoule',titleEn:'Pan-baked pizza with semolina',titleEs:'Pizza en bandeja con sémola',titleIt:'Pizza in teglia con semola',
  notes:'Recette de Pablo, sur plaques métalliques. Farine forte (13,7 g de protéines pour 100 g) et semoule de blé fine (environ 1 part de semoule pour 9 de farine), eau tiède (30–35 °C), levure sèche active, sel, huile d’olive, une pincée de sucre.\nLevure activée 5 à 10 min dans l’eau tiède sucrée ; pétrissage 12 à 15 min, sel en dernier ; levée en masse environ 4 h 15 ; division et boulage ; détente 45 min (ne pas la sauter : la farine forte se rétracte).\nFour à 230 °C en chaleur tournante, préchauffé au moins 45 min, niveau le plus bas, 11 à 13 min. Étaler du centre vers les bords sans écraser le bord, plaque légèrement huilée, garnir avec modération, bords huilés au pinceau.\nL’hydratation de l’appli (70 %) est calculée sur la farine seule ; avec la semoule, elle est d’environ 64 %.',
  notesEn:'Pablo’s recipe, on metal pans. Strong flour (13.7 g protein per 100 g) and fine durum semolina (about 1 part semolina to 9 of flour), warm water (30–35 °C), active dry yeast, salt, olive oil, a pinch of sugar.\nYeast activated 5 to 10 min in the sweetened warm water; knead 12 to 15 min, salt last; bulk rise about 4 h 15; divide and shape; rest 45 min (do not skip: strong flour springs back).\nOven at 230 °C (445 °F) convection, preheated at least 45 min, lowest rack, 11 to 13 min. Stretch from the centre out without crushing the rim, lightly oiled pan, top sparingly, rim brushed with oil.\nThe app’s hydration (70%) is on flour only; with the semolina it is about 64%.',
  notesEs:'Receta de Pablo, en bandejas metálicas. Harina de fuerza (13,7 g de proteína por 100 g) y sémola fina de trigo duro (más o menos 1 parte de sémola por 9 de harina), agua tibia (30–35 °C), levadura seca activa, sal, aceite de oliva, una pizca de azúcar.\nLevadura activada 5 a 10 min en el agua tibia con azúcar; amasado 12 a 15 min, la sal al final; levado en bloque unas 4 h 15; división y boleado; reposo 45 min (no saltarlo: la harina de fuerza se retrae).\nHorno a 230 °C con ventilador, precalentado al menos 45 min, nivel más bajo, 11 a 13 min. Estirar del centro hacia los bordes sin aplastar el borde, bandeja ligeramente aceitada, cubrir con moderación, bordes pintados con aceite.\nLa hidratación de la app (70 %) se calcula solo sobre la harina; con la sémola es de unos 64 %.',
  notesIt:'Ricetta di Pablo, su teglie di metallo. Farina forte (13,7 g di proteine per 100 g) e semola rimacinata (circa 1 parte di semola per 9 di farina), acqua tiepida (30–35 °C), lievito secco attivo, sale, olio d’oliva, un pizzico di zucchero.\nLievito attivato 5–10 min nell’acqua tiepida zuccherata; impasto 12–15 min, sale per ultimo; lievitazione in massa circa 4 h 15; divisione e formatura; riposo 45 min (da non saltare: la farina forte si ritira).\nForno a 230 °C ventilato, preriscaldato almeno 45 min, livello più basso, 11–13 min. Stendere dal centro verso i bordi senza schiacciare il cornicione, teglia leggermente unta, condire con moderazione, bordi spennellati d’olio.\nL’idratazione dell’app (70 %) è calcolata sulla sola farina; con la semola è circa 64 %.',
  params:{brushEdges:true,n:4,shape:'round',diam:32,thick:'custom',ballW:300,method:'complete',flour:'bread',hyd:70,salt:2.1,oil:3.6,honey:0.2,ytype:'ady',yfix:14.3,fh:4.5,T:22,oven:'home240',support:'plaque',grill:false,withTop:true,sauce:'maison',mozza:'fior',basil:true,extras:[],custom:[{name:'Semoule de blé fine',cat:'pate',qty:11.1,unit:'pf'}],time:'19:00'},titlePt:'Pizza em assadeira com sêmola',titleZh:'粗粒小麦粉烤盘披萨',notesPt:'Receita do Pablo, em assadeiras de metal. Farinha forte (13,7 g de proteínas por 100 g) e sêmola fina de trigo duro (cerca de 1 parte de sêmola para 9 de farinha), água morna (30–35 °C), fermento biológico seco, sal, azeite, uma pitada de açúcar.\nFermento ativado 5 a 10 min na água morna adoçada; sove 12 a 15 min, o sal por último; fermentação em bloco de cerca de 4 h 15; divida e boleie; descanso de 45 min (não pule: a farinha forte retrai).\nForno a 230 °C com ventilação, preaquecido pelo menos 45 min, grade mais baixa, 11 a 13 min. Abra do centro para fora sem esmagar a borda, assadeira levemente untada, cobertura moderada, borda pincelada com azeite.\nA hidratação do app (70%) é calculada só sobre a farinha; com a sêmola fica em cerca de 64%.',notesZh:'Pablo 的配方，用金属烤盘。高筋面粉（每 100 克含 13.7 克蛋白质）和细粒硬质小麦粉（约 1 份粗粒粉配 9 份面粉），温水（30–35 °C），活性干酵母，盐，橄榄油，一小撮糖。\n酵母在加糖的温水中激活 5 到 10 分钟；揉 12 到 15 分钟，最后加盐；整体发酵约 4 小时 15 分；分割并滚圆；静置 45 分钟（不要省略：高筋面粉会回缩）。\n烤箱 230 °C 热风，至少预热 45 分钟，最下层，11 到 13 分钟。从中心向外推开，不要压扁饼边，烤盘稍微抹油，配料适量，饼边刷油。\n应用中的含水量（70%）只按面粉计算；算上粗粒小麦粉约为 64%。'},
 {id:'express-70',cat:'Pizza',author:'',title:'Express 3 h à 70 %, par rabats',titleEn:'3 h express at 70%, with folds',titleEs:'Exprés 3 h al 70 %, con pliegues',titleIt:'Express 3 h al 70 %, con pieghe',
  notes:'Proportions : 70 % d’eau, 2,4 % de sel, 0,6 % de levure sèche instantanée.\nMélange tout jusqu’à ce qu’il ne reste plus de farine sèche ; boule grossière, couverte, 30 min. Un rabat d’environ 1 min ; 30 min ; un second rabat. Sur le plan de travail, forme une boule lisse, couverte, 30 min. Divise en pâtons et laisse-les 1 h 30 dans des boîtes.\nPas de pétrissage long : ce sont les rabats et le temps qui développent le gluten. L’appli suit le déroulé de la méthode Express ; remplace le pétrissage par les rabats.',
  notesEn:'Proportions: 70% water, 2.4% salt, 0.6% instant dry yeast.\nMix everything until no dry flour remains; rough ball, covered, 30 min. One fold of about 1 min; 30 min; a second fold. On the counter, shape a smooth ball, covered, 30 min. Divide into balls and leave them 1 h 30 in boxes.\nNo long kneading: folds and time develop the gluten. The app follows the Express method’s steps; replace kneading with the folds.',
  notesEs:'Proporciones: 70 % de agua, 2,4 % de sal, 0,6 % de levadura seca instantánea.\nMezcla todo hasta que no quede harina seca; bola tosca, tapada, 30 min. Un pliegue de 1 min; 30 min; un segundo pliegue. En la encimera, forma una bola lisa, tapada, 30 min. Divide en bolas y déjalas 1 h 30 en cajas.\nSin amasado largo: los pliegues y el tiempo desarrollan el gluten. La app sigue los pasos del método Exprés; sustituye el amasado por los pliegues.',
  notesIt:'Proporzioni: 70 % d’acqua, 2,4 % di sale, 0,6 % di lievito secco istantaneo.\nMescola tutto finché non resta farina secca; palla grossolana, coperta, 30 min. Una piega di circa 1 min; 30 min; una seconda piega. Sul piano forma una palla liscia, coperta, 30 min. Dividi in panetti e lasciali 1 h 30 nelle cassette.\nNiente impasto lungo: pieghe e tempo sviluppano il glutine. L’app segue i passaggi del metodo Express; sostituisci l’impasto con le pieghe.',
  params:{n:3,shape:'round',diam:30,thick:'custom',ballW:285,method:'express',flour:'ap',hyd:70,salt:2.4,oil:0,honey:0,ytype:'idy',yfix:6,T:22,oven:'home260',support:'pierre',grill:true,withTop:true,sauce:'maison',mozza:'fior',basil:true,extras:[],time:'19:00',dRest:30,dBulk:60,dProof:90},titlePt:'Express 3 h a 70%, com dobras',titleZh:'3 小时快速法，含水 70%，折叠法',notesPt:'Proporções: 70% de água, 2,4% de sal, 0,6% de fermento biológico seco instantâneo.\nMisture tudo até não sobrar farinha seca; bola grosseira, coberta, 30 min. Uma dobra de cerca de 1 min; 30 min; uma segunda dobra. Na bancada, forme uma bola lisa, coberta, 30 min. Divida em bolinhas e deixe-as 1 h 30 em caixas.\nSem sova longa: são as dobras e o tempo que desenvolvem o glúten. O app segue as etapas do método Express; substitua a sova pelas dobras.',notesZh:'比例：70% 水，2.4% 盐，0.6% 即发干酵母。\n把所有材料拌到没有干粉；整成粗糙的面团，盖好，30 分钟。折叠约 1 分钟；30 分钟；第二次折叠。在台面上整成光滑的面团，盖好，30 分钟。分成面团球，放在盒子里 1 小时 30 分。\n不需要长时间揉面：靠折叠和时间形成面筋。应用按快速法的步骤安排；用折叠代替揉面。'},
 {id:'focaccia',cat:'Focaccia',author:'',title:'Focaccia moelleuse sans pétrissage (plaque 30 × 40 cm)',titleEn:'Soft no-knead focaccia (30 × 40 cm pan)',titleEs:'Focaccia esponjosa sin amasado (bandeja 30 × 40 cm)',
  notes:'Farine T55, Manitoba ou 00 ; eau tiède à 80 % ; levure (sèche ou fraîche) ; sel fin ; un peu de sucre ou de miel ; huile d’olive généreuse, fleur de sel, romarin frais.\nLevure et sucre dans l’eau tiède 5 min ; farine et sel à la spatule, sans pétrir ; filet d’huile, couvert, 1 h 30 à 2 h au chaud. Plaque bien huilée, pâte pliée 1 ou 2 fois puis versée et étalée mains huilées ; 30 à 45 min sans couvrir. Four 220 °C ; huile, creux avec les dix doigts jusqu’au fond, fleur de sel, romarin ; 20 à 25 min. À la sortie, un filet d’huile, tiédir sur une grille.',
  notesEn:'T55, Manitoba or 00 flour; 80% warm water; yeast (dry or fresh); fine salt; a little sugar or honey; plenty of olive oil, flaky salt, fresh rosemary.\nYeast and sugar in warm water 5 min; flour and salt with a spatula, no kneading; drizzle of oil, covered, 1 h 30 to 2 h somewhere warm. Well-oiled pan, fold the dough 1 or 2 times, then tip it in and spread with oiled hands; 30 to 45 min uncovered. Oven 220 °C (430 °F); oil, dimple with all ten fingers to the bottom, flaky salt, rosemary; 20 to 25 min. When it comes out, a drizzle of oil; cool on a rack.',
  notesEs:'Harina T55, Manitoba o 00; agua tibia al 80 %; levadura (seca o fresca); sal fina; un poco de azúcar o miel; aceite de oliva generoso, sal en escamas, romero fresco.\nLevadura y azúcar en el agua tibia 5 min; harina y sal con espátula, sin amasar; chorrito de aceite, tapada, 1 h 30 a 2 h en un sitio templado. Bandeja bien aceitada, masa plegada 1 o 2 veces y luego volcada y extendida con las manos aceitadas; 30 a 45 min sin tapar. Horno a 220 °C; aceite, hoyos con los diez dedos hasta el fondo, sal en escamas, romero; 20 a 25 min. Al salir, un chorrito de aceite y templar sobre una rejilla.',
  params:{n:1,shape:'rect',rl:40,rw:30,thick:'custom',ballW:925,method:'focaccia',flour:'ap',hyd:80,salt:2.4,oil:0,honey:1,ytype:'idy',yfix:14,T:22,oven:'home240',support:'plaque',grill:false,dbl:false,withTop:true,sauce:'none',mozza:'none',basil:false,extras:[],time:'18:30',ds:8,de:20},notesIt:'Farina T55, Manitoba o 00; acqua tiepida all’80 %; lievito (secco o fresco); sale fino; un po’ di zucchero o miele; olio d’oliva abbondante, sale in fiocchi, rosmarino fresco.\nLievito e zucchero nell’acqua tiepida 5 min; farina e sale con una spatola, senza impastare; un filo d’olio, coperto, 1 h 30–2 h al caldo. Teglia ben unta, impasto piegato 1 o 2 volte poi versato e steso con le mani unte; 30–45 min scoperto. Forno a 220 °C; olio, fossette con dieci dita fino al fondo, sale in fiocchi, rosmarino; 20–25 min. All’uscita, un filo d’olio e far intiepidire su una griglia.',titleIt:'Focaccia soffice senza impastare (teglia 30 × 40 cm)',titlePt:'Focaccia macia sem sova (assadeira 30 × 40 cm)',titleZh:'松软免揉佛卡夏（30 × 40 厘米烤盘）',notesPt:'Farinha T55, Manitoba ou 00; 80% de água morna; fermento (seco ou fresco); sal fino; um pouco de açúcar ou mel; bastante azeite, sal em flocos, alecrim fresco.\nFermento e açúcar na água morna por 5 min; farinha e sal com uma espátula, sem sovar; um fio de azeite, coberta, 1 h 30 a 2 h em lugar quente. Assadeira bem untada, dobre a massa 1 ou 2 vezes, depois despeje e espalhe com as mãos untadas; 30 a 45 min descoberta. Forno a 220 °C; azeite, furinhos com os dez dedos até o fundo, sal em flocos, alecrim; 20 a 25 min. Ao sair, um fio de azeite; deixe amornar numa grade.',notesZh:'T55、Manitoba 或 00 号面粉；80% 温水；酵母（干或鲜）；细盐；少许糖或蜂蜜；大量橄榄油、片盐、新鲜迷迭香。\n酵母和糖放进温水 5 分钟；用刮刀拌入面粉和盐，不揉；淋一点油，盖好，放在温暖处 1 小时 30 分到 2 小时。烤盘抹足油，把面团折 1 或 2 次，倒进烤盘，用抹油的手铺开；不盖放 30 到 45 分钟。烤箱 220 °C；淋油，十指戳到底形成小坑，撒片盐和迷迭香；烤 20 到 25 分钟。出炉后淋一点油，放在烤架上晾凉。'},
 {id:'pugliese',cat:'Focaccia',author:'',title:'Focaccia pugliese à la pomme de terre',titleEn:'Focaccia pugliese with potato',titleEs:'Focaccia pugliese con patata',
  notes:'Focaccia des Pouilles (région de Bari) : la pomme de terre dans la pâte la rend très moelleuse et l’empêche de sécher.\nFarine (T45, 00 ou tout usage) et semoule fine de blé dur (2 pour 1), pomme de terre cuite et écrasée (environ un tiers du poids de farine), eau tiède, levure, une pincée de sucre, sel, huile d’olive, plus de l’huile pour la plaque et le dessus.\nCuire la pomme de terre avec la peau, l’éplucher chaude et l’écraser finement. Activer la levure 5 min dans l’eau tiède sucrée, ajouter farine, semoule, sel, purée et huile, pétrir 10 min : la pâte est souple et collante.\n1re levée de 2 à 3 h sous un torchon humide ; 2e levée de 45 min à 1 h sur la plaque bien huilée.\nCreuser avec les doigts, garnir de tomates cerises (côté coupé en bas), olives, romarin ou origan, fleur de sel et un filet d’huile. Four à 220–250 °C, 15 à 20 min.',
  notesEn:'Focaccia from Apulia (Bari area): potato in the dough makes it very soft and keeps it from drying out.\nFlour (T45, 00 or all-purpose) and fine durum semolina (2 to 1), cooked mashed potato (about a third of the flour weight), warm water, yeast, a pinch of sugar, salt, olive oil, plus oil for the pan and the top.\nBoil the potato in its skin, peel it hot and mash finely. Activate the yeast 5 min in sweetened warm water, add flour, semolina, salt, mash and oil, knead 10 min: the dough is soft and sticky.\n1st rise 2 to 3 h under a damp cloth; 2nd rise 45 min to 1 h in the well-oiled pan.\nDimple with your fingers, top with cherry tomatoes (cut side down), olives, rosemary or oregano, flaky salt and a drizzle of oil. Oven at 220–250 °C (430–480 °F), 15 to 20 min.',
  notesEs:'Focaccia de Apulia (zona de Bari): la patata en la masa la hace muy esponjosa y evita que se seque.\nHarina (T45, 00 o común) y sémola fina de trigo duro (2 a 1), patata cocida y aplastada (más o menos un tercio del peso de la harina), agua tibia, levadura, una pizca de azúcar, sal, aceite de oliva, y más aceite para la bandeja y la superficie.\nCocer la patata con piel, pelarla caliente y hacer un puré fino. Activar la levadura 5 min en el agua tibia con azúcar, añadir harina, sémola, sal, puré y aceite, amasar 10 min: la masa es suave y pegajosa.\n1.er levado de 2 a 3 h bajo un paño húmedo; 2.º levado de 45 min a 1 h en la bandeja bien aceitada.\nHacer hoyos con los dedos, cubrir con tomates cherry (lado cortado hacia abajo), aceitunas, romero u orégano, sal en escamas y un chorrito de aceite. Horno a 220–250 °C, 15 a 20 min.',
  params:{n:1,shape:'rect',rl:40,rw:30,thick:'custom',ballW:779,method:'focaccia',flour:'semblend',hyd:61,salt:2.2,oil:8.9,honey:0.9,ytype:'idy',yfix:11.1,T:22,oven:'home240',withTop:true,sauce:'none',mozza:'none',basil:false,extras:['tomcer','olives','origan','olive'],custom:[{name:'pomme de terre cuite, en purée',cat:'pate',qty:33.3,unit:'pf'}],dBulk:150,dProof:50,focT:230,focB:17.5,time:'19:00'},notesIt:'Focaccia pugliese (zona di Bari): la patata nell’impasto la rende molto soffice e le impedisce di seccarsi.\nFarina (T45, 00 o per tutti gli usi) e semola rimacinata (2 a 1), patata lessa schiacciata (circa un terzo del peso della farina), acqua tiepida, lievito, un pizzico di zucchero, sale, olio d’oliva, più olio per la teglia e la superficie.\nLessare la patata con la buccia, sbucciarla calda e schiacciarla finemente. Attivare il lievito 5 min nell’acqua tiepida zuccherata, aggiungere farina, semola, sale, purè e olio, impastare 10 min: l’impasto è morbido e appiccicoso.\n1ª lievitazione di 2–3 h sotto un canovaccio umido; 2ª lievitazione di 45 min–1 h nella teglia ben unta.\nFare le fossette con le dita, condire con pomodorini (lato tagliato in giù), olive, rosmarino o origano, sale in fiocchi e un filo d’olio. Forno a 220–250 °C, 15–20 min.',titleIt:'Focaccia pugliese con patate',titlePt:'Focaccia pugliese com batata',titleZh:'普利亚土豆佛卡夏',notesPt:'Focaccia da Apúlia (região de Bari): a batata na massa a deixa muito macia e evita que resseque.\nFarinha (T45, 00 ou para todos os usos) e sêmola fina de trigo duro (2 para 1), purê de batata cozida (cerca de um terço do peso da farinha), água morna, fermento, uma pitada de açúcar, sal, azeite, mais azeite para a assadeira e a superfície.\nCozinhe a batata com casca, descasque ainda quente e amasse bem. Ative o fermento 5 min na água morna adoçada, junte farinha, sêmola, sal, purê e azeite, sove 10 min: a massa fica mole e grudenta.\n1ª fermentação de 2 a 3 h sob um pano úmido; 2ª fermentação de 45 min a 1 h na assadeira bem untada.\nFaça furinhos com os dedos, cubra com tomates-cereja (lado cortado para baixo), azeitonas, alecrim ou orégano, sal em flocos e um fio de azeite. Forno a 220–250 °C, 15 a 20 min.',notesZh:'来自普利亚大区（巴里一带）的佛卡夏：面团里的土豆让它非常松软，也不容易变干。\n面粉（T45、00 号或通用粉）和细粒硬质小麦粉（2 比 1），煮熟的土豆泥（约为面粉重量的三分之一），温水，酵母，一小撮糖，盐，橄榄油，另备烤盘和表面用的油。\n土豆带皮煮熟，趁热去皮并压成细泥。酵母放进加糖的温水中激活 5 分钟，加入面粉、粗粒小麦粉、盐、土豆泥和油，揉 10 分钟：面团柔软且粘手。\n第一次发酵 2 到 3 小时，盖湿布；第二次在抹足油的烤盘中发酵 45 分钟到 1 小时。\n用手指戳出小坑，铺上樱桃番茄（切面朝下）、橄榄、迷迭香或牛至、片盐，淋一点油。烤箱 220–250 °C，15 到 20 分钟。'},
 {id:'biga-50',cat:'Pizza',author:'',title:'Pizza à la biga (50 %)',titleEn:'Biga pizza (50%)',titleEs:'Pizza con biga (50 %)',titleIt:'Pizza con biga (50 %)',
  notes:'Biga la veille : la moitié de la farine, 45 % de son poids en eau fraîche et 1 % de levure fraîche (0,3 % si elle passe au frigo), mélangées juste assez pour mouiller la farine (grumeaux). 18 h vers 18 °C ; dans une cuisine plus chaude, 1 h à température ambiante puis au frigo.\nLe jour J : biga délayée dans le reste de l’eau, reste de la farine, sel, pétrissage 10 à 15 min, pointage 1 h, boulage, apprêt 2 h 30 environ.\nValeurs de départ courantes pour une biga, à ajuster selon ta farine et ta cuisine.',
  notesEn:'Biga the day before: half the flour, 45% of its weight in cool water and 1% fresh yeast (0.3% if it goes in the fridge), mixed just enough to wet the flour (lumpy). 18 h around 18 °C (64 °F); in a warmer kitchen, 1 h at room temperature then in the fridge.\nOn the day: biga dissolved in the rest of the water, rest of the flour, salt, knead 10 to 15 min, bulk 1 h, shape, proof about 2 h 30.\nCommon starting values for a biga, to adjust to your flour and kitchen.',
  notesEs:'Biga la víspera: la mitad de la harina, 45 % de su peso en agua fresca y 1 % de levadura fresca (0,3 % si pasa por la nevera), mezcladas lo justo para mojar la harina (grumos). 18 h hacia 18 °C; en una cocina más caliente, 1 h a temperatura ambiente y luego a la nevera.\nEl día del servicio: biga deshecha en el resto del agua, resto de la harina, sal, amasado 10 a 15 min, primer levado 1 h, boleado, segundo levado unas 2 h 30.\nValores de partida habituales para una biga, a ajustar según tu harina y tu cocina.',
  notesIt:'Biga il giorno prima: metà della farina, 45 % del suo peso in acqua fresca e 1 % di lievito fresco (0,3 % se passa in frigo), mescolati quanto basta per bagnare la farina (grumi). 18 h intorno ai 18 °C; in una cucina più calda, 1 h a temperatura ambiente poi in frigo.\nIl giorno stesso: biga sciolta nel resto dell’acqua, resto della farina, sale, impasto 10–15 min, puntata 1 h, formatura, appretto circa 2 h 30.\nValori di partenza comuni per una biga, da regolare secondo la farina e la cucina.',
  params:{n:3,shape:'round',diam:30,thick:'custom',ballW:260,method:'biga',bpct:50,bh:18,flour:'p00',hyd:65,salt:2.5,oil:0,honey:0,ytype:'fresh',T:22,oven:'home260',support:'pierre',grill:true,withTop:true,sauce:'maison',mozza:'fior',basil:true,extras:[],time:'19:00'},titlePt:'Pizza com biga (50%)',titleZh:'意式酵头披萨（50%）',notesPt:'Biga na véspera: metade da farinha, 45% do peso dela em água fresca e 1% de fermento fresco (0,3% se for para a geladeira), misturado só o bastante para molhar a farinha (empelotado). 18 h a cerca de 18 °C; numa cozinha mais quente, 1 h em temperatura ambiente e depois na geladeira.\nNo dia: biga dissolvida no resto da água, resto da farinha, sal, sove 10 a 15 min, fermentação em bloco 1 h, boleie, fermentação final de cerca de 2 h 30.\nValores iniciais comuns para uma biga, a ajustar conforme a sua farinha e a sua cozinha.',notesZh:'前一天做 biga：一半面粉，加相当于其重量 45% 的凉水和 1% 鲜酵母（若要冷藏则 0.3%），拌到面粉刚好湿润即可（呈块状）。约 18 °C 下放 18 小时；厨房较热时，室温 1 小时后放进冰箱。\n当天：把 biga 化在剩余的水中，加入剩余面粉和盐，揉 10 到 15 分钟，整体发酵 1 小时，滚圆，最后发酵约 2 小时 30 分。\n这些是 biga 常见的起始数值，请根据你的面粉和厨房调整。'},
 {id:'biga-48',cat:'Pizza',author:'',title:'Biga 48 h (pâtons au frigo)',titleEn:'48 h biga (balls in the fridge)',titleEs:'Biga 48 h (bolas en la nevera)',titleIt:'Biga 48 h (panetti in frigo)',
  notes:'Biga : la moitié de la farine (farine forte, W 340 environ), 50 % de son poids en eau froide, 0,3 % de levure fraîche ; mélanger, 2 h à température ambiante, puis 20 h au frigo.\nPâte finale : biga, le reste de la farine (W 300 environ) et de l’eau froide, un peu de levure fraîche, le sel ; hydratation totale 70 %, sel 2,5 %. Pétrir jusqu’à une pâte lisse.\nPâtons 20 h au frigo, sortis 4 h avant la cuisson. Pâte croustillante et aérée.\nL’appli prépare la biga à 45 % d’eau ; la différence est faible.',
  notesEn:'Biga: half the flour (strong flour, about W 340), 50% of its weight in cold water, 0.3% fresh yeast; mix, 2 h at room temperature, then 20 h in the fridge.\nFinal dough: biga, the rest of the flour (about W 300) and cold water, a little fresh yeast, the salt; total hydration 70%, salt 2.5%. Knead until smooth.\nBalls 20 h in the fridge, out 4 h before baking. Crisp, airy crust.\nThe app makes the biga at 45% water; the difference is small.',
  notesEs:'Biga: la mitad de la harina (harina de fuerza, unos W 340), 50 % de su peso en agua fría, 0,3 % de levadura fresca; mezclar, 2 h a temperatura ambiente y luego 20 h en la nevera.\nMasa final: biga, el resto de la harina (unos W 300) y del agua fría, un poco de levadura fresca, la sal; hidratación total 70 %, sal 2,5 %. Amasar hasta que esté lisa.\nBolas 20 h en la nevera, sacadas 4 h antes de hornear. Corteza crujiente y aireada.\nLa app prepara la biga con 45 % de agua; la diferencia es pequeña.',
  notesIt:'Biga: metà della farina (farina forte, circa W 340), 50 % del suo peso in acqua fredda, 0,3 % di lievito fresco; mescolare, 2 h a temperatura ambiente, poi 20 h in frigo.\nImpasto finale: biga, il resto della farina (circa W 300) e dell’acqua fredda, un po’ di lievito fresco, il sale; idratazione totale 70 %, sale 2,5 %. Impastare fino a un impasto liscio.\nPanetti 20 h in frigo, fuori 4 h prima della cottura. Crosta croccante e alveolata.\nL’app prepara la biga al 45 % d’acqua; la differenza è piccola.',
  params:{n:4,shape:'round',diam:30,thick:'custom',ballW:280,method:'biga',bpct:50,bh:22,bfr:true,flour:'strong',hyd:70,salt:2.5,oil:0,honey:0,ytype:'fresh',T:22,oven:'home290',support:'pierre',grill:true,withTop:true,sauce:'crue',mozza:'fior',basil:true,extras:[],time:'19:00',dProof:240},titlePt:'Biga 48 h (bolinhas na geladeira)',titleZh:'48 小时 biga（面团球冷藏）',notesPt:'Biga: metade da farinha (farinha forte, cerca de W 340), 50% do peso dela em água fria, 0,3% de fermento fresco; misture, 2 h em temperatura ambiente e depois 20 h na geladeira.\nMassa final: biga, o resto da farinha (cerca de W 300) e da água fria, um pouco de fermento fresco, o sal; hidratação total 70%, sal 2,5%. Sove até ficar lisa.\nBolinhas 20 h na geladeira, retiradas 4 h antes de assar. Massa crocante e aerada.\nO app prepara a biga com 45% de água; a diferença é pequena.',notesZh:'Biga：一半面粉（高筋面粉，约 W 340），加相当于其重量 50% 的冷水和 0.3% 鲜酵母；拌匀，室温 2 小时，然后冷藏 20 小时。\n主面团：biga、剩余面粉（约 W 300）和冷水、少许鲜酵母、盐；总含水量 70%，盐 2.5%。揉到光滑。\n面团球冷藏 20 小时，烘烤前 4 小时取出。饼皮酥脆、多孔。\n应用中 biga 的含水量按 45% 计算；差别很小。'},
 {id:'vito-100',cat:'Pizza',author:'',title:'Poolish 100 %',titleEn:'Poolish 100%',titleEs:'Poolish 100 %',
  notes:'Proportions : 145 g de farine pour 100 ml d’eau (environ 69 % d’hydratation), sel 3,45 %.\nPoolish 16 à 24 h avant : eau et farine à parts égales, avec 5 g de levure fraîche et 5 g de miel pour 300 g d’eau.\nVersion 100 % : toute l’eau est dans le poolish. Le jour J, on n’ajoute que le reste de la farine et le sel, sans eau.',
  notesEn:'Ratio: 145 g flour per 100 ml water (about 69% hydration), salt 3.45%.\nPoolish 16 to 24 h ahead: equal parts water and flour, with 5 g fresh yeast and 5 g honey per 300 g water.\n100% version: all the water is in the poolish. On the day you only add the rest of the flour and the salt, no water.',
  notesEs:'Proporciones: 145 g de harina por 100 ml de agua (unos 69 % de hidratación), sal 3,45 %.\nPoolish 16 a 24 h antes: agua y harina a partes iguales, con 5 g de levadura fresca y 5 g de miel por 300 g de agua.\nVersión 100 %: toda el agua está en el poolish. El día del servicio solo se añade el resto de la harina y la sal, sin agua.',
  params:{n:3,shape:'round',diam:30,thick:'custom',ballW:250,method:'poolish',ppct:100,phours:16,pform:'marco',pyg:5,phg:5,vito:false,flour:'p00',hyd:69,salt:3.45,oil:0,honey:0,ytype:'fresh',T:22,oven:'home260',support:'pierre',grill:true,withTop:true,sauce:'maison',mozza:'fior',basil:true,extras:[],time:'19:00'},notesIt:'Proporzioni: 145 g di farina per 100 ml d’acqua (circa 69 % d’idratazione), sale 3,45 %.\nPoolish 16–24 h prima: acqua e farina in parti uguali, con 5 g di lievito fresco e 5 g di miele ogni 300 g d’acqua.\nVersione 100 %: tutta l’acqua è nel poolish. Il giorno stesso si aggiungono solo il resto della farina e il sale, senz’acqua.',titleIt:'Poolish 100 %',titlePt:'Poolish 100%',titleZh:'100% 波兰种',notesPt:'Proporção: 145 g de farinha para 100 ml de água (cerca de 69% de hidratação), sal 3,45%.\nPoolish 16 a 24 h antes: água e farinha em partes iguais, com 5 g de fermento fresco e 5 g de mel para 300 g de água.\nVersão 100%: toda a água está no poolish. No dia, só se acrescentam o resto da farinha e o sal, sem água.',notesZh:'比例：每 100 毫升水配 145 克面粉（含水量约 69%），盐 3.45%。\n提前 16 到 24 小时做波兰种：水和面粉等量，每 300 克水加 5 克鲜酵母和 5 克蜂蜜。\n100% 版本：所有的水都在波兰种里。当天只加剩余的面粉和盐，不再加水。'},
 {id:'vito-20',cat:'Pizza',author:'',title:'Poolish 20 %',titleEn:'Poolish 20%',titleEs:'Poolish 20 %',
  notes:'Mêmes proportions que la version 100 % : 145 g de farine pour 100 ml d’eau, sel 3,45 %.\nVersion « 20 % » : un petit poolish (eau et farine à parts égales, levure et miel en proportion), fait 16 à 24 h avant, qui contient environ 17 % de l’eau.\nLe jour J : on ajoute le reste de l’eau, de la farine et le sel.',
  notesEn:'Same ratio as the 100% version: 145 g flour per 100 ml water, salt 3.45%.\n“20%” version: a small poolish (equal parts water and flour, yeast and honey in proportion), made 16 to 24 h ahead, holding about 17% of the water.\nOn the day: add the rest of the water, the flour and the salt.',
  notesEs:'Mismas proporciones que la versión 100 %: 145 g de harina por 100 ml de agua, sal 3,45 %.\nVersión «20 %»: un poolish pequeño (agua y harina a partes iguales, levadura y miel en proporción), hecho 16 a 24 h antes, que contiene unos 17 % del agua.\nEl día del servicio: se añade el resto del agua, la harina y la sal.',
  params:{n:3,shape:'round',diam:30,thick:'custom',ballW:250,method:'poolish',ppct:16.7,phours:16,pform:'marco',pyg:5,phg:5,vito:false,flour:'p00',hyd:69,salt:3.45,oil:0,honey:0,ytype:'fresh',T:22,oven:'home260',support:'pierre',grill:true,withTop:true,sauce:'maison',mozza:'fior',basil:true,extras:[],time:'19:00'},notesIt:'Stesse proporzioni della versione 100 %: 145 g di farina per 100 ml d’acqua, sale 3,45 %.\nVersione «20 %»: un piccolo poolish (acqua e farina in parti uguali, lievito e miele in proporzione), fatto 16–24 h prima, che contiene circa il 17 % dell’acqua.\nIl giorno stesso: si aggiungono il resto dell’acqua, la farina e il sale.',titleIt:'Poolish 20 %',titlePt:'Poolish 20%',titleZh:'20% 波兰种',notesPt:'Mesma proporção da versão 100%: 145 g de farinha para 100 ml de água, sal 3,45%.\nVersão “20%”: um pequeno poolish (água e farinha em partes iguais, fermento e mel na proporção), feito 16 a 24 h antes, com cerca de 17% da água.\nNo dia: acrescente o resto da água, a farinha e o sal.',notesZh:'与 100% 版本比例相同：每 100 毫升水配 145 克面粉，盐 3.45%。\n“20%”版本：一小份波兰种（水和面粉等量，酵母和蜂蜜按比例），提前 16 到 24 小时制作，约含 17% 的水。\n当天：加入剩余的水、面粉和盐。'},

 {id:'base-complete',cat:'Pizza',author:'Marco',title:'Recette simple',titleEn:'Simple recipe',titleEs:'Receta sencilla',
  notes:'Levure sèche activée dans l’eau tiède miellée (15 à 30 min, jusqu’à ce que ça mousse), puis pétrissage avec la farine, le sel et un peu d’huile d’olive, et une seule levée de 3 à 6 h, la même journée.\nUn peu d’huile d’olive sur les mains pour manipuler la pâte, et au pinceau sur les bords de la pizza avant d’enfourner.\nMême esprit que ma recette au poolish : c’est surtout la façon de faire lever et de pétrir qui change.',
  notesEn:'Dry yeast activated in warm honey water (15 to 30 min, until foamy), then kneaded with the flour, salt and a little olive oil, and a single 3 to 6 h rise, the same day.\nA little olive oil on your hands to handle the dough, and brushed on the pizza rim before baking.\nSame spirit as my poolish recipe: mainly the rising and kneading change.',
  notesEs:'Levadura seca activada en el agua tibia con miel (15 a 30 min, hasta que haga espuma), luego amasado con la harina, la sal y un poco de aceite de oliva, y un solo levado de 3 a 6 h, el mismo día.\nUn poco de aceite de oliva en las manos para manejar la masa, y con pincel en los bordes de la pizza antes de hornear.\nMismo espíritu que mi receta con poolish: sobre todo cambian el levado y el amasado.',
  params:{brushEdges:true,n:2,shape:'round',diam:40,thick:'custom',ballW:444,method:'complete',flour:'ap',T:22,oven:'home260',support:'perforee',grill:true,withTop:true,sauce:'maison',mozza:'fior',basil:false,extras:['jambon','olives','oignon','origan'],time:'18:30',hyd:61,salt:1.1,oil:0.9,honey:1.3,ytype:'idy',yfix:14.8,fh:4},notesIt:'Lievito secco attivato nell’acqua tiepida con miele (15–30 min, finché fa schiuma), poi impastato con farina, sale e un po’ d’olio d’oliva, e una sola lievitazione di 3–6 h, in giornata.\nUn po’ d’olio d’oliva sulle mani per maneggiare l’impasto, e col pennello sui bordi della pizza prima di infornare.\nStesso spirito della mia ricetta col poolish: cambiano soprattutto lievitazione e impasto.',titleIt:'Ricetta semplice',titlePt:'Receita simples',titleZh:'简单配方',notesPt:'Fermento seco ativado em água morna com mel (15 a 30 min, até espumar), depois sovado com a farinha, o sal e um pouco de azeite, e uma única fermentação de 3 a 6 h, no mesmo dia.\nUm pouco de azeite nas mãos para manusear a massa, e na borda da pizza com pincel antes de assar.\nMesmo espírito da minha receita com poolish: mudam sobretudo a fermentação e a sova.',notesZh:'干酵母在加蜂蜜的温水中激活（15 到 30 分钟，直到起泡），再与面粉、盐和少许橄榄油一起揉，当天只发酵一次，3 到 6 小时。\n手上抹一点橄榄油方便操作面团，烘烤前在饼边刷一点。\n与我的波兰种配方思路相同：主要区别在发酵和揉面。'},

 {id:'sanjaya-napo',cat:'Pizza',author:'',title:'Napolitaine farine 00 au frigo',titleEn:'Cold-fermented 00 Neapolitan',titleEs:'Napolitana con harina 00 en nevera',
  notes:'Farine 00, 65 % d’eau, 3 % de sel, très peu de levure sèche instantanée (environ 0,08 %). Farine avec presque toute l’eau, repos 20 min ; levure dans le reste de l’eau ; sel ; pétrir. 2 h à température ambiante, pâtons au frigo 18 à 24 h, 1 à 2 h dehors avant d’étaler. Cuisson 430 à 480 °C, 60 à 120 s.',
  notesEn:'00 flour, 65% water, 3% salt, very little instant yeast (about 0.08%). Flour with almost all the water, rest 20 min; yeast in the rest of the water; salt; knead. 2 h at room temperature, balls in the fridge 18 to 24 h, 1 to 2 h out before stretching. Bake at 430 to 480 °C (800–900 °F), 60 to 120 s.',
  notesEs:'Harina 00, 65 % de agua, 3 % de sal, muy poca levadura seca instantánea (unos 0,08 %). Harina con casi toda el agua, reposo 20 min; levadura en el resto del agua; sal; amasar. 2 h a temperatura ambiente, bolas en la nevera 18 a 24 h, 1 a 2 h fuera antes de estirar. Hornear a 430–480 °C, 60 a 120 s.',
  params:{n:4,shape:'round',diam:30,thick:'custom',ballW:250,method:'frigo',fh:21,flour:'p00',hyd:65,salt:3,oil:0,honey:0,ytype:'idy',yfix:0.83,T:22,oven:'wood',support:'pierre',grill:false,withTop:true,sauce:'crue',mozza:'fior',basil:true,extras:[],time:'19:00',dRest:20,dBulk:120,dProof:90},notesIt:'Farina 00, 65 % d’acqua, 3 % di sale, pochissimo lievito secco istantaneo (circa 0,08 %). Farina con quasi tutta l’acqua, riposo 20 min; il lievito nell’acqua rimanente; il sale; impastare. 2 h a temperatura ambiente, panetti in frigo 18–24 h, fuori 1–2 h prima di stendere. Cottura a 430–480 °C, 60–120 s.',titleIt:'Napoletana con farina 00 in frigo',titlePt:'Napolitana com farinha 00 na geladeira',titleZh:'00 号面粉冷藏那不勒斯披萨',notesPt:'Farinha 00, 65% de água, 3% de sal, muito pouco fermento instantâneo (cerca de 0,08%). Farinha com quase toda a água, descanso de 20 min; fermento no resto da água; sal; sove. 2 h em temperatura ambiente, bolinhas na geladeira 18 a 24 h, 1 a 2 h fora antes de abrir. Asse a 430–480 °C, 60 a 120 s.',notesZh:'00 号面粉，65% 水，3% 盐，极少量即发酵母（约 0.08%）。面粉加几乎全部的水，静置 20 分钟；酵母溶在剩余的水中；加盐；揉面。室温 2 小时，面团球冷藏 18 到 24 小时，擀开前取出 1 到 2 小时。430–480 °C 烘烤 60 到 120 秒。'},
 {id:'sanjaya-romaine',cat:'Pizza',author:'',title:'Pizza romaine en plaque 30 × 40 cm',titleEn:'Roman pan pizza 30 × 40 cm',titleEs:'Pizza romana en bandeja 30 × 40 cm',
  notes:'Farine forte, 75 % d’eau froide, 2,4 % de sel, 0,4 % de levure sèche instantanée, 3 % d’huile. Frigo 18 à 24 h, 1 à 2 h dehors, étaler dans une plaque bien huilée, levée 1 à 2 h. Garnir et cuire à 250–280 °C, 10 à 15 min.',

/* ---------- yeast models ---------- */
const ANCH=[[2,2.2],[3,1.43],[4,0.8],[6,0.33],[8,0.175],[10,0.125],[12,0.085],[16,0.066],[24,0.045],[48,0.025]];
function base24(H){ H=clamp(H,2,48);
  for(let i=0;i<ANCH.length-1;i++){ const[a,ya]=ANCH[i],[b,yb]=ANCH[i+1];
    if(H<=b){ const t=(Math.log(H)-Math.log(a))/(Math.log(b)-Math.log(a)); return Math.exp(Math.log(ya)+t*(Math.log(yb)-Math.log(ya))); } }
  return ANCH[ANCH.length-1][1]; }
function kT(H){ const t=clamp((Math.log(H)-Math.log(3))/(Math.log(8)-Math.log(3)),0,1); return 0.095+t*0.052; }
const freshPct=(T_,H)=>base24(H)*Math.exp(-kT(H)*(T_-24));
const coldPct=(T_,H)=>0.4*Math.pow(24/H,0.7)*clamp(Math.exp(-0.05*(T_-22)),0.7,1.4);
const levainPct=(T_,H)=>clamp(20*Math.pow(freshPct(T_,H)/freshPct(24,8),0.9),2,35);
const WT=[[19,30],[22,25],[25,20],[28,14.5],[31,10]];
function waterT(t){ let v;
  if(t<=WT[0][0]) v=WT[0][1]+(WT[0][0]-t)*1.67;
  else if(t>=WT[4][0]) v=WT[4][1]-(t-WT[4][0])*1.5;
  else for(let i=0;i<4;i++){ const[a,ya]=WT[i],[b,yb]=WT[i+1]; if(t<=b){ v=lerp(ya,yb,(t-a)/(b-a)); break; } }
  return Math.round(clamp(v,6,36)); }
const poolishSug=t=>clamp(Math.round((100-(t-19)*(80/7))/10)*10,20,100);

  if(isFoc(s)){ const ft=s.focT||220, fb=s.focB||22.5; return {o,pre:20,bake:fb,cycle:fb+3.5,temp:`${ft} °C (${Math.round(ft*9/5+32)} °F)`,foc:true,ft,fb}; }
  if(isBrl(s)) return {o,pre:30,bake:2,cycle:6,temp:T('Grill au maximum','Broiler on high','Grill al máximo','Grill al massimo','Grill no máximo','上火开到最大'),brl:true};
  const pre=o.home?o.pre[s.support]:o.pre;
  let bake=(o.bake[0]+o.bake[1])/2;
  if(o.home&&s.support==='perforee') bake+=2;
  if(o.home&&s.grill) bake+=1.5;
  if(s.method==='sg') bake=12;
  const cycle=o.home?bake+4:Math.max(bake+1.5,4);
  return {o,pre,bake,cycle,temp:s.method==='sg'?'275 °C (525 °F)':o.temp};
}

/* ---------- schedule ---------- */
function schedule(s,q,ov,pH){

  const O=(k,auto)=>s[k]===null||s[k]===undefined?auto:s[k];
  const yl=g=>T(`${gr(g)} g de ${YN()[s.ytype]}`,`${gr(g)} g ${YN()[s.ytype]}`,`${gr(g)} g de ${YN()[s.ytype]}`,`${gr(g)} g di ${YN()[s.ytype]}`,`${gr(g)} g de ${YN()[s.ytype]}`,`${YN()[s.ytype]} ${gr(g)} 克`);
  const L1=T('1re levée, pâte entière (pointage)','1st rise, whole dough (bulk)','1.er levado, masa entera','1ª lievitazione, impasto intero (puntata)','1ª fermentação, massa inteira (em bloco)','第一次发酵，整块面团'), L2=T('2e levée, en pâtons (apprêt)','2nd rise, dough balls (proof)','2.º levado, en bolas','2ª lievitazione, in panetti (appretto)','2ª fermentação, bolinhas','第二次发酵，面团球');
  const REST=T('Repos sur la table, sous un bol','Rest on the counter, under a bowl','Reposo en la encimera, bajo un bol','Riposo sul tavolo, sotto una ciotola','Descanso na bancada, sob uma tigela','在台面上静置，用碗盖住'), RELAX=T('La pâte se détend.','The dough relaxes.','La masa se relaja.','L’impasto si rilassa.','A massa relaxa.','面团松弛。');
  const rect=s.shape==='rect';
  const KT=T(' Elle est prête quand la main ressort propre au toucher et qu’un morceau étiré forme un voile fin sans se déchirer.',' It is ready when your hand comes away clean and a stretched piece forms a thin film without tearing.',' Está lista cuando la mano sale limpia al tocarla y un trozo estirado forma un velo fino sin romperse.',' È pronto quando la mano si stacca pulita e un pezzetto tirato forma un velo sottile senza strapparsi.',' Está pronta quando a mão sai limpa e um pedaço esticado forma uma película fina sem rasgar.',' 当手不再粘面、拉开一小块能形成不破的薄膜时，就揉好了。');
  const ball=rect?T(`Divise en ${n} pâton${n>1?'s':''} de ${b} g (un par plaque) et boule${n>1?'-les':'-le'} en tendant la surface.`,`Divide into ${n} ball${n>1?'s':''} of ${b} g (one per pan) and shape with a taut surface.`,`Divide en ${n} bola${n>1?'s':''} de ${b} g (una por bandeja) y bolea tensando la superficie.`,`Dividi in ${n} panett${n>1?'i':'o'} da ${b} g (uno per teglia) e forma con la superficie ben tesa.`,`Divida em ${n} bolinha${n>1?'s':''} de ${b} g (uma por forma) e boleie com a superfície bem esticada.`,`分成 ${n} 个 ${b} 克的面团（每盘一个），滚圆，让表面绷紧。`)
    :T(`Divise en ${n} pâton${n>1?'s':''} de ${b} g et boule${n>1?'-les':'-le'} en tendant la surface, sans la déchirer.`,`Divide into ${n} ball${n>1?'s':''} of ${b} g and shape with a taut surface, without tearing it.`,`Divide en ${n} bola${n>1?'s':''} de ${b} g y bolea tensando la superficie, sin romperla.`,`Dividi in ${n} panett${n>1?'i':'o'} da ${b} g e forma con la superficie ben tesa, senza strapparla.`,`Divida em ${n} bolinha${n>1?'s':''} de ${b} g e boleie com a superfície bem esticada, sem rasgar.`,`分成 ${n} 个 ${b} 克的面团球，滚圆，让表面绷紧，不要扯破。`);
  const ballThen=T(`Huile légèrement ${n>1?'chaque pâton':'le pâton'}, place-${n>1?'les dans des bols séparés ou une boîte':'le dans un bol'}, filme ou couvre.`,`Lightly oil ${n>1?'each ball':'the ball'}, put ${n>1?'them in separate bowls or a box':'it in a bowl'}, wrap or cover.`,`Aceita ligeramente ${n>1?'cada bola':'la bola'}, ponla${n>1?'s en boles separados o en una caja':' en un bol'}, tapa con film.`,`Ungi leggermente ${n>1?'ogni panetto':'il panetto'}, mett${n>1?'ili in ciotole separate o in una cassetta':'ilo in una ciotola'}, copri con pellicola o coperchio.`,`Unte levemente ${n>1?'cada bolinha':'a bolinha'}, coloque-${n>1?'as em tigelas separadas ou numa caixa':'a numa tigela'}, cubra com filme ou tampa.`,`稍微给${n>1?'每个面团球':'面团球'}抹油，${n>1?'分别放进碗里或面团盒':'放进碗里'}，盖上保鲜膜或盖子。`);
  const stretch=rect?T('Étale la pâte dans la plaque huilée, du bout des doigts, jusqu’aux coins. Garnis.','Press the dough into the oiled pan with your fingertips, out to the corners. Top it.','Extiende la masa en la bandeja aceitada con la yema de los dedos, hasta las esquinas. Cubre.','Stendi l’impasto nella teglia unta con la punta delle dita, fino agli angoli. Condisci.','Pressione a massa na forma untada com as pontas dos dedos, até os cantos. Cubra.','用指尖把面团按进抹油的烤盘，一直推到四角。铺料。')
    :T(`Sors un pâton à la fois${n>1?' (les autres restent couverts)':''}. Pose-le sur de la semoule fine de blé dur pour une croûte croustillante, sinon sur de la farine, en secouant la pâte pour retirer l’excédent. Du bout des doigts d’une main, appuie d’abord sur la partie haute du pâton, sans écraser le centre ni toucher le bord ; retourne-le (le haut passe en bas) et recommence. Termine à deux mains : une main immobile entre la pâte et le bord, l’autre étire. Ne touche jamais le bord, sans rouleau.${s.support==='perforee'&&!rect?' Termine de l’étaler sur la plaque à trous.':''} Garnis (voir la rubrique Garniture).`,`Take out one ball at a time${n>1?' (keep the others covered)':''}. Set it on fine durum semolina for a crisp crust, or on flour, shaking off the excess. With the fingertips of one hand, first press the top part of the ball, without crushing the centre or touching the rim; flip it (top to bottom) and repeat. Finish with both hands: one hand stays still between the dough and the rim, the other stretches. Never touch the rim, no rolling pin.${s.support==='perforee'&&!rect?' Finish stretching it on the perforated pan.':''} Top it (see Toppings).`,`Saca una bola cada vez${n>1?' (las demás siguen tapadas)':''}. Ponla sobre sémola fina de trigo duro para una corteza crujiente, o sobre harina, sacudiendo el exceso. Con la yema de los dedos de una mano, presiona primero la parte superior de la bola, sin aplastar el centro ni tocar el borde; dale la vuelta (lo de arriba pasa abajo) y repite. Termina con las dos manos: una mano quieta entre la masa y el borde, la otra estira. No toques nunca el borde, sin rodillo.${s.support==='perforee'&&!rect?' Termina de estirarla sobre la bandeja perforada.':''} Cubre (ver Cobertura).`,`Prendi un panetto alla volta${n>1?' (gli altri restano coperti)':''}. Appoggialo sulla semola rimacinata per una crosta croccante, oppure sulla farina, scuotendo l’eccesso. Con la punta delle dita di una mano, premi prima la parte alta del panetto, senza schiacciare il centro né toccare il cornicione; giralo (sopra va sotto) e ripeti. Finisci a due mani: una ferma tra l’impasto e il cornicione, l’altra allarga. Non toccare mai il cornicione, senza mattarello.${s.support==='perforee'&&!rect?' Finisci di stenderlo sulla teglia forata.':''} Condisci (vedi la sezione Condimento).`,`Pegue uma bolinha de cada vez${n>1?' (as outras ficam cobertas)':''}. Coloque-a sobre sêmola fina de trigo duro para uma massa crocante, ou sobre farinha, tirando o excesso. Com as pontas dos dedos de uma mão, pressione primeiro a parte de cima da bolinha, sem esmagar o centro nem tocar na borda; vire-a (de cima para baixo) e repita. Termine com as duas mãos: uma fica parada entre a massa e a borda, a outra estica. Nunca toque na borda, nada de rolo.${s.support==='perforee'&&!rect?' Termine de abrir sobre a assadeira furada.':''} Cubra (veja Cobertura).`,`一次取一个面团球${n>1?'（其余的继续盖着）':''}。放在细粒硬质小麦粉上可让饼底更脆，或放在面粉上并抖掉多余的粉。用一只手的指尖先按压面团上半部分，不要压扁中心，也不要碰到饼边；翻面（上下翻转）后重复。最后用双手完成：一只手不动，按在面团和饼边之间，另一只手往外拉。千万不要碰饼边，不要用擀面杖。${s.support==='perforee'&&!rect?'在带孔烤盘上完成最后的推开。':''}铺料（见“配料”）。`);

    add(firstTop,stretch+BR,8,'act','',...STR);
  }
  else if(s.method==='biga'){
    const res=Math.round(Math.max(0,q.addW)*0.1), main=Math.max(0,q.addW)-res;
    const wq=s.bfr?T('froide','cold','fría','fredda','fria','冷'):q.amb?T('à température ambiante','room-temperature','a temperatura ambiente','a temperatura ambiente','em temperatura ambiente','室温'):T(`tiède (${tC(q.wt)})`,`lukewarm (${tC(q.wt)})`,`tibia (${tC(q.wt)})`,`tiepida (${tC(q.wt)})`,`morna (${tC(q.wt)})`,`温（${tC(q.wt)}）`);

i con una ciotola o un canovaccio.','Cubra com uma tigela ou um pano.','用碗或布盖住。'),'wet','bowl');

function fitWindow(st,m,s,serve){
  const d=new Date(serve.getTime()+st*60000), h=d.getHours()+d.getMinutes()/60;
  if(h>=s.ds&&h+m/60<=s.de) return st;
  const t=new Date(d); t.setHours(s.de,0,0,0); if(h<s.ds) t.setDate(t.getDate()-1);
  return (t.getTime()-serve.getTime())/60000-m;
}
const inWindow=(st,m,s,serve)=>fitWindow(st,m,s,serve)===st;

function bakeLine(s,ov){

let costItems=[];

function renderCost(s,q,top){

      <input type="number" min="0" step="0.01" data-f="p" value="${p.p??''}" placeholder="${T('prix','price','precio','prezzo','preço','价格')}" aria-label="${esc(e.label)}"> ${sym}

      <span data-pw ${p.mode==='pack'?'':'hidden'}><input type="number" min="0" step="1" data-f="w" value="${p.w??''}" placeholder="${T('poids','weight','peso','peso','peso','重量')}"> g</span></div></td><td class="n" data-cost>–</td></tr>`; }).join('');

    <div class="tw"><table><tr><th>${T('Ingrédient','Ingredient','Ingrediente','Ingrediente','Ingrediente','原料')}</th><th class="n">${T('Utilisé','Used','Usado','Usato','Usado','用量')}</th><th>${T('Prix','Price','Precio','Prezzo','Preço','价格')}</th><th class="n">${T('Coût','Cost','Coste','Costo','Custo','成本')}</th></tr>${rows}</table></div>
    <div class="costsum" id="costSum"></div>`;
  updateCosts();

function updateCosts(){
  let pate=0, gar=0; const per=new Map();
  costItems.forEach(it=>{ const pk=priceOf(it.k); if(pk===null) return; const c=it.g/1000*pk; per.set(it.k,(per.get(it.k)||0)+c); if(it.cat==='pate') pate+=c; else gar+=c; });
  $('cost').querySelectorAll('tr[data-k]').forEach(tr=>{ const c=per.get(tr.dataset.k); tr.querySelector('[data-cost]').textContent=c===undefined?'–':money(c); });
  const s=read(), n=s.n, missK=new Set(costItems.filter(it=>priceOf(it.k)===null).map(it=>it.k)).size;
  const P=parts(s,calc(s)), slices=n*P.per, unit=isFoc(s)?T('plaque','pan','bandeja','teglia','assadeira','烤盘'):'pizza';
  $('costH').textContent=`${T('Total','Total','Total','Totale','Total','合计')} ${money(pate+gar)} · ${money((pate+gar)/n)} / ${unit}${missK?T(` · ${missK} prix manquant${missK>1?'s':''}`,` · ${missK} missing price${missK>1?'s':''}`,` · ${missK} precio${missK>1?'s':''} sin poner`,` · ${missK} prezz${missK>1?'i mancanti':'o mancante'}`,` · ${missK} preço${missK>1?'s':''} faltando`,` · 缺少 ${missK} 个价格`):''}`;
  $('costSum').innerHTML=`<div><div class="k">${T('Pâte','Dough','Masa','Impasto','Massa','面团')}</div><div class="v">${money(pate)}</div></div><div><div class="k">${T('Par pâton','Per ball','Por bola','Per panetto','Por bolinha','每个面团球')}</div><div class="v">${money(pate/n)}</div></div><div><div class="k">${T('Garniture','Toppings','Cobertura','Condimento','Cobertura','配料')}</div><div class="v">${s.withTop?money(gar):T('exclue','excluded','excluida','escluso','excluída','不计')}</div></div><div><div class="k">${T('Total','Total','Total','Totale','Total','合计')}</div><div class="v">${money(pate+gar)}</div></div><div><div class="k">${isFoc(s)?T('Par plaque','Per pan','Por bandeja','Per teglia','Por assadeira','每盘'):T('Par pizza','Per pizza','Por pizza','Per pizza','Por pizza','每张披萨')}</div><div class="v">${money((pate+gar)/n)}</div></div><div><div class="k">${T('Par part','Per slice','Por porción','Per fetta','Por fatia','每片')}</div><div class="v">${money((pate+gar)/slices)}</div></div>${missK?`<div><div class="k">${T('Prix manquants','Missing prices','Precios sin poner','Prezzi mancanti','Preços faltando','缺少的价格')}</div><div class="v">${missK}</div></div>`:''}`;
}
$('cost').addEventListener('input',e=>{
  const tr=e.target.closest('tr[data-k]'); if(!tr) return; const k=tr.dataset.k; carnet.prices=carnet.prices||{};
  const p=carnet.prices[k]||{mode:'kg'}; const f=e.target.dataset.f;
  if(f==='mode'){ p.mode=e.target.value; tr.querySelector('[data-pw]').hidden=p.mode!=='pack'; }
  else if(f) p[f]=e.target.value===''?null:+e.target.value;
  carnet.prices[k]=p; saveC(); updateCosts();
});

function renderPlan(s,r){

    const hs=(x.hd||x.sf)?`<p class="hand">${x.hd?`<b>${T('Mains','Hands','Manos','Mani','Mãos','手')}${LANG==='fr'?' :':':'}</b> ${HD[x.hd]}`:''}${x.hd&&x.sf?' · ':''}${x.sf?`<b>${x.sf==='box'?T('Pâtons','Dough balls','Bolas','Panetti','Bolinhas','面团球'):T('Plan de travail','Counter','Encimera','Piano di lavoro','Bancada','台面')}${LANG==='fr'?' :':':'}</b> ${SF[x.sf]}`:''}</p>`:'';
    const mm=x.k==='oven'&&x.out!=null?x.out-x.start:x.m; const sticky=/^(Pétrissage|Knead|Amasado|Impastare)/.test(stripTags(x.t))?`<p class="stick">${T('<b>Si la pâte colle</b>, n’ajoute pas de farine : ça change ta recette (à 70 % d’hydratation, 100 g de farine en plus pour 1 kg font tomber la pâte vers 64 %). Procède par paliers :<br>1. Laisse-la reposer 15 à 20 min, puis fais des rabats (replie-la sur elle-même) jusqu’à ce qu’elle se tienne.<br>2. Si elle colle encore : repos d’au moins 30 min (1 h c’est mieux), puis pétris de nouveau.<br>3. Si elle colle toujours : huile un peu le dessus, couvre d’un bol et laisse reposer 1 h.<br>Mains mouillées pour la travailler dans le bol ; mains huilées pour les rabats et la manipulation.','<b>If the dough is sticky</b>, do not add flour: it changes your recipe (at 70% hydration, 100 g extra flour per 1 kg drops the dough to about 64%). Go step by step:<br>1. Let it rest 15 to 20 min, then fold it over itself until it holds.<br>2. If it still sticks: rest at least 30 min (1 h is better), then knead again.<br>3. If it still sticks: oil the top lightly, cover with a bowl and rest 1 h.<br>Wet hands to work it in the bowl; oiled hands for folds and handling.','<b>Si la masa se pega</b>, no añadas harina: cambia tu receta (al 70 % de hidratación, 100 g más de harina por 1 kg la bajan a un 64 %). Ve por etapas:<br>1. Déjala reposar 15 a 20 min y haz pliegues hasta que se sostenga.<br>2. Si aún se pega: reposo de al menos 30 min (mejor 1 h) y vuelve a amasar.<br>3. Si sigue pegándose: aceita un poco la superficie, tápala con un bol y deja reposar 1 h.<br>Manos mojadas para trabajarla en el bol; manos aceitadas para los pliegues y la manipulación.','<b>Se l’impasto è appiccicoso</b>, non aggiungere farina: cambia la ricetta (al 70% d’idratazione, 100 g di farina in più per 1 kg portano l’impasto a circa 64%). Procedi per gradi:<br>1. Lascialo riposare 15–20 min, poi fai delle pieghe finché sta in forma.<br>2. Se si attacca ancora
