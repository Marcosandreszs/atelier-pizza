/* ---------- timers ---------- */
const TK='atelier-pizza-timers-v1';
let timers=[]; try{ timers=JSON.parse(localStorage.getItem(TK)||'[]')||[]; }catch(e){}
let actx=null, timerSig='';
const saveTimers=()=>{ try{ localStorage.setItem(TK,JSON.stringify(timers)); }catch(e){} };
function unlockAudio(){ try{ actx=actx||new (window.AudioContext||window.webkitAudioContext)(); if(actx.state==='suspended') actx.resume(); }catch(e){} }
function beep(){
  try{ unlockAudio(); const t0=actx.currentTime;
    for(let i=0;i<4;i++){ const o=actx.createOscillator(), g=actx.createGain(); o.type='sine'; o.frequency.value=i%2?660:880; o.connect(g); g.connect(actx.destination);
      const a=t0+i*0.45; g.gain.setValueAtTime(0.0001,a); g.gain.exponentialRampToValueAtTime(0.35,a+0.02); g.gain.exponentialRampToValueAtTime(0.0001,a+0.35); o.start(a); o.stop(a+0.4); } }catch(e){}
  try{ if(navigator.vibrate) navigator.vibrate([300,150,300,150,300]); }catch(e){}
}
const fmtLeft=ms=>{ const s=Math.max(0,Math.round(ms/1000)), h=Math.floor(s/3600), m=Math.floor(s%3600/60), x=s%60; return h?`${h} h ${pad(m)} min`:`${pad(m)}:${pad(x)}`; };
function startTimer(label,min){ unlockAudio(); timers.push({id:Date.now().toString(36)+Math.random().toString(36).slice(2,6),label,min,end:Date.now()+min*60000,done:false}); saveTimers(); tick(true); }
function drawTimers(){
  const box=$('timers'); box.hidden=!timers.length; document.body.classList.toggle('hasTimers',timers.length>0);
  box.innerHTML=timers.length?`<div class="tthead"><b>${T('Minuteurs','Timers','Temporizadores','Timer')}</b></div>`+timers.map(t=>`<div class="timer${t.done?' done':''}" data-id="${t.id}"><span class="tlab">${esc(t.label)}</span><span class="tval" data-tv></span><span class="row" style="gap:4px">${t.done?'':`<button type="button" class="mini" data-tplus="${t.id}">+5 min</button>`}<button type="button" class="mini" data-tstop="${t.id}">${t.done?'OK':T('Arrêter','Stop','Parar','Ferma')}</button></span></div>`).join(''):'';
}
function tick(force){
  const now=Date.now(); let ch=!!force;
  timers.forEach(t=>{ if(!t.done&&t.end<=now){ t.done=true; ch=true; beep(); } });
  if(ch) saveTimers();
  const sig=timers.map(t=>t.id+(t.done?'d':'')).join(',');
  if(ch||sig!==timerSig){ timerSig=sig; drawTimers(); }
  $('timers').querySelectorAll('.timer').forEach(el=>{ const t=timers.find(x=>x.id===el.dataset.id); if(t) el.querySelector('[data-tv]').textContent=t.done?T('Terminé !','Done!','¡Listo!','Finito!'):fmtLeft(t.end-now); });
  const run=timers.filter(t=>!t.done).sort((a,b)=>a.end-b.end)[0];
  document.title=run?`⏱ ${fmtLeft(run.end-now)} · Atelier Pizza`:timers.some(t=>t.done)?`✔ ${T('Minuteur terminé','Timer done','Temporizador listo','Timer finito')} · Atelier Pizza`:'Atelier Pizza';
  markNow();
}
$('timers').addEventListener('click',e=>{ const b=e.target.closest('button'); if(!b) return; unlockAudio();
  if(b.dataset.tstop){ timers=timers.filter(t=>t.id!==b.dataset.tstop); saveTimers(); tick(true); }
  if(b.dataset.tplus){ const t=timers.find(x=>x.id===b.dataset.tplus); if(t){ t.end+=5*60000; saveTimers(); tick(); } } });
$('plan').addEventListener('click',e=>{ const b=e.target.closest('.tbtn'); if(!b) return; startTimer(b.dataset.tl,+b.dataset.tm);
  b.textContent='⏱ '+T('Lancé','Started','En marcha','Avviato'); setTimeout(()=>render(),1500); });
setInterval(tick,1000);

/* ---------- cooking mode ---------- */
let wake=null, cookOn=false;
function cookLabels(){ document.querySelectorAll('[data-cook]').forEach(b=>{ b.textContent=cookOn?T('Quitter le mode cuisine','Exit cooking mode','Salir del modo cocina','Esci dalla modalità cucina'):T('Mode cuisine','Cooking mode','Modo cocina','Modalità cucina'); b.classList.toggle('on',cookOn); }); }
let noSleep=null;
async function getWake(){
  try{ if('wakeLock' in navigator){ wake=await navigator.wakeLock.request('screen'); wake.addEventListener('release',()=>{ wake=null; }); return 'native'; } }catch(e){}
  try{ if(window.NoSleep){ noSleep=noSleep||new window.NoSleep(); await noSleep.enable(); if(noSleep.isEnabled) return 'video'; } }catch(e){}
  return '';
}
async function setCook(on){
  cookOn=on; document.body.classList.toggle('cook',on); cookLabels();
  if(on){ unlockAudio(); const ok=await getWake();
    $('planMsg').textContent=ok?T('Mode cuisine (pensé pour le téléphone) : l’écran ne se met plus en veille tant que la page reste ouverte. L’étape en cours est mise en évidence.','Cooking mode (made for phones): the screen will not go to sleep while the page stays open. The current step is highlighted.','Modo cocina (pensado para el móvil): la pantalla no se apaga mientras la página siga abierta. El paso actual se resalta.','Modalità cucina (pensata per il telefono): lo schermo non si spegne finché la pagina resta aperta. Il passaggio in corso è messo in evidenza.')
      :T('Mode cuisine (pensé pour le téléphone) : il sert à empêcher l’écran de se mettre en veille. Ici, ton navigateur ne le permet pas ; désactive la mise en veille dans les réglages du téléphone (Affichage, Mise en veille de l’écran) le temps de la recette.','Cooking mode (made for phones): it keeps the screen from going to sleep. Your browser does not allow it here; turn off screen timeout in your phone settings (Display, Screen timeout) while you cook.','Modo cocina (pensado para el móvil): evita que la pantalla se apague. Aquí tu navegador no lo permite; desactiva el apagado de pantalla en los ajustes del móvil (Pantalla, Tiempo de espera) mientras cocinas.','Modalità cucina (pensata per il telefono): serve a impedire che lo schermo si spenga. Qui il browser non lo consente; disattiva lo spegnimento dello schermo nelle impostazioni del telefono (Schermo, Spegnimento schermo) mentre cucini.');
    goSec('planD'); markNow(true); }
  else { try{ if(wake) await wake.release(); }catch(e){} wake=null; try{ if(noSleep) noSleep.disable(); }catch(e){} $('planMsg').textContent=''; }
}
document.addEventListener('click',e=>{ if(e.target.closest('[data-cook]')) setCook(!cookOn); });
document.addEventListener('visibilitychange',()=>{ if(cookOn&&document.visibilityState==='visible'&&!wake&&!(noSleep&&noSleep.isEnabled)) getWake(); });
function markNow(scroll){
  const now=Date.now(); let cur=null;
  $('plan').querySelectorAll('li[data-st]').forEach(li=>{ const st=+li.dataset.st, en=+li.dataset.en; const on=st<=now&&now<Math.max(en,st+60000); li.classList.toggle('now',on); li.classList.toggle('past',Math.max(en,st)<=now&&!on); if(on&&!cur) cur=li; });
  if(scroll&&cur) setTimeout(()=>cur.scrollIntoView({behavior:'smooth',block:'center'}),400);
}

/* ---------- raw downloads, copy, share ---------- */
async function dlRaw(data,name,mime){

$('photoF').addEventListener('change',e=>{ const f=e.target.files&&e.target.files[0]; e.target.value=''; if(!f) return; const rd=new FileReader(); rd.onload=()=>{ const im=new Image(); im.onload=()=>{ const M=1400, k=Math.min(1,M/Math.max(im.width,im.height)); const c=document.createElement('canvas'); c.width=Math.round(im.width*k); c.height=Math.round(im.height*k); c.getContext('2d').drawImage(im,0,0,c.width,c.height); let q=.85, out=c.toDataURL('image/jpeg',q); while(out.length>900000&&q>.4){ q-=.1; out=c.toDataURL('image/jpeg',q); } savePhoto(out); }; im.onerror=()=>{ $('photoMsg').textContent=T('Image illisible : choisis une photo JPEG ou PNG.','Unreadable image: pick a JPEG or PNG photo.','Imagen ilegible: elige una foto JPEG o PNG.','Immagine illeggibile: scegli una foto JPEG o PNG.'); }; im.src=rd.result; }; rd.readAsDataURL(f); });
$('photoR').addEventListener('click',()=>savePhoto(''));
setPhoto(getPhoto());
const FZK='atelier-pizza-fz';
function setFz(v){ v=Math.min(130,Math.max(80,Math.round((+v||100)/10)*10)); document.body.style.zoom=v===100?'':String(v/100); window.__fz=v; $('fzM').disabled=v<=80; $('fzP').disabled=v>=130; $('fzV').textContent=v+' %'; try{ localStorage.setItem(FZK,String(v)); }catch(e){} }
$('fzM').addEventListener('click',()=>setFz((window.__fz||100)-10)); $('fzP').addEventListener('click',()=>setFz((window.__fz||100)+10));
function setTbh(){ try{ const tb=document.querySelector('.topbar'); if(tb) document.documentElement.style.setProperty('--tbh',(tb.getBoundingClientRect().height+10)+'px'); }catch(e){} }
addEventListener('resize',setTbh); setTimeout(setTbh,300);
try{ setFz(localStorage.getItem(FZK)||100); }catch(e){ setFz(100); }
try{ setLook(localStorage.getItem(LOOKK)||'lavande'); }catch(e){ setLook('lavande'); }

    `<details class="box"><summary><b>${T('Texte de la licence MIT (anglais, version officielle)','MIT licence text','Texto de la licencia MIT (inglés, versión oficial)','Testo della licenza MIT (inglese, versione ufficiale)')}</b></summary><pre style="white-space:pre-wrap;font-size:.78rem;margin:8px 0 0">${esc(MIT_TXT)}</pre></details>`+
    h(T('À savoir','Good to know','Conviene saber','Da sapere'))+

function renderUse(){
  const li=a=>`<ul>${a.map(x=>`<li>${x}</li>`).join('')}</ul>`;
  $('useBody').innerHTML=`<div class="row ulangs">${[['fr','Français'],['en','English'],['es','Español'],['it','Italiano']].map(([k,l])=>`<button type="button" class="mini${LANG===k?' on':''}" data-ulang="${k}">${l}</button>`).join('')}</div>
  <p>${T('Atelier Pizza est un seul fichier, « Atelier Pizza.html ». Il fonctionne sans installation et sans connexion, dans Chrome, Edge, Firefox ou Safari.','Atelier Pizza is a single file, “Atelier Pizza.html”. It works with no installation and no connection, in Chrome, Edge, Firefox or Safari.','Atelier Pizza es un solo archivo, «Atelier Pizza.html». Funciona sin instalación y sin conexión, en Chrome, Edge, Firefox o Safari.','Atelier Pizza è un solo file, «Atelier Pizza.html». Funziona senza installazione e senza connessione, in Chrome, Edge, Firefox o Safari.')}</p>
  <h3>1. ${T('Télécharger le fichier','Download the file','Descargar el archivo','Scaricare il file')}</h3>
  <p><button type="button" class="btn" id="useDl">⤓ ${T('Télécharger « Atelier Pizza.html »','Download “Atelier Pizza.html”','Descargar «Atelier Pizza.html»','Scarica «Atelier Pizza.html»')}</button> <span class="hint" id="useMsg"></span></p>
  <h3>2. ${T('L’ouvrir dans ton navigateur','Open it in your browser','Abrirlo en tu navegador','Aprirlo nel browser')}</h3>
  ${li([T('D’abord, enregistre le fichier sur ton ordinateur (dans Téléchargements ou Documents). Ne l’ouvre pas directement depuis un courriel, Messages ou un aperçu : l’appli n’y fonctionne pas.','First, save the file to your computer (in Downloads or Documents). Do not open it straight from an email, Messages or a preview: the app does not work there.','Primero, guarda el archivo en tu ordenador (en Descargas o Documentos). No lo abras directamente desde un correo, Mensajes o una vista previa: ahí la app no funciona.','Prima salva il file sul computer (in Download o Documenti). Non aprirlo direttamente da un’e-mail, da Messaggi o da un’anteprima: lì l’app non funziona.'),T('Ensuite, double-clique sur le fichier enregistré, ou fais-le glisser dans une fenêtre de Chrome, Edge, Firefox ou Safari.','Then double-click the saved file, or drag it into a Chrome, Edge, Firefox or Safari window.','Luego haz doble clic en el archivo guardado o arrástralo a una ventana de Chrome, Edge, Firefox o Safari.','Poi fai doppio clic sul file salvato, oppure trascinalo in una finestra di Chrome, Edge, Firefox o Safari.'),T('S’il s’ouvre dans une autre appli que le navigateur (surtout sur Mac) : clic droit sur le fichier, « Ouvrir avec », puis Safari ou Chrome.','If it opens in an app other than the browser (especially on Mac): right-click the file, “Open With”, then Safari or Chrome.','Si se abre en otra app que no es el navegador (sobre todo en Mac): clic derecho en el archivo, «Abrir con», y luego Safari o Chrome.','Se si apre in un’app diversa dal browser (soprattutto su Mac): clic destro sul file, «Apri con», poi Safari o Chrome.'),T('Sur iPhone et iPad, le fichier ne fonctionne pas : utilise l’adresse web de l’appli (voir la partie 4).','On iPhone and iPad the file does not work: use the app’s web address (see part 4).','En iPhone y iPad el archivo no funciona: usa la dirección web de la app (ver la parte 4).','Su iPhone e iPad il file non funziona: usa l’indirizzo web dell’app (vedi la parte 4).'),T('Ou, dans le navigateur, Ctrl+O (Cmd+O sur Mac), puis choisis le fichier.','Or, in the browser, press Ctrl+O (Cmd+O on Mac) and pick the file.','O, en el navegador, pulsa Ctrl+O (Cmd+O en Mac) y elige el archivo.','Oppure, nel browser, premi Ctrl+O (Cmd+O su Mac) e scegli il file.')])}
  <h3>3. ${T('Le garder à portée de main','Keep it handy','Tenerlo a mano','Tenerlo a portata di mano')}</h3>
  ${li([T('Range-le dans un dossier fixe, par exemple Documents, puis Atelier Pizza, et ne le déplace plus.','Keep it in a fixed folder, for example Documents, then Atelier Pizza, and do not move it.','Guárdalo en una carpeta fija, por ejemplo Documentos y luego Atelier Pizza, y no lo muevas.','Mettilo in una cartella fissa, per esempio Documenti, poi Atelier Pizza, e non spostarlo più.'),T('Ajoute-le aux favoris du navigateur (Ctrl+D, ou Cmd+D sur Mac).','Bookmark it in the browser (Ctrl+D, or Cmd+D on Mac).','Añádelo a favoritos del navegador (Ctrl+D, o Cmd+D en Mac).','Aggiungilo ai preferiti del browser (Ctrl+D, o Cmd+D su Mac).'),T('Crée un raccourci sur le bureau : clic droit sur le fichier, puis « Créer un raccourci » (Windows) ou « Créer un alias » (Mac).','Create a desktop shortcut: right-click the file, then “Create shortcut” (Windows) or “Make Alias” (Mac).','Crea un acceso directo en el escritorio: clic derecho en el archivo y «Crear acceso directo» (Windows) o «Crear alias» (Mac).','Crea un collegamento sul desktop: clic destro sul file, poi «Crea collegamento» (Windows) o «Crea alias» (Mac).'),T('À chaque nouvelle version, remplace l’ancien fichier par le nouveau, au même endroit et sous le même nom : le favori et le raccourci continuent de fonctionner.','For each new version, replace the old file with the new one, in the same place and with the same name: the bookmark and shortcut keep working.','En cada nueva versión, reemplaza el archivo antiguo por el nuevo, en el mismo sitio y con el mismo nombre: el favorito y el acceso directo siguen funcionando.','A ogni nuova versione, sostituisci il vecchio file con il nuovo, nello stesso posto e con lo stesso nome: preferito e collegamento continuano a funzionare.')])}
  <h3>4. ${T('Sur téléphone, tablette et Mac','On a phone, tablet and Mac','En el móvil, la tableta y el Mac','Su telefono, tablet e Mac')}</h3>
  ${li([T('Android : ouvre le fichier depuis l’appli Fichiers avec Chrome. Ça fonctionne, mais sans icône d’appli sur l’écran d’accueil.','Android: open the file from the Files app with Chrome. It works, but without an app icon on the home screen.','Android: abre el archivo desde la app Archivos con Chrome. Funciona, pero sin icono de app en la pantalla de inicio.','Android: apri il file dall’app File con Chrome. Funziona, ma senza icona dell’app nella schermata Home.'),T('iPhone et iPad : le fichier seul ne fonctionne pas (l’iPhone n’en montre qu’un aperçu). Utilise l’adresse web de l’appli dans Safari, puis Partager, « Sur l’écran d’accueil » : elle s’ouvre alors comme une appli.','iPhone and iPad: the file alone does not work (the iPhone only shows a preview). Use the app’s web address in Safari, then Share, “Add to Home Screen”: it then opens like an app.','iPhone y iPad: el archivo solo no funciona (el iPhone solo muestra una vista previa). Usa la dirección web de la app en Safari y luego Compartir, «Añadir a pantalla de inicio»: se abre como una app.','iPhone e iPad: il file da solo non funziona (l’iPhone ne mostra solo un’anteprima). Usa l’indirizzo web dell’app in Safari, poi Condividi, «Aggiungi alla schermata Home»: si apre come un’app.'),T('Mac : enregistre le fichier, puis clic droit, « Ouvrir avec », Safari ou Chrome. Ne l’ouvre pas depuis Mail, Messages ou l’aperçu (barre d’espace) : l’appli n’y fonctionne pas. Ou utilise l’adresse web.','Mac: save the file, then right-click, “Open With”, Safari or Chrome. Do not open it from Mail, Messages or Quick Look (space bar): the app does not work there. Or use the web address.','Mac: guarda el archivo y luego clic derecho, «Abrir con», Safari o Chrome. No lo abras desde Mail, Mensajes o la vista rápida (barra espaciadora): ahí la app no funciona. O usa la dirección web.','Mac: salva il file, poi clic destro, «Apri con», Safari o Chrome. Non aprirlo da Mail, Messaggi o dall’anteprima (barra spaziatrice): lì l’app non funziona. Oppure usa l’indirizzo web.'),T('Attention : les recettes enregistrées avec le fichier et celles enregistrées avec l’adresse web sont séparées. Pour passer de l’un à l’autre, télécharge ta sauvegarde puis importe-la.','Note: recipes saved with the file and those saved with the web address are kept apart. To move from one to the other, download your backup and import it.','Atención: las recetas guardadas con el archivo y las guardadas con la dirección web están separadas. Para pasar de uno a otro, descarga tu copia e impórtala.','Attenzione: le ricette salvate con il file e quelle salvate con l’indirizzo web sono separate. Per passare dall’uno all’altro, scarica il backup e importalo.'),T('Les minuteurs restent utilisables sur Android.','Timers still work on Android.','Los temporizadores siguen funcionando en Android.','I timer funzionano comunque su Android.')])}
  <h3>${T('Ce que l’appli sait faire','What the app can do','Lo que la app sabe hacer','Cosa sa fare l’app')}</h3>
  ${li([T('<b>Démarrer</b> : à l’ouverture, rien n’est choisi ; si une fournée est en cours, l’appli propose de la reprendre ou d’en commencer une nouvelle. Le bouton « Tout recommencer » (rubrique 2) remet tout à zéro.','<b>Getting started</b>: on opening, nothing is chosen; if a bake is in progress, the app offers to resume it or start a new one. The “Start over” button (section 2) resets everything.','<b>Empezar</b>: al abrir, no hay nada elegido; si hay una horneada en curso, la app propone retomarla o empezar otra. El botón «Empezar de nuevo» (sección 2) lo pone todo a cero.','<b>Iniziare</b>: all’apertura non è scelto niente; se c’è un’infornata in corso, l’app propone di riprenderla o di iniziarne una nuova. Il pulsante «Ricominciare» (sezione 2) azzera tutto.'),
    T('<b>Choisir sa pâte, dans l’ordre</b> : d’abord le nombre et la taille des pizzas, puis une méthode (poolish, biga, express, recette simple, directe longue, frigo, levain, en moule, focaccia, sans gluten), puis une recette ; tout est recalculé pour ton format.','<b>Choose your dough, in order</b>: first the number and size of pizzas, then a method (poolish, biga, express, simple recipe, long straight, cold, sourdough, pan, focaccia, gluten-free), then a recipe; everything is recalculated for your size.','<b>Elegir la masa, en orden</b>: primero el número y el tamaño de las pizzas, luego un método (poolish, biga, exprés, receta sencilla, directa larga, nevera, masa madre, en molde, focaccia, sin gluten) y después una receta; todo se recalcula para tu formato.','<b>Scegliere l’impasto, in ordine</b>: prima numero e misura delle pizze, poi un metodo (poolish, biga, express, ricetta semplice, diretto lungo, frigo, lievito madre, in teglia, focaccia, senza glutine), poi una ricetta; tutto è ricalcolato per il tuo formato.'),
    T('<b>Partir de la farine que tu as</b> : entre son poids, l’appli propose plusieurs façons de partager la pâte (petites ou grandes pizzas) sans rien perdre.','<b>Start from the flour you have</b>: enter its weight and the app suggests several ways to share the dough (small or large pizzas) with nothing wasted.','<b>Partir de la harina que tienes</b>: indica su peso y la app propone varias formas de repartir la masa (pizzas pequeñas o grandes) sin desperdiciar nada.','<b>Partire dalla farina che hai</b>: inserisci il peso e l’app propone diversi modi di dividere l’impasto (pizze piccole o grandi) senza sprechi.'),
    T('<b>Dire où tu en es</b> : pré-ferment déjà lancé, pâte déjà faite ou pâtons déjà faits. Le rétroplanning repart de là, et tu peux encore changer le nombre et la taille des pizzas : l’appli recalcule les pâtons.','<b>Say where you are at</b>: preferment started, dough made or balls made. The schedule picks up from there, and you can still change the number and size of pizzas: the app recalculates the balls.','<b>Indicar en qué punto estás</b>: prefermento empezado, masa hecha o bolas hechas. La planificación sigue desde ahí y aún puedes cambiar el número y el tamaño de las pizzas: la app recalcula las bolas.','<b>Dire a che punto sei</b>: prefermento avviato, impasto fatto o panetti fatti. Il programma riparte da lì e puoi ancora cambiare numero e misura delle pizze: l’app ricalcola i panetti.'),
    T('<b>Planifier</b> : avec une heure de service, l’appli calcule quand commencer chaque étape ; sans heure, elle compte depuis le départ. Minuteurs à chaque attente, export vers ton agenda, fiche à imprimer.','<b>Plan</b>: with a serving time, the app works out when to start each step; without one, it counts from the start. Timers for each wait, calendar export, printable sheet.','<b>Planificar</b>: con hora de servir, la app calcula cuándo empezar cada paso; sin hora, cuenta desde el inicio. Temporizadores en cada espera, exportación al calendario, ficha para imprimir.','<b>Pianificare</b>: con un’ora di servizio, l’app calcola quando iniziare ogni passaggio; senza, conta dalla partenza. Timer per ogni attesa, esportazione nel calendario, scheda da stampare.'),
    T('<b>Garnir</b> : garnitures prêtes ou à composer, bases (sauces) à créer, quantités calculées avec la pâte.','<b>Top</b>: ready-made or custom toppings, bases (sauces) you create, amounts calculated with the dough.','<b>Cubrir</b>: coberturas listas o para componer, bases (salsas) propias, cantidades calculadas con la masa.','<b>Condire</b>: condimenti pronti o da comporre, basi (salse) da creare, quantità calcolate con l’impasto.'),
    T('<b>Annuler et rétablir</b> : en haut, « ↶ Annuler » revient en arrière, une modification à la fois (jusqu’à 30) : choix de recette, Reprendre ou Nouvelle fournée, nombre, diamètre, méthode, Je commence maintenant, etc. « ↷ » rétablit ce que tu viens d’annuler. Sur ordinateur : Ctrl+Z et Ctrl+Y (Cmd+Z et Cmd+Maj+Z sur Mac). Le carnet de recettes n’est pas concerné.','<b>Undo and redo</b>: at the top, “↶ Undo” goes back one change at a time (up to 30): recipe choice, Resume or New bake, number, diameter, method, I’m starting now, etc. “↷” redoes what you just undid. On a computer: Ctrl+Z and Ctrl+Y (Cmd+Z and Cmd+Shift+Z on Mac). The recipe book is not affected.','<b>Deshacer y rehacer</b>: arriba, «↶ Deshacer» vuelve atrás un cambio cada vez (hasta 30): elección de receta, Retomar o Nueva horneada, número, diámetro, método, Empiezo ahora, etc. «↷» rehace lo que acabas de deshacer. En ordenador: Ctrl+Z y Ctrl+Y (Cmd+Z y Cmd+Mayús+Z en Mac). El recetario no se ve afectado.','<b>Annulla e ripristina</b>: in alto, «↶ Annulla» torna indietro una modifica alla volta (fino a 30): scelta della ricetta, Riprendere o Nuova infornata, numero, diametro, metodo, Comincio adesso, ecc. «↷» ripristina ciò che hai appena annullato. Sul computer: Ctrl+Z e Ctrl+Y (Cmd+Z e Cmd+Maiusc+Z su Mac). Il ricettario non è interessato.'),
    T('<b>Arrondir les quantités</b> : dans la rubrique 6, le bouton « Arrondir les quantités » arrondit la farine à un chiffre rond (par exemple 643 g → 650 g) et ajuste tout le reste dans les mêmes proportions ; les gros poids sont arrondis à 5 g près. Un second clic remet les valeurs exactes.','<b>Round quantities</b>: in section 6, the “Round quantities” button rounds the flour to a round number (for example 643 g → 650 g) and adjusts everything else in the same proportions; large weights are rounded to the nearest 5 g. A second click restores exact values.','<b>Redondear las cantidades</b>: en la sección 6, el botón «Redondear las cantidades» redondea la harina a una cifra redonda (por ejemplo 643 g → 650 g) y ajusta todo lo demás en las mismas proporciones; los pesos grandes se redondean de 5 en 5 g. Un segundo clic vuelve a los valores exactos.','<b>Arrotondare le quantità</b>: nella sezione 6, il pulsante «Arrotondare le quantità» arrotonda la farina a un numero tondo (per esempio 643 g → 650 g) e adatta tutto il resto nelle stesse proporzioni; i pesi grandi sono arrotondati ai 5 g. Un secondo clic rimette i valori esatti.'),
    T('<b>Poids réel de la pâte</b> : avec « Pâte faite » ou « Pâtons déjà faits », tu peux entrer le poids de ta pâte ou d’un pâton (facultatif) ; l’appli recalcule tout à partir de ce poids.','<b>Actual dough weight</b>: with “Dough made” or “Dough balls already made”, you can enter the weight of your dough or of one ball (optional); the app recalculates everything from it.','<b>Peso real de la masa</b>: con «Masa hecha» o «Bolas ya hechas», puedes indicar el peso de tu masa o de una bola (opcional); la app lo recalcula todo a partir de ese peso.','<b>Peso reale dell’impasto</b>: con «Impasto fatto» o «Panetti già fatti», puoi inserire il peso del tuo impasto o di un panetto (facoltativo); l’app ricalcola tutto da quel peso.'),
    T('<b>Ta photo</b> : le bouton « 📷 Changer la photo », sur l’image du haut, la remplace par ta propre photo de pizza. Elle reste dans ce navigateur, n’est envoyée nulle part et fait partie du fichier de sauvegarde. « Photo d’origine » remet l’image de départ.','<b>Your photo</b>: the “📷 Change photo” button, on the top image, replaces it with your own pizza photo. It stays in this browser, is sent nowhere and is part of the backup file. “Original photo” puts back the starting image.','<b>Tu foto</b>: el botón «📷 Cambiar foto», sobre la imagen de arriba, la reemplaza por tu propia foto de pizza. Se queda en este navegador, no se envía a ningún sitio y forma parte del archivo de copia. «Foto original» devuelve la imagen de inicio.','<b>La tua foto</b>: il pulsante «📷 Cambia foto», sull’immagine in alto, la sostituisce con la tua foto di pizza. Resta in questo browser, non viene inviata da nessuna parte e fa parte del file di backup. «Foto originale» rimette l’immagine iniziale.'),
    T('<b>Taille du texte</b> : tout en haut, les boutons « A− » et « A+ » réduisent ou agrandissent l’affichage de l’appli (de 80 % à 130 %). Le réglage est gardé dans ce navigateur.','<b>Text size</b>: at the very top, the “A−” and “A+” buttons make the app smaller or larger (80% to 130%). The setting is kept in this browser.','<b>Tamaño del texto</b>: arriba del todo, los botones «A−» y «A+» reducen o agrandan la app (del 80 % al 130 %). El ajuste se guarda en este navegador.','<b>Dimensione del testo</b>: in cima, i pulsanti «A−» e «A+» riducono o ingrandiscono l’app (dall’80% al 130%). L’impostazione resta in questo browser.'),
    T('<b>Calories</b> : un encadré sous les quantités (rubrique 6, Quantités calculées) estime l’énergie de la pizza complète (pâte, sauce, fromage et garniture), par pizza, par part et en tout, avec la part de la pâte.','<b>Calories</b>: an estimate per pizza and per slice, under the quantities.','<b>Calorías</b>: una estimación por pizza y por porción, bajo las cantidades.','<b>Calorie</b>: una stima per pizza e per fetta, sotto le quantità.'),
    T('<b>Suivre et partager</b> : coût de revient, liste de courses, recettes et journal de fournées, sauvegarde dans un fichier, cuisine à 20 °C par défaut (réglable).','<b>Track and share</b>: cost, shopping list, recipes and bake log, backup to a file, kitchen at 20 °C by default (adjustable).','<b>Seguir y compartir</b>: coste, lista de la compra, recetas y diario de horneadas, copia en un archivo, cocina a 20 °C por defecto (ajustable).','<b>Seguire e condividere</b>: costo, lista della spesa, ricette e diario delle infornate, backup in un file, cucina a 20 °C di base (regolabile).')])}
  <h3>${T('Ne rien perdre : les sauvegardes','Losing nothing: backups','No perder nada: las copias','Non perdere nulla: i backup')}</h3>
  ${li([T('Tes recettes, notes, étoiles et prix restent <b>dans le navigateur</b> qui a ouvert le fichier, pas dans le fichier lui-même.','Your recipes, notes, stars and prices stay <b>in the browser</b> that opened the file, not in the file itself.','Tus recetas, notas, estrellas y precios se quedan <b>en el navegador</b> que abrió el archivo, no en el archivo.','Le tue ricette, note, stelle e prezzi restano <b>nel browser</b> che ha aperto il file, non nel file stesso.'),T('Un navigateur, une copie : ouvrir le fichier dans Firefox ne montre pas les recettes enregistrées dans Chrome. Choisis un navigateur et tiens-t’y.','One browser, one copy: opening the file in Firefox does not show the recipes saved in Chrome. Pick one browser and stick to it.','Un navegador, una copia: abrir el archivo en Firefox no muestra las recetas guardadas en Chrome. Elige un navegador y quédate con él.','Un browser, una copia: aprire il file in Firefox non mostra le ricette salvate in Chrome. Scegli un browser e usa sempre quello.'),T('Après chaque séance, clique sur « Sauvegarder tous les changements » et range le fichier .json dans un dossier synchronisé (OneDrive, Google Drive, Dropbox).','After each session, click “Save all changes” and keep the .json file in a synced folder (OneDrive, Google Drive, Dropbox).','Después de cada sesión, pulsa «Guardar todos los cambios» y guarda el archivo .json en una carpeta sincronizada (OneDrive, Google Drive, Dropbox).','Dopo ogni sessione, clicca su «Salva tutte le modifiche» e metti il file .json in una cartella sincronizzata (OneDrive, Google Drive, Dropbox).'),T('Avant une nouvelle version : sauvegarde dans l’ancienne, ouvre la nouvelle, vérifie tes recettes. S’il en manque, « Mes fichiers », puis « Importer un fichier .json ».','Before a new version: back up in the old one, open the new one, check your recipes. If any are missing, “My files”, then “Import a .json file”.','Antes de una nueva versión: haz una copia en la antigua, abre la nueva y comprueba tus recetas. Si falta alguna, «Mis archivos» y luego «Importar un archivo .json».','Prima di una nuova versione: fai il backup nella vecchia, apri la nuova, controlla le ricette. Se ne manca qualcuna, «I miei file», poi «Importa un file .json».'),T('Ce qui efface les données : la navigation privée, « Effacer les données de navigation » (cookies et données de site), et parfois le déplacement ou le renommage du fichier.','What erases the data: private browsing, “Clear browsing data” (cookies and site data), and sometimes moving or renaming the file.','Lo que borra los datos: la navegación privada, «Borrar datos de navegación» (cookies y datos de sitios) y a veces mover o renombrar el archivo.','Cosa cancella i dati: la navigazione privata, «Cancella dati di navigazione» (cookie e dati dei siti), e a volte spostare o rinominare il file.'),T('Pour partager : envoie le fichier .html, plus une sauvegarde ou une recette (.json) à importer.','To share: send the .html file, plus a backup or a recipe (.json) to import.','Para compartir: envía el archivo .html y una copia o una receta (.json) para importar.','Per condividere: manda il file .html, più un backup o una ricetta (.json) da importare.')])}`;
  $('useDl').addEventListener('click',async()=>{ const r=await dlRaw(SELF(),'Atelier Pizza.html','text/html'); $('useMsg').textContent=r==='ok'?T('Fichier proposé au téléchargement.','File offered for download.','Archivo ofrecido para descargar.','File proposto per il download.'):r==='declined'?'':T('Téléchargement impossible ici : demande le fichier à la personne qui t’a partagé l’appli.','Download not possible here: ask the person who shared the app for the file.','Descarga no disponible aquí: pide el archivo a quien te compartió la app.','Download non possibile qui: chiedi il file a chi ha condiviso l’app con te.'); });
}
function SELF(){ try{ const d=new DOMParser().parseFromString(SRC0,'text/html'); d.querySelectorAll('script:not([data-app])').forEach(x=>x.remove()); return '<!doctype html>\n'+d.documentElement.outerHTML; }catch(e){ return '<!doctype html>\n'+SRC0; } }
function openUse(){ const d=$('useDlg'); try{ $('useNo').checked=localStorage.getItem(USEK)==='no'; }catch(e){} try{ d.showModal(); }catch(e){ d.setAttribute('open',''); } }
$('useBody').addEventListener('click',e=>{ const b=e.target.closest('[data-ulang]'); if(!b) return; setCountry(CK_,true,b.dataset.ulang); relang(); });
$('useX').addEventListener('click',()=>{ const d=$('useDlg'); try{ d.close(); }catch(e){ d.removeAttribute('open'); } });
$('useNo').addEventListener('change',e=>{ try{ localStorage.setItem(USEK,e.target.checked?'no':'yes'); }catch(x){} });
document.addEventListener('click',e=>{ if(e.target.closest('[data-openuse]')){ e.preventDefault(); openUse(); } });

/* ---------- search ---------- */
function srchItems(){
  const it=[];
  document.querySelectorAll('section[data-toc]').forEach(sec=>it.push({k:T('Rubrique','Section','Sección','Sezione'),t:sec.querySelector('h2').textContent,x:'',go:()=>goSec(sec.dataset.toc)}));
  [...Object.keys(METHODS),...umList().map(u=>'u:'+u.id)].forEach(k=>{ const m=mdef(k), t=L3([m.fr,m.en,m.es,m.it]); it.push({k:T('Méthode','Method','Método','Metodo'),t:t[0],x:t[1]||'',go:()=>{ const r=F.querySelector(`input[name=method][value="${k}"]`); if(r){ r.checked=true; onMethod(); render(); renderC(); autoPick(); } goSec('carD'); }}); });
  carnet.entries.forEach(e=>it.push({k:T('Recette','Recipe','Receta','Ricetta'),t:eTitle(e),x:(eNotes(e)||'')+' '+(e.author||'')+' '+(e.cat||''),go:()=>{ openEntry(e); goSec('carD'); setTimeout(()=>$('cFiche').scrollIntoView({behavior:'smooth',block:'start'}),400); }}));
  FAQ.forEach(f=>it.push({k:'FAQ',t:L3(f.q),x:stripTags(L3(f.a)),go:()=>{ $('faqQ').value=L3(f.q); renderFaq(); goSec('faqD'); }}));
  $('plan').querySelectorAll('li[data-st]').forEach(li=>{ const b=li.querySelector('.what>b'); it.push({k:T('Étape','Step','Paso','Passaggio'),t:(li.querySelector('.when .t')||{}).textContent+' · '+(b?b.textContent:''),x:li.querySelector('.what').textContent,go:()=>{ goSec('planD'); setTimeout(()=>li.scrollIntoView({behavior:'smooth',block:'center'}),400); }}); });
  return it;
}
let srchCache=[];
function runSearch(){
  const q=norm($('srchQ').value.trim()), w=q.split(/\s+/).filter(Boolean);
  if(!w.length){ $('srchR').innerHTML=''; $('srchN').textContent=T('Tape un mot : recette, méthode, question, étape…','Type a word: recipe, method, question, step…','Escribe una palabra: receta, método, pregunta, paso…','Scrivi una parola: ricetta, metodo, domanda, passaggio…'); return; }
  srchCache=srchItems().filter(i=>{ const h=norm(i.t+' '+i.x); return w.every(x=>h.includes(x)); }).slice(0,40);
  $('srchN').textContent=T(`${srchCache.length} résultat${srchCache.length>1?'s':''}`,`${srchCache.length} result${srchCache.length>1?'s':''}`,`${srchCache.length} resultado${srchCache.length>1?'s':''}`,`${srchCache.length} risultat${srchCache.length>1?'i':'o'}`);
  $('srchR').innerHTML=srchCache.map((i,n)=>`<li><button type="button" data-sr="${n}"><span class="badge">${esc(i.k)}</span> <b>${esc(i.t)}</b></button></li>`).join('');
}
$('srchBtn').addEventListener('click',()=>{ const p=$('srch'); p.hidden=!p.hidden; if(!p.hidden){ $('srchQ').focus(); runSearch(); } });
$('srchX').addEventListener('click',()=>{ $('srch').hidden=true; });
$('srchQ').addEventListener('input',runSearch);
$('srchQ').addEventListener('keydown',e=>{ if(e.key==='Escape') $('srch').hidden=true; if(e.key==='Enter'&&srchCache[0]){ srchCache[0].go(); $('srch').hidden=true; } });
$('srchR').addEventListener('click',e=>{ const b=e.target.closest('[data-sr]'); if(!b) return; const i=srchCache[+b.dataset.sr]; $('srch').hidden=true; if(i) i.go(); });

/* ---------- init ---------- */
let c0=null; try{ c0=localStorage.getItem(CTRY); }catch(e){}
let l0=null; try{ l0=localStorage.getItem(LGK); }catch(e){}
setCountry(c0||'ca',false,l0);
$('date').value=todayStr();
refreshSauce();
const saved=load();
if(saved) apply(saved); else apply({});
$('resumeBox').hidden=!(saved&&saved.method&&mdef(saved.method)); window.__hadResume=!$('resumeBox').hidden;
if(saved&&mdef(saved.method)) $('resumeT').textContent=T(`Tu as une fournée en cours : ${mName(saved.method)}, ${saved.n} × ${saved.shape==='rect'?`${saved.rl} × ${saved.rw} cm`:`${saved.diam} cm`}.`,`You have a bake in progress: ${mName(saved.method)}, ${saved.n} × ${saved.shape==='rect'?`${saved.rl} × ${saved.rw} cm`:`${saved.diam} cm`}.`,`Tienes una horneada en curso: ${mName(saved.method)}, ${saved.n} × ${saved.shape==='rect'?`${saved.rl} × ${saved.rw} cm`:`${saved.diam} cm`}.`,`Hai un’infornata in corso: ${mName(saved.method)}, ${saved.n} × ${saved.shape==='rect'?`${saved.rl} × ${saved.rw} cm`:`${saved.diam} cm`}.`);
$('roomT').value=20;
$('svc').checked=saved?(saved.svc!==undefined?!!saved.svc:true):false; svcUI();
startEmpty();
for(let k=0;k<4;k++){ const r=build(read()); if(r.serve.getTime()+r.first*60000>=Date.now()) break;
  const d=new Date($('date').value+'T12:00:00'); d.setDate(d.getDate()+1); $('date').value=`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; }
umFill(umCur()||null);
render(); try{ localStorage.setItem(CK,JSON.stringify(carnet)); }catch(e){} $('xData').value=JSON.stringify(exportObj('sauvegarde'),null,1);
var uiReady=true; renderC(); renderT(); paintC(); paintT(); fileStatus(); renderShop(); renderToc(); renderFaq(); renderCred(); cookLabels(); tick(true); renderUse();
try{ if(localStorage.getItem(USEK)!=='no') setTimeout(openUse,300); }catch(e){}
const OK='atelier-pizza-open-v1', OPEN_DEF={fs7:true,carD:true,qtyD:true,planD:true};
let openSt={}; try{ openSt=JSON.parse(localStorage.getItem(OK)||'null')||{}; }catch(e){}
const secs=[...document.querySelectorAll('details.sec')];
secs.forEach(d=>{ d.open=d.id==='credD'?false:(d.id in openSt?!!openSt[d.id]:!!OPEN_DEF[d.id]);
  d.addEventListener('toggle',()=>{ openSt[d.id]=d.open; try{ localStorage.setItem(OK,JSON.stringify(openSt)); }catch(e){} }); });
$('openAll').addEventListener('click',()=>secs.forEach(d=>d.open=true));
$('closeAll').addEventListener('click',()=>secs.forEach(d=>d.open=false));
})();
</script>
